  --iron-1: #241f1a;
  --iron-2: #322b23;
  --iron-3: #4a4036;
  --gold-1: #c8a566;
  --gold-2: #e8c98a;
  --gold-dim: #8a7346;
  --parch-1: #e7dabb;
  --parch-2: #d6c49c;
  --parch-ink: #2c2318;
  --frame-green: #1d2b20;
  --frame-green-2: #16201a;
  --blood: #a7372d;
  --steel: #5a6d72;
  --text: #e3d8c4;
  --text-dim: #a99c88;

  --font-title: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;

  --card-w: clamp(104px, 12.5vw, 150px);
  --card-h: calc(var(--card-w) * 1.44);
  --hand-gap: clamp(6px, 1vw, 14px);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
}

body { user-select: none; -webkit-user-select: none; }
input, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; }
button { font-family: inherit; color: inherit; }
img { display: block; }

/* ---------- 2. 场景底层 ---------- */
.scene-bg {
  position: fixed; inset: 0; z-index: 0;
  background-color: #0d0b0a;
  background-image: var(--bg-img);
  background-size: cover; background-position: center center;
  filter: saturate(.82) brightness(.62) contrast(1.06);
  pointer-events: none;
}
.scene-veil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(120% 78% at 50% 42%, rgba(0,0,0,.34) 22%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.94) 100%),
    linear-gradient(180deg, rgba(8,6,5,.72) 0%, rgba(8,6,5,.18) 26%, rgba(8,6,5,.30) 62%, rgba(6,5,4,.86) 100%);
}
.torch-glow {
  position: fixed; z-index: 1; pointer-events: none;
  left: 4%; top: 22%;
  width: 46vmin; height: 46vmin;
  background: radial-gradient(circle, rgba(255,168,64,.30) 0%, rgba(255,140,40,.13) 38%, rgba(255,120,30,0) 70%);
  filter: blur(2px);
  animation: torchFlicker 3.6s ease-in-out infinite;
}
@keyframes torchFlicker {
  0%,100% { opacity: .86; transform: scale(1); }
  38% { opacity: 1; transform: scale(1.05); }
  62% { opacity: .78; transform: scale(.97); }
}

/* 第一人称：左手火把 / 右手长剑 */
.first-person { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.hand-torch {
  position: absolute; left: calc(-10px + var(--safe-l)); bottom: calc(-18px + var(--safe-b));
  width: 66px; height: 300px; transform: rotate(11deg); transform-origin: 50% 100%;
}
.hand-torch .stick {
  position: absolute; left: 50%; bottom: 0; width: 17px; height: 230px; transform: translateX(-50%);
  background: linear-gradient(90deg, #241a12, #5c452e 42%, #1d150e);
  border-radius: 8px 8px 3px 3px;
  box-shadow: inset -4px 0 8px rgba(0,0,0,.6);
}
.hand-torch .wrap {
  position: absolute; left: 50%; bottom: 196px; width: 34px; height: 34px; transform: translateX(-50%);
  background: repeating-linear-gradient(0deg, #6b5636 0 5px, #3a2d1c 5px 9px);
  border-radius: 5px;
}
.hand-torch .flame {
  position: absolute; left: 50%; bottom: 218px; width: 52px; height: 86px; transform: translateX(-50%);
  background:
    radial-gradient(ellipse at 50% 78%, rgba(255,246,214,.98) 0%, rgba(255,206,96,.92) 22%, rgba(255,140,36,.66) 46%, rgba(220,70,10,0) 74%);
  filter: blur(1px);
  animation: flameFlicker .42s ease-in-out infinite alternate;
}
@keyframes flameFlicker {
  from { transform: translateX(-50%) scaleY(.94) scaleX(1.02); opacity: .92; }
  to { transform: translateX(-50%) scaleY(1.08) scaleX(.95); opacity: 1; }
}
.hand-sword {
  position: absolute; right: calc(-16px + var(--safe-r)); bottom: calc(-40px + var(--safe-b));
  width: 76px; height: 330px; transform: rotate(-9deg); transform-origin: 50% 100%;
}
.hand-sword .blade {
  position: absolute; left: 50%; bottom: 62px; width: 17px; height: 258px; transform: translateX(-50%);
  background: linear-gradient(90deg, #4a4a48, #cfd2cd 34%, #7d807c 62%, #2f302e);
  clip-path: polygon(50% 0, 100% 22%, 88% 100%, 12% 100%, 0 22%);
  box-shadow: 0 0 16px rgba(220,226,230,.20);
}
.hand-sword .guard {
  position: absolute; left: 50%; bottom: 50px; width: 86px; height: 16px; transform: translateX(-50%);
  background: linear-gradient(180deg, var(--gold-1), #6d5630);
  border-radius: 3px;
}
.hand-sword .grip {
  position: absolute; left: 50%; bottom: 0; width: 22px; height: 58px; transform: translateX(-50%);
  background: linear-gradient(90deg, #241a12, #4d3520 45%, #1a1209);
  border-radius: 5px 5px 9px 9px;
}

/* ---------- 3. 应用容器与屏幕 ---------- */
#app { position: relative; z-index: 3; height: 100%; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) calc(10px + var(--safe-b)) calc(12px + var(--safe-l));
  animation: screenIn .28s ease-out;
}
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 通用面板 */
.panel {
  background: linear-gradient(180deg, rgba(38,32,26,.94), rgba(20,17,14,.96));
  border: 1px solid var(--gold-dim);
  border-radius: 3px;
  box-shadow: 0 10px 30px rgba(0,0,0,.62), inset 0 0 0 1px rgba(0,0,0,.55);
}
.panel-title {
  font-family: var(--font-title);
  font-size: 15px; letter-spacing: .22em; color: var(--gold-2);
  padding: 9px 14px; border-bottom: 1px solid rgba(200,165,102,.34);
  background: linear-gradient(180deg, rgba(70,56,34,.55), rgba(0,0,0,.18));
}
.btn {
  border: 1px solid var(--gold-dim); border-radius: 2px;
  background: linear-gradient(180deg, #4b3f2f, #2a231b);
  color: var(--gold-2); font-size: 14px; letter-spacing: .16em;
  padding: 10px 22px; cursor: pointer;
  transition: filter .14s, transform .1s;
}
.btn:hover { filter: brightness(1.18); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.primary {
  background: linear-gradient(180deg, #6d5430, #3a2c1a);
  border-color: var(--gold-1); color: #ffeec2;
  box-shadow: 0 0 18px rgba(200,165,102,.22), inset 0 1px 0 rgba(255,235,190,.22);
}
.btn.ghost { background: rgba(24,20,16,.7); }
.scroll-y { overflow-y: auto; overscroll-behavior: contain; }

/* ---------- 4. 开始界面 ---------- */
.title-screen { align-items: center; justify-content: center; text-align: center; gap: 0; }
.title-wrap { max-width: 640px; width: 100%; }
.title-mark {
  font-size: 11px; letter-spacing: .5em; color: var(--gold-dim); margin-bottom: 14px;
}
.title-main {
  font-family: var(--font-title);
  font-size: clamp(46px, 9vw, 92px); font-weight: 700; line-height: 1.06;
  letter-spacing: .14em; margin: 0;
  color: #f0e0bd;
  text-shadow: 0 0 26px rgba(255,176,72,.30), 0 4px 18px rgba(0,0,0,.85);
}
.title-sub {
  font-size: clamp(12px, 1.7vw, 17px); letter-spacing: .58em; color: var(--gold-1);
  margin: 12px 0 6px; text-indent: .58em;
}
.title-rule {
  width: 190px; height: 1px; margin: 20px auto 26px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
}
.title-desc {
  font-size: 13px; line-height: 2; color: var(--text-dim); margin: 0 auto 30px; max-width: 430px;
}
.title-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.title-actions .btn { min-width: 150px; padding: 13px 26px; font-size: 15px; }

.credits {
  position: absolute; left: 0; right: 0; bottom: calc(18px + var(--safe-b));
  text-align: center; line-height: 1.95; pointer-events: none;
}
.credits .ck { font-size: 10px; letter-spacing: .42em; color: var(--gold-dim); }
.credits .cn { font-family: var(--font-title); font-size: 19px; letter-spacing: .2em; color: #e7d9b8; }
.credits .cname { font-family: var(--font-title); font-size: 17px; color: #d9c9a5; letter-spacing: .12em; }
.credits .crec {
  margin-top: 10px; font-size: 11px; letter-spacing: .2em; color: #9b8d77;
}
.credits .crec b { color: #cdbb95; font-weight: 500; }

/* ---------- 5. 选关 / 开局配置 ---------- */
.select-screen { gap: 14px; overflow-y: auto; overflow-x: hidden; justify-content: center; }
.select-head { text-align: center; }
.select-head h2 {
  font-family: var(--font-title); margin: 0; font-size: clamp(19px, 2.6vw, 27px);
  letter-spacing: .3em; color: #f0e0bd; text-shadow: 0 3px 14px rgba(0,0,0,.8);
}
.select-head p { margin: 6px 0 0; font-size: 12px; color: var(--text-dim); letter-spacing: .16em; }
.select-body {
  flex: 0 1 auto; min-height: 0; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  grid-template-areas: "clan deck" "diff deck";
  align-content: start;
}
.sel-block.deck .deck-panel { min-height: 200px; }
.sel-block.clan .opt-row, .sel-block.diff .opt-row { align-items: stretch; }
.sel-block { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.sel-block.clan { grid-area: clan; }
.sel-block.diff { grid-area: diff; }
.sel-block.deck { grid-area: deck; }
.sel-label {
  font-size: 12px; letter-spacing: .3em; color: var(--gold-1);
  display: flex; align-items: center; gap: 10px;
}
.sel-label::after { content: ""; flex: 1; height: 1px; background: rgba(200,165,102,.24); }
.opt-row { display: flex; gap: 10px; }
.opt {
  flex: 1 1 0; min-width: 0; text-align: left; cursor: pointer;
  border: 1px solid rgba(120,104,78,.55); border-radius: 3px;
  background: linear-gradient(180deg, rgba(40,34,27,.9), rgba(19,16,13,.95));
  padding: 11px 13px; color: var(--text);
  transition: border-color .15s, box-shadow .15s, transform .1s;
}
.opt:hover { border-color: var(--gold-dim); transform: translateY(-1px); }
.opt.on {
  border-color: var(--gold-1);
  box-shadow: 0 0 0 1px rgba(200,165,102,.42), 0 0 20px rgba(200,165,102,.18);
  background: linear-gradient(180deg, rgba(66,53,33,.92), rgba(26,21,15,.96));
}
.opt h3 { margin: 0 0 4px; font-family: var(--font-title); font-size: 16px; color: var(--gold-2); letter-spacing: .12em; }
.opt .tag { font-size: 11px; color: #b08e5e; letter-spacing: .1em; margin-bottom: 6px; }
.opt p { margin: 0; font-size: 11.5px; line-height: 1.75; color: var(--text-dim); }
.opt .diff-note { font-size: 11px; color: #c8a566; margin-top: 6px; }

.deck-panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.deck-panel .panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.deck-tools { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid rgba(200,165,102,.18); }
.deck-tools .btn { padding: 6px 13px; font-size: 12px; }
.deck-hint { padding: 8px 12px; font-size: 11px; color: var(--text-dim); line-height: 1.7; border-bottom: 1px solid rgba(200,165,102,.12); }
.deck-cards {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px;
  padding: 12px; overflow-y: auto; align-content: start;
}
.select-foot { display: flex; justify-content: center; gap: 12px; padding-top: 4px; }
.select-foot .btn { min-width: 190px; padding: 13px 26px; }

/* ---------- 6. 卡牌 ---------- */
.card {
  width: var(--card-w); height: var(--card-h);
  border-radius: 4px; padding: 4px;
  background: linear-gradient(180deg, #2c4030, var(--frame-green) 40%, var(--frame-green-2));
  border: 1px solid #6b5a38;
  box-shadow: 0 6px 16px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.5);
  position: relative; flex: 0 0 auto;
}
.card-inner {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  border-radius: 2px; overflow: hidden;
  background: linear-gradient(170deg, var(--parch-1) 0%, var(--parch-2) 62%, #c8b389 100%);
  color: var(--parch-ink);
}
.card-tier {
  position: absolute; top: 0; left: 0;
  min-width: 30px; height: 18px; padding: 0 5px;
  font-size: 10px; line-height: 18px; letter-spacing: .04em;
  background: linear-gradient(180deg, #2d2419, #171009);
  color: var(--gold-2); border-bottom-right-radius: 7px;
  border-right: 1px solid rgba(200,165,102,.4); border-bottom: 1px solid rgba(200,165,102,.4);
  text-align: center;
}
.card-name {
  margin: 19px 6px 0; text-align: center;
  font-family: var(--font-title); font-size: clamp(12px, 1.15vw, 15px);
  font-weight: 700; letter-spacing: .08em; color: #2a2015;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
  line-height: 1.25;
}
.card-text {
  flex: 1 1 auto; margin: 5px 7px 0; text-align: center;
  font-size: clamp(10px, .92vw, 11.5px); line-height: 1.5; color: #4a3d2c;
  overflow: hidden;
}
.card-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px 5px; margin-top: 4px;
}
.stat {
  font-size: clamp(12px, 1.05vw, 14px); font-weight: 700;
  min-width: 32px; text-align: center; line-height: 20px;
  border-radius: 2px; color: #fdf3dc;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
}
.stat.atk { background: linear-gradient(180deg, #b54336, #7d251c); }
.stat.hp { background: linear-gradient(180deg, #64777c, #3d4c50); }
.stat-label { font-size: 9px; opacity: .82; margin-right: 2px; }
.card.state-card { background: linear-gradient(180deg, #38303f, #211c26); border-color: #57496a; }
.card.state-card .card-inner { background: linear-gradient(170deg, #d7d2e4, #b9b3c9); }
.card.state-card .card-tier { background: linear-gradient(180deg, #3a3145, #1d1824); }
.card.state-card .card-foot { justify-content: center; }
.card.state-card .stat.atk { background: linear-gradient(180deg, #6a5a86, #3d3352); }
.card.mini { width: 100%; height: auto; }
.card.mini .card-name { margin: 14px 5px 0; font-size: 11px; }
.card.mini .card-text { font-size: 9.5px; }
.card.mini .card-foot { padding-bottom: 3px; }

/* ---------- 7. 战斗界面 ---------- */
.battle {
  display: grid;
  grid-template-columns: 96px minmax(0,1fr) 196px;
  grid-template-rows: auto minmax(0,1fr) auto;
  grid-template-areas:
    "top  top  top"
    "left field side"
    "left hand side";
  gap: 8px; padding-bottom: calc(8px + var(--safe-b));
}
.b-top { grid-area: top; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.b-side { grid-area: side; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.b-left { grid-area: left; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.b-field { grid-area: field; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
.b-hand { grid-area: hand; display: flex; flex-direction: column; align-items: center; gap: 7px; }

/* 顶部：场次 / 轮次 / 敌方血条 */
.wave-box { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
.wave-name {
  font-family: var(--font-title); font-size: clamp(15px, 1.9vw, 21px);
  letter-spacing: .2em; color: #f0e0bd; text-shadow: 0 3px 12px rgba(0,0,0,.9);
}
.wave-name small { display: block; font-size: 10px; letter-spacing: .3em; color: var(--gold-dim); margin-top: 3px; }
.steps { display: flex; gap: 5px; }
.steps i {
  width: 17px; height: 17px; line-height: 17px; text-align: center;
  font-style: normal; font-size: 10px; color: #7d7060;
  border: 1px solid rgba(140,122,92,.4); border-radius: 2px;
  background: rgba(20,17,13,.7);
}
.steps i.done { color: #b7a882; border-color: rgba(200,165,102,.55); background: rgba(58,48,32,.7); }
.steps i.on { color: #1c1509; background: var(--gold-1); border-color: var(--gold-2); font-weight: 700; }
.enemy-hp {
  position: relative; width: min(560px, 52vw); height: 26px; margin: 0 auto;
  border: 1px solid #6d4a3c; border-radius: 2px;
  background: linear-gradient(180deg, #191512, #0e0b09);
  box-shadow: 0 4px 14px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.6);
  overflow: hidden;
}
.enemy-hp i {
  position: absolute; inset: 1px auto 1px 1px; display: block;
  background: linear-gradient(180deg, #c2452f, #8d2419);
  box-shadow: 0 0 14px rgba(200,60,30,.45);
  transition: width .32s cubic-bezier(.2,.7,.3,1);
}
.enemy-hp b {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px; height: 100%; font-size: 12px; letter-spacing: .12em;
  color: #f6ecd6; text-shadow: 0 1px 3px #000;
}
.enemy-hp .hp-num { font-family: var(--font-title); font-size: 14px; letter-spacing: .06em; }
.enemy-hp .shield-txt { color: #bcd4dd; }
.round-line { font-size: 11px; color: var(--text-dim); letter-spacing: .18em; display: flex; gap: 14px; }
.round-line b { color: var(--gold-2); font-weight: 500; }

/* 右上角圆形按钮 */
.top-tools { display: flex; gap: 8px; flex: 0 0 auto; }
.round-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: radial-gradient(circle at 34% 28%, #55462f, #241d16 72%);
  color: var(--gold-2); font-size: 15px; line-height: 1;
  cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,230,180,.16);
  transition: filter .14s, transform .1s;
}
.round-btn:hover { filter: brightness(1.25); }
.round-btn:active { transform: scale(.94); }

/* 左侧 HUD */
.hud-hp, .hud-candle { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.hud-bar {
  width: 26px; height: clamp(96px, 17vh, 160px);
  border: 1px solid #5d4a38; border-radius: 2px;
  background: linear-gradient(180deg, #16120f, #0c0a08);
  position: relative; overflow: hidden;
  box-shadow: inset 0 0 12px rgba(0,0,0,.8);
}
.hud-bar i {
  position: absolute; left: 1px; right: 1px; bottom: 1px; display: block;
  transition: height .3s cubic-bezier(.2,.7,.3,1);
}
.hud-bar.hp i { background: linear-gradient(0deg, #8e2a20, #c8483a); }
.hud-bar.cd i { background: linear-gradient(0deg, #9c6a20, #e0a63c); }
.hud-bar b {
  position: absolute; left: 0; right: 0; bottom: 3px; z-index: 1;
  text-align: center; font-size: 12px; color: #f4e9d2; text-shadow: 0 1px 3px #000;
}
.hud-name { font-size: 11px; letter-spacing: .18em; color: var(--gold-1); }
.hud-note { font-size: 10px; color: var(--text-dim); letter-spacing: .06em; }
.candle-pips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.candle-pips i {
  width: 6px; height: 12px; border-radius: 2px 2px 1px 1px;
  background: linear-gradient(180deg, #f3d896, #c98a2a);
  box-shadow: 0 0 6px rgba(230,170,60,.5);
}
.relic-dock { display: flex; flex-direction: column; gap: 5px; align-items: center; margin-top: auto; padding-bottom: 4px; }
.relic-dock .label { font-size: 10px; letter-spacing: .2em; color: var(--gold-dim); }
.relic-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 92px; }
.relic-chip {
  width: 30px; height: 30px; border-radius: 3px; cursor: help;
  border: 1px solid rgba(200,165,102,.5);
  background: radial-gradient(circle at 35% 30%, #6a5738, #2a231a);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-title); font-size: 13px; color: var(--gold-2);
}
.relic-chip[data-tip]:hover::after {
  content: attr(data-name) " · " attr(data-tip);
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
  width: 210px; padding: 8px 10px; z-index: 40;
  background: rgba(18,15,12,.97); border: 1px solid var(--gold-dim); border-radius: 3px;
  color: var(--text); font-size: 11.5px; line-height: 1.7; text-align: left;
  font-family: var(--font-ui); letter-spacing: 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.7);
}
.relic-chip { position: relative; }

/* 战场 */
.monster-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; max-height: 100%; }
.monster {
  width: min(40vw, 400px); height: min(44vh, 400px);
  background-size: contain; background-repeat: no-repeat; background-position: center center;
  -webkit-mask-image: radial-gradient(ellipse 80% 78% at 50% 50%, #000 64%, rgba(0,0,0,.62) 86%, transparent 100%);
  mask-image: radial-gradient(ellipse 80% 78% at 50% 50%, #000 64%, rgba(0,0,0,.62) 86%, transparent 100%);
  filter: drop-shadow(0 12px 26px rgba(0,0,0,.8)) saturate(.9);
  animation: monsterBreathe 4.2s ease-in-out infinite;
}
@keyframes monsterBreathe {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-7px) scale(1.012); }
}
.intent-box {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 2px;
  background: rgba(20,15,12,.86); border: 1px solid rgba(200,165,102,.4);
  font-size: 13px; color: #f0dfb6; letter-spacing: .1em;
}
.intent-box .ico { font-size: 16px; }
.intent-box.attack { border-color: rgba(200,70,45,.6); color: #f3b3a2; }
.intent-box.defend { border-color: rgba(110,150,170,.6); color: #b8d6e4; }
.intent-box.buff { border-color: rgba(190,130,210,.6); color: #dcb6e4; }
.shield-line { font-size: 11px; color: #a9c8d4; letter-spacing: .12em; }

/* 右侧状态区 */
.side-zone { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.side-zone .panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
.side-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
.side-empty { font-size: 11px; color: #6f6558; text-align: center; padding: 14px 6px; line-height: 1.8; }
.pile-row { display: flex; gap: 6px; }
.pile-btn {
  flex: 1 1 0; padding: 6px 4px; text-align: center; cursor: pointer;
  border: 1px solid rgba(120,104,78,.45); border-radius: 2px;
  background: linear-gradient(180deg, rgba(44,36,28,.9), rgba(18,15,12,.94));
  color: var(--text); font-size: 11px; letter-spacing: .08em;
}
.pile-btn b { display: block; color: var(--gold-2); font-size: 14px; font-family: var(--font-title); }
.pile-btn:hover { border-color: var(--gold-dim); }

/* 手牌与对决按钮 */
.battle-btn {
  position: relative; z-index: 5;
  min-width: 188px; padding: 11px 30px;
  font-family: var(--font-title); font-size: 17px; letter-spacing: .28em; text-indent: .28em;
  color: #ffeec2; cursor: pointer;
  border: 1px solid var(--gold-1); border-radius: 2px;
  background: linear-gradient(180deg, #6d5430, #352818);
  box-shadow: 0 0 22px rgba(200,165,102,.26), inset 0 1px 0 rgba(255,235,190,.24), 0 8px 22px rgba(0,0,0,.6);
  transition: filter .14s, transform .1s;
}
.battle-btn:hover:not(:disabled) { filter: brightness(1.16); }
.battle-btn:active:not(:disabled) { transform: translateY(1px); }
.battle-btn:disabled { opacity: .55; cursor: default; filter: grayscale(.4); }
.hand-row {
  display: flex; gap: var(--hand-gap); align-items: flex-end; justify-content: center;
  width: 100%; overflow-x: auto; overflow-y: visible;
  padding: 4px 6px 6px; scrollbar-width: thin;
}
.hand-row::-webkit-scrollbar { height: 5px; }
.hand-row::-webkit-scrollbar-thumb { background: rgba(200,165,102,.35); }
.hand-slot { flex: 0 0 auto; }
.card:hover { filter: brightness(1.06); }
.card.dealing .card-inner { animation: dealIn .46s cubic-bezier(.22,.9,.3,1) both; animation-delay: var(--deal-delay, 0s); }
@keyframes dealIn {
  from { transform: translate(46%, 58%) scale(.55) rotate(9deg); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.card.dying .card-inner { animation: cardDie .42s ease-out both; }
@keyframes cardDie {
  to { transform: translateY(14px) rotate(-5deg) scale(.9); opacity: 0; }
}
.card.hit .card-inner { animation: cardHit .26s ease-out; }
@keyframes cardHit {
  0% { transform: translateX(0); filter: brightness(1); }
  25% { transform: translateX(-7px); filter: brightness(1.5) saturate(.4); }
  60% { transform: translateX(4px); }
  100% { transform: none; }
}

/* 飘字与震屏 */
.fx-layer { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.float-num {
  position: absolute; font-family: var(--font-title); font-weight: 700;
  font-size: 30px; text-shadow: 0 2px 6px #000, 0 0 16px rgba(0,0,0,.9);
  animation: floatUp 1s ease-out forwards; white-space: nowrap;
}
.float-num.dmg { color: #ff8a6a; }
.float-num.crit { color: #ffd166; font-size: 38px; }
.float-num.heal { color: #8fd8a0; }
.float-num.self { color: #d98fb0; }
@keyframes floatUp {
  from { transform: translate(-50%, 0) scale(.7); opacity: 0; }
  20% { transform: translate(-50%, -14px) scale(1.1); opacity: 1; }
  to { transform: translate(-50%, -62px) scale(1); opacity: 0; }
}
.quake { animation: quake .28s ease-in-out; }
@keyframes quake {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-4px, 2px); }
  50% { transform: translate(4px, -2px); }
  75% { transform: translate(-2px, -1px); }
}
.battle.shake .b-field { animation: quake .28s ease-in-out; }

/* ---------- 8. 商城 ---------- */
.shop-screen { gap: 10px; }
.shop-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shop-head h2 { margin: 0; font-family: var(--font-title); font-size: clamp(17px, 2.2vw, 23px); letter-spacing: .28em; color: #f0e0bd; }
.shop-coin {
  font-family: var(--font-title); font-size: 15px; letter-spacing: .12em; color: #f0c86a;
  padding: 7px 16px; border: 1px solid rgba(200,165,102,.55); border-radius: 2px;
  background: linear-gradient(180deg, rgba(72,58,34,.8), rgba(24,19,13,.9));
}
.shop-counter {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  border: 2px solid #7a5f3c; border-radius: 4px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 3px, rgba(255,255,255,.022) 3px 30px),
    linear-gradient(180deg, rgba(92,68,40,.97) 0%, rgba(52,38,23,.98) 42%, rgba(30,22,15,.99) 100%);
  box-shadow: inset 0 0 52px rgba(0,0,0,.72), 0 14px 34px rgba(0,0,0,.6);
  padding: 16px 18px;
}
.shop-counter::before {
  content: ""; display: block; height: 10px; margin: -16px -18px 12px;
  background: linear-gradient(180deg, rgba(150,112,66,.55), rgba(60,44,26,.2));
  border-bottom: 1px solid rgba(0,0,0,.45);
}
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.shop-item {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 10px; border-radius: 3px; text-align: center;
  border: 1px solid rgba(150,122,80,.5);
  background: linear-gradient(180deg, rgba(38,30,22,.95), rgba(16,13,10,.97));
  box-shadow: inset 0 1px 0 rgba(255,226,170,.07), 0 6px 16px rgba(0,0,0,.45);
}
.shop-item .card { margin: 0 auto; }
.shop-item h4 { margin: 0; font-family: var(--font-title); font-size: 14px; color: var(--gold-2); letter-spacing: .1em; }
.shop-item p { margin: 0; font-size: 11px; line-height: 1.65; color: var(--text-dim); }
.shop-item .price { font-family: var(--font-title); font-size: 14px; color: #f0c86a; }
.shop-item .buy {
  padding: 6px 18px; font-size: 12px; letter-spacing: .14em; cursor: pointer;
  border: 1px solid var(--gold-dim); border-radius: 2px;
  background: linear-gradient(180deg, #5c4a2f, #2c241a); color: var(--gold-2);
}
.shop-item .buy:disabled { opacity: .4; cursor: default; }
.shop-item.sold { opacity: .55; }
.shop-item.sold .buy { display: none; }
.shop-sub { margin: 16px 0 10px; font-size: 12px; letter-spacing: .3em; color: var(--gold-1); }
.destroy-zone {
  margin-top: 16px; padding: 12px; border: 1px dashed rgba(200,165,102,.34); border-radius: 3px;
  background: rgba(16,13,10,.6);
}
.destroy-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
.destroy-chip {
  padding: 5px 10px; font-size: 11.5px; cursor: pointer; border-radius: 2px;
  border: 1px solid rgba(150,120,80,.45); background: rgba(38,30,22,.9); color: var(--text);
}
.destroy-chip:hover { border-color: var(--blood); color: #f0a89a; }
.destroy-chip.on { border-color: var(--blood); background: rgba(90,30,22,.75); color: #ffd0c4; }
.shop-foot { display: flex; justify-content: flex-end; gap: 12px; }

/* ---------- 9. 结算屏 ---------- */
.end-screen { align-items: center; justify-content: center; text-align: center; gap: 14px; }
.end-title {
  font-family: var(--font-title); font-size: clamp(34px, 6vw, 62px); letter-spacing: .3em;
  text-indent: .3em; margin: 0; color: #f0e0bd;
}
.end-title.lose { color: #d99a8c; }
.end-sub { font-size: 13px; color: var(--text-dim); letter-spacing: .2em; line-height: 2; }
.end-stats { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; margin: 8px 0 6px; }
.end-stat { text-align: center; }
.end-stat b { display: block; font-family: var(--font-title); font-size: 24px; color: var(--gold-2); }
.end-stat span { font-size: 11px; color: var(--text-dim); letter-spacing: .18em; }

/* ---------- 10. 弹窗 ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 18px;
  background: rgba(4,3,3,.74);
  backdrop-filter: blur(2px);
}
.modal-back.on { display: flex; animation: fadeIn .16s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(660px, 94vw); max-height: min(86vh, 760px);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a231b, #14110d);
  border: 1px solid var(--gold-dim); border-radius: 3px;
  box-shadow: 0 24px 60px rgba(0,0,0,.8), inset 0 0 0 1px rgba(0,0,0,.6);
  animation: modalIn .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes modalIn { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head {

/* 横屏：手牌四列同屏 */
@media (orientation: landscape) {
  .hand-row { flex-wrap: nowrap; }
}

@media (orientation: portrait) {
  .battle {

  .hand-sword { transform: rotate(-8deg) scale(.72); transform-origin: 50% 100%; }

  .shop-item { padding: 8px 8px; gap: 6px; }

  :root { --card-w: clamp(88px, 9.4vw, 116px); }

  .monster { width: min(30vw, 260px); height: min(48vh, 260px); }

  .card-text { display: none; }
  .card-name { margin-top: 17px; }
  .hand-torch, .hand-sword { transform: scale(.66); }

<script>
/* 《残烛纪年 / ASHEN CANDLE》游戏核心
 *
 * 设计约束（对应交接文档「工程实现提示词」）：
 *  1. 核心为纯逻辑，不触碰 DOM，不依赖 setTimeout / Promise / 动画回调。
 *  2. 战斗结算只有一个入口 advanceOneRound(game)，一次调用推进且仅推进一轮。
 *  3. 卡面显示的攻击力与实际造成的伤害走同一个函数 effectiveAttack()。
 *  4. 渲染层只读状态；动画只消费核心吐出的 events 数组。
 */
(function (root, factory) {
  var DATA = (typeof module === 'object' && module.exports)
    ? require('./data.js')
    : root.ASHEN_DATA;
  var core = factory(DATA);
  if (typeof module === 'object' && module.exports) module.exports = core;
  root.ASHEN_CORE = core;
})(typeof globalThis !== 'undefined' ? globalThis : this, function (DATA) {
  'use strict';

  var R = DATA.RULES;

  /* ======================= 基础工具 ======================= */

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function shuffle(a, rng) {
    var out = a.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor((rng || Math.random)() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  function cardDef(cardId) { return DATA.ALL_CARD_MAP[cardId]; }

  /** 单位牌判定：必须有攻击与生命，缺一不可进入手牌区 */
  function isUnitCard(def) {
    return !!(def && typeof def.atk === 'number' && def.atk > 0 &&
               typeof def.hp === 'number' && def.hp > 0);
  }

  function makeInstance(game, cardId) {
    var def = cardDef(cardId);
    var atk = def.atk || 0;
    var hp = def.hp || 0;
    var kw = def.kw || [];
    if (kw.indexOf('swift') >= 0) { atk += 2; hp -= 2; }
    if (kw.indexOf('heavy') >= 0) { hp += 4; }
    return {
      uid: game.nextUid++,
      cardId: cardId,
      baseAtk: def.atk || 0,
      atk: atk,
      hp: hp,
      maxHp: hp
    };
  }

  /* ======================= 遗物 / 攻击加成 ======================= */

  /** 判定遗物作用域是否命中当前手牌 */
  function scopeMatches(eff, card, ctx, game) {
    var def = cardDef(card.cardId);
    var kw = def.kw || [];
    switch (eff.scope) {
      case 'all': return true;
      case 'first': return ctx.handIndex === 0;
      case 'last': return ctx.handIndex === ctx.handSize - 1;
      case 'slot': return (eff.slots || []).indexOf(ctx.handIndex) >= 0;
      case 'clan': return def.clan === eff.clan;
      case 'tierHigh': return def.tier === 3;
      case 'tierLow': return def.tier === 1;
      case 'hpHigh': return card.maxHp >= 14;
      case 'hpLow': return card.maxHp <= 10;
      case 'stateFull': return card.hp >= card.maxHp;
      case 'stateHurt': return card.hp < card.maxHp;
      case 'parityOdd': return card.baseAtk % 2 === 1;
      case 'parityEven': return card.baseAtk % 2 === 0;
      case 'roundFrom': return ctx.round >= eff.round;
      case 'waveFrom': return ctx.waveNumber >= eff.wave;
      case 'relicCount': return ctx.relicCount >= eff.min;
      case 'kw': return kw.indexOf(eff.kw) >= 0;
      default: return false;
    }
  }

  /** 唯一攻击力计算入口：卡面显示与实际伤害共用 */
  function effectiveAttack(game, card, ctx) {
    var b = game.battle;
    var def = cardDef(card.cardId);
    var kw = def.kw || [];
    var atk = card.atk;

    // 关键词「誓约」：生命低于一半
    if (kw.indexOf('oath') >= 0 && card.hp * 2 < card.maxHp) atk += 4;

    // 状态牌（右侧效果区）加成
    var side = b ? b.sideCards : [];
    for (var i = 0; i < side.length; i++) {
      var sdef = cardDef(side[i].cardId);
      var eff = sdef.effect || {};
      if (eff.kind === 'sideAtk') atk += eff.v;
      else if (eff.kind === 'sideAtkHp') atk += eff.atk || 0;
      else if (eff.kind === 'sideFirstAtk' && ctx.isFirst) atk += eff.v;
    }

    // 遗物加成
    var relics = game.run.relics;
    for (var r = 0; r < relics.length; r++) {
      var relic = DATA.RELICS[relics[r]];
      if (!relic) continue;
      var effects = relic.effects || (relic.effect ? [relic.effect] : []);
      for (var ei = 0; ei < effects.length; ei++) {
        var eff = effects[ei];
        if (scopeMatches(eff, card, ctx, game)) atk += eff.atk || 0;
      }
    }

    return Math.max(0, Math.round(atk));
  }

  /** 生成用于渲染 / 结算的统一上下文 */
  function makeCtx(game, handIndex, handSize, round) {
    var b = game.battle;
    return {
      round: round == null ? (b ? b.round : 1) : round,
      waveNumber: b ? b.waveIndex + 1 : 1,
      handIndex: handIndex,
      handSize: handSize,
      isFirst: handIndex === 0,
      relicCount: game.run.relics.length
    };
  }

  /* ======================= 随机初始卡组 ======================= */

  /**
   * 生成 8 张不重复初始卡牌。
   * 约束：至少 5 张基础攻击力大于 3。
   */
  function randomDeck(rng) {
    var pool = shuffle(DATA.RANDOM_POOL, rng);
    var picked = pool.slice(0, R.START_DECK_SIZE);
    var threshold = R.STRONG_ATK_THRESHOLD;
    var need = R.MIN_STRONG_IN_DECK;

    function strongCount(list) {
      var n = 0;
      for (var i = 0; i < list.length; i++) {
        if (DATA.CARDS[list[i]].atk > threshold) n++;
      }
      return n;
    }

    if (strongCount(picked) < need) {
      var spare = pool.slice(R.START_DECK_SIZE).filter(function (id) {
        return DATA.CARDS[id].atk > threshold;
      });
      var si = 0;
      for (var k = picked.length - 1; k >= 0 && strongCount(picked) < need && si < spare.length; k--) {
        if (DATA.CARDS[picked[k]].atk <= threshold) picked[k] = spare[si++];
      }
    }
    return picked;
  }

  /* ======================= 状态与流程 ======================= */

  function createGame() {
    return {
      version: 1,
      screen: 'title',
      run: {
        clan: null,
        difficulty: null,
        waveIndex: 0,
        playerHp: 30,
        maxPlayerHp: 30,
        candle: R.INITIAL_CANDLE,
        gold: 0,
        deck: [],
        relics: []
      },
      battle: null,
      shop: null,
      nextUid: 1,
      lastRandomDeck: null
    };
  }

  /** 开始一局：选定氏族、难度与卡组 */
  function startRun(game, options) {
    var clan = DATA.CLANS[options.clan];
    var diff = DATA.DIFFICULTIES[options.difficulty];
    var deck = (options.deck && options.deck.length === R.START_DECK_SIZE)
      ? options.deck.slice()
      : clan.deck.slice();

    game.run.clan = clan.id;
    game.run.difficulty = diff.id;
    game.run.waveIndex = 0;
    game.run.maxPlayerHp = diff.hp;
    game.run.playerHp = diff.hp;
    game.run.candle = R.INITIAL_CANDLE;
    game.run.gold = 0;
    game.run.deck = deck.slice();
    game.run.relics = [];
    game.battle = null;
    game.shop = null;
    game.nextUid = 1;
    game.screen = 'battle';
    startBattle(game);
    return game;
  }

  function makeEnemy(wave, diff) {
    var maxHp = Math.round(wave.hp * diff.hpMul);
    return {
      name: wave.name,
      place: wave.place,
      art: wave.art,
      hp: maxHp,
      maxHp: maxHp,
      shield: 0,
      atkBonus: 0,
      alive: true,
      intentIndex: 0,
      intents: wave.intents.map(function (it) { return { t: it.t, v: it.v }; })
    };
  }

  /** 开始一场战斗：建立牌堆并发牌 */
  function startBattle(game) {
    var wave = DATA.WAVES[game.run.waveIndex];
    var diff = DATA.DIFFICULTIES[game.run.difficulty];
    var battle = {
      waveIndex: game.run.waveIndex,
      round: 1,
      hand: [],
      sideCards: [],
      drawPile: [],
      discardPile: [],
      enemies: [makeEnemy(wave, diff)],
      outcome: null,
      log: []
    };
    game.battle = battle;

    // 牌堆由当前卡组构成，洗牌后进入抽牌堆
    battle.drawPile = shuffle(game.run.deck, Math.random).map(function (id) {
      return makeInstance(game, id);
    });

    var events = [];
    fillHand(game, events);
    battle.log.push('第 ' + battle.round + ' 轮开始。');
    return battle;
  }

  /** 从牌堆取一张牌：抽牌堆空则重洗弃牌堆 */
  function takeFromPile(game) {
    var b = game.battle;
    if (!b.drawPile.length && b.discardPile.length) {
      // 重洗弃牌堆：重新洗入抽牌堆并恢复生命
      b.drawPile = shuffle(b.discardPile, Math.random);
      b.discardPile = [];
      b.drawPile.forEach(function (c) { c.hp = c.maxHp; });
    }
    if (!b.drawPile.length) return null;
    var inst = b.drawPile.pop();
    inst.hp = inst.maxHp;
    return inst;
  }

  /** 抽牌：单位牌进手牌，无攻血的牌进右侧状态区 */
  function drawOne(game, events) {
    var b = game.battle;
    var inst = takeFromPile(game);
    if (!inst) return false;
    var def = cardDef(inst.cardId);
    if (isUnitCard(def)) {
      b.hand.push(inst);
      events.push({ type: 'draw', uid: inst.uid, cardId: inst.cardId });
    } else {
      b.sideCards.push(inst);
      events.push({ type: 'status', uid: inst.uid, cardId: inst.cardId });
      // 静默香炉：抽到状态牌时额外抽一张
      var extra = 0;
      game.run.relics.forEach(function (rid) {
        var rel = DATA.RELICS[rid];
        if (rel && rel.side && rel.side.drawExtraOnStatus) extra += rel.side.drawExtraOnStatus;
      });
      for (var i = 0; i < extra; i++) {
        if (!drawOne(game, events)) break;
      }
    }
    return true;
  }

  /** 补满手牌到 4 张；新牌追加到存活牌右侧 */
  function fillHand(game, events) {
    var b = game.battle;
    var guard = 64;
    while (b.hand.length < R.MAX_HAND && guard-- > 0) {
      if (!drawOne(game, events)) break;
    }
  }

  /* ======================= 轮次效果 ======================= */

  function healPlayer(game, amount, events, reason) {
    if (amount <= 0) return;
    var before = game.run.playerHp;
    game.run.playerHp = Math.min(game.run.maxPlayerHp, game.run.playerHp + amount);
    var got = game.run.playerHp - before;
    if (got > 0) events.push({ type: 'player-heal', amount: got, reason: reason || '' });
  }

  function damagePlayer(game, amount, events, reason) {
    if (amount <= 0) return;
    game.run.playerHp = Math.max(0, game.run.playerHp - amount);
    events.push({ type: 'player-damage', amount: amount, reason: reason || '' });
  }

  function healHand(game, amount, events) {
    var b = game.battle;
    b.hand.forEach(function (c) {
      if (c.hp <= 0) return;
      c.hp = Math.min(c.maxHp, c.hp + amount);
    });
  }

  /** 轮开始：关键词、遗物、状态牌 */
  function beginRound(game, events) {
    var b = game.battle;

    // 关键词：成长 / 饥饿
    b.hand.forEach(function (c) {
      var def = cardDef(c.cardId);
      var kw = def.kw || [];
      if (kw.indexOf('grow') >= 0) c.atk = Math.min(c.atk + 1, c.baseAtk + 8);
      if (kw.indexOf('hunger') >= 0) {
        c.hp = Math.max(1, c.hp - 2);
        c.atk = Math.min(c.atk + 3, c.baseAtk + 6);
      }
    });

    // 遗物副作用
    game.run.relics.forEach(function (rid) {
      var rel = DATA.RELICS[rid];
      if (!rel || !rel.side) return;
      if (rel.side.selfDamage) {
        damagePlayer(game, rel.side.selfDamage, events, '遗物「' + rel.name + '」自损');
        b.log.push('遗物「' + rel.name + '」自损 ' + rel.side.selfDamage + ' 点生命。');
      }
      if (rel.side.healPerRound) {
        healPlayer(game, rel.side.healPerRound, events, '遗物「' + rel.name + '」');
      }
      if (rel.side.handHpPerRound) healHand(game, rel.side.handHpPerRound, events);
    });

    // 状态牌（右侧效果区）副作用
    b.sideCards.forEach(function (sc) {
      var eff = cardDef(sc.cardId).effect || {};
      if (eff.kind === 'sideHeal') healPlayer(game, eff.v, events, '「' + cardDef(sc.cardId).name + '」');
      if (eff.kind === 'sideHp') healHand(game, eff.v, events);
    });

    b.log.push('第 ' + b.round + ' 轮。');
  }

  /** 轮末：守御等结算 */
  function endRound(game, events) {
    var b = game.battle;
    b.hand.forEach(function (c) {
      var def = cardDef(c.cardId);
      if ((def.kw || []).indexOf('ward') >= 0 && c.hp > 0) {
        c.hp = Math.min(c.maxHp, c.hp + 2);
      }
    });
  }

  /* ======================= 战斗结算 ======================= */

  function firstAliveEnemy(b) {
    for (var i = 0; i < b.enemies.length; i++) if (b.enemies[i].alive) return b.enemies[i];
    return null;
  }

  function allEnemiesDead(b) {
    return b.enemies.every(function (e) { return !e.alive; });
  }

  function damageEnemy(game, enemy, amount, card, events) {
    var b = game.battle;
    var def = cardDef(card.cardId);
    var ignoresShield = (def.kw || []).indexOf('focus') >= 0;
    var rest = amount;
    if (!ignoresShield && enemy.shield > 0) {
      var absorbed = Math.min(enemy.shield, rest);
      enemy.shield -= absorbed;
      rest -= absorbed;
      events.push({ type: 'enemy-shield', enemyIndex: b.enemies.indexOf(enemy), amount: absorbed });
    }
    enemy.hp = Math.max(0, enemy.hp - rest);
    events.push({ type: 'enemy-damage', enemyIndex: b.enemies.indexOf(enemy), amount: rest, uid: card.uid });
    if (enemy.hp <= 0) {
      enemy.alive = false;
      events.push({ type: 'enemy-die', enemyIndex: b.enemies.indexOf(enemy) });
    }
  }

  function enemyAction(game, enemy, events) {
    var b = game.battle;
    var diff = DATA.DIFFICULTIES[game.run.difficulty];
    var intent = enemy.intents[enemy.intentIndex % enemy.intents.length];
    enemy.intentIndex++;
    var enemyIndex = b.enemies.indexOf(enemy);

    if (intent.t === 'attack') {
      var dmg = intent.v + enemy.atkBonus + diff.atkAdd;
      events.push({ type: 'enemy-intent', enemyIndex: enemyIndex, intent: { t: 'attack', v: dmg } });

      // 伤害先由手牌承受：从 1 号位开始，击破后剩余伤害继续传递
      var remaining = dmg;
      var hits = [];
      for (var i = 0; i < b.hand.length && remaining > 0; i++) {
        var card = b.hand[i];
        var lost = Math.min(card.hp, remaining);
        card.hp -= lost;
        remaining -= lost;
        hits.push({ uid: card.uid, cardId: card.cardId, lost: lost });
        if (card.hp <= 0) {
          b.hand.splice(i, 1);
          i--;
          b.discardPile.push(card);
          events.push({ type: 'card-die', uid: card.uid, cardId: card.cardId });
        }
      }
      events.push({ type: 'enemy-hit', enemyIndex: enemyIndex, amount: dmg, hits: hits, toPlayer: remaining });
      if (remaining > 0) {
        damagePlayer(game, remaining, events, '');
        b.log.push(enemy.name + ' 造成 ' + dmg + ' 点伤害，' + remaining + ' 点溢出到烛火之下。');
      } else {
        b.log.push(enemy.name + ' 造成 ' + dmg + ' 点伤害，被手牌尽数承受。');
      }
    } else if (intent.t === 'defend') {
      enemy.shield += intent.v;
      events.push({ type: 'enemy-defend', enemyIndex: enemyIndex, amount: intent.v });
      b.log.push(enemy.name + ' 凝聚护盾 ' + intent.v + ' 点。');
    } else if (intent.t === 'buff') {
      enemy.atkBonus += intent.v;
      events.push({ type: 'enemy-buff', enemyIndex: enemyIndex, amount: intent.v });
      b.log.push(enemy.name + ' 强化自身，攻击 +' + intent.v + '。');
    }
  }

  function winBattle(game, events) {
    var b = game.battle;
    b.outcome = 'win';
    events.push({ type: 'battle-win' });
    b.log.push('击败 ' + b.enemies[0].name + '。');
  }

  function loseBattle(game, reason, events) {
    var b = game.battle;
    b.outcome = 'lose';
    b.loseReason = reason;
    events.push({ type: 'battle-lose', reason: reason });
    b.log.push(reason === 'rounds' ? '十轮已尽，烛火熄灭。' : '烛火燃尽，倒在长廊里。');
  }

  /** 唯一结算入口：推进且仅推进一轮 */
  function advanceOneRound(game) {
    var b = game.battle;
    if (!b || b.outcome) return [];
    var events = [];
    b.events = events;

    beginRound(game, events);

    // 玩家攻击阶段：对按钮点击瞬间的手牌做快照，从左到右依次攻击
    var snapshot = b.hand.slice();
    var handSize = snapshot.length;
    for (var i = 0; i < snapshot.length; i++) {
      if (b.outcome) break;
      var card = snapshot[i];
      var target = firstAliveEnemy(b);
      if (!target) { winBattle(game, events); break; }
      var ctx = makeCtx(game, i, handSize, b.round);
      var atk = effectiveAttack(game, card, ctx);
      events.push({
        type: 'card-attack', uid: card.uid, cardId: card.cardId,
        amount: atk, enemyIndex: b.enemies.indexOf(target), handIndex: i
      });
      damageEnemy(game, target, atk, card, events);
    }

    if (b.outcome) return events;

    // 敌方行动
    for (var e = 0; e < b.enemies.length; e++) {
      var enemy = b.enemies[e];
      if (!enemy.alive) continue;
      if (game.run.playerHp <= 0) { loseBattle(game, 'life', events); return events; }
      enemyAction(game, enemy, events);
      if (game.run.playerHp <= 0) { loseBattle(game, 'life', events); return events; }
    }

    endRound(game, events);
    fillHand(game, events);

    if (game.run.playerHp <= 0) { loseBattle(game, 'life', events); return events; }
    if (b.round >= R.MAX_ROUNDS) { loseBattle(game, 'rounds', events); return events; }

    b.round += 1;
    return events;
  }

  function canAdvanceRound(game) {
    var b = game.battle;
    if (!b || b.outcome) return false;
    return b.round <= R.MAX_ROUNDS;
  }

  /** 胜利后的推进：结算奖励，并决定下一站 */
  function advanceAfterWin(game) {
    var b = game.battle;
    var waveNumber = b.waveIndex + 1;
    var diff = DATA.DIFFICULTIES[game.run.difficulty];
    var gold = Math.round((R.GOLD_BASE + R.GOLD_PER_WAVE * waveNumber) * diff.goldMul);
    game.run.gold += gold;
    game.run.playerHp = Math.min(game.run.maxPlayerHp, game.run.playerHp + R.HEAL_PER_WAVE);
    game.run.waveIndex += 1;

    if (waveNumber >= R.TOTAL_WAVES) {
      game.screen = 'victory';
      game.battle = null;
      return { next: 'victory', gold: gold };
    }
    if (R.SHOP_AFTER_WAVES.indexOf(waveNumber) >= 0) {
      prepareShop(game);
      game.screen = 'shop';
      return { next: 'shop', gold: gold };
    }
    game.screen = 'battle';
    startBattle(game);
    return { next: 'battle', gold: gold };
  }

  /* ======================= 商城 ======================= */

  function cardPrice(def) { return DATA.SHOP.cardPrice[def.tier] || 60; }
  function relicPrice(relic) { return DATA.SHOP.relicPrice[relic.tier] || 100; }
  function destroyPrice(deckSize) {
    return DATA.SHOP.destroyBase + Math.max(0, deckSize - R.START_DECK_SIZE) * DATA.SHOP.destroyPerExtra;
  }

  function prepareShop(game) {
    var owned = {};
    game.run.relics.forEach(function (id) { owned[id] = true; });
    var pool = shuffle(DATA.RANDOM_POOL.concat(Object.keys(DATA.STATUS_CARDS)), Math.random);
    var cardOffers = [];
    for (var i = 0; i < pool.length && cardOffers.length < DATA.SHOP.cardSlots; i++) {
      var def = cardDef(pool[i]);
      cardOffers.push({ cardId: pool[i], price: cardPrice(def), sold: false });
    }
    var relicIds = Object.keys(DATA.RELICS).filter(function (id) { return !owned[id]; });
    relicIds = shuffle(relicIds, Math.random);
    var relicOffers = [];
    for (var j = 0; j < relicIds.length && relicOffers.length < DATA.SHOP.relicSlots; j++) {
      var rel = DATA.RELICS[relicIds[j]];
      relicOffers.push({ relicId: relicIds[j], price: relicPrice(rel), sold: false });
    }
    game.shop = {
      cards: cardOffers,
      relics: relicOffers,
      destroyPrice: destroyPrice(game.run.deck.length)
    };
    return game.shop;
  }

  function buyShopCard(game, index) {
    var shop = game.shop;
    if (!shop) return false;
    var offer = shop.cards[index];
    if (!offer || offer.sold) return false;
    if (game.run.gold < offer.price) return false;
    game.run.gold -= offer.price;
    offer.sold = true;
    game.run.deck.push(offer.cardId);
    shop.destroyPrice = destroyPrice(game.run.deck.length);
    return true;
  }

  function buyShopRelic(game, index) {
    var shop = game.shop;
    if (!shop) return false;
    var offer = shop.relics[index];
    if (!offer || offer.sold) return false;
    if (game.run.gold < offer.price) return false;
    game.run.gold -= offer.price;
    offer.sold = true;
    game.run.relics.push(offer.relicId);
    return true;
  }

  function destroyDeckCard(game, index) {
    var shop = game.shop;
    if (!shop) return false;
    if (index < 0 || index >= game.run.deck.length) return false;
    if (game.run.gold < shop.destroyPrice) return false;
    game.run.gold -= shop.destroyPrice;
    game.run.deck.splice(index, 1);
    shop.destroyPrice = destroyPrice(game.run.deck.length);
    return true;
  }

  /** 离开商城：进入下一场 */
  function leaveShop(game) {
    game.shop = null;
    game.screen = 'battle';
    startBattle(game);
    return game.battle;
  }

  /* ======================= 存档 ======================= */

  function serialize(game) {
    return JSON.stringify({
      version: game.version,
      screen: game.screen,
      run: game.run,
      battle: game.battle,
      shop: game.shop,
      nextUid: game.nextUid
    });
  }

  /** 读取存档：结构不符或版本不符时返回 null，绝不恢复任何交互锁字段 */
  function deserialize(text) {
    if (!text) return null;
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return null; }
    if (!obj || obj.version !== 1 || !obj.run || !Array.isArray(obj.run.deck)) return null;
    if (!Array.isArray(obj.run.relics) || !Array.isArray(obj.run.deck)) return null;
    if (obj.run.relics.some(function (id) { return !DATA.RELICS[id]; })) return null;
    if (obj.run.deck.some(function (id) { return !DATA.ALL_CARD_MAP[id]; })) return null;
    if (obj.screen === 'battle' && !obj.battle) return null;
    if (obj.screen === 'shop' && !obj.shop) return null;
    obj.nextUid = obj.nextUid || 1;
    return obj;
  }

  /** 一致性自检：核心每次结算后调用，测试亦复用 */
  function assertGameState(game) {
    var b = game.battle;
    if (!b) return true;
    var uids = {};
    function reg(u) {
      if (uids[u.uid]) throw new Error('uid 重复：' + u.uid);
      uids[u.uid] = true;
    }
    b.hand.forEach(reg);
    b.drawPile.forEach(reg);
    b.discardPile.forEach(reg);
    b.sideCards.forEach(reg);
    if (b.round > R.MAX_ROUNDS) throw new Error('轮次超过上限：' + b.round);
    if (b.hand.length > R.MAX_HAND) throw new Error('手牌超过上限：' + b.hand.length);
    if (game.run.playerHp < 0) throw new Error('生命为负');
    return true;
  }

  return {
    RULES: R,
    DATA: DATA,
    clone: clone,
    shuffle: shuffle,
    cardDef: cardDef,
    isUnitCard: isUnitCard,
    makeInstance: makeInstance,
    effectiveAttack: effectiveAttack,
    makeCtx: makeCtx,
    scopeMatches: scopeMatches,
    randomDeck: randomDeck,
    createGame: createGame,
    startRun: startRun,
    startBattle: startBattle,
    advanceOneRound: advanceOneRound,
    canAdvanceRound: canAdvanceRound,
    advanceAfterWin: advanceAfterWin,
    prepareShop: prepareShop,
    buyShopCard: buyShopCard,
    buyShopRelic: buyShopRelic,
    destroyDeckCard: destroyDeckCard,
    leaveShop: leaveShop,
    destroyPrice: destroyPrice,
    cardPrice: cardPrice,
    relicPrice: relicPrice,
    serialize: serialize,
    deserialize: deserialize,
    assertGameState: assertGameState
  };
});
