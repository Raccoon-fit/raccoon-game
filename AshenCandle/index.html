<script>
/* 《残烛纪年 / ASHEN CANDLE》界面层
 *
 * 与核心的边界：
 *  - 本文件只读取 Core 状态生成 DOM，绝不在渲染过程中抽牌 / 扣血 / 推进回合。
 *  - 战斗结算只有一个入口 onBattleSubmit()，核心里也只有一个结算调用点。
 *  - 动画只消费核心吐出的 events 数组，动画失败不影响玩法结果。
 */
(function () {
  'use strict';

  var Core = window.ASHEN_CORE;
  var DATA = window.ASHEN_DATA;
  var ART = window.ASHEN_ART || {};
  var BUILD = window.ASHEN_BUILD || 'web';

  var SAVE_KEY = 'ashen_candle_save_v1';
  var HISTORY_KEY = 'ashen_candle_history_v1';
  var SETTINGS_KEY = 'ashen_candle_settings_v1';

  var game = Core.createGame();
  var ui = {
    dealing: false,       // 发牌表现进行中（纯视觉）
    dealUids: [],         // 本次需要播放发牌动画的卡牌
    pendingResult: null,  // 战斗结束后的结算浮层
    destroyPick: -1,      // 商城中选中的待销毁卡牌
    lastClickStamp: 0,
    rearmTimer: null,
    modalOpen: null
  };

  var settings = { orient: 'auto', fullscreen: false };

  /* ======================= 工具 ======================= */
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function pct(v, max) { return Math.max(0, Math.min(100, max ? (v / max) * 100 : 0)); }

  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }
  function storeRemove(key) { try { window.localStorage.removeItem(key); } catch (e) {} }

  /* ======================= 存档 ======================= */
  function saveGame() {
    try { store(SAVE_KEY, Core.serialize(game)); } catch (e) {}
  }
  function loadGame() {
    var text = store(SAVE_KEY);
    if (!text) return null;
    return Core.deserialize(text);
  }
  function hasSave() {
    var g = loadGame();
    return !!(g && g.screen && g.screen !== 'title' && g.screen !== 'victory' && g.screen !== 'defeat');
  }
  function clearSave() { storeRemove(SAVE_KEY); }

  function loadSettings() {
    try {
      var raw = store(SETTINGS_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && obj.orient) settings.orient = obj.orient;
      }
    } catch (e) {}
  }
  function saveSettings() { store(SETTINGS_KEY, JSON.stringify(settings)); }

  function history() {
    try { return JSON.parse(store(HISTORY_KEY) || '[]'); } catch (e) { return []; }
  }
  function pushHistory(entry) {
    var list = history();
    list.unshift(entry);
    try { store(HISTORY_KEY, JSON.stringify(list.slice(0, 20))); } catch (e) {}
  }

  /* ======================= 弹窗 ======================= */
  function openModal(kind) {
    ui.modalOpen = kind;
    var back = el('modal-back');
    var title = el('modal-title');
    var body = el('modal-body');
    title.textContent = MODAL_TITLES[kind] || '';
    body.innerHTML = modalContent(kind);
    back.classList.add('on');
    back.setAttribute('aria-hidden', 'false');
    if (kind === 'settings') applyOrient();
  }
  function closeModal() {
    ui.modalOpen = null;
    var back = el('modal-back');
    if (back) { back.classList.remove('on'); back.setAttribute('aria-hidden', 'true'); }
  }
  var MODAL_TITLES = { rules: '规 则', draw: '抽 牌 堆', discard: '弃 牌 堆', settings: '设 置' };

  function modalContent(kind) {
    if (kind === 'rules') return rulesHTML();
    if (kind === 'draw') return pileHTML(game.battle ? game.battle.drawPile : []);
    if (kind === 'discard') return pileHTML(game.battle ? game.battle.discardPile : []);
    if (kind === 'settings') return settingsHTML();
    return '';
  }

  function rulesHTML() {
    var b = game.battle;
    return '' +
      '<h4>对决流程</h4>' +
      '<p>本游戏共 <b>9 场</b>战斗，每场最多 <b>10 轮</b>。每场开始时抽满手牌，之后每轮结束补满至 4 张。</p>' +
      '<ul>' +
      '<li>手牌即出战区：手牌中的所有单位牌都会参与本轮对决，无需拖拽、上阵或施放，点击手牌不会有任何效果。</li>' +
      '<li>点击「开始对决」后，手牌从左到右依次攻击存活敌人；敌人全部阵亡即判定胜利，本轮不再被反击。</li>' +
      '<li>敌人行动时，伤害<b>先由手牌承受</b>：从 1 号位开始依次扣除卡牌当前生命，击破后剩余伤害继续传递到下一张牌；所有手牌耗尽后，剩余伤害才扣玩家生命。</li>' +
      '<li>阵亡的牌进入弃牌堆；存活的牌保持剩余生命与相对顺序，新抽到的牌追加到右侧。</li>' +
      '<li>第 10 轮完整结算后敌人仍存活，本场立即失败（十轮已尽），不会出现第 11 轮。</li>' +
      '</ul>' +
      '<h4>卡牌</h4>' +
      '<ul>' +
      '<li>有攻击与生命的<b>单位牌</b>才会进入手牌；没有攻击或生命的法术、被动牌会自动进入右侧状态区。</li>' +
      '<li>卡面显示的攻击力 = 本轮实际造成的伤害，两者由同一个函数计算，包含关键词与全部遗物加成。</li>' +
      '<li>抽牌堆为空时会重洗弃牌堆；若已无牌可抽，则保持不足 4 张的状态。</li>' +
      '</ul>' +
      '<h4>遗物（35 种）</h4>' +
      '<p>遗物主要强化攻击，可按氏族、印记阶位、生命高低、是否受伤、基础攻击奇偶、每轮位置、轮次、场次、关键词以及已持有遗物数量生效。卡面数值与实际伤害始终一致。</p>' +
      '<h4>进度与资源</h4>' +
      '<ul>' +
      '<li>完成第 <b>2、4、6、8 场</b>后进入商城并刷新商品；第 1、3、5、7 场后直接进入下一场；第 9 场胜利即通关。</li>' +
      '<li>每通过一场恢复 <b>' + Core.RULES.HEAL_PER_WAVE + ' 点生命</b>，并获得烛币用于购买卡牌、遗物或销毁卡组中的牌。</li>' +
      '<li>烛火是世界观资源，目前只作为界面显示，不会影响对决与生命。</li>' +
      '</ul>' +
      (b ? '<h4>当前进度</h4><p>第 ' + (b.waveIndex + 1) + ' / ' + Core.RULES.TOTAL_WAVES + ' 场 · 第 ' + b.round + ' / ' + Core.RULES.MAX_ROUNDS + ' 轮 · 手牌 ' + b.hand.length + ' 张</p>' : '');
  }

  function pileHTML(list) {
    if (!list || !list.length) return '<div class="side-empty">这里空着。<br>没有可展示的卡牌。</div>';
    return '<div class="deck-cards">' + list.map(function (c) {
      return cardHTML(c, true);
    }).join('') + '</div>';
  }

  function settingsHTML() {
    var list = history();
    var rows = list.length ? list.map(function (h) {
      return '<div class="history-row"><span>' + esc(h.clanName) + ' · ' + esc(h.diffName) + '</span>' +
        '<span class="res">' + esc(h.result) + ' · 第 ' + h.wave + ' 场</span></div>';
    }).join('') : '<div class="side-empty">还没有对局记录。</div>';

    var html = '';
    html += '<div class="setting-row"><div class="k">显示模式<small>网页版可切换窗口 / 全屏</small></div><div class="seg" id="seg-display">' +
      '<button data-v="window" class="' + (settings.fullscreen ? '' : 'on') + '">窗口</button>' +
      '<button data-v="full" class="' + (settings.fullscreen ? 'on' : '') + '">全屏</button></div></div>';
    html += '<div class="setting-row"><div class="k">方向设置<small>移动端可在支持的设备上锁定横竖屏</small></div><div class="seg" id="seg-orient">' +
      ['auto', 'landscape', 'portrait'].map(function (v) {
        var label = { auto: '自动', landscape: '横屏', portrait: '竖屏' }[v];
        return '<button data-v="' + v + '" class="' + (settings.orient === v ? 'on' : '') + '">' + label + '</button>';
      }).join('') + '</div></div>';
    html += '<h4>历史对局</h4>' + rows;
    html += '<div class="setting-row" style="border-bottom:none"><div class="k">清空记录</div>' +
      '<div class="seg"><button id="clear-history">清空</button></div></div>';
    return html;
  }

  /* ======================= 渲染：卡片 ======================= */
  function cardHTML(inst, mini) {
    var def = Core.cardDef(inst.cardId);
    var b = game.battle;
    var atk = def.atk != null ? def.atk : 0;
    var hp = def.hp != null ? def.hp : 0;
    var isState = !Core.isUnitCard(def);
    var tierText = (DATA.TIER_NAME[def.tier] || '').split('·')[1] || '';
    var foot = isState
      ? '<div class="card-foot"><span class="stat atk">效果</span></div>'
      : '<div class="card-foot"><span class="stat atk">' + atk + '</span><span class="stat hp">' + hp + '</span></div>';
    return '<div class="card' + (isState ? ' state-card' : '') + (mini ? ' mini' : '') + '" data-uid="' + inst.uid + '" data-card="' + inst.cardId + '">' +
      '<div class="card-inner">' +
      '<div class="card-tier">' + esc(tierText) + '</div>' +
      '<div class="card-name">' + esc(def.name) + '</div>' +
      '<div class="card-text">' + esc(def.text) + '</div>' +
      foot +
      '</div></div>';
  }

  /** 手牌卡面：显示的是统一函数算出的真实攻击力 */
  function handCardHTML(inst, index) {
    var b = game.battle;
    var def = Core.cardDef(inst.cardId);
    var ctx = Core.makeCtx(game, index, b.hand.length);
    var atk = Core.effectiveAttack(game, inst, ctx);
    var tierText = (DATA.TIER_NAME[def.tier] || '').split('·')[1] || '';
    var bonus = atk - inst.atk;
    var foot = '<div class="card-foot">' +
      '<span class="stat atk" title="本轮实际伤害">' + atk + '</span>' +
      '<span class="stat hp" title="当前生命 / 生命上限">' + inst.hp + '<span class="stat-label">/' + inst.maxHp + '</span></span>' +
      '</div>';
    var bonusNote = bonus > 0 ? '<div class="card-text" style="margin:2px 6px 0;font-size:10px;color:#7a5a22">加成 +' + bonus + '</div>' : '';
    return '<div class="hand-slot"><div class="card" data-uid="' + inst.uid + '" data-card="' + inst.cardId + '" data-index="' + index + '">' +
      '<div class="card-inner">' +
      '<div class="card-tier">' + esc(tierText) + '</div>' +
      '<div class="card-name">' + esc(def.name) + '</div>' +
      '<div class="card-text">' + esc(def.text) + '</div>' +
      bonusNote +
      foot +
      '</div></div></div>';
  }

  /* ======================= 渲染：主入口 ======================= */
  function render() {
    var app = el('app');
    if (game.screen === 'battle' && app.querySelector('.battle')) {
      updateBattle();
    } else {
      app.innerHTML = buildScreen();
      afterRender();
    }
  }

  function buildScreen() {
    switch (game.screen) {
      case 'title': return titleHTML();
      case 'select': return selectHTML();
      case 'battle': return battleShellHTML();
      case 'shop': return shopHTML();
      case 'victory': return endHTML(true);
      case 'defeat': return endHTML(false);
      default: return titleHTML();
    }
  }

  function afterRender() {
    if (game.screen === 'battle') {
      updateBattle();
      armBattleButton();
      return;
    }
    if (game.screen === 'select') bindSelect();
    if (game.screen === 'shop') bindShop();
    if (game.screen === 'title') bindTitle();
    if (game.screen === 'victory' || game.screen === 'defeat') bindEnd();
  }

  /* ---------- 开始界面 ---------- */
  function titleHTML() {
    var cont = hasSave();
    return '<div class="screen title-screen">' +
      '<div class="title-wrap">' +
      '<div class="title-mark">ASHEN CANDLE</div>' +
      '<h1 class="title-main">残烛纪年</h1>' +
      '<div class="title-sub">ASHEN CANDLE</div>' +
      '<div class="title-rule"></div>' +
      '<p class="title-desc">九场长廊，一支残烛。<br>带上手牌，让它们替你挡住黑暗。</p>' +
      '<div class="title-actions">' +
      '<button class="btn primary" data-act="start">' + (cont ? '开始新的一局' : '进入游戏') + '</button>' +
      (cont ? '<button class="btn ghost" data-act="continue">继续上次进度</button>' : '') +
      (BUILD === 'web' ? '<button class="btn ghost" data-act="fullscreen">进入全屏</button>' : '') +
      '</div>' +
      '</div>' +
      '<div class="credits">' +
      '<div class="ck">SPECIAL THANKS</div>' +
      '<div class="cn">特别鸣谢</div>' +
      '<div class="cname">布兰 Bran</div>' +
      '<div class="crec">友情推荐 · FRIENDLY RECOMMENDATION</div>' +
      '<div class="crec"><b>《降临之地》</b> 现已登陆 Steam</div>' +
      '</div>' +
      '</div>';
  }

  function bindTitle() {
    var app = el('app');
    app.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        if (act === 'start') { startNewRun(); }
        else if (act === 'continue') { continueRun(); }
        else if (act === 'fullscreen') { requestFullscreen(); }
      });
    });
  }

  function startNewRun() {
    game = Core.createGame();
    game.screen = 'select';
    ui.dealUids = [];
    saveGame();
    render();
  }

  function continueRun() {
    var loaded = loadGame();
    if (!loaded) { startNewRun(); return; }
    game = loaded;
    if (game.screen === 'title') game.screen = 'select';
    if (game.screen === 'battle' && game.battle && !game.battle.outcome) {
      ui.dealUids = game.battle.hand.map(function (c) { return c.uid; });
      ui.dealing = true;
    }
    render();
  }

  /* ---------- 选关 / 开局配置 ---------- */
  var sel = { clan: 'order', diff: 'ember', deck: null, random: false };

  function selectHTML() {
    var clans = Object.keys(DATA.CLANS).map(function (id) {
      var c = DATA.CLANS[id];
      return '<button class="opt' + (sel.clan === id ? ' on' : '') + '" data-clan="' + id + '">' +
        '<h3>' + esc(c.name) + '</h3><div class="tag">' + esc(c.tag) + '</div><p>' + esc(c.desc) + '</p></button>';
    }).join('');

    var diffs = Object.keys(DATA.DIFFICULTIES).map(function (id) {
      var d = DATA.DIFFICULTIES[id];
      return '<button class="opt' + (sel.diff === id ? ' on' : '') + '" data-diff="' + id + '">' +
        '<h3>' + esc(d.name) + '</h3><p>' + esc(d.desc) + '</p>' +
        '<div class="diff-note">生命 ' + d.hp + ' · 敌人生命 ×' + d.hpMul + ' · 敌人攻击 +' + d.atkAdd + '</div></button>';
    }).join('');

    var deckList = sel.deck || DATA.CLANS[sel.clan].deck;
    var cards = deckList.map(function (id) {
      var def = DATA.CARDS[id];
      var inst = { uid: id, cardId: id };
      return '<div class="card mini" data-card="' + id + '"><div class="card-inner">' +
        '<div class="card-tier">' + esc((DATA.TIER_NAME[def.tier] || '').split('·')[1] || '') + '</div>' +
        '<div class="card-name">' + esc(def.name) + '</div>' +
        '<div class="card-text">' + esc(def.text) + '</div>' +
        '<div class="card-foot"><span class="stat atk">' + def.atk + '</span><span class="stat hp">' + def.hp + '</span></div>' +
        '</div></div>';
    }).join('');

    return '<div class="screen select-screen">' +
      '<div class="select-head"><h2>烛 火 未 熄</h2><p>选择氏族与难度，并决定这一局带上手牌</p></div>' +
      '<div class="select-body">' +
      '<div class="sel-block clan"><div class="sel-label">氏 族</div><div class="opt-row">' + clans + '</div></div>' +
      '<div class="sel-block diff"><div class="sel-label">难 度</div><div class="opt-row">' + diffs + '</div></div>' +
      '<div class="sel-block deck"><div class="sel-label">初 始 卡 组</div>' +
      '<div class="deck-panel"><div class="panel">' +
      '<div class="deck-tools"><button class="btn" data-act="reroll">重 新 随 机</button><button class="btn ghost" data-act="restore">恢 复 默 认</button></div>' +
      '<div class="deck-hint">' + (sel.random
        ? '当前为随机卡组，开局后正式使用这 8 张牌。可无限次重新随机，开局前只能查看整套卡组。'
        : '当前为「' + esc(DATA.CLANS[sel.clan].name) + '」默认卡组。点击「重新随机」可从 ' + DATA.RANDOM_POOL.length + ' 张候选牌中抽取 8 张。') + '</div>' +
      '<div class="deck-cards">' + cards + '</div>' +
      '</div></div></div>' +
      '</div>' +
      '<div class="select-foot"><button class="btn primary" data-act="begin">进 入 长 廊</button></div>' +
      '</div>';
  }

  function bindSelect() {
    var app = el('app');
    app.querySelectorAll('[data-clan]').forEach(function (b) {
      b.addEventListener('click', function () {
        sel.clan = b.getAttribute('data-clan');
        if (!sel.random) sel.deck = null;
        render();
      });
    });
    app.querySelectorAll('[data-diff]').forEach(function (b) {
      b.addEventListener('click', function () {
        sel.diff = b.getAttribute('data-diff');
        render();
      });
    });
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        if (act === 'reroll') { sel.deck = Core.randomDeck(); sel.random = true; render(); }
        else if (act === 'restore') { sel.deck = null; sel.random = false; render(); }
        else if (act === 'begin') { beginRun(); }
      });
    });
  }

  function beginRun() {
    var deck = (sel.deck && sel.deck.length === Core.RULES.START_DECK_SIZE)
      ? sel.deck.slice()
      : DATA.CLANS[sel.clan].deck.slice();
    Core.startRun(game, { clan: sel.clan, difficulty: sel.diff, deck: deck });
    game.lastRandomDeck = sel.random ? deck.slice() : null;
    ui.dealUids = game.battle.hand.map(function (c) { return c.uid; });
    ui.dealing = true;
    saveGame();
    render();
  }

  /* ---------- 战斗界面 ---------- */
  function battleShellHTML() {
    return '<div class="screen battle" id="battle-screen">' +
      '<div class="b-top" id="b-top"></div>' +
      '<aside class="b-left" id="b-left"></aside>' +
      '<section class="b-field" id="b-field"></section>' +
      '<aside class="b-side" id="b-side"></aside>' +
      '<div class="b-hand">' +
      '<button class="battle-btn" id="battle-submit" type="button">开始对决</button>' +
      '<div class="hand-row" id="b-hand-row"></div>' +
      '</div>' +
      '</div>';
  }

  function updateBattle() {
    var b = game.battle;
    if (!b) return;
    el('b-top').innerHTML = topHTML();
    el('b-left').innerHTML = leftHTML();
    el('b-field').innerHTML = fieldHTML();
    el('b-side').innerHTML = sideHTML();
    el('b-hand-row').innerHTML = b.hand.map(handCardHTML).join('');
    bindTopTools();
    // 本场已结束时按钮保持禁用，避免玩家在结算浮层出现前再次推进
    var btn = el('battle-submit');
    if (btn && b.outcome) { btn.disabled = true; btn.textContent = '本 场 结 束'; }
    // 新抽到的牌依次落位（发牌表现，纯视觉）
    if (ui.dealUids.length) playDealAnimation();
  }

  function topHTML() {
    var b = game.battle;
    var wave = DATA.WAVES[b.waveIndex];
    var enemy = b.enemies[0];
    var steps = DATA.WAVES.map(function (w, i) {
      var cls = i === b.waveIndex ? 'on' : (i < b.waveIndex ? 'done' : '');
      return '<i class="' + cls + '">' + (i + 1) + '</i>';
    }).join('');
    var shieldTxt = enemy.shield > 0 ? '<span class="shield-txt">护盾 ' + enemy.shield + '</span>' : '';
    return '<div class="wave-box">' +
      '<div class="wave-name">' + esc(enemy.name) + '<small>' + esc(enemy.place || wave.place) + ' · 第 ' + (b.waveIndex + 1) + ' / ' + Core.RULES.TOTAL_WAVES + ' 场</small></div>' +
      '<div class="steps">' + steps + '</div>' +
      '<div class="enemy-hp" title="' + esc(enemy.name) + ' ' + enemy.hp + ' / ' + enemy.maxHp + '">' +
      '<i style="width:' + pct(enemy.hp, enemy.maxHp) + '%"></i>' +
      '<b><span>' + esc(enemy.name) + '</span><span class="hp-num">' + enemy.hp + ' / ' + enemy.maxHp + '</span>' + shieldTxt + '</b>' +
      '</div>' +
      '<div class="round-line"><span>第 <b>' + b.round + '</b> / ' + Core.RULES.MAX_ROUNDS + ' 轮</span>' +
      '<span>手牌 <b>' + b.hand.length + '</b> / ' + Core.RULES.MAX_HAND + '</span>' +
      '<span>烛币 <b>' + game.run.gold + '</b></span></div>' +
      '</div>' +
      '<div class="top-tools">' +
      '<button class="round-btn" data-act="rules" title="规则" aria-label="规则">规</button>' +
      '<button class="round-btn" data-act="draw" title="抽牌堆" aria-label="抽牌堆">抽</button>' +
      '<button class="round-btn" data-act="discard" title="弃牌堆" aria-label="弃牌堆">弃</button>' +
      '<button class="round-btn" data-act="settings" title="设置" aria-label="设置">⚙</button>' +
      '</div>';
  }

  function leftHTML() {
    var r = game.run;
    var hpPct = pct(r.playerHp, r.maxPlayerHp);
    var pips = '';
    for (var i = 0; i < Core.RULES.INITIAL_CANDLE; i++) pips += '<i></i>';
    var relics = r.relics.map(function (id) {
      var rel = DATA.RELICS[id];
      return '<div class="relic-chip" data-name="' + esc(rel.name) + '" data-tip="' + esc(rel.text) + '">' + esc(rel.name.charAt(0)) + '</div>';
    }).join('');
    return '<div class="hud-hp">' +
      '<div class="hud-name">生命</div>' +
      '<div class="hud-bar hp"><i style="height:' + hpPct + '%"></i><b>' + r.playerHp + '</b></div>' +
      '<div class="hud-note">' + r.playerHp + ' / ' + r.maxPlayerHp + '</div>' +
      '</div>' +
      '<div class="hud-candle">' +
      '<div class="hud-name">烛火</div>' +
      '<div class="hud-bar cd"><i style="height:100%"></i><b>' + r.candle + '</b></div>' +
      '<div class="candle-pips">' + pips + '</div>' +
      '</div>' +
      '<div class="relic-dock">' +
      '<div class="label">遗 物</div>' +
      '<div class="relic-row">' + (relics || '<div class="hud-note">无</div>') + '</div>' +
      '</div>';
  }

  function fieldHTML() {
    var b = game.battle;
    var enemy = b.enemies[0];
    var intent = enemy.intents[enemy.intentIndex % enemy.intents.length];
    var diff = DATA.DIFFICULTIES[game.run.difficulty];
    var label = { attack: '攻 击', defend: '格 挡', buff: '强 化' }[intent.t] || '行 动';
    var ico = { attack: '⚔', defend: '🛡', buff: '✦' }[intent.t] || '✦';
    var value = intent.t === 'attack' ? (intent.v + enemy.atkBonus + diff.atkAdd) : intent.v;
    return '<div class="monster-wrap">' +
      '<div class="monster" style="background-image:url(' + (ART[enemy.art] || '') + ')" role="img" aria-label="' + esc(enemy.name) + '"></div>' +
      '<div class="intent-box ' + intent.t + '"><span class="ico">' + ico + '</span><span>' + label + '</span><b>' + value + '</b></div>' +
      '</div>';
  }

  function sideHTML() {
    var b = game.battle;
    var sideCards = b.sideCards.map(function (c) {
      var def = Core.cardDef(c.cardId);
      return '<div class="status-mini"><b>' + esc(def.name) + '</b><span>' + esc(def.text) + '</span></div>';
    }).join('');
    return '<div class="side-zone"><div class="panel">' +
      '<div class="panel-title">状 态 区</div>' +
      '<div class="side-list">' + (sideCards || '<div class="side-empty">暂无状态牌。<br>抽到没有攻击或生命的牌时会出现在这里。</div>') + '</div>' +
      '</div></div>' +
      '<div class="pile-row">' +
      '<button class="pile-btn" data-act="draw">抽牌堆<b>' + b.drawPile.length + '</b></button>' +
      '<button class="pile-btn" data-act="discard">弃牌堆<b>' + b.discardPile.length + '</b></button>' +
      '</div>';
  }

  function bindTopTools() {
    document.querySelectorAll('[data-act="rules"],[data-act="draw"],[data-act="discard"],[data-act="settings"]').forEach(function (btn) {
      if (btn.dataset.bound === '1') return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        openModal(btn.getAttribute('data-act'));
      });
    });
  }

  /* ---------- 对决按钮：唯一结算入口 ---------- */
  function bindBattleButton() {
    var btn = el('battle-submit');
    if (!btn) return;
    if (btn.dataset.bound === '1') return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', onBattleSubmit, { once: true });
  }

  function armBattleButton() {
    var btn = el('battle-submit');
    if (!btn) return;
    var b = game.battle;
    if (!b || b.outcome) {
      btn.disabled = true;
      btn.textContent = b && b.outcome ? '本 场 结 束' : '开 始 对 决';
      return;
    }
    btn.disabled = ui.dealing;
    btn.textContent = ui.dealing ? '发 牌 中…' : '开 始 对 决';
    btn.dataset.bound = '0';
    bindBattleButton();
  }

  function onBattleSubmit(event) {
    event.preventDefault();
    var btn = event.currentTarget;
    btn.dataset.bound = '0';

    // 同一物理双击只推进一轮（浏览器原生双击计数）
    if (event.detail >= 2) { armBattleButton(); return; }

    if (!Core.canAdvanceRound(game)) { armBattleButton(); return; }

    btn.disabled = true;
    var events = Core.advanceOneRound(game);
    Core.assertGameState(game);
    saveGame();
    // 本轮补位抽到的牌在结算后依次落位
    var drawn = events.filter(function (e) { return e.type === 'draw'; }).map(function (e) { return e.uid; });
    ui.dealUids = drawn;
    render();
    playEvents(events);
    if (drawn.length) playDealAnimation();
    else scheduleRearm();
  }

  /** 结算表现结束后重新武装按钮；纯视觉节奏，不承担正确性 */
  function scheduleRearm(delay) {
    var btn = el('battle-submit');
    if (ui.rearmTimer) { clearTimeout(ui.rearmTimer); ui.rearmTimer = null; }
    var ms = delay == null ? 380 : delay;
    ui.rearmTimer = setTimeout(function () {
      ui.rearmTimer = null;
      ui.dealing = false;
      armBattleButton();
    }, ms);
  }

  /* ---------- 战斗结束浮层 ---------- */
  function playEvents(events) {
    var b = game.battle;
    var fx = el('fx');
    if (!b || !events || !events.length) return;
    var enemyNode = document.querySelector('.monster');

    events.forEach(function (ev) {
      if (ev.type === 'enemy-damage' && ev.amount > 0) {
        floatAt(enemyNode, ev.amount, 'dmg');
        shake();
      } else if (ev.type === 'card-attack') {
        var node = document.querySelector('.card[data-uid="' + ev.uid + '"]');
        if (node) {
          node.classList.add('hit');
          setTimeout(function () { node.classList.remove('hit'); }, 300);
        }
        if (enemyNode) floatAt(enemyNode, ev.amount, 'dmg', 0.55);
      } else if (ev.type === 'card-die') {
        var dnode = document.querySelector('.card[data-uid="' + ev.uid + '"]');
        if (dnode) {
          dnode.classList.add('dying');
          setTimeout(function () { dnode.classList.remove('dying'); }, 460);
        }
      } else if (ev.type === 'player-damage' && ev.amount > 0) {
        floatAt(document.querySelector('.hud-bar.hp'), '-' + ev.amount, ev.reason ? 'self' : 'dmg');
      } else if (ev.type === 'player-heal' && ev.amount > 0) {
        floatAt(document.querySelector('.hud-bar.hp'), '+' + ev.amount, 'heal');
      } else if (ev.type === 'enemy-die') {
        shake();
      }
    });

    if (b.outcome) {
      setTimeout(function () { showResult(); }, 620);
    }
  }

  function showResult() {
    var b = game.battle;
    if (!b || !b.outcome) return;
    var win = b.outcome === 'win';
    var title = win ? '本 场 胜 利' : (b.loseReason === 'rounds' ? '十 轮 已 尽' : '烛 火 熄 灭');
    var sub = win
      ? '第 ' + (b.waveIndex + 1) + ' 场 · ' + b.enemies[0].name + ' 已被击退'
      : (b.loseReason === 'rounds' ? '十轮已尽，' + b.enemies[0].name + ' 仍站着你。' : '生命耗尽，长廊吞下了最后一盏烛。');
    var back = el('result-back');
    back.innerHTML = '<div class="panel" style="max-width:420px;width:100%">' +
      '<div class="panel-title">' + title + '</div>' +
      '<div class="modal-body" style="text-align:center">' +
      '<p>' + esc(sub) + '</p>' +
      '<p style="font-size:12px;color:#a99c88">剩余生命 ' + game.run.playerHp + ' / ' + game.run.maxPlayerHp + ' · 烛币 ' + game.run.gold + '</p>' +
      '<div style="margin-top:14px"><button class="btn primary" data-act="result-next">' + (win ? '继 续' : '返 回') + '</button></div>' +
      '</div></div>';
    back.classList.add('on');
    back.querySelector('[data-act="result-next"]').addEventListener('click', function () {
      back.classList.remove('on');
      if (win) {
        var res = Core.advanceAfterWin(game);
        if (res.next === 'shop') { ui.dealUids = []; saveGame(); render(); }
        else if (res.next === 'victory') { recordRun(true); game.screen = 'victory'; saveGame(); render(); }
        else { ui.dealUids = game.battle.hand.map(function (c) { return c.uid; }); ui.dealing = true; saveGame(); render(); }
      } else {
        recordRun(false);
        game.screen = 'defeat';
        saveGame();
        render();
      }
    });
  }

  function recordRun(win) {
    pushHistory({
      clanName: DATA.CLANS[game.run.clan].name,
      diffName: DATA.DIFFICULTIES[game.run.difficulty].name,
      wave: game.run.waveIndex + 1,
      result: win ? '通关' : '失败',
      time: new Date().toISOString().slice(0, 16).replace('T', ' ')
    });
  }

  /* ---------- 商城 ---------- */
  function shopHTML() {
    var shop = game.shop;
    var cardItems = shop.cards.map(function (o, i) {
      var def = Core.cardDef(o.cardId);
      var isState = !Core.isUnitCard(def);
      var inner = isState
        ? '<div class="card state-card"><div class="card-inner">' +
          '<div class="card-tier">效果</div><div class="card-name">' + esc(def.name) + '</div>' +
          '<div class="card-text">' + esc(def.text) + '</div><div class="card-foot"><span class="stat atk">驻留</span></div></div></div>'
        : '<div class="card"><div class="card-inner">' +
          '<div class="card-tier">' + esc((DATA.TIER_NAME[def.tier] || '').split('·')[1] || '') + '</div>' +
          '<div class="card-name">' + esc(def.name) + '</div>' +
          '<div class="card-text">' + esc(def.text) + '</div>' +
          '<div class="card-foot"><span class="stat atk">' + def.atk + '</span><span class="stat hp">' + def.hp + '</span></div></div></div>';
      return '<div class="shop-item' + (o.sold ? ' sold' : '') + '">' + inner +
        '<div class="price">烛币 ' + o.price + '</div>' +
        '<button class="buy" data-buy-card="' + i + '"' + (game.run.gold < o.price ? ' disabled' : '') + '>' + (o.sold ? '已购买' : '购 买') + '</button>' +
        '</div>';
    }).join('');

    var relicItems = shop.relics.map(function (o, i) {
      var rel = DATA.RELICS[o.relicId];
      return '<div class="shop-item' + (o.sold ? ' sold' : '') + '">' +
        '<div class="relic-chip" style="width:52px;height:52px;font-size:20px">' + esc(rel.name.charAt(0)) + '</div>' +
        '<h4>' + esc(rel.name) + '</h4>' +
        '<p>' + esc(rel.text) + '</p>' +
        '<div class="price">烛币 ' + o.price + '</div>' +
        '<button class="buy" data-buy-relic="' + i + '"' + (game.run.gold < o.price ? ' disabled' : '') + '>' + (o.sold ? '已购买' : '购 买') + '</button>' +
        '</div>';
    }).join('');

    var destroyList = game.run.deck.map(function (id, i) {
      var def = Core.cardDef(id);
      return '<button class="destroy-chip' + (ui.destroyPick === i ? ' on' : '') + '" data-destroy="' + i + '">' +
        esc(def.name) + ' <span style="opacity:.6">' + (def.atk || '-') + '/' + (def.hp || '-') + '</span></button>';
    }).join('');

    return '<div class="screen shop-screen">' +
      '<div class="shop-head">' +
      '<h2>商 城 · 第 ' + (game.run.waveIndex) + ' 场之后</h2>' +
      '<div class="shop-coin">烛 币 ' + game.run.gold + '</div>' +
      '</div>' +
      '<div class="shop-counter scroll-y">' +
      '<div class="shop-sub">卡 牌 商 品</div>' +
      '<div class="shop-grid">' + cardItems + '</div>' +
      '<div class="shop-sub">遗 物 商 品</div>' +
      '<div class="shop-grid">' + relicItems + '</div>' +
      '<div class="destroy-zone">' +
      '<div class="shop-sub" style="margin:0 0 4px">卡 组 销 毁 区</div>' +
      '<p style="margin:0;font-size:11.5px;color:#a99c88">销毁卡组中的一张牌以减轻负担。当前销毁价：<b style="color:#f0c86a">烛币 ' + shop.destroyPrice + '</b></p>' +
      '<div class="destroy-list">' + destroyList + '</div>' +
      '<button class="btn" data-act="destroy" style="padding:6px 16px;font-size:12px">销 毁 选 中 的 牌</button>' +
      '</div>' +
      '</div>' +
      '<div class="shop-foot"><button class="btn primary" data-act="next-wave">前 往 下 一 场</button></div>' +
      '</div>';
  }

  function bindShop() {
    var app = el('app');
    app.querySelectorAll('[data-buy-card]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (Core.buyShopCard(game, +b.getAttribute('data-buy-card'))) { saveGame(); render(); }
      });
    });
    app.querySelectorAll('[data-buy-relic]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (Core.buyShopRelic(game, +b.getAttribute('data-buy-relic'))) { saveGame(); render(); }
      });
    });
    app.querySelectorAll('[data-destroy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-destroy');
        ui.destroyPick = (ui.destroyPick === i) ? -1 : i;
        render();
      });
    });
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        if (act === 'destroy') {
          if (ui.destroyPick >= 0 && Core.destroyDeckCard(game, ui.destroyPick)) {
            ui.destroyPick = -1; saveGame(); render();
          }
        } else if (act === 'next-wave') {
          Core.leaveShop(game);
          ui.dealUids = game.battle.hand.map(function (c) { return c.uid; });
          ui.dealing = true;
          saveGame();
          render();
        }
      });
    });
  }

  /* ---------- 结算屏 ---------- */
  function endHTML(win) {
    return '<div class="screen end-screen">' +
      '<h1 class="end-title' + (win ? '' : ' lose') + '">' + (win ? '残 烛 未 熄' : '长 廊 无 尽') + '</h1>' +
      '<div class="end-sub">' + (win
        ? '九场长廊，你带着最后一支残烛走了出来。'
        : '第 ' + (game.run.waveIndex + 1) + ' 场，烛火熄灭了。') + '</div>' +
      '<div class="end-stats">' +
      '<div class="end-stat"><b>' + (win ? 9 : game.run.waveIndex + 1) + '</b><span>场次</span></div>' +
      '<div class="end-stat"><b>' + game.run.gold + '</b><span>烛币</span></div>' +
      '<div class="end-stat"><b>' + game.run.relics.length + '</b><span>遗物</span></div>' +
      '<div class="end-stat"><b>' + game.run.playerHp + '</b><span>剩余生命</span></div>' +
      '</div>' +
      '<div class="title-actions">' +
      '<button class="btn primary" data-act="again">再 来 一 局</button>' +
      '<button class="btn ghost" data-act="home">回 到 开 始</button>' +
      '</div>' +
      '</div>';
  }

  function bindEnd() {
    var app = el('app');
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        if (act === 'again') { clearSave(); startNewRun(); }
        else if (act === 'home') { clearSave(); game = Core.createGame(); game.screen = 'title'; saveGame(); render(); }
      });
    });
  }

  /* ======================= 动画 ======================= */
  function playDealAnimation() {
    var uids = ui.dealUids;
    ui.dealUids = [];
    var btn = el('battle-submit');
    if (btn) { btn.disabled = true; btn.textContent = '发 牌 中…'; }
    ui.dealing = true;
    uids.forEach(function (uid, i) {
      var node = document.querySelector('.hand-row .card[data-uid="' + uid + '"]');
      if (!node) return;
      node.classList.add('dealing');
      node.style.setProperty('--deal-delay', (i * 0.12) + 's');
    });
    scheduleRearm(320 + uids.length * 120);
  }

  function floatAt(node, text, cls, scale) {
    if (!node) return;
    var r = node.getBoundingClientRect();
    var fx = el('fx');
    if (!fx) return;
    var d = document.createElement('div');
    d.className = 'float-num ' + (cls || 'dmg');
    d.textContent = text;
    d.style.left = (r.left + r.width / 2) + 'px';
    d.style.top = (r.top + r.height * 0.34) + 'px';
    if (scale) { d.style.fontSize = Math.round(30 * scale) + 'px'; d.style.opacity = '.92'; }
    fx.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1100);
  }

  function shake() {
    var field = document.querySelector('.b-field');
    if (!field) return;
    field.classList.remove('quake');
    void field.offsetWidth;
    field.classList.add('quake');
    setTimeout(function () { field.classList.remove('quake'); }, 320);
  }

  /* ======================= 全屏与方向 ======================= */
  function fsElement() {
    return document.documentElement || document.body;
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function requestFullscreen() {
    var e = fsElement();
    var fn = e.requestFullscreen || e.webkitRequestFullscreen || e.msRequestFullscreen;
    if (!fn) return;
    try {
      var p = fn.call(e);
      if (p && p.then) p.then(function () { settings.fullscreen = true; saveSettings(); }).catch(function () {});
      else { settings.fullscreen = true; saveSettings(); }
    } catch (err) {}
  }
  function exitFullscreen() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) { try { fn.call(document); } catch (e) {} }
    settings.fullscreen = false;
    saveSettings();
  }
  function applyOrient() {
    if (!settings.orient || settings.orient === 'auto') return;
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock(settings.orient === 'landscape' ? 'landscape' : 'portrait');
      }
    } catch (e) {}
  }

  /* ======================= 全局事件 ======================= */
  function bindModal() {
    var back = el('modal-back');
    back.addEventListener('click', function (e) {
      if (e.target === back) { closeModal(); }
    });
    el('modal-close').addEventListener('click', closeModal);
    back.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-v]') : null;
      if (!t) return;
      var seg = t.parentNode.getAttribute('id');
      var v = t.getAttribute('data-v');
      if (seg === 'seg-display') {
        if (v === 'full') { requestFullscreen(); }
        else { if (isFullscreen()) exitFullscreen(); settings.fullscreen = false; saveSettings(); }
      } else if (seg === 'seg-orient') {
        settings.orient = v;
        saveSettings();
        applyOrient();
      }
      openModal('settings');
    });
    back.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('#clear-history')) {
        storeRemove(HISTORY_KEY);
        openModal('settings');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && ui.modalOpen) closeModal();
    });
  }

  function bindGlobal() {
    document.addEventListener('visibilitychange', function () {
      // 回到前台时解除可能的视觉锁，避免后台节流导致的卡死
      if (!document.hidden) {
        if (ui.rearmTimer) { clearTimeout(ui.rearmTimer); ui.rearmTimer = null; }
        ui.dealing = false;
        if (game.screen === 'battle') armBattleButton();
      }
    });
    window.addEventListener('resize', function () { /* 纯 CSS 响应式，无需重排 */ });
  }

  /* ======================= 启动 ======================= */
  function boot() {
    loadSettings();
    var app = el('app');
    app.innerHTML = titleHTML();
    bindTitle();
    bindModal();
    bindGlobal();
    applyOrient();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // 供自动化测试使用的只读入口
  window.ASHEN_UI = {
    getGame: function () { return game; },
    render: render,
    startRun: function (clan, diff, deck) {
      sel.clan = clan; sel.diff = diff; sel.deck = deck || null; sel.random = !!deck;
      beginRun();
    },
    setSel: function (patch) { for (var k in patch) sel[k] = patch[k]; },
    getSel: function () { return sel; },
    openModal: openModal,
    closeModal: closeModal,
    isModalOpen: function () { return !!ui.modalOpen; },
    clickBattle: function () {
      var btn = el('battle-submit');
      if (btn) btn.click();
    },
    battleButton: function () { return el('battle-submit'); },
    game: function () { return game; }
  };
})();

</script>
</body>
</html>
