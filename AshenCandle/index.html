<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0a0d">
<title>残烛纪年</title>
<style>
:root{
  --bg:#08070a; --bg2:#141118; --panel:#1a161f; --line:#2c2533;
  --gold:#e6b263; --gold-dim:#8a6636; --gold-soft:rgba(230,178,99,.16);
  --text:#f1e9dd; --muted:#9c9188; --blood:#c0483f; --jade:#63b191; --violet:#9a7fc0;
  --card-w:78px; --card-h:112px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(90% 46% at 50% -6%,rgba(230,178,99,.16) 0%,rgba(120,80,40,.05) 34%,transparent 62%),
    radial-gradient(120% 70% at 50% 110%,rgba(80,40,90,.22) 0%,transparent 60%),
    linear-gradient(180deg,#120e17 0%,#0a080c 42%,#060509 100%);
  color:#f1e9dd;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none; -webkit-user-select:none;user-select:none; position:relative; overflow-x:hidden;
}
body::after{
  content:"";position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.45;
}
#app{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:0px;padding-bottom:env(safe-area-inset-bottom)}
#app.screen-in{animation:screenIn .4s cubic-bezier(.22,.61,.36,1);animation:screenIn .4s var(--ease)}
@keyframes screenIn{from{opacity:0}to{opacity:1}}

/* 烛火粒子 */
.embers{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.embers span{
  position:absolute;bottom:-12px;width:3px;height:3px;border-radius:50%;
  background:radial-gradient(circle,#ffd79a 0%,rgba(230,160,70,.7) 45%,transparent 70%);
  box-shadow:0 0 8px rgba(230,178,99,.75);animation:rise linear infinite;opacity:0;
}
@keyframes rise{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  12%{opacity:.9}
  70%{opacity:.55}
  100%{opacity:0;transform:translate3d(14px,-88vh,0) scale(1.15)}
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{
  position:relative;overflow:hidden;border:1px solid #8a6636;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,#2b2232,#191320);color:#e6b263;color:var(--gold);
  border-radius:11px;padding:10px 18px;font-size:15px;letter-spacing:.08em;
  transition:transform .16s cubic-bezier(.22,.61,.36,1),box-shadow .2s,border-color .2s;transition:transform .16s var(--ease),box-shadow .2s,border-color .2s;
}
.btn::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,215,154,.22),transparent);
  transform:skewX(-18deg);animation:sheen 4.6s ease-in-out infinite;
}
@keyframes sheen{0%,68%{left:-70%}86%,100%{left:130%}}
.btn:active{transform:scale(.97);box-shadow:0 0 18px rgba(230,178,99,.25)}
.btn.primary{
  background:linear-gradient(180deg,#563c22,#2b1d0f);border-color:#e6b263;border-color:var(--gold);color:#ffdca2;
  box-shadow:0 0 0 1px rgba(230,178,99,.18),0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,170,.22);
}
.btn.primary:active{box-shadow:0 0 26px rgba(230,178,99,.42)}
.btn[disabled]{opacity:.4}

/* 标题页 */
.title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 22px;text-align:center;gap:14px}
.title-wrap h1{
  position:relative;font-size:31px;letter-spacing:.36em;margin:0;text-indent:.36em;font-weight:600;
  background:linear-gradient(180deg,#ffe6b8 0%,#e6b263 46%,#9b6f37 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(230,178,99,.35));
  animation:titleIn .9s cubic-bezier(.22,.61,.36,1) backwards;animation:titleIn .9s var(--ease) backwards;
}
.title-wrap h1::after{
  content:"";position:absolute;left:50%;bottom:-10px;width:120px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(230,178,99,.75),transparent);
  animation:lineGrow .9s .2s cubic-bezier(.22,.61,.36,1) backwards;animation:lineGrow .9s .2s var(--ease) backwards;
}
@keyframes titleIn{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes lineGrow{from{width:0;opacity:0}to{width:120px;opacity:1}}
.title-wrap .sub{color:#9c9188;color:var(--muted);font-size:12px;letter-spacing:.18em;animation:fadeIn .7s .25s backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.clan-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;margin-top:18px}
.clan-card{
  position:relative;overflow:hidden;border:1px solid #2c2533;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(160deg,#1c1524 0%,#100d15 70%);
  padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;
  transition:transform .2s cubic-bezier(.22,.61,.36,1),border-color .2s,box-shadow .25s;transition:transform .2s var(--ease),border-color .2s,box-shadow .25s;
  animation:cardRise .5s cubic-bezier(.22,.61,.36,1) backwards;animation:cardRise .5s var(--ease) backwards;
}
.clan-card:nth-child(2){animation-delay:.08s}
.clan-card::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
  background:linear-gradient(180deg,transparent,#e6b263,transparent);background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.55;
}
.clan-card:active,.clan-card:hover{transform:translateY(-2px);border-color:#8a6636;border-color:var(--gold-dim);box-shadow:0 10px 26px rgba(0,0,0,.45)}
@keyframes cardRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.clan-card h3{margin:0;font-size:16px;color:#f1e9dd;color:var(--text);letter-spacing:.04em}
.clan-card p{margin:0;font-size:12px;color:#9c9188;color:var(--muted);line-height:1.6}
.clan-card .tag{font-size:11px;color:#e6b263;color:var(--gold);letter-spacing:.1em}

/* 难度选择 */
.diff-row{display:flex;gap:8px;margin-top:16px}
.diff-btn{
  border:1px solid #2c2533;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;color:#9c9188;color:var(--muted);
  transition:color .2s,border-color .2s,background .2s,box-shadow .25s,transform .16s;
}
.diff-btn:active{transform:scale(.96)}
.diff-btn.on{border-color:#e6b263;border-color:var(--gold);color:#e6b263;color:var(--gold);background:rgba(230,178,99,.16);background:var(--gold-soft);box-shadow:0 0 16px rgba(230,178,99,.22)}
.pick-label{font-size:11px;color:#7a6f68;letter-spacing:.3em;margin-top:4px}
.relic-row{font-size:10px;color:#8d7f74;padding:4px 12px 0;letter-spacing:.06em}

/* 战斗布局 */
.hud{
  display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:12px;color:#9c9188;color:var(--muted);
  border-bottom:1px solid rgba(44,37,51,.8);background:linear-gradient(180deg,rgba(24,19,30,.9),rgba(12,10,16,.4));
  backdrop-filter:blur(6px);
}
.hud .hp{color:#ea7f73;font-weight:600}
.hud .en{color:#e6b263;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.hud .pile{margin-left:auto;display:flex;gap:10px}
.hud .turn{color:#f1e9dd;color:var(--text);letter-spacing:.06em}
.bump{animation:bump .34s cubic-bezier(.22,.61,.36,1);animation:bump .34s var(--ease)}
@keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.28);color:#ffdca2}100%{transform:scale(1)}}
.flash-red{animation:flashRed .4s ease-out}
@keyframes flashRed{0%{box-shadow:inset 0 0 0 2px rgba(192,72,63,.75)}100%{box-shadow:inset 0 0 0 2px transparent}}

.field{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px 4px;gap:6px;min-height:0}
.field::after{
  content:"";position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;
  border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(230,178,99,.13),transparent 28%,rgba(150,120,210,.12) 52%,transparent 76%,rgba(230,178,99,.13));
  filter:blur(2px);opacity:.75;animation:runeSpin 26s linear infinite;
}
.field::before{
  content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
  border:1px solid rgba(230,178,99,.10);border-radius:50%;pointer-events:none;
  animation:runePulse 5.5s ease-in-out infinite;
}
@keyframes runeSpin{to{transform:rotate(360deg)}}
@keyframes runePulse{0%,100%{transform:scale(.96);opacity:.35}50%{transform:scale(1.04);opacity:.7}}
.slot{position:relative;z-index:1}
.side-label{font-size:11px;color:#6a6060;letter-spacing:.2em;padding-left:2px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mid{flex:1;display:flex;align-items:center;gap:10px;color:#3d3446;font-size:9px;letter-spacing:.4em;text-indent:.4em;min-height:18px}
.mid i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#2e2636 30%,#2e2636 70%,transparent)}
.slot{
  position:relative;border:1px dashed #332b3b;border-radius:12px;height:calc(112px + 6px);height:calc(var(--card-h) + 6px);
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.012);
  transition:border-color .18s,background .18s,box-shadow .2s;
}
.slot.empty::after{content:"空位";color:#463d4a;font-size:11px;letter-spacing:.2em}
#enemy-row .slot{background:radial-gradient(120% 90% at 50% 0%,rgba(120,44,44,.10),rgba(255,255,255,.012) 70%)}
#enemy-row .slot.empty{background:rgba(255,255,255,.012)}
.side-label::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;
  background:linear-gradient(135deg,#e6b263,transparent);background:linear-gradient(135deg,var(--gold),transparent);transform:rotate(45deg);vertical-align:1px;opacity:.7}
.slot.target{border-color:#e6b263;border-color:var(--gold);background:rgba(230,178,99,.16);background:var(--gold-soft);animation:targetPulse 1.1s ease-in-out infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 0 0 rgba(230,178,99,.28)}50%{box-shadow:0 0 0 6px rgba(230,178,99,0)}}
.slot.taunt{border-color:#6d4a2f}
.slot.shake{animation:shake .34s cubic-bezier(.22,.61,.36,1);animation:shake .34s var(--ease)}

.unit{
  width:100%;height:100%;border-radius:11px;border:1px solid #3a3145;
  background:linear-gradient(180deg,#251e2d 0%,#151119 100%);display:flex;flex-direction:column;
  padding:6px;gap:2px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 14px rgba(0,0,0,.35);
  animation:popIn .25s cubic-bezier(.22,.61,.36,1) backwards;animation:popIn .25s var(--ease) backwards;
}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
.unit.enemy{border-color:#4b2a2e;background:linear-gradient(180deg,#2b1a1e 0%,#160f12 100%)}
.unit .uname{font-size:12px;color:#e3d8ca;line-height:1.25;word-break:break-all}
.unit .ustat{display:flex;gap:6px;font-size:12px;margin-top:auto;font-variant-numeric:tabular-nums}
.unit .atk{color:#f3a862;font-weight:700}
.unit .hp{color:#ea7f73;font-weight:700}
.unit .kw{font-size:10px;color:#9a7fc0;color:var(--violet)}
.unit .intent{font-size:10px;color:#dcb46d;border-top:1px solid #332b3b;margin-top:2px;padding-top:2px;letter-spacing:.03em}
.unit.dead{opacity:.25}
.unit.threat::after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:11px;pointer-events:none;
  box-shadow:inset 0 0 14px rgba(200,70,60,.4);animation:threatPulse 1.9s ease-in-out infinite;
}
@keyframes threatPulse{0%,100%{opacity:.35}50%{opacity:.95}}
.unit .buffrow{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.buff{font-size:9px;padding:1px 4px;border-radius:4px;background:#2b2436;color:#cdbce6}
.hpbar{height:3px;border-radius:2px;background:#2a222c;margin-top:4px;overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#8e3a33,#e2675b);transition:width .35s cubic-bezier(.22,.61,.36,1);transition:width .35s var(--ease)}

.hand-zone{
  border-top:1px solid rgba(44,37,51,.9);
  background:linear-gradient(180deg,rgba(10,8,12,.3),rgba(8,6,10,.86));
  padding:4px 10px 6px;
}
.hand{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.handcard{display:flex;flex:0 0 auto;transform:rotate(0deg) translateY(0px);transform:rotate(var(--rot,0deg)) translateY(var(--lift,0px));
  transition:transform .22s cubic-bezier(.22,.61,.36,1);transition:transform .22s var(--ease)}
.handcard.selwrap{transform:rotate(0deg) translateY(-10px) scale(1.05);z-index:6}
.handcard.selwrap .card{box-shadow:0 14px 30px rgba(0,0,0,.65),0 0 0 1px #e0c07a}
.card{
  flex:0 0 auto;width:78px;width:var(--card-w);height:112px;height:var(--card-h);border-radius:10px;
  background:linear-gradient(180deg,#272031 0%,#141018 100%);border:1px solid #3d3348;
  display:flex;flex-direction:column;padding:7px 6px 6px;gap:3px;position:relative;
  transition:transform .18s cubic-bezier(.22,.61,.36,1),border-color .18s,box-shadow .22s;transition:transform .18s var(--ease),border-color .18s,box-shadow .22s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.38);
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:10px 10px 0 0;
  background:linear-gradient(90deg,transparent,rgba(230,178,99,.75),transparent);
}
.card.spell::before{background:linear-gradient(90deg,transparent,rgba(120,150,220,.8),transparent)}
.card.passive::before{background:linear-gradient(90deg,transparent,rgba(160,130,210,.85),transparent)}
.card:active{transform:translateY(-3px)}
.card.sel{
  border-color:#e6b263;border-color:var(--gold);
  box-shadow:0 0 0 1px #e6b263,0 10px 26px rgba(230,178,99,.28),0 0 24px rgba(230,178,99,.18);box-shadow:0 0 0 1px var(--gold),0 10px 26px rgba(230,178,99,.28),0 0 24px rgba(230,178,99,.18);
  transform:translateY(-8px) scale(1.03) rotateX(0deg) rotateY(0deg);transform:translateY(-8px) scale(1.03) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
}
.card.no{opacity:.42;filter:grayscale(.45)}
.card.playing{animation:cardPlay .26s cubic-bezier(.22,.61,.36,1) forwards;animation:cardPlay .26s var(--ease) forwards}
@keyframes cardPlay{to{opacity:0;transform:translateY(-26px) scale(.82)}}
.card.deal-in{animation:dealIn .3s cubic-bezier(.22,.61,.36,1) backwards;animation:dealIn .3s var(--ease) backwards}
@keyframes dealIn{from{opacity:0;transform:translateY(-14px) rotate(-4deg) scale(.94)}to{opacity:1;transform:none}}
.card .cost{
  position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6b5129,#2b2011 70%);
  border:1px solid #e6b263;border:1px solid var(--gold);color:#ffe0ac;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 10px rgba(230,178,99,.35);
}
.card .cname{font-size:12px;color:#eaded0;line-height:1.2}
.card .ctype{font-size:10px;color:#847890}
.card .ctext{font-size:10px;color:#ada096;line-height:1.38;flex:1;overflow:hidden}
.card .cstat{display:flex;justify-content:space-between;font-size:11px;font-variant-numeric:tabular-nums}
.card .cstat .a{color:#f3a862}.card .cstat .h{color:#ea7f73}

.actionbar{display:flex;gap:8px;align-items:center;padding:4px 10px 8px;padding:4px 10px calc(8px + env(safe-area-inset-bottom))}
.actionbar .btn{flex:1;padding:12px}
.actionbar .ghost{flex:0 0 auto;padding:12px 14px;border-color:#2c2533;border-color:var(--line);color:#9c9188;color:var(--muted)}

.log{
  max-height:80px;overflow-y:auto;font-size:10.5px;color:#8a7f78;line-height:1.7;
  padding:0 12px 2px;border-top:1px dashed #241f2b;
}
.log div{white-space:normal;animation:logIn .24s cubic-bezier(.22,.61,.36,1);animation:logIn .24s var(--ease)}
@keyframes logIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

@media (max-height:680px){
  :root{--card-w:70px;--card-h:98px}
  .log{max-height:52px}
  .hand{padding-top:14px}
  .field{gap:4px;padding-top:4px}
  .title-wrap{padding:22px 20px;gap:10px}
  .title-wrap h1{font-size:26px}
}

/* 奖励 / 结算 */
.panel-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:14px;text-align:center;position:relative}
.panel-wrap h2{
  margin:0;font-size:20px;color:#e6b263;color:var(--gold);letter-spacing:.14em;
  text-shadow:0 0 20px rgba(230,178,99,.35);animation:titleIn .6s cubic-bezier(.22,.61,.36,1) both;animation:titleIn .6s var(--ease) both;
}
.panel-wrap p{margin:0;color:#9c9188;color:var(--muted);font-size:12px;line-height:1.8;animation:fadeIn .5s .1s both}
.rewards{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.reward{
  border:1px solid #2c2533;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:linear-gradient(150deg,#1d1725,#121017);text-align:left;display:flex;gap:10px;align-items:center;
  transition:transform .18s cubic-bezier(.22,.61,.36,1),border-color .2s,box-shadow .22s;transition:transform .18s var(--ease),border-color .2s,box-shadow .22s;
  animation:cardRise .4s cubic-bezier(.22,.61,.36,1) both;animation:cardRise .4s var(--ease) both;
}
.reward:nth-child(2){animation-delay:.07s}
.reward:nth-child(3){animation-delay:.14s}
.reward:active{transform:translateX(3px);border-color:#8a6636;border-color:var(--gold-dim);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.reward .rc{flex:1}
.reward .rn{font-size:13px;color:#eaded0}
.reward .rt{font-size:11px;color:#8f8489;line-height:1.5;margin-top:3px}
.reward .rp{font-size:11px;color:#e6b263;color:var(--gold)}

/* 特效层 */
#fx{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.float{
  position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:20px;
  text-shadow:0 2px 10px rgba(0,0,0,.65);animation:floatUp .9s cubic-bezier(.22,.61,.36,1) forwards;animation:floatUp .9s var(--ease) forwards;
}
.float.dmg{color:#ff7d6e}
.float.heal{color:#7fd8a8}
.float.gold{color:#ffd79a;font-size:15px;letter-spacing:.1em}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-62%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}
  45%{transform:translateX(3px)}
  70%{transform:translateX(-2px)}
}
.banner{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  padding:10px 26px;border-top:1px solid rgba(230,178,99,.5);border-bottom:1px solid rgba(230,178,99,.5);
  background:linear-gradient(90deg,transparent,rgba(18,14,22,.9),transparent);
  color:#ffdca2;font-size:15px;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;
  animation:bannerIn 1.05s cubic-bezier(.22,.61,.36,1) forwards;animation:bannerIn 1.05s var(--ease) forwards;
}
@keyframes bannerIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}
}
.flycard{position:fixed;pointer-events:none;z-index:95;transition:transform .3s cubic-bezier(.22,.61,.36,1),opacity .3s;transition:transform .3s var(--ease),opacity .3s;will-change:transform}
.ring{
  position:fixed;width:26px;height:26px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(230,178,99,.85);transform:translate(-50%,-50%) scale(.4);
  animation:ringBurst .55s cubic-bezier(.22,.61,.36,1) forwards;animation:ringBurst .55s var(--ease) forwards;
}
@keyframes ringBurst{to{transform:translate(-50%,-50%) scale(3.4);opacity:0;border-color:rgba(230,178,99,0)}}
.drag-ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
.hint{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;bottom:calc(96px + env(safe-area-inset-bottom));
  background:rgba(20,15,24,.96);border:1px solid #2c2533;border:1px solid var(--line);color:#d8ccbe;font-size:12px;
  padding:8px 14px;border-radius:20px;z-index:80;pointer-events:none;transition:opacity .3s;
  animation:hintIn .25s cubic-bezier(.22,.61,.36,1);animation:hintIn .25s var(--ease);
}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.hidden{display:none!important}

/* 胜利 / 失败氛围 */
.win-aura,.lose-aura{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:1}
.win-aura{background:radial-gradient(60% 40% at 50% 42%,rgba(230,178,99,.22),transparent 70%);animation:auraPulse 2.6s ease-in-out infinite}
.lose-aura{background:radial-gradient(70% 50% at 50% 50%,rgba(140,40,40,.18),transparent 75%);animation:auraPulse 3.2s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.55}50%{opacity:1}}


/* ===== 增强动效 ===== */
.en{display:inline-flex;align-items:center;gap:5px}
.orbs{display:inline-flex;gap:3px;margin-left:1px}
.orb{width:7px;height:7px;border-radius:50%;background:#2c2533;border:1px solid #443a52;transition:background .25s,box-shadow .25s,transform .25s}
.orb.on{background:radial-gradient(circle at 35% 30%,#ffe3b4,#e6b263 60%,#9a6d33);border-color:#e6b263;box-shadow:0 0 8px rgba(230,178,99,.65)}
.orb.drain{animation:orbDrain .36s cubic-bezier(.22,.61,.36,1);animation:orbDrain .36s var(--ease)}
@keyframes orbDrain{0%{transform:scale(1.35);box-shadow:0 0 16px rgba(230,178,99,.95)}100%{transform:scale(1);box-shadow:none}}
.orb.light{animation:orbLight .45s cubic-bezier(.22,.61,.36,1) backwards;animation:orbLight .45s var(--ease) backwards}
@keyframes orbLight{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}

.unit.lunge{animation:lunge .36s cubic-bezier(.22,.61,.36,1);animation:lunge .36s var(--ease)}
@keyframes lunge{0%{transform:translateY(0)}38%{transform:translateY(-11px) scale(1.05)}100%{transform:translateY(0)}}
.unit.enemy.lunge{animation:lungeDown .36s cubic-bezier(.22,.61,.36,1);animation:lungeDown .36s var(--ease)}
@keyframes lungeDown{0%{transform:none}38%{transform:translateY(11px) scale(1.04)}100%{transform:none}}

.unit.hurt{animation:hurtFlash .42s ease-out}
@keyframes hurtFlash{0%{box-shadow:inset 0 0 0 2px rgba(255,120,100,.85)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 14px rgba(0,0,0,.35)}}
.unit.hurt .hpbar i{filter:brightness(2.4) saturate(.5)}

.unit.scout{animation:scoutPulse .55s cubic-bezier(.22,.61,.36,1);animation:scoutPulse .55s var(--ease)}
@keyframes scoutPulse{0%{box-shadow:0 0 0 0 rgba(230,178,99,.55)}65%{box-shadow:0 0 0 4px rgba(230,178,99,.1)}100%{box-shadow:none}}

.shard{position:fixed;width:5px;height:5px;border-radius:1px;background:#e6b263;pointer-events:none;z-index:96;box-shadow:0 0 7px rgba(230,178,99,.65)}

.ripple{position:absolute;border-radius:50%;background:rgba(255,225,170,.3);transform:translate(-50%,-50%) scale(0);animation:rippleOut .55s ease-out forwards;pointer-events:none}
@keyframes rippleOut{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.sweep{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.sweep::before{content:"";position:absolute;top:-40%;left:-35%;width:38%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,220,160,.18),transparent);
  transform:rotate(12deg);animation:sweepMove 1.7s cubic-bezier(.22,.61,.36,1) forwards;animation:sweepMove 1.7s var(--ease) forwards}
@keyframes sweepMove{to{left:125%}}

body::before{content:"";position:fixed;top:-20%;right:-20%;bottom:-20%;left:-20%;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(38% 30% at 22% 18%,rgba(120,80,160,.16),transparent 70%),
    radial-gradient(42% 32% at 82% 72%,rgba(200,130,60,.12),transparent 72%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}

.float.big{font-size:27px;letter-spacing:-.02em}


/* ===== HUD v2 ===== */
.hud{gap:8px;padding:9px 12px}
.hud .turn{display:inline-flex;align-items:baseline;gap:4px;color:#cdbfb1;background:rgba(230,178,99,.07);border:1px solid rgba(230,178,99,.18);border-radius:999px;padding:3px 9px}
.hud .turn em{font-style:normal;font-size:9px;color:#8d7f74;letter-spacing:.18em}
.hud .hp{display:inline-flex;align-items:center;gap:5px;color:#f0a49a;font-variant-numeric:tabular-nums}
.hud .hp b{font-size:14px;color:#ffb0a4}
.hud .hp s{text-decoration:none;font-size:10px;color:#8d7f74}
.hud .hp .mini{width:32px;height:4px;border-radius:2px;background:#2a2028;overflow:hidden;display:inline-block}
.hud .hp .mini u{display:block;height:100%;background:linear-gradient(90deg,#8f3a33,#ef8577);transition:width .35s cubic-bezier(.22,.61,.36,1);transition:width .35s var(--ease)}
.hud .en b.env{font-size:14px}
.hud .en s{text-decoration:none;font-size:10px;color:#8d7f74}
.hud .pile{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.hud .pile .ico{width:10px;height:13px;border-radius:2px;display:inline-block;border:1px solid rgba(230,178,99,.45)}
.hud .pile .deck-ico{background:linear-gradient(180deg,rgba(230,178,99,.32),rgba(230,178,99,.06));box-shadow:2px 2px 0 -0.5px rgba(230,178,99,.16)}
.hud .pile .dis-ico{border-color:rgba(150,140,160,.4);background:linear-gradient(180deg,rgba(160,150,190,.22),transparent)}
.hud .pile .deck-ico.pulse{animation:pilePulse .42s cubic-bezier(.22,.61,.36,1);animation:pilePulse .42s var(--ease)}
@keyframes pilePulse{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-7deg)}100%{transform:scale(1)}}

/* ===== 手牌焦点与边缘渐隐 ===== */
.hand{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 16px),transparent 100%)}
.hand.focus .card:not(.sel){opacity:.5;transform:scale(.95);filter:saturate(.65)}
.card::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:10px;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 32%,rgba(255,235,200,.20) 47%,transparent 62%)}
.card.sel::after{animation:cardSheen 1.8s cubic-bezier(.22,.61,.36,1) infinite;animation:cardSheen 1.8s var(--ease) infinite}
@keyframes cardSheen{0%{opacity:0;transform:translateX(-38%)}32%{opacity:1}100%{opacity:0;transform:translateX(38%)}}

/* ===== 开场与震屏 ===== */
.slot.intro-in{animation:slotIn .5s cubic-bezier(.22,.61,.36,1) backwards;animation:slotIn .5s var(--ease) backwards}
@keyframes slotIn{from{opacity:0;transform:perspective(620px) rotateX(-40deg) translateY(16px) scale(.9)}to{opacity:1;transform:none}}
#app.quake{animation:quake .4s ease-out}
@keyframes quake{0%,100%{transform:translate(0,0)}22%{transform:translate(-3px,2px)}48%{transform:translate(3px,-2px)}72%{transform:translate(-2px,1px)}}

/* ===== 奖励与标题细节 ===== */
.reward{will-change:transform}
.reward:hover{transform:translateX(4px)}
.title-wrap .version{
  margin-top:2px;font-size:10px;letter-spacing:.28em;color:#6d6259;border:1px solid #2a2530;
  padding:3px 10px;border-radius:999px;
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===== 地牢第一人称主题 ===== */
#app{padding-bottom:0}
.dungeon{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,rgba(6,5,4,.10),rgba(6,5,4,.26) 55%,rgba(6,5,4,.5))}

  background:

.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;padding:10px 12px 6px;color:#c9b394}

.gear{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(200,170,120,.28);

.orbs-vert{margin-top:14px}

.hud{position:absolute;right:10px;top:52px;z-index:3;display:flex;gap:8px;padding:0;border:0;background:none;backdrop-filter:none;font-size:10px;color:#8d7c66}

.field{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:6px 10px 0 38px;gap:0;min-height:0}

/* 场景细化 */
.wall{
  background:
    radial-gradient(120% 90% at 50% 18%,rgba(255,190,120,.07),transparent 58%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.62) 0 3px,transparent 3px 54px),

  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.6'/></svg>");

.cage{bottom:30%;opacity:.42}

.enemy-wrap::before,.enemy-wrap::after{display:none}
.beast{position:absolute;left:50%;top:52%;width:300px;height:196px;transform:translate(-50%,-56%);

.card{background:#26301f!important;box-shadow:0 4px 10px rgba(0,0,0,.45)!important}

.card .chead{background:#1b241a!important}
.card .cart{background:#1f2a20!important}
.card .ctext{background:none!important;color:#d8cdb0!important}
.card .cfoot{background:#182116!important}
.card .glyph{text-shadow:0 1px 2px #000!important}
#enemy-row .unit .uname,.tl b,.side-label{text-shadow:0 2px 4px #000!important}
.unit,.slot{box-shadow:none!important}
.float{text-shadow:0 2px 4px rgba(0,0,0,.8)!important}
.hand-zone{background:linear-gradient(180deg,transparent,#080605 60%)!important}


/* 清除残余滤镜与合成层 */
*,*::before,*::after{filter:none!important;backdrop-filter:none!important;mix-blend-mode:normal!important}
.scene-fixed{will-change:auto!important}


/* 场景亮度与烛台细节 */
.backwall{background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 3px,transparent 3px 40px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.24) 0 3px,transparent 3px 78px),
  linear-gradient(180deg,#4a4036 0%,#26201a 62%,#141110 100%)!important}
.wall-l{background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 3px,transparent 3px 48px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,transparent 3px 74px),
  linear-gradient(90deg,#332a22,#191410)!important}
.wall-r{background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 3px,transparent 3px 48px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,transparent 3px 74px),
  linear-gradient(90deg,#191410,#332a22)!important}
.candle{height:16px;width:4px;background:linear-gradient(180deg,#f0e2c2,#bfa87f)!important}
.candle::before{width:7px;height:11px;top:-10px;background:radial-gradient(ellipse at 50% 70%,#fff0c8,#ffb055 55%,rgba(255,120,40,.25) 75%,transparent 82%)!important}
.candle::after{content:"";display:block!important;position:absolute;left:-6px;top:6px;width:14px;height:4px;border-radius:2px;background:#2b2118}


/* 设置与历史对局 */
.panel-wrap.settings{gap:10px;padding:18px;justify-content:flex-start}
.hist-head{width:100%;display:flex;align-items:baseline;justify-content:space-between;
  margin-top:4px;padding-bottom:6px;border-bottom:1px solid rgba(200,170,120,.25);
  font-size:12px;letter-spacing:.18em;color:#c9b394}
.hist-head em{font-style:normal;font-size:10px;color:#8b7a64;letter-spacing:.06em}
.hist-list{width:100%;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.hist-list::-webkit-scrollbar{width:3px}
.hist-list::-webkit-scrollbar-thumb{background:rgba(200,170,120,.35);border-radius:2px}
.hist-row{border:1px solid rgba(200,170,120,.22);border-radius:8px;padding:8px 10px;
  background:rgba(20,16,12,.55);display:flex;flex-direction:column;gap:4px}
.hist-main{display:flex;align-items:center;gap:8px}
.hist-main b{font-size:12px;letter-spacing:.1em}
.hist-main b.win{color:#8fd6a4}
.hist-main b.lose{color:#e08a78}
.hist-main span{font-size:12px;color:#e2d3b8}
.hist-sub{display:flex;gap:10px;font-size:10px;color:#8f7f6a}
.hist-empty{width:100%;padding:22px 12px;border:1px dashed rgba(200,170,120,.22);border-radius:10px;
  color:#8b7a64;font-size:12px;line-height:1.8;text-align:center}
.title-settings{margin-top:10px}


/* 设置/奖励面板压暗背景，烛台去“勺子”感 */
.panel-wrap{background:linear-gradient(180deg,rgba(9,7,6,.74),rgba(9,7,6,.92))!important}
.candle::after{display:none!important}
.candle::before{width:6px;height:10px;top:-9px;background:radial-gradient(ellipse at 50% 72%,#fff2cf,#ffb257 56%,rgba(255,130,50,.22) 78%,transparent 84%)!important}
.candle{height:14px;width:3px!important}


/* 设置页可读性与按钮层级 */
.panel-wrap.settings h2{color:#f0d9a8!important;text-shadow:0 0 18px rgba(230,178,99,.45),0 2px 8px #000!important}
.panel-wrap.settings [data-act="clear-history"]{
  align-self:center;padding:7px 18px;font-size:12px;letter-spacing:.1em;
  border-color:rgba(200,120,100,.45);color:#e0a08c;background:rgba(40,20,16,.5)}
.panel-wrap.settings [data-act="clear-history"]:active{border-color:#e08a78;color:#ffc3ae}
.hist-list{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 18px),transparent 100%)}


/* 主开始页 */
.start-wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:36px 24px 36px;padding:36px 24px calc(36px + env(safe-area-inset-bottom));
  text-align:center;
  background:radial-gradient(80% 55% at 50% 42%,rgba(60,40,24,.35),rgba(6,5,4,.86) 62%,rgba(4,3,3,.94) 100%)}
.start-wrap.start-in{animation:startFade .7s cubic-bezier(.22,.61,.36,1);animation:startFade .7s var(--ease)}
@keyframes startFade{from{opacity:0;transform:scale(1.01)}to{opacity:1;transform:none}}
.start-crest{width:64px;height:64px;margin-bottom:6px;border:1px solid rgba(220,190,130,.4);
  transform:rotate(45deg);position:relative;box-shadow:0 0 24px rgba(230,178,99,.18),inset 0 0 18px rgba(230,178,99,.12)}
.start-crest::before{content:"";position:absolute;top:14px;right:14px;bottom:14px;left:14px;inset:14px;border:1px solid rgba(220,190,130,.28);border-radius:50%}
.start-title{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:34px;letter-spacing:.34em;
  text-indent:.34em;margin:0;font-weight:600;
  background:linear-gradient(180deg,#fff0cd 0%,#e8bd78 46%,#a3743a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(230,178,99,.3))}
.start-sub{font-size:10px;letter-spacing:.42em;text-indent:.42em;color:#8d7a5f}
.start-rule{width:120px;height:1px;margin:6px 0 2px;
  background:linear-gradient(90deg,transparent,rgba(230,178,99,.7),transparent)}
.start-desc{margin:0;font-size:12px;line-height:2;color:#a2927c;letter-spacing:.08em}
.enter-btn{min-width:208px;margin-top:16px;padding:14px 26px;font-size:16px;letter-spacing:.24em;
  text-indent:.24em;animation:enterGlow 3.4s ease-in-out infinite}
@keyframes enterGlow{0%,100%{box-shadow:0 0 0 1px rgba(230,178,99,.18),0 8px 26px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 0 1px rgba(230,178,99,.4),0 8px 30px rgba(230,178,99,.18)}}
.start-hint{font-size:10px;color:#776a59;letter-spacing:.06em}
.start-wrap .version{margin-top:4px}
@media (max-height:640px){
  .start-title{font-size:28px}
  .start-crest{width:52px;height:52px;margin-bottom:2px}
  .enter-btn{padding:12px 22px}
}


/* 显示模式下拉：低存在感样式 */
.set-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 2px;border-bottom:1px solid rgba(200,170,120,.14)}
.set-label{font-size:12px;color:#c9b394;letter-spacing:.12em}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;letter-spacing:.06em;
  color:#b6a184;border:1px solid rgba(200,170,120,.26);border-radius:6px;background:rgba(20,16,12,.45);
  transition:border-color .2s,color .2s}
.dd-btn i{font-style:normal;font-size:9px;opacity:.65;transition:transform .18s cubic-bezier(.22,.61,.36,1);transition:transform .18s var(--ease)}
.dd.open .dd-btn{border-color:rgba(230,178,99,.45);color:#e6cda4}
.dd.open .dd-btn i{transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:92px;z-index:20;
  background:rgba(15,12,9,.98);border:1px solid rgba(200,170,120,.24);border-radius:6px;overflow:hidden;
  animation:ddIn .16s cubic-bezier(.22,.61,.36,1);animation:ddIn .16s var(--ease)}
.dd-item{display:block;width:100%;text-align:left;padding:7px 12px;font-size:11px;letter-spacing:.06em;
  color:#a08c72;background:none;border:0}
.dd-item.on{color:#ffd79a;background:rgba(230,178,99,.07)}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}


/* 页面内全屏降级 */
html.pseudo-full,html.pseudo-full body{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
html.pseudo-full .scene-fixed{position:fixed;top:0;right:0;bottom:0;left:0;inset:0}
.set-note{width:100%;font-size:10px;color:#8a7a63;letter-spacing:.04em;margin:-2px 0 2px}

<script>
/* 兼容兜底层：仅在老内核补齐缺失能力。

(function(){
  "use strict";
  var doc=document;
  var root=doc.documentElement;

  /* ---- 0. 启动诊断：页面脚本报错时，把错误写到引导提示里，便于定位 ---- */
  window.onerror=function(msg,src,line,col){
    try{
      if(window.__bootErr){ return false; }
      window.__bootErr=String(msg)+(line?(" @"+line+":"+(col||0)):"");
      var box=doc.getElementById("boot-err");
      if(box){ box.textContent="错误信息："+window.__bootErr; }
    }catch(e){}
    return false;
  };

  /* ---- 1. Element.matches / Element.closest 垫片 ---- */
  if(!Element.prototype.matches){
    Element.prototype.matches=Element.prototype.msMatchesSelector||Element.prototype.webkitMatchesSelector||
      function(sel){
        var m=(this.document||this.ownerDocument).querySelectorAll(sel),i=m.length;

      var el=this;
      while(el&&el.nodeType===1){

      }

    };

  }
  if(!window.cancelAnimationFrame){
    window.cancelAnimationFrame=function(id){ window.clearTimeout(id); };
  }

  /* ---- 3. flex gap 实测：不支持时挂 no-flexgap，交给样式表的兜底间距 ---- */
  try{
    var box=doc.createElement("div");
    box.setAttribute("style","position:absolute;left:-9999px;top:-9999px;display:flex;gap:4px");
    var a=doc.createElement("i"),b=doc.createElement("i");
    a.setAttribute("style","display:block;width:4px;height:1px");

    var gapOk=(b.offsetLeft-a.offsetLeft)>=8;
    doc.body.removeChild(box);
    if(!gapOk){ root.className=(root.className?root.className+" ":"")+"no-flexgap"; }
  }catch(e){}

  /* ---- 4. 无 PointerEvent 的内核：用 touch/mouse 合成等价的 pointer 事件 ---- */
  if(!window.PointerEvent){

      function fire(type,x,y){
        var t;

        try{

      function pick(e){
        if(e.touches&&e.touches.length){ return e.touches[0]; }

        var type=e.type==="touchstart"?"pointerdown":(e.type==="touchmove"?"pointermove":(e.type==="touchend"?"pointerup":"pointercancel"));

  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=rnd(i+1); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  /* ---------------- 开局 ---------------- */
  function startRun(clan,diff){
    S.clan=clan; S.diff=diff||S.diff; S.deck=STARTERS[clan].slice();
    S.relics=[clan==="order"?"oath":"maw"]; S.wave=0; S.battle=null; S.event=null; S.shop=null; S.gold=0;

  function startBattle(){
    var wave=WAVES[S.wave];
    var baseHp=(DIFFS[S.diff]||DIFFS.apostle).hp;
    var keepHp = S.battle ? S.battle.playerHp : baseHp;
    var b={
      playerHp:keepHp, maxHp:baseHp, energy:5, maxEnergy:5, turn:0,
      hand:[], statusCards:[], drawPile:shuffle(S.deck).map(function(id){ return {id:id,uid:S.uid++}; }), discard:[],
      units:[], enemies:[], log:[], outcome:null
    };
    var diff=DIFFS[S.diff]||DIFFS.apostle;
    wave.enemies.forEach(function(e){
      var hp=Math.round(e.hp*diff.mul);
      b.enemies.push({name:e.name,hp:hp,maxHp:hp,atk:diff.atk,intents:e.intents,ii:0,alive:true});
    });
    S.battle=b; S.screen="battle"; ui.sel=null;
    if(S.relics.indexOf("oath")>=0){ summonUnit({name:"铁誓卫兵",atk:2,hp:6,kw:["taunt"]}); log("铁誓护符：召唤铁誓卫兵"); }
    if(S.relics.indexOf("chain")>=0){ log("连锁之环：全体攻击 +1"); }
    drawTo(4);
    startTurn(true);
  }

  function isStatusCard(card){
    var id=typeof card==="string"?card:(card&&card.id);
    var d=CARDS[id];
    // 手牌区只保留有攻击和生命的单位牌；无攻击/生命的法术、驻留、效果牌统一缩小放右侧。
    return !d || !(typeof d.atk==="number" && typeof d.hp==="number");
  }
  function stashStatusCard(c){
    var b=S.battle;
    if(!b.statusCards) b.statusCards=[];
    b.statusCards.push(c);
    var d=CARDS[c.id];
    log((d.type==="passive"?"状态牌：":"效果牌：")+d.name+" 进入右侧区域");
  }
  function markDealAnim(c,delay){
    if(!c) return c;
    c.anim="deal-arc";
    c.animDelay=delay||0;
    return c;
  }
  function drawTo(n){
    var b=S.battle;
    if(!b.statusCards) b.statusCards=[];
    var added=0;
    while(b.hand.length<n){
      var c=takeNonStatusFromPile(true);
      if(!c) break;
      markDealAnim(c,added*0.5);
      b.hand.push(c);
      added++;
    }
  }
  function takeNonStatusFromPile(allowReshuffle){
    var b=S.battle;
    for(var guard=0; guard<500; guard++){
      if(b.drawPile.length===0){
        if(!allowReshuffle || b.discard.length===0) return null;
        b.drawPile=shuffle(b.discard); b.discard=[];
      }
      var c=b.drawPile.shift();
      if(isStatusCard(c)){ stashStatusCard(c); continue; }
      return c;
    }
    return null;
  }
  function takeFromPile(){ return takeNonStatusFromPile(true); }
  function takeFromDrawPileOnly(){ return takeNonStatusFromPile(false); }
  function replaceHandCard(handIdx){
    var b=S.battle;
    if(!b||b.outcome||ui.replacing) return;
    var old=b.hand[handIdx];
    if(!old) return;
    if(b.energy<1){ msg("烛火不足：换牌需要 1 点烛火"); return; }
    var next=takeFromDrawPileOnly();
    if(!next){ msg("抽牌堆没有可进入手牌的攻击/生命牌，不能再换牌"); return; }
    var node=document.querySelector('[data-hand="'+handIdx+'"]');
    var finish=function(){
      b.energy-=1;
      b.hand[handIdx]=markDealAnim(next,0);
      b.discard.push(old);
      ui.sel=null; ui.replacing=false;
      log("换牌：消耗 1 点烛火，"+CARDS[old.id].name+" 进入弃牌堆");
      saveGame();
      render();
    };
    ui.replacing=true;
    forcePlayRerollOut(node,finish);
  }

  function startTurn(first){
    var b=S.battle;
    if(!first && b.outcome) return;
    b.turn++;
    b.energy=b.maxEnergy+(S.relics.indexOf("ember")>=0?1:0);
    // 成长
    b.units.forEach(function(u){ if(u && u.alive && u.kw.indexOf("grow")>=0){ u.atk+=1; u.buffs.push("攻+1"); } });
    if(S.relics.indexOf("maw")>=0){
      aliveUnits().forEach(function(u){ u.atk+=1; u.buffs.push("攻+1"); });
      b.playerHp-=1; log("深渊之胃：自损 1 点生命，全体攻击 +1");
      if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; S.screen="over"; }
    }
    // 驻留卡触发
    b.drawPile.forEach(function(c){
      var def=CARDS[c.id];
      if(def.type==="passive"){ applyEffect(def.effect,{passive:true,card:def}); log("驻留生效：" + def.name); }
    });
    drawTo(4);
    render();
  }

  /* ---------------- 效果 ---------------- */
  function aliveUnits(){ return S.battle.units.filter(function(u){return u&&u.alive;}); }
  function aliveEnemies(){ return S.battle.enemies.filter(function(e){return e.alive;}); }
  function frontEnemy(){ var a=aliveEnemies(); return a.length?a[0]:null; }
  function slotIndex(u){ return S.battle.units.indexOf(u); }

  function applyEffect(eff,ctx){
    if(!eff) return;
    var b=S.battle;
    switch(eff.kind){
      case "buffAll":
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.buffs.push("攻+"+eff.atk); });
        break;
      case "summon":
        for(var i=0;i<eff.count;i++){ summonUnit({name:eff.kw&&eff.kw.length?"爬虫":"侍从",atk:eff.atk,hp:eff.hp,kw:eff.kw||[]}); }
        break;
      case "focus": {
        var target=b.units[0];
        if(!target||!target.alive){ msg("1 号位没有单位，增益无处集中"); return; }
        var moved=0, movedHp=0;
        b.units.forEach(function(u,idx){
          if(u&&u.alive&&idx!==0){
            u.buffs.forEach(function(tag){
              if(tag.indexOf("攻+")===0){ var n=parseInt(tag.slice(2),10)||0; target.atk+=n; moved+=n; }
              if(tag.indexOf("血+")===0){ var h=parseInt(tag.slice(2),10)||0; target.hp+=h; target.maxHp+=h; movedHp+=h; }
            });
            u.buffs=u.buffs.filter(function(t){return t.indexOf("攻+")!==0 && t.indexOf("血+")!==0;});
          }
        });
        if(moved>0){ target.buffs.push("攻+"+moved); }
        if(movedHp>0){ target.buffs.push("血+"+movedHp); }
        if(moved+movedHp>0){ log("共生：把 "+moved+" 攻 / "+movedHp+" 血 的增益集中到 1 号位"); }
        break;
      }
      case "clone": {
        var src=b.units[1];
        if(!src||!src.alive){ msg("2 号位没有单位可复制"); return; }
        var tags=src.buffs.slice();
        if(tags.length===0){ msg("2 号位没有增益可复制"); return; }
        aliveUnits().forEach(function(u){
          tags.forEach(function(t){
            u.buffs.push(t);
            if(t.indexOf("攻+")===0){ u.atk+=parseInt(t.slice(2),10)||0; }
            if(t.indexOf("血+")===0){ u.hp+=parseInt(t.slice(2),10)||0; u.maxHp+=parseInt(t.slice(2),10)||0; }
          });
        });
        log("无形者复制了 "+tags.length+" 条增益给全体");
        break;
      }
      case "swap": {
        var u=b.units[0];
        if(!u||!u.alive){ msg("1 号位没有单位"); return; }
        var t=u.atk; u.atk=u.hp; u.hp=t;
        u.maxHp=Math.max(u.maxHp,u.hp);
        u.buffs.push("攻血互换");
        log(u.name+" 攻血互换：" + u.atk + " / " + u.hp);
        break;
      }
      case "healAll":
        aliveUnits().forEach(function(u){ u.hp=Math.min(u.maxHp,u.hp+eff.v); });
        break;
      case "drawPerUnit":
        drawTo(b.hand.length + aliveUnits().length);
        log("连锁圣咏：抽 "+aliveUnits().length+" 张");
        break;
      case "drawN":
        drawTo(b.hand.length + eff.v);
        break;
      case "healPlayer":
        b.playerHp=Math.min(b.maxHp,b.playerHp+eff.v);
        break;
      case "damageFront":
        var fe=frontEnemy(); if(fe) damageEnemy(fe,eff.v);
        break;
      case "damageAllEnemy":
        aliveEnemies().slice().forEach(function(e){ damageEnemy(e,eff.v); });
        if(eff.self) damagePlayer(eff.self);
        break;
      case "sacrifice": {
        var s=b.units[0];
        if(!s||!s.alive){ msg("1 号位没有单位可献祭"); return; }
        killUnit(s);
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.buffs.push("攻+"+eff.atk); });
        log("献祭 "+s.name+"，全体攻击+"+eff.atk);
        break;
      }
      case "devour": {
        var d=b.units[0];
        if(!d||!d.alive){ msg("1 号位没有单位可吞食"); return; }
        var heal=d.atk; killUnit(d);
        b.playerHp=Math.min(b.maxHp,b.playerHp+heal);
        log("吞食 "+d.name+"，回复 "+heal+" 生命");
        break;
      }
      case "doubleAtk": {
        var t2=b.units[0];
        if(!t2||!t2.alive){ msg("1 号位没有单位"); return; }
        t2.atk*=2; t2.buffs.push("攻×2"); damagePlayer(4);
        break;
      }
      case "bloodPact":
        damagePlayer(3); b.energy+=2;
        log("血契：自损 3，能量 +2");
        break;
      case "growSlot1": {
        var g=b.units[0];
        if(g&&g.alive){ g.atk+=2; g.buffs.push("攻+2"); damagePlayer(1); }
        break;
      }
      case "buffSlot": {
        var t3=b.units[0];
        if(!t3||!t3.alive){ msg("1 号位没有单位"); return; }
        t3.atk+=eff.atk||0; t3.hp+=eff.hp||0; t3.maxHp+=eff.hp||0;
        if(eff.atk) t3.buffs.push("攻+"+eff.atk);
        if(eff.hp) t3.buffs.push("血+"+eff.hp);
        break;
      }
      case "buffAllHeal":
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.hp=Math.min(u.maxHp,u.hp+eff.v); });
        break;
      case "selfDamage":
        damagePlayer(eff.v);
        break;
    }
  }

  function summonUnit(tpl){
    var b=S.battle;
    var idx=b.units.length;
    b.units.push({uid:S.uid++,name:tpl.name,atk:tpl.atk,hp:tpl.hp,maxHp:tpl.hp,kw:(tpl.kw||[]).slice(),buffs:[],alive:true});
    return true;
  }

  function damageEnemy(e,v){
    if(!e||!e.alive) return;
    var before=e.hp;
    var overflow=Math.max(0,v-before);
    e.hp-=v;
    if(overflow>0){
      S.gold=(S.gold||0)+overflow;
      log("溢出伤害奖励：+"+overflow+" 烛币");
    }
    if(e.hp<=0){ e.hp=0; e.alive=false; log("击杀 "+e.name); }
  }
  function damagePlayer(v){
    var b=S.battle; b.playerHp-=v;
    if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; }
  }
  function killUnit(u){
    if(!u||!u.alive) return;
    u.hp=0; u.alive=false;
    if(u.kw.indexOf("deathrattle")>=0){
      log(u.name+" 亡语：对敌方全体造成 3 点伤害");
      aliveEnemies().slice().forEach(function(e){ damageEnemy(e,3); });
    }
  }

  function msg(t){
    var h=el("hint"); h.textContent=t; h.classList.remove("hidden");
    clearTimeout(msg._t); msg._t=setTimeout(function(){ h.classList.add("hidden"); },1600);
  }

  /* ---------------- 出牌 ---------------- */
  function canPlay(card,slot){
    var def=CARDS[card.id];
    if(def.type==="passive") return false;
    if(def.cost>S.battle.energy) return false;
    if(def.type==="unit") return true;
    return true;
  }

  function playCard(handIdx,slot){
    var b=S.battle;
    var card=b.hand[handIdx];
    if(!card) return;
    var def=CARDS[card.id];
    if(!canPlay(card,slot)){
      if(def.cost>b.energy) msg("能量不足");
      else if(def.type==="unit") msg("选一个空位召唤");
      return;
    }
    var cardEl=document.querySelector('[data-hand="'+handIdx+'"] .card');
    var targetEl=(CARDS[card.id].type==="unit")?document.querySelector("#unit-row"):document.querySelector(".mid");
    var flyFrom=cardEl?cardEl.getBoundingClientRect():null;
    var flyTo=targetEl?targetEl.getBoundingClientRect():null;
    b.energy-=def.cost;
    b.hand.splice(handIdx,1);
    if(def.type==="unit"){
      var unit={uid:S.uid++,name:def.name,atk:def.atk,hp:def.hp,maxHp:def.hp,kw:(def.kw||[]).slice(),buffs:[],alive:true};
      b.units.push(unit);
      log("召唤 "+def.name+" 入场");
      if(def.onPlay) applyEffect(def.onPlay,{unit:unit});
    }else{
      log("施放 "+def.name);
      applyEffect(def.effect,{});
    }
    b.discard.push(card);
    ui.sel=null;
    cleanup();
    if(flyFrom&&flyTo){
      PENDING_FLY={node:cardEl,from:flyFrom,to:{x:flyTo.left+flyTo.width/2,y:flyTo.top+flyTo.height/2}};
    }
    if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; recordRun("lose"); S.screen="over"; render(); return; }
    saveGame();
    render();
  }

  /* ---------------- 回合结算 ---------------- */
  function resolveHandCard(card){
    var def=CARDS[card.id];
    if(!def || def.type==="passive") return;
    if(def.type==="unit"){
      var target=pickEnemyTarget();
      if(target){ damageEnemy(target,def.atk||0); log(def.name+" 出战，造成 "+(def.atk||0)); }
      if(def.onPlay) applyEffect(def.onPlay,{unit:{name:def.name,atk:def.atk||0,hp:def.hp||1,maxHp:def.hp||1,kw:(def.kw||[]).slice(),buffs:[],alive:true}});
    }else{
      log("施放 "+def.name);
      applyEffect(def.effect,{});
    }
  }
  function endTurn(){
    var b=S.battle;
    if(b.outcome) return;
    S.runTurns++;
    var played=b.hand.splice(0,b.hand.length);
    played.forEach(function(c){ resolveHandCard(c); b.discard.push(c); });
    cleanup();
    if(aliveEnemies().length===0){ winBattle(); return; }
    aliveEnemies().forEach(function(e){
      var intent=e.intents[e.ii % e.intents.length];
      e.ii++;
      if(intent.t==="attack"){
        damagePlayer(intent.v); log(e.name+" 命中你，造成 "+intent.v);
      }else if(intent.t==="defend"){
        var healed=Math.min(e.maxHp-e.hp,intent.v);
        e.hp+=healed;
        log(e.name+" 恢复 "+healed+" 生命"+(healed<intent.v?"（生命已满）":""));
      }else if(intent.t==="buff"){
        e.atk+=intent.v; log(e.name+" 攻击+"+intent.v);
      }
    });
    cleanup();
    if(b.playerHp<=0){ b.outcome="lose"; recordRun("lose"); S.screen="over"; render(); return; }
    if(aliveEnemies().length===0){ winBattle(); return; }
    startTurn(false);
    saveGame();
    render();
  }

  function pickEnemyTarget(){
    var a=aliveEnemies();
    if(!a.length) return null;
    return a[0];
  }
  function pickUnitTarget(){
    var taunt=S.battle.units.filter(function(u){return u&&u.alive&&u.kw.indexOf("taunt")>=0;});
    if(taunt.length) return taunt[0];
    for(var i=0;i<S.battle.units.length;i++){ if(S.battle.units[i]&&S.battle.units[i].alive) return S.battle.units[i]; }
    return null;
  }
  function cleanup(){
    var b=S.battle;
    b.units=b.units.filter(function(u){ return u&&u.alive; });
    b.enemies.forEach(function(e){ if(e.hp<=0) e.alive=false; });
  }

  function winBattle(){
    S.battle.outcome="win";
    S.wave++;
    if(S.wave>=WAVES.length){ S.gold=0; recordRun("win"); clearSave(); S.screen="win"; render(); return; }
    var gain=70+(S.wave-1)*25;
    S.gold=(S.gold||0)+gain;
    log("战利品：获得 "+gain+" 烛币");
    prepareShop();
    S.screen="shop"; render();
  }
  function cardPrice(id){
    var d=CARDS[id]||{};
    return 45+(d.cost||0)*18+(d.type==="unit"?12:0);
  }
  function relicPrice(id){ return {ember:115,oath:125,maw:105,censer:135,chain:120}[id]||120; }
  function destroyPrice(){ return 150+Math.max(0,(S.deck||[]).length-10)*6; }
  function prepareShop(){
    var cardPool=[];
    Object.keys(CARDS).forEach(function(id){
      var d=CARDS[id];
      if(d.type!=="passive"&&(d.clan===S.clan||d.clan==="neutral")) cardPool.push(id);
    });
    var relicPool=["ember","oath","maw","censer","chain"].filter(function(r){ return S.relics.indexOf(r)<0; });
    S.shop={cards:shuffle(cardPool).slice(0,3),relics:shuffle(relicPool).slice(0,3),boughtCards:{},boughtRelics:{},destroyed:false,showDestroy:false};
  }
  function buyShopCard(id){
    if(!S.shop||S.shop.boughtCards[id]) return;
    var price=cardPrice(id);
    if((S.gold||0)<price){ msg("烛币不足"); return; }
    S.gold-=price; S.deck.push(id); S.shop.boughtCards[id]=true; msg("购买："+CARDS[id].name); saveGame(); render();
  }
  function buyShopRelic(id){
    if(!S.shop||S.shop.boughtRelics[id]||S.relics.indexOf(id)>=0) return;
    var price=relicPrice(id);
    if((S.gold||0)<price){ msg("烛币不足"); return; }
    S.gold-=price; S.relics.push(id); S.shop.boughtRelics[id]=true; msg("购买遗物："+RELICS[id].name); saveGame(); render();
  }
  function destroyDeckCard(idx){
    if(!S.shop||S.shop.destroyed) return;
    var price=destroyPrice();
    if((S.gold||0)<price){ msg("烛币不足"); return; }
    if(S.deck.length<=6){ msg("牌组太薄，不能再销毁"); return; }
    idx=parseInt(idx,10);
    if(isNaN(idx)||idx<0||idx>=S.deck.length) return;
    var id=S.deck[idx];
    S.gold-=price; S.deck.splice(idx,1); S.shop.destroyed=true; S.shop.showDestroy=false; msg("已销毁："+CARDS[id].name); saveGame(); render();
  }
  function leaveShop(){ S.shop=null; S.screen="battle"; startBattle(); }

  function startEvent(){
    S.event=EVENTS[rnd(EVENTS.length)];
    S.screen="event"; render();
  }
  function eventChoice(i){
    var opt=S.event.options[i];
    var b=S.battle;
    if(opt.hp){ b.playerHp=clamp(b.playerHp+opt.hp,1,b.maxHp); log("事件："+(opt.hp>0?"回复 ":"失去 ")+Math.abs(opt.hp)+" 点生命"); }
    if(opt.card){ var id=pickCardForEvent(); S.deck.push(id); log("事件：获得 "+CARDS[id].name); }
    if(S.wave>=2){ grantRelic(); }
    S.screen="battle"; startBattle();
  }
  function pickCardForEvent(){
    var pool=[];
    Object.keys(CARDS).forEach(function(id){
      var d=CARDS[id];
      if(d.type==="passive") return;
      if(d.clan===S.clan||d.clan==="neutral") pool.push(id);
    });
    return pool[rnd(pool.length)];
  }
  function grantRelic(){
    var pool=["ember","oath","maw","censer","chain"].filter(function(r){ return S.relics.indexOf(r)<0; });
    if(!pool.length) return;
    var r=pool[rnd(pool.length)];
    S.relics.push(r); log("获得遗物："+RELICS[r].name);
  }
  function rollRewards(){
    var pool=[];
    Object.keys(CARDS).forEach(function(id){
      var d=CARDS[id];
      if(d.type==="passive") return;
      if(d.clan===S.clan||d.clan==="neutral") pool.push(id);
    });
    pool=shuffle(pool);
    return pool.slice(0,3);
  }
  function chooseReward(id){
    S.deck.push(id);
    startEvent();
  }
  function nextBattleSkip(){ startEvent(); }

  /* ---------------- 渲染 ---------------- */

    var d=CARDS[id];

  function unitHTML(u,side,idx){
    if(!u||!u.alive) return "";
    var kw=(u.kw||[]).map(function(k){return {taunt:"守护",grow:"成长",deathrattle:"亡语"}[k];}).filter(Boolean).join(" · ");

  /* ---------------- 动画层（渲染后按状态差异回放，不改动逻辑） ---------------- */
  var LAST=null, PENDING_FLY=null;

  function snap(){
    var b=S.battle;
    return {
      screen:S.screen,
      turn:b?b.turn:0,
      hp:b?b.playerHp:0,
      energy:b?b.energy:0,

    };

  function orbsHTML(cur,max){

    return '<span class="orbs">'+out+'</span>';

  function lungeEl(node){
    if(!node||reduceMotion()) return;
    node.classList.remove("lunge");
    void node.offsetWidth;
    node.classList.add("lunge");
    setTimeout(function(){ node.classList.remove("lunge"); },400);
  }
  function shatter(node){
    if(!node||reduceMotion()) return;
    var r=node.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<9;i++){
      var sh=document.createElement("div");
      sh.className="shard";
      sh.style.left=cx+"px"; sh.style.top=cy+"px";
      fxLayer().appendChild(sh);
      var ang=Math.random()*Math.PI*2, dist=34+Math.random()*54;
      if(sh.animate){
        sh.animate([
          {transform:"translate(-50%,-50%) scale(1)",opacity:1},
          {transform:"translate("+(Math.cos(ang)*dist).toFixed(1)+"px,"+((Math.sin(ang)*dist)+38).toFixed(1)+"px) scale(.2)",opacity:0}
        ],{duration:480+Math.random()*220,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
      }
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },780); })(sh);
    }
  }
  function fxLayer(){ return el("fx"); }
  function reduceMotion(){
    try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; }
  }
  var floatSeq=0, floatClear=null;
  function floatAt(node,text,cls){
    if(!node||reduceMotion()) return;
    var r=node.getBoundingClientRect();
    var d=document.createElement("div");
    d.className="float "+cls;
    d.textContent=text;
    var lift=floatSeq*17;
    d.style.left=(r.left+r.width/2)+"px";
    d.style.top=(r.top+r.height/2-lift)+"px";
    floatSeq++;
    clearTimeout(floatClear);
    floatClear=setTimeout(function(){ floatSeq=0; },320);
    fxLayer().appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },900);
  }
  function quakeScreen(){
    if(reduceMotion()) return;
    var app=el("app");
    app.classList.remove("quake");
    void app.offsetWidth;
    app.classList.add("quake");
    setTimeout(function(){ app.classList.remove("quake"); },440);
  }
  function shakeEl(node){
    if(!node||reduceMotion()) return;
    node.classList.remove("shake");
    void node.offsetWidth;
    node.classList.add("shake");
    setTimeout(function(){ node.classList.remove("shake"); },380);
  }
  function swordSlash(node,kind,after){
    if(!node||reduceMotion()){
      if(after) setTimeout(after,300);
      return;
    }
    var r=node.getBoundingClientRect();
    var x=r.left+r.width/2, y=r.top+r.height/2;
    var slash=document.createElement("div");
    slash.className="slash-fx "+(kind==="cleave"?"cleave":"");
    slash.style.left=x+"px"; slash.style.top=y+"px";
    slash.innerHTML='<span class="sword-body"><i class="blade"></i><i class="guard"></i><i class="handle"></i></span><i class="slash-line"></i>';
    fxLayer().appendChild(slash);
    setTimeout(function(){
      var pop=document.createElement("div");
      pop.className="impact-pop";
      pop.style.left=x+"px"; pop.style.top=y+"px";
      fxLayer().appendChild(pop);
      setTimeout(function(){ if(pop.parentNode) pop.parentNode.removeChild(pop); },300);
    },190);
    for(var i=0;i<5;i++){
      var sp=document.createElement("i"); sp.className="slash-spark";
      sp.style.left=(x-3+(Math.random()-.5)*34)+"px";
      sp.style.top=(y-3+(Math.random()-.5)*24)+"px";
      sp.style.setProperty("--sx",((Math.random()-.5)*(kind==="cleave"?112:82)).toFixed(0)+"px");
      sp.style.setProperty("--sy",((Math.random()-.5)*(kind==="cleave"?76:54)).toFixed(0)+"px");
      fxLayer().appendChild(sp);
      (function(n){ setTimeout(function(){ if(n.parentNode)n.parentNode.removeChild(n); },420); })(sp);
    }
    setTimeout(function(){ if(slash.parentNode)slash.parentNode.removeChild(slash); },460);
    if(after) setTimeout(after,300);
  }
  function showBanner(text){
    if(reduceMotion()) return;
    var d=document.createElement("div");
    d.className="banner";
    d.textContent=text;
    fxLayer().appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1100);
  }
  function playFly(p){
    if(!p||!p.node||reduceMotion()) return;
    var n=p.node.cloneNode(true);
    n.classList.remove("sel","no");
    n.classList.add("flycard");
    n.style.left=p.from.left+"px";
    n.style.top=p.from.top+"px";
    n.style.width=p.from.width+"px";
    n.style.height=p.from.height+"px";
    fxLayer().appendChild(n);
    var dx=p.to.x-(p.from.left+p.from.width/2);
    var dy=p.to.y-(p.from.top+p.from.height/2);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        n.style.transform="translate("+dx+"px,"+dy+"px) scale(.7) rotate(7deg)";
        n.style.opacity="0.12";
      });
    });
    setTimeout(function(){
      if(n.parentNode) n.parentNode.removeChild(n);
      var ring=document.createElement("div");
      ring.className="ring";
      ring.style.left=p.to.x+"px";
      ring.style.top=p.to.y+"px";
      fxLayer().appendChild(ring);
      setTimeout(function(){ if(ring.parentNode) ring.parentNode.removeChild(ring); },520);
    },340);
  }
  function unitNode(side,i){
    var sel=side==="enemy"?'#enemy-row [data-eidx="'+i+'"]':'#unit-row [data-slot="'+i+'"]';
    var box=document.querySelector(sel);
    return box?box.querySelector(".unit"):null;
  }
  function slotNode(side,i){
    var sel=side==="enemy"?'#enemy-row [data-eidx="'+i+'"]':'#unit-row [data-slot="'+i+'"]';
    return document.querySelector(sel);
  }
  function animateDiff(p,c){
    if(!p||!c||c.screen!=="battle"||p.screen!=="battle") return;
    var queue=[];
    c.enemies.forEach(function(hp,i){
      var before=p.enemies[i];
      if(before!=null&&hp!=null&&hp<before) queue.push({side:"enemy",i:i,dmg:before-hp,kill:hp<=0});
      else if(before!=null&&hp===null) queue.push({side:"enemy",i:i,dmg:0,kill:true});
    });
    c.units.forEach(function(hp,i){
      var before=p.units[i];
      if(before!=null&&hp==null) queue.push({side:"player",i:i,dmg:before,kill:true});
      else if(before!=null&&hp!=null&&hp<before) queue.push({side:"player",i:i,dmg:before-hp,kill:false});
    });
    queue.forEach(function(item,idx){
      setTimeout(function(){
        var node=unitNode(item.side,item.i)||slotNode(item.side,item.i);
        if(item.side==="enemy"){
          var atk=document.querySelectorAll("#unit-row .unit");
          for(var a=0;a<atk.length;a++){
            (function(el,delay){ setTimeout(function(){ lungeEl(el); },delay); })(atk[a],a*70);
          }
        }else{
          var foe=document.querySelector("#enemy-row .unit");
          if(foe) lungeEl(foe);
        }
        if(item.dmg>0){
          swordSlash(node,item.dmg>=10?"cleave":"slash",function(){
            floatAt(node,"-"+item.dmg,item.dmg>=10?"dmg big":"dmg");
          });
        }
        if(item.kill){ floatAt(node,"击杀","gold"); shatter(node); }
        if(node){ node.classList.add("hurt"); setTimeout(function(){ node.classList.remove("hurt"); },450); }
        shakeEl(node);
      },idx*120);
    });
    if(c.hand>p.hand){ /* 发牌动画由 deal-arc 类负责 */ }
  }
  function battleIntro(){
    if(reduceMotion()) return;
    var slots=document.querySelectorAll("#enemy-row .slot");
    for(var i=0;i<slots.length;i++){
      slots[i].classList.add("intro-in");

  function syncAura(){
    var old=document.querySelector(".win-aura,.lose-aura");
    if(old) old.parentNode.removeChild(old);
    if(S.screen!=="win"&&S.screen!=="over") return;

  function getDisplay(){
    try{ return localStorage.getItem(DISPLAY_KEY)==="fullscreen"?"fullscreen":"window"; }catch(e){ return "window"; }
  }
  function getOrient(){
    try{ return localStorage.getItem(ORIENT_KEY)==="portrait"?"portrait":"landscape"; }catch(e){ return "landscape"; }
  }
  function setOrient(dir){
    try{ localStorage.setItem(ORIENT_KEY,dir==="portrait"?"portrait":"landscape"); }catch(e){}
  }
  function setDisplay(mode){
    try{ localStorage.setItem(DISPLAY_KEY,mode==="window"?"window":"fullscreen"); }catch(e){}
  }
  function fsElement(){
    return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement||null;
  }
  function fsSupported(){
    var el=document.documentElement;
    var api=!!(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen);
    var enabled=(document.fullscreenEnabled!==false)&&(document.webkitFullscreenEnabled!==false);
    return api&&enabled;
  }
  function orientationLockable(){
    try{ return !!(screen.orientation&&screen.orientation.lock); }catch(e){ return false; }
  }
  function lockOrientation(){
    try{
      if(!orientationLockable()) return;
      var pr=screen.orientation.lock(getOrient());
      if(pr&&pr.catch) pr.catch(function(){});
    }catch(e){}
  }
  function unlockOrientation(){
    try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  }
  function pseudoFull(on){
    var root=document.documentElement, body=document.body;
    if(on){ root.classList.add("pseudo-full"); body.classList.add("pseudo-full"); }
    else{ root.classList.remove("pseudo-full"); body.classList.remove("pseudo-full"); }
  }
  function applyDisplay(mode){
    try{
      var el=document.documentElement;
      if(mode==="fullscreen"){
        if(fsElement()) return;
        if(fsSupported()){
          var r=null;
          if(el.requestFullscreen) r=el.requestFullscreen();
          else if(el.webkitRequestFullscreen) r=el.webkitRequestFullscreen();
          else if(el.mozRequestFullScreen) r=el.mozRequestFullScreen();
          else if(el.msRequestFullscreen) r=el.msRequestFullscreen();
          if(r&&r.then) r.then(function(){ lockOrientation(); }).catch(function(){
            pseudoFull(true);
            msg("系统全屏被浏览器拦截，已按页面内全屏显示");
          });
          else lockOrientation();
          /* 全屏请求悬挂兜底：1.5s 后仍未进入系统全屏，则按页面内全屏铺满 */
          setTimeout(function(){ if(!fsElement()) pseudoFull(true); },1500);
          return;
        }
        pseudoFull(true);
        lockOrientation();
        msg("当前浏览器不支持系统全屏，已按页面内全屏显示");
      }else{
        if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if(document.msExitFullscreen) document.msExitFullscreen();
        unlockOrientation();
        pseudoFull(false);
      }
    }catch(e){ pseudoFull(mode==="fullscreen"); }
  }
  document.addEventListener("fullscreenchange",function(){
    if(fsElement()){ pseudoFull(false); lockOrientation(); }
    else unlockOrientation();
  });
  document.addEventListener("webkitfullscreenchange",function(){ if(fsElement()) pseudoFull(false); });

  function loadHistory(){
    try{
      var raw=localStorage.getItem(HISTORY_KEY);
      var arr=raw?JSON.parse(raw):[];
      return Array.isArray(arr)?arr:[];
    }catch(e){ return []; }
  }
  function recordRun(result){
    if(S.recorded) return;
    S.recorded=true;
    try{
      var list=loadHistory();
      list.unshift({
        ts:Date.now(),
        clan:(CLANS[S.clan]||{}).name||S.clan,
        diff:(DIFFS[S.diff]||{}).name||S.diff,
        result:result,
        wave:Math.min(S.wave+1,WAVES.length),
        turns:S.runTurns||0,
        deck:(S.deck||[]).length
      });
      if(list.length>30) list=list.slice(0,30);
      localStorage.setItem(HISTORY_KEY,JSON.stringify(list));
    }catch(e){}
  }
  function clearHistory(){
    try{ localStorage.removeItem(HISTORY_KEY); }catch(e){}
  }

  function saveGame(){
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify({clan:S.clan,diff:S.diff,deck:S.deck,relics:S.relics,wave:S.wave,battle:S.battle,gold:S.gold,shop:S.shop}));
      S.hasSave=true;
    }catch(e){}
  }
  function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); S.hasSave=false; }catch(e){} }
  function loadGame(){
    try{
      var raw=localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      var d=JSON.parse(raw);
      S.clan=d.clan; S.diff=d.diff; S.deck=d.deck; S.relics=d.relics||[]; S.wave=d.wave; S.gold=d.gold||0; S.shop=d.shop||null;
      S.battle=d.battle; S.screen=(S.shop?"shop":"battle"); S.hasSave=true;
      render(); return true;
    }catch(e){ return false; }
  }

  function render(){
    var app=el("app");
    var prev=LAST;
    var oldHand={};
    var oldNodes=document.querySelectorAll("#hand .handcard");
    for(var oh=0;oh<oldNodes.length;oh++){
      var uidKey=oldNodes[oh].getAttribute("data-uid");
      if(uidKey) oldHand[uidKey]=oldNodes[oh].getBoundingClientRect();
    }
    if(S.screen==="start") app.innerHTML=renderStart();
    else if(S.screen==="title") app.innerHTML=renderTitle();
    else if(S.screen==="battle") app.innerHTML=renderBattle();
    else if(S.screen==="reward") app.innerHTML=renderReward();
    else if(S.screen==="shop") app.innerHTML=renderShop();
    else if(S.screen==="event") app.innerHTML=renderEvent();
    else if(S.screen==="over") app.innerHTML=renderEnd(false);
    else if(S.screen==="win") app.innerHTML=renderEnd(true);
    else if(S.screen==="settings") app.innerHTML=renderSettings();
    var cur=snap();
    animateDiff(prev,cur);
    if(PENDING_FLY){ playFly(PENDING_FLY); PENDING_FLY=null; }
    if(!prev||prev.screen!==S.screen){
      app.classList.remove("screen-in");
      void app.offsetWidth;

    }
    if(prev&&prev.screen==="battle"&&S.screen==="battle") handReflow(oldHand);

    LAST=cur;

  function forcePlayCardAnimations(){
    var nodes=document.querySelectorAll('#hand .handcard[data-anim="deal"]');
    for(var i=0;i<nodes.length;i++){
      (function(wrap){
        var card=wrap.querySelector('.card');
        if(!card) return;
        var delay=parseFloat(wrap.getAttribute('data-delay')||'0')||0;
        card.style.opacity='0';
        card.style.willChange='transform,opacity';
        // 双保险：Web Animations API 强制播放；CSS animation 同时作为兜底。
        if(card.animate){
          try{
            card.animate([
              {opacity:0,transform:'translate(46vw,28vh) scale(.10) rotate(24deg)'},
              {opacity:1,transform:'translate(31vw,-12vh) scale(.36) rotate(16deg)',offset:.22},
              {opacity:1,transform:'translate(12vw,-7vh) scale(.76) rotate(6deg)',offset:.58},
              {opacity:1,transform:'translate(2vw,-1vh) scale(.96) rotate(1deg)',offset:.84},
              {opacity:1,transform:'translate(0,0) scale(1) rotate(0)'}
            ],{duration:1360,delay:delay*1000,easing:'cubic-bezier(.16,.74,.16,1)',fill:'both'}).onfinish=function(){
              card.style.opacity=''; card.style.transform=''; card.style.willChange='';
            };
          }catch(e){}
        }
      })(nodes[i]);
    }
  }
  function forcePlayRerollOut(wrap,done){
    var card=wrap&&wrap.querySelector?wrap.querySelector('.card'):null;
    var finish=function(){ if(done) done(); };
    if(!wrap||!card){ setTimeout(finish,980); return; }
    wrap.classList.add('force-reroll-out');
    card.style.willChange='transform,opacity';
    var finished=false;
    var safe=function(){ if(finished) return; finished=true; card.style.willChange=''; finish(); };
    if(card.animate){
      try{
        var anim=card.animate([
          {opacity:1,transform:'translate(0,0) scale(1) rotate(0)'},
          {opacity:.86,transform:'translate(-14vw,5vh) scale(.66) rotate(-10deg)',offset:.38},
          {opacity:.34,transform:'translate(-34vw,19vh) scale(.27) rotate(-23deg)',offset:.76},
          {opacity:0,transform:'translate(-48vw,29vh) scale(.08) rotate(-34deg)'}
        ],{duration:980,easing:'cubic-bezier(.42,0,.72,.32)',fill:'both'});
        anim.onfinish=safe;
      }catch(e){ setTimeout(safe,980); }
    }else{
      setTimeout(safe,980);
    }
  }

  app.addEventListener("click",function(ev){

    if(!t) return;

    if(t.dataset.clan){ startRun(t.dataset.clan,S.diff); return; }
    if(t.dataset.reward){ chooseReward(t.dataset.reward); return; }
    if(t.dataset.event!==undefined){ eventChoice(parseInt(t.dataset.event,10)); return; }

    if(t.dataset.shopRelic){ buyShopRelic(t.dataset.shopRelic); return; }
    if(t.dataset.destroyCard!==undefined){ destroyDeckCard(t.dataset.destroyCard); return; }
    if(t.dataset.display){
      var dm=t.dataset.display==="window"?"window":"fullscreen";
      setDisplay(dm); applyDisplay(dm); ui.ddOpen=""; render(); return;
    }
    if(t.dataset.orient){
      setOrient(t.dataset.orient);
      if(fsElement()) lockOrientation();
      ui.ddOpen=""; render(); return;
    }
    if(t.dataset.act){
      if(t.dataset.act==="end"){ endTurn(); }
      else if(t.dataset.act==="skip"){ nextBattleSkip(); }
      else if(t.dataset.act==="leave-shop"){ leaveShop(); }
      else if(t.dataset.act==="toggle-destroy"){ if(S.shop&&!S.shop.destroyed){ S.shop.showDestroy=!S.shop.showDestroy; render(); } }
      else if(t.dataset.act==="restart"){ S.screen="title"; S.battle=null; S.event=null; render(); }
      else if(t.dataset.act==="resume"){ loadGame(); }
      else if(t.dataset.act==="rules"){ showRules(); }
      else if(t.dataset.act==="enter-fullscreen"){ setDisplay("fullscreen"); applyDisplay("fullscreen"); return; }
      else if(t.dataset.act==="enter"){
        S.screen="title"; render();
      }
      else if(t.dataset.act==="settings"){ ui.ddOpen=""; showSettingsModal(false); }
      else if(t.dataset.act==="back"){ ui.ddOpen=""; S.screen=S.prevScreen||"title"; render(); }
      else if(t.dataset.act==="dd-toggle"){
        var key=t.dataset.dd||"display";
        ui.ddOpen=(ui.ddOpen===key?"":key);
        render();
      }
      else if(t.dataset.act==="clear-history"){
        if(!ui.confirmClear){ ui.confirmClear=true; render(); }
        else { clearHistory(); ui.confirmClear=false; render(); }
      }
      else if(t.dataset.act==="deck"){ showDeck(); }
      else if(t.dataset.act==="drawpile"){ showDrawPile(); }
      else if(t.dataset.act==="discardpile"){ showDiscardPile(); }
      else if(t.dataset.act==="relics"){ msg(S.relics.length?("遗物：" + S.relics.map(function(r){return RELICS[r].name;}).join(" / ")):"还没有获得遗物"); }
      return;
    }
    if(t.dataset.slot!==undefined && ui.sel!==null){
      playCard(ui.sel,parseInt(t.dataset.slot,10));
      return;
    }
    if(t.dataset.hand!==undefined){
      replaceHandCard(parseInt(t.dataset.hand,10));
      return;
    }
  });
