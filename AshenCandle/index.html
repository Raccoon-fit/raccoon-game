    var btn=ev.target.closest(".btn");
    if(!btn||reduceMotion()) return;
    var r=btn.getBoundingClientRect();
    var sp=document.createElement("span");
    sp.className="ripple";
    var size=Math.max(r.width,r.height)*1.6;
    sp.style.width=sp.style.height=size+"px";
    sp.style.left=(ev.clientX-r.left)+"px";
    sp.style.top=(ev.clientY-r.top)+"px";
    btn.appendChild(sp);
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },580);
  });

  app.addEventListener("pointermove",function(ev){
    var sel=document.querySelector(".card.sel");
    if(!sel) return;
    var r=sel.getBoundingClientRect();
    var dx=Math.max(-1,Math.min(1,(ev.clientX-(r.left+r.width/2))/(r.width/2)));
    var dy=Math.max(-1,Math.min(1,(ev.clientY-(r.top+r.height/2))/(r.height/2)));
    sel.style.setProperty("--ry",(dx*9).toFixed(1)+"deg");
    sel.style.setProperty("--rx",(-dy*9).toFixed(1)+"deg");
  });

  function closeExpandModal(){
    var m=document.querySelector(".expand-modal");
    if(m&&m.parentNode) m.parentNode.removeChild(m);
  }
  function openExpandModal(title,html,extraClass){
    closeExpandModal();
    var m=document.createElement("div");
    m.className="expand-modal";
    var cls="expand-panel"+(extraClass?" "+extraClass:"");
    m.innerHTML='<section class="'+cls+'" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="expand-head"><h3>'+title+'</h3><button class="expand-close" type="button" aria-label="关闭">×</button></div>'+html+'</section>';
    document.body.appendChild(m);
    m.querySelector(".expand-close").addEventListener("click",closeExpandModal);
    m.addEventListener("click",function(e){ if(e.target===m) closeExpandModal(); });
  }

  function settingsModalHTML(){
    var list=loadHistory();
    var pad=function(n){ return (n<10?"0":"")+n; };
    var rows=list.map(function(h){
      var d=new Date(h.ts||0);
      var when=pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
      var ok=(h.result==="win");
      return '<div class="hist-row">'+
        '<div class="hist-main"><b class="'+(ok?"win":"lose")+'">'+(ok?"通关":"失败")+'</b>'+
        '<span>'+h.clan+' · '+h.diff+'</span></div>'+
        '<div class="hist-sub"><span>第 '+h.wave+' 层</span><span>'+h.turns+' 回合</span><span>'+when+'</span></div>'+
      '</div>';
    }).join("");
    var dir=getOrient();
    var dirLabel=dir==="portrait"?"竖屏":"横屏";
    var isFull=!!fsElement()||document.documentElement.classList.contains("pseudo-full");
    var displayLabel=isFull?"全屏":"窗口";
    var dd='<div class="set-row"><span class="set-label">窗口模式</span>'+
      '<div class="dd'+(ui.ddOpen==="modal-display"?" open":"")+'">'+
        '<button class="dd-btn" data-modal-dd="modal-display" aria-haspopup="listbox" aria-expanded="'+(ui.ddOpen==="modal-display")+'">'+displayLabel+'<i>▾</i></button>'+
        (ui.ddOpen==="modal-display"?'<div class="dd-menu" role="listbox">'+
          '<button class="dd-item'+(!isFull?" on":"")+'" data-modal-display="window" role="option">窗口</button>'+
          '<button class="dd-item'+(isFull?" on":"")+'" data-modal-display="fullscreen" role="option">全屏</button>'+
        '</div>':'')+
      '</div></div>'+
      '<div class="set-note full-note">全屏不会自动启动，只能由你点击主界面按钮或在这里选择“全屏”后进入。</div>'+
      '<div class="set-row"><span class="set-label">游戏方向</span>'+
      '<div class="dd'+(ui.ddOpen==="modal-orient"?" open":"")+'">'+
        '<button class="dd-btn" data-modal-dd="modal-orient" aria-haspopup="listbox" aria-expanded="'+(ui.ddOpen==="modal-orient")+'">'+
          dirLabel+'<i>▾</i></button>'+
        (ui.ddOpen==="modal-orient"?'<div class="dd-menu" role="listbox">'+
          '<button class="dd-item'+(dir==="landscape"?" on":"")+'" data-modal-orient="landscape" role="option">横屏</button>'+
          '<button class="dd-item'+(dir==="portrait"?" on":"")+'" data-modal-orient="portrait" role="option">竖屏</button>'+
        '</div>':'')+
      '</div></div>'+
      (orientationLockable()?"":'<div class="set-note">当前环境不支持锁定屏幕方向，将随设备自动旋转</div>');
    return '<div class="settings-modal-body">'+dd+
      '<div class="hist-head"><span>历史对局</span><em>'+list.length+' / 30</em></div>'+
      (list.length?'<div class="hist-list">'+rows+'</div>':'<div class="hist-empty">还没有对局记录。打完一局（通关或失败）就会出现在这里。</div>')+
      (list.length?'<button class="btn ghost" data-modal-clear="1">'+(ui.confirmClear?"再点一次确认清空":"清空记录")+'</button>':'')+
      '<div class="modal-actions"><button class="btn primary" data-modal-close="1">关闭</button></div>'+ 
      '</div>';
  }
  function showSettingsModal(keepConfirm){
    if(!keepConfirm) ui.confirmClear=false;
    openExpandModal("设置",settingsModalHTML(),"settings-modal-panel");
  }

  function showRules(){
    openExpandModal("战斗规则",'<div class="rule-list">'+
      '<div class="rule-row"><b>手牌即出战</b>不再设置单独出战区；手牌区里的所有非状态牌默认参与本回合对决。</div>'+ 
      '<div class="rule-row"><b>换牌</b>点击手牌会消耗 1 点烛火，从抽牌堆抽 1 张非状态牌替换；被换下的牌进入弃牌堆。抽牌堆没有可进入手牌的攻击/生命牌时不能换牌。</div>'+ 
      '<div class="rule-row"><b>每回合抽牌</b>每回合抽到 4 张有攻击和生命的出战牌；无攻击/生命的法术、驻留、效果牌不会进入手牌，会自动缩小放到右侧区域。</div>'+ 
      '<div class="rule-row"><b>开始对决</b>点击“开始对决”后，当前手牌全部结算并进入弃牌堆，然后敌人行动并进入下一回合。</div>'+ 
      '<div class="rule-row"><b>过关与商店</b>击败当前关卡后进入商店，可购买卡牌、遗物或昂贵地销毁一张牌。</div>'+ 
      '<div class="rule-row"><b>溢出奖励</b>致死伤害超过敌人剩余生命时，每溢出 1 点获得 1 烛币。</div>'+ 
      '</div>');
  }
  function showDeck(){
    if(!S.deck||!S.deck.length){ openExpandModal("牌堆",'<div class="rule-row">牌堆为空。</div>'); return; }
    var count={}; S.deck.forEach(function(id){ count[id]=(count[id]||0)+1; });
    var rows=Object.keys(count).map(function(id){ var d=CARDS[id]; return '<div class="deck-popup-card"><div><b>'+d.name+'</b><span> · '+d.text+'</span></div><em>×'+count[id]+'</em></div>'; }).join("");
    var b=S.battle;
    var summary='<div class="deck-summary"><span>总计 '+S.deck.length+' 张</span>'+(b?'<span>抽牌堆 '+b.drawPile.length+'</span><span>弃牌堆 '+b.discard.length+'</span>':'')+'</div>';
    openExpandModal("牌堆",summary+'<div class="deck-popup-list">'+rows+'</div>');
  }
  function pileRows(cards){
    if(!cards||!cards.length) return '<div class="rule-row">暂无卡牌。</div>';
    var count={};
    cards.forEach(function(c){ var id=(typeof c==="string")?c:c.id; count[id]=(count[id]||0)+1; });
    return '<div class="deck-popup-list">'+Object.keys(count).map(function(id){ var d=CARDS[id]; return '<div class="deck-popup-card"><div><b>'+d.name+'</b><span> · '+d.text+'</span></div><em>×'+count[id]+'</em></div>'; }).join("")+'</div>';
  }
  function showDrawPile(){
    var b=S.battle;
    if(!b){ showDeck(); return; }
    openExpandModal("抽牌堆",'<div class="deck-summary"><span>抽牌堆 '+b.drawPile.length+' 张</span></div>'+pileRows(b.drawPile));
  }
  function showDiscardPile(){
    var b=S.battle;
    if(!b){ showDeck(); return; }
    openExpandModal("弃牌堆",'<div class="deck-summary"><span>弃牌堆 '+b.discard.length+' 张</span></div>'+pileRows(b.discard));
  }


  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-modal-dd],[data-modal-display],[data-modal-orient],[data-modal-clear],[data-modal-close]");
    if(!t) return;
    if(t.dataset.modalClose!==undefined){ closeExpandModal(); return; }
    if(t.dataset.modalDisplay){
      var dm=t.dataset.modalDisplay==="fullscreen"?"fullscreen":"window";
      setDisplay(dm); applyDisplay(dm); ui.ddOpen=""; showSettingsModal(true); return;
    }
    if(t.dataset.modalDd){
      ui.ddOpen=(ui.ddOpen===t.dataset.modalDd?"":t.dataset.modalDd);
      showSettingsModal(true);
      return;
    }
    if(t.dataset.modalOrient){
      setOrient(t.dataset.modalOrient);
      if(fsElement()) lockOrientation();
      ui.ddOpen="";
      showSettingsModal(true);
      render();
      return;
    }
    if(t.dataset.modalClear!==undefined){
      if(!ui.confirmClear){ ui.confirmClear=true; showSettingsModal(true); }
      else { clearHistory(); ui.confirmClear=false; showSettingsModal(true); }
      return;
    }
  });

  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeExpandModal(); });

  /* 拖拽 */
  var ghost=el("ghost");
  function highlight(x,y){}
  function clearHighlight(){}

  (function initEmbers(){
    var box=el("embers");
    if(!box) return;
    for(var i=0;i<16;i++){
      var sp=document.createElement("span");
      sp.style.left=(Math.random()*100)+"%";
      sp.style.animationDuration=(7+Math.random()*6)+"s";
      sp.style.animationDelay=(-Math.random()*9)+"s";
      sp.style.width=sp.style.height=(2+Math.random()*2)+"px";
      box.appendChild(sp);
    }
  })();

  document.addEventListener("animationend",function(ev){
    var n=ev.animationName;
    if(n==="slotIn") ev.target.classList.remove("intro-in");
    else if(n==="dealIn") ev.target.classList.remove("deal-in");
    else if(n==="popIn") ev.target.classList.remove("pop-in");
  },true);

  try{ S.hasSave=!!localStorage.getItem(SAVE_KEY); }catch(e){}
  render();
})();
</script>
<script>
/* 引导提示收尾：游戏脚本已渲染则在首次绘制前移除；未渲染则保留并显示错误 */
(function(){
  var app=document.getElementById("app");
  var notice=document.getElementById("boot-notice");
  if(!notice) return;
  if(app&&app.firstChild){ if(notice.parentNode) notice.parentNode.removeChild(notice); return; }
  if(window.__bootErr){
    var box=document.getElementById("boot-err");
    if(box) box.textContent="错误信息："+window.__bootErr;
  }
})();
</script>
</body>
