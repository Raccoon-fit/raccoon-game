<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0a0d">
<title>残烛纪年</title>
<style>
:root{
  --bg:#08070a; --bg2:#141118; --panel:#1a161f; --line:#2c2533;
  --gold:#e6b263; --gold-dim:#8a6636; --gold-soft:rgba(230,178,99,.16);
  --text:#f1e9dd; --muted:#9c9188; --blood:#c0483f; --jade:#63b191; --violet:#9a7fc0;
  --card-w:78px; --card-h:112px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(90% 46% at 50% -6%,rgba(230,178,99,.16) 0%,rgba(120,80,40,.05) 34%,transparent 62%),
    radial-gradient(120% 70% at 50% 110%,rgba(80,40,90,.22) 0%,transparent 60%),
    linear-gradient(180deg,#120e17 0%,#0a080c 42%,#060509 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none; user-select:none; position:relative; overflow-x:hidden;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.45;
}
#app{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#app.screen-in{animation:screenIn .4s var(--ease)}
@keyframes screenIn{from{opacity:0}to{opacity:1}}

/* 烛火粒子 */
.embers{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.embers span{
  position:absolute;bottom:-12px;width:3px;height:3px;border-radius:50%;
  background:radial-gradient(circle,#ffd79a 0%,rgba(230,160,70,.7) 45%,transparent 70%);
  box-shadow:0 0 8px rgba(230,178,99,.75);animation:rise linear infinite;opacity:0;
}
@keyframes rise{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  12%{opacity:.9}
  70%{opacity:.55}
  100%{opacity:0;transform:translate3d(14px,-88vh,0) scale(1.15)}
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{
  position:relative;overflow:hidden;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,#2b2232,#191320);color:var(--gold);
  border-radius:11px;padding:10px 18px;font-size:15px;letter-spacing:.08em;
  transition:transform .16s var(--ease),box-shadow .2s,border-color .2s;
}
.btn::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,215,154,.22),transparent);
  transform:skewX(-18deg);animation:sheen 4.6s ease-in-out infinite;
}
@keyframes sheen{0%,68%{left:-70%}86%,100%{left:130%}}
.btn:active{transform:scale(.97);box-shadow:0 0 18px rgba(230,178,99,.25)}
.btn.primary{
  background:linear-gradient(180deg,#563c22,#2b1d0f);border-color:var(--gold);color:#ffdca2;
  box-shadow:0 0 0 1px rgba(230,178,99,.18),0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,170,.22);
}
.btn.primary:active{box-shadow:0 0 26px rgba(230,178,99,.42)}
.btn[disabled]{opacity:.4}

/* 标题页 */
.title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 22px;text-align:center;gap:14px}
.title-wrap h1{
  position:relative;font-size:31px;letter-spacing:.36em;margin:0;text-indent:.36em;font-weight:600;
  background:linear-gradient(180deg,#ffe6b8 0%,#e6b263 46%,#9b6f37 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(230,178,99,.35));
  animation:titleIn .9s var(--ease) backwards;
}
.title-wrap h1::after{
  content:"";position:absolute;left:50%;bottom:-10px;width:120px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(230,178,99,.75),transparent);
  animation:lineGrow .9s .2s var(--ease) backwards;
}
@keyframes titleIn{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes lineGrow{from{width:0;opacity:0}to{width:120px;opacity:1}}
.title-wrap .sub{color:var(--muted);font-size:12px;letter-spacing:.18em;animation:fadeIn .7s .25s backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.clan-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;margin-top:18px}
.clan-card{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(160deg,#1c1524 0%,#100d15 70%);
  padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;
  transition:transform .2s var(--ease),border-color .2s,box-shadow .25s;
  animation:cardRise .5s var(--ease) backwards;
}
.clan-card:nth-child(2){animation-delay:.08s}
.clan-card::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.55;
}
.clan-card:active,.clan-card:hover{transform:translateY(-2px);border-color:var(--gold-dim);box-shadow:0 10px 26px rgba(0,0,0,.45)}
@keyframes cardRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.clan-card h3{margin:0;font-size:16px;color:var(--text);letter-spacing:.04em}
.clan-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.clan-card .tag{font-size:11px;color:var(--gold);letter-spacing:.1em}

/* 难度选择 */
.diff-row{display:flex;gap:8px;margin-top:16px}
.diff-btn{
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--muted);
  transition:color .2s,border-color .2s,background .2s,box-shadow .25s,transform .16s;
}
.diff-btn:active{transform:scale(.96)}
.diff-btn.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);box-shadow:0 0 16px rgba(230,178,99,.22)}
.pick-label{font-size:11px;color:#7a6f68;letter-spacing:.3em;margin-top:4px}
.relic-row{font-size:10px;color:#8d7f74;padding:4px 12px 0;letter-spacing:.06em}

/* 战斗布局 */
.hud{
  display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:12px;color:var(--muted);
  border-bottom:1px solid rgba(44,37,51,.8);background:linear-gradient(180deg,rgba(24,19,30,.9),rgba(12,10,16,.4));
  backdrop-filter:blur(6px);
}
.hud .hp{color:#ea7f73;font-weight:600}
.hud .en{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.hud .pile{margin-left:auto;display:flex;gap:10px}
.hud .turn{color:var(--text);letter-spacing:.06em}
.bump{animation:bump .34s var(--ease)}
@keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.28);color:#ffdca2}100%{transform:scale(1)}}
.flash-red{animation:flashRed .4s ease-out}
@keyframes flashRed{0%{box-shadow:inset 0 0 0 2px rgba(192,72,63,.75)}100%{box-shadow:inset 0 0 0 2px transparent}}

.field{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px 4px;gap:6px;min-height:0}
.field::after{
  content:"";position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;
  border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(230,178,99,.13),transparent 28%,rgba(150,120,210,.12) 52%,transparent 76%,rgba(230,178,99,.13));
  filter:blur(2px);opacity:.75;animation:runeSpin 26s linear infinite;
}
.field::before{
  content:"";position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
  border:1px solid rgba(230,178,99,.10);border-radius:50%;pointer-events:none;
  animation:runePulse 5.5s ease-in-out infinite;
}
@keyframes runeSpin{to{transform:rotate(360deg)}}
@keyframes runePulse{0%,100%{transform:scale(.96);opacity:.35}50%{transform:scale(1.04);opacity:.7}}
.slot{position:relative;z-index:1}
.side-label{font-size:11px;color:#6a6060;letter-spacing:.2em;padding-left:2px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mid{flex:1;display:flex;align-items:center;gap:10px;color:#3d3446;font-size:9px;letter-spacing:.4em;text-indent:.4em;min-height:18px}
.mid i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#2e2636 30%,#2e2636 70%,transparent)}
.slot{
  position:relative;border:1px dashed #332b3b;border-radius:12px;height:calc(var(--card-h) + 6px);
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.012);
  transition:border-color .18s,background .18s,box-shadow .2s;
}
.slot.empty::after{content:"空位";color:#463d4a;font-size:11px;letter-spacing:.2em}
#enemy-row .slot{background:radial-gradient(120% 90% at 50% 0%,rgba(120,44,44,.10),rgba(255,255,255,.012) 70%)}
#enemy-row .slot.empty{background:rgba(255,255,255,.012)}
.side-label::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;
  background:linear-gradient(135deg,var(--gold),transparent);transform:rotate(45deg);vertical-align:1px;opacity:.7}
.slot.target{border-color:var(--gold);background:var(--gold-soft);animation:targetPulse 1.1s ease-in-out infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 0 0 rgba(230,178,99,.28)}50%{box-shadow:0 0 0 6px rgba(230,178,99,0)}}
.slot.taunt{border-color:#6d4a2f}
.slot.shake{animation:shake .34s var(--ease)}

.unit{
  width:100%;height:100%;border-radius:11px;border:1px solid #3a3145;
  background:linear-gradient(180deg,#251e2d 0%,#151119 100%);display:flex;flex-direction:column;
  padding:6px;gap:2px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 14px rgba(0,0,0,.35);
  animation:popIn .25s var(--ease) backwards;
}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
.unit.enemy{border-color:#4b2a2e;background:linear-gradient(180deg,#2b1a1e 0%,#160f12 100%)}
.unit .uname{font-size:12px;color:#e3d8ca;line-height:1.25;word-break:break-all}
.unit .ustat{display:flex;gap:6px;font-size:12px;margin-top:auto;font-variant-numeric:tabular-nums}
.unit .atk{color:#f3a862;font-weight:700}
.unit .hp{color:#ea7f73;font-weight:700}
.unit .kw{font-size:10px;color:var(--violet)}
.unit .intent{font-size:10px;color:#dcb46d;border-top:1px solid #332b3b;margin-top:2px;padding-top:2px;letter-spacing:.03em}
.unit.dead{opacity:.25}
.unit.threat::after{
  content:"";position:absolute;inset:0;border-radius:11px;pointer-events:none;
  box-shadow:inset 0 0 14px rgba(200,70,60,.4);animation:threatPulse 1.9s ease-in-out infinite;
}
@keyframes threatPulse{0%,100%{opacity:.35}50%{opacity:.95}}
.unit .buffrow{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.buff{font-size:9px;padding:1px 4px;border-radius:4px;background:#2b2436;color:#cdbce6}
.hpbar{height:3px;border-radius:2px;background:#2a222c;margin-top:4px;overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#8e3a33,#e2675b);transition:width .35s var(--ease)}

.hand-zone{
  border-top:1px solid rgba(44,37,51,.9);
  background:linear-gradient(180deg,rgba(10,8,12,.3),rgba(8,6,10,.86));
  padding:4px 10px 6px;
}
.hand{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.handcard{display:flex;flex:0 0 auto;transform:rotate(var(--rot,0deg)) translateY(var(--lift,0px));
  transition:transform .22s var(--ease)}
.handcard.selwrap{transform:rotate(0deg) translateY(-10px) scale(1.05);z-index:6}
.handcard.selwrap .card{box-shadow:0 14px 30px rgba(0,0,0,.65),0 0 0 1px #e0c07a}
.card{
  flex:0 0 auto;width:var(--card-w);height:var(--card-h);border-radius:10px;
  background:linear-gradient(180deg,#272031 0%,#141018 100%);border:1px solid #3d3348;
  display:flex;flex-direction:column;padding:7px 6px 6px;gap:3px;position:relative;
  transition:transform .18s var(--ease),border-color .18s,box-shadow .22s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 12px rgba(0,0,0,.38);
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:10px 10px 0 0;
  background:linear-gradient(90deg,transparent,rgba(230,178,99,.75),transparent);
}
.card.spell::before{background:linear-gradient(90deg,transparent,rgba(120,150,220,.8),transparent)}
.card.passive::before{background:linear-gradient(90deg,transparent,rgba(160,130,210,.85),transparent)}
.card:active{transform:translateY(-3px)}
.card.sel{
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 10px 26px rgba(230,178,99,.28),0 0 24px rgba(230,178,99,.18);
  transform:translateY(-8px) scale(1.03) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
}
.card.no{opacity:.42;filter:grayscale(.45)}
.card.playing{animation:cardPlay .26s var(--ease) forwards}
@keyframes cardPlay{to{opacity:0;transform:translateY(-26px) scale(.82)}}
.card.deal-in{animation:dealIn .3s var(--ease) backwards}
@keyframes dealIn{from{opacity:0;transform:translateY(-14px) rotate(-4deg) scale(.94)}to{opacity:1;transform:none}}
.card .cost{
  position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6b5129,#2b2011 70%);
  border:1px solid var(--gold);color:#ffe0ac;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 10px rgba(230,178,99,.35);
}
.card .cname{font-size:12px;color:#eaded0;line-height:1.2}
.card .ctype{font-size:10px;color:#847890}
.card .ctext{font-size:10px;color:#ada096;line-height:1.38;flex:1;overflow:hidden}
.card .cstat{display:flex;justify-content:space-between;font-size:11px;font-variant-numeric:tabular-nums}
.card .cstat .a{color:#f3a862}.card .cstat .h{color:#ea7f73}

.actionbar{display:flex;gap:8px;align-items:center;padding:4px 10px calc(8px + env(safe-area-inset-bottom))}
.actionbar .btn{flex:1;padding:12px}
.actionbar .ghost{flex:0 0 auto;padding:12px 14px;border-color:var(--line);color:var(--muted)}

.log{
  max-height:80px;overflow-y:auto;font-size:10.5px;color:#8a7f78;line-height:1.7;
  padding:0 12px 2px;border-top:1px dashed #241f2b;
}
.log div{white-space:normal;animation:logIn .24s var(--ease)}
@keyframes logIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

@media (max-height:680px){
  :root{--card-w:70px;--card-h:98px}
  .log{max-height:52px}
  .hand{padding-top:14px}
  .field{gap:4px;padding-top:4px}
  .title-wrap{padding:22px 20px;gap:10px}
  .title-wrap h1{font-size:26px}
}

/* 奖励 / 结算 */
.panel-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:14px;text-align:center;position:relative}
.panel-wrap h2{
  margin:0;font-size:20px;color:var(--gold);letter-spacing:.14em;
  text-shadow:0 0 20px rgba(230,178,99,.35);animation:titleIn .6s var(--ease) both;
}
.panel-wrap p{margin:0;color:var(--muted);font-size:12px;line-height:1.8;animation:fadeIn .5s .1s both}
.rewards{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.reward{
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  background:linear-gradient(150deg,#1d1725,#121017);text-align:left;display:flex;gap:10px;align-items:center;
  transition:transform .18s var(--ease),border-color .2s,box-shadow .22s;
  animation:cardRise .4s var(--ease) both;
}
.reward:nth-child(2){animation-delay:.07s}
.reward:nth-child(3){animation-delay:.14s}
.reward:active{transform:translateX(3px);border-color:var(--gold-dim);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.reward .rc{flex:1}
.reward .rn{font-size:13px;color:#eaded0}
.reward .rt{font-size:11px;color:#8f8489;line-height:1.5;margin-top:3px}
.reward .rp{font-size:11px;color:var(--gold)}

/* 特效层 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.float{
  position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:20px;
  text-shadow:0 2px 10px rgba(0,0,0,.65);animation:floatUp .9s var(--ease) forwards;
}
.float.dmg{color:#ff7d6e}
.float.heal{color:#7fd8a8}
.float.gold{color:#ffd79a;font-size:15px;letter-spacing:.1em}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-62%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}
  45%{transform:translateX(3px)}
  70%{transform:translateX(-2px)}
}
.banner{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
  padding:10px 26px;border-top:1px solid rgba(230,178,99,.5);border-bottom:1px solid rgba(230,178,99,.5);
  background:linear-gradient(90deg,transparent,rgba(18,14,22,.9),transparent);
  color:#ffdca2;font-size:15px;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;
  animation:bannerIn 1.05s var(--ease) forwards;
}
@keyframes bannerIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}
}
.flycard{position:fixed;pointer-events:none;z-index:95;transition:transform .3s var(--ease),opacity .3s;will-change:transform}
.ring{
  position:fixed;width:26px;height:26px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(230,178,99,.85);transform:translate(-50%,-50%) scale(.4);
  animation:ringBurst .55s var(--ease) forwards;
}
@keyframes ringBurst{to{transform:translate(-50%,-50%) scale(3.4);opacity:0;border-color:rgba(230,178,99,0)}}
.drag-ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
.hint{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:rgba(20,15,24,.96);border:1px solid var(--line);color:#d8ccbe;font-size:12px;
  padding:8px 14px;border-radius:20px;z-index:80;pointer-events:none;transition:opacity .3s;
  animation:hintIn .25s var(--ease);
}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.hidden{display:none!important}

/* 胜利 / 失败氛围 */
.win-aura,.lose-aura{position:fixed;inset:0;pointer-events:none;z-index:1}
.win-aura{background:radial-gradient(60% 40% at 50% 42%,rgba(230,178,99,.22),transparent 70%);animation:auraPulse 2.6s ease-in-out infinite}
.lose-aura{background:radial-gradient(70% 50% at 50% 50%,rgba(140,40,40,.18),transparent 75%);animation:auraPulse 3.2s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.55}50%{opacity:1}}


/* ===== 增强动效 ===== */
.en{display:inline-flex;align-items:center;gap:5px}
.orbs{display:inline-flex;gap:3px;margin-left:1px}
.orb{width:7px;height:7px;border-radius:50%;background:#2c2533;border:1px solid #443a52;transition:background .25s,box-shadow .25s,transform .25s}
.orb.on{background:radial-gradient(circle at 35% 30%,#ffe3b4,#e6b263 60%,#9a6d33);border-color:#e6b263;box-shadow:0 0 8px rgba(230,178,99,.65)}
.orb.drain{animation:orbDrain .36s var(--ease)}
@keyframes orbDrain{0%{transform:scale(1.35);box-shadow:0 0 16px rgba(230,178,99,.95)}100%{transform:scale(1);box-shadow:none}}
.orb.light{animation:orbLight .45s var(--ease) backwards}
@keyframes orbLight{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}

.unit.lunge{animation:lunge .36s var(--ease)}
@keyframes lunge{0%{transform:translateY(0)}38%{transform:translateY(-11px) scale(1.05)}100%{transform:translateY(0)}}
.unit.enemy.lunge{animation:lungeDown .36s var(--ease)}
@keyframes lungeDown{0%{transform:none}38%{transform:translateY(11px) scale(1.04)}100%{transform:none}}

/* ===== 复古地牢卡牌 ===== */
.card{
  width:90px;height:138px;padding:0;border-radius:5px;overflow:hidden;
  border:1px solid #cabfa0;
  background:linear-gradient(180deg,#333f37 0%,#25302a 55%,#1a221d 100%);
  box-shadow:0 10px 20px rgba(0,0,0,.55),inset 0 0 0 2px rgba(20,26,22,.9),inset 0 0 0 3px rgba(200,190,160,.16);
}
.card::before{
  content:"";position:absolute;inset:3px;border:1px solid rgba(202,191,160,.22);border-radius:3px;
  background:none;height:auto;pointer-events:none;
}
.card::after{inset:3px;border-radius:3px}
.card .cost{
  position:absolute;top:5px;left:5px;z-index:3;width:19px;height:19px;border-radius:50%;
  border:1px solid #b39a68;
  background:radial-gradient(circle at 34% 28%,#fbf3dd,#d8c8a2 58%,#8d7a52);
  box-shadow:0 1px 4px rgba(0,0,0,.65),inset 0 0 4px rgba(255,255,255,.5);
  color:#241a0c;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.card .cost b{font-style:normal;font-weight:700;font-size:10.5px;line-height:1}
.card .chead{
  height:25px;display:flex;align-items:center;justify-content:center;padding-left:22px;padding-right:6px;
  background:rgba(18,26,20,.55);border-bottom:1px solid rgba(214,196,150,.55);
}
.card .cname{
  font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:11px;letter-spacing:.08em;
  color:#f2e6c8;text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.card .cart{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 50% 46%,rgba(226,216,186,.16),transparent 62%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);
}
.card .glyph{
  font-size:30px;line-height:1;color:#e7d9b4;opacity:.82;transform:rotate(-8deg);
  text-shadow:0 0 14px rgba(240,226,190,.35),0 2px 4px rgba(0,0,0,.8);
  filter:sepia(.25) contrast(1.05);
}
.card .ctext{
  font-size:9px;line-height:1.32;color:#d6cbb0;padding:3px 7px 2px;min-height:26px;
  background:linear-gradient(180deg,transparent,rgba(8,12,10,.35));
}
.card .cfoot{
  height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 3px;
  font-size:8.5px;letter-spacing:.14em;color:#c8d2b8;
  background:rgba(14,20,15,.55);border-top:1px solid rgba(214,196,150,.35);
}
.card .cstat{display:inline-flex;gap:6px}
.card .cstat i{
  font-style:normal;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;border:1px solid rgba(240,220,180,.5);
}
.card .cstat .a{background:radial-gradient(circle at 35% 30%,#f0b070,#8a4b21);color:#2a1608}
.card .cstat .h{background:radial-gradient(circle at 35% 30%,#e88a78,#8a2f26);color:#2a0d08}
.card.spell{background:linear-gradient(180deg,#333d45 0%,#242d34 55%,#161c21 100%)}
.card.passive{background:linear-gradient(180deg,#3c3546,#2a2433 55%,#191520 100%)}
.card.no{opacity:.45;filter:grayscale(.5)}

/* 昵称与数值：衬线描金 */
#enemy-row .unit .uname{
  font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:19px;letter-spacing:.16em;
  color:#f4e7c6;text-shadow:0 0 14px rgba(255,214,150,.35),0 2px 5px rgba(0,0,0,.95);
}
.tl b{font-family:"Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.3em}
#enemy-row .unit .hpbar{
  height:9px;border-radius:1px;border:1px solid rgba(210,180,130,.45);
  clip-path:polygon(0 50%,6% 0,94% 0,100% 50%,94% 100%,6% 100%);
  background:rgba(12,10,9,.85);
}
#enemy-row .unit .hpbar i{background:linear-gradient(180deg,#e2674c,#9d2f22 60%,#6d1d16)}
#enemy-row .unit .hpbar::after{background:repeating-linear-gradient(90deg,transparent 0 16px,rgba(0,0,0,.4) 16px 18px)}
#enemy-row .unit .ustat{
  font-family:"Songti SC",Georgia,serif;letter-spacing:.08em;color:#e8d4ad;font-size:12px;
  border-top:1px solid rgba(202,191,160,.18);padding-top:3px;
}


/* ===== 3D 纵深环境 ===== */
.backwall{
  position:absolute;left:14%;right:14%;top:4%;bottom:24%;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 3px,transparent 3px 40px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.26) 0 3px,transparent 3px 78px),
    linear-gradient(180deg,#332d26 0%,#1a1612 62%,#0f0c0a 100%);
  transform:perspective(900px) translateZ(-60px);
  box-shadow:inset 0 0 80px rgba(0,0,0,.85);
}
.wall-l,.wall-r{
  position:absolute;top:-4%;width:36%;height:94%;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.6) 0 3px,transparent 3px 48px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 3px,transparent 3px 74px),
    linear-gradient(90deg,#241e19 0%,#15110e 100%);
  box-shadow:inset -30px 0 60px rgba(0,0,0,.75);
}
.wall-l{left:-14%;width:44%;transform:perspective(520px) rotateY(30deg);transform-origin:left center}
.wall-r{right:-14%;width:44%;transform:perspective(520px) rotateY(-30deg);transform-origin:right center;
  background:linear-gradient(90deg,#15110e 0%,#241e19 100%);box-shadow:inset 30px 0 60px rgba(0,0,0,.75)}
.arch{box-shadow:inset 0 0 70px rgba(0,0,0,.9),0 0 50px rgba(60,40,20,.35);
  position:absolute;left:50%;top:7%;width:54%;height:58%;transform:translateX(-50%);
  border:9px solid #221c17;border-radius:50% 50% 8px 8px/42% 42% 8px 8px;
  box-shadow:inset 0 0 70px rgba(0,0,0,.85),0 0 40px rgba(0,0,0,.5);
  opacity:.6;
}
.fog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,.05) 0%,rgba(8,7,6,.35) 55%,rgba(8,7,6,.7) 100%)}
.dust{
  position:absolute;inset:0;opacity:.22;
  background-image:radial-gradient(circle,rgba(255,224,178,.5) 0 1px,transparent 1.6px);
  background-size:96px 128px;
  animation:dustDrift 22s linear infinite;
}
@keyframes dustDrift{from{background-position:0 0}to{background-position:36px -128px}}
.floor{
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 3px,transparent 3px 62px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 3px,transparent 3px 54px),
    linear-gradient(180deg,#33291f 0%,#1b1511 60%,#0d0a08 100%);
}
.floor::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(60% 50% at 32% 30%,rgba(255,170,80,.20),transparent 62%);
}
.torch{left:12%;top:30%;width:300px;height:300px;
  background:radial-gradient(circle,rgba(255,186,96,.38),rgba(255,120,40,.14) 38%,transparent 68%)}
.pillar{box-shadow:inset -6px 0 18px rgba(0,0,0,.7),0 0 30px rgba(0,0,0,.5)}
.cage{filter:drop-shadow(0 10px 18px rgba(0,0,0,.8))}


/* 竖条数值底衬 */
.vbar b{background:rgba(8,6,5,.72);padding:0 3px;border-radius:3px}
/* 短屏适配 */
@media (max-height:700px){
  .beast{width:176px;height:112px;top:58%}
  .leftbars{top:19%;gap:16px}
  .vbar{height:86px}
  .orbs-vert{margin-top:6px}
  .orbs-vert .orb{width:6px;height:6px}
  .arch{top:5%;height:50%}
  .log{display:none}
  .unit-wrap{height:104px}
  .hand{padding-top:8px}
  .tools{padding-top:2px}
  .actionbar .btn{padding:10px 16px}
  #enemy-row .unit .uname{font-size:17px}
}
@media (max-height:620px){
  .tl b{font-size:12px}
  .tl span{display:none}
  .hand-zone .card{height:124px}
}


/* 奖励页紧凑，避免溢出 */
.panel-wrap{padding:16px 18px;gap:10px;overflow:auto}
.rewards{gap:8px;margin:10px 0}
.panel-wrap .reward{padding:9px 11px}
.panel-wrap .btn{padding:10px 16px}


/* 拱廊场景 */
.archk{position:absolute;bottom:24%;width:27%;height:44%;border:9px solid #352c24;border-bottom:0;
  border-radius:50% 50% 0 0/70% 70% 0 0;opacity:.42;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.archk.a1{left:1%}
.archk.a2{left:36.5%}
.archk.a3{left:72%}
.gate{position:absolute;left:50%;top:14%;width:30%;height:48%;transform:translateX(-50%);
  background:repeating-linear-gradient(90deg,#211b16 0 5px,#0d0b09 5px 13px),linear-gradient(180deg,#241d17,#0b0908);
  border-radius:48% 48% 0 0/34% 34% 0 0;opacity:.72;
  box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.6)}
.gate::after{content:"";position:absolute;left:50%;top:52%;width:6px;height:22px;transform:translateX(-50%);
  background:#c9a15a;border-radius:3px;box-shadow:0 0 12px rgba(230,178,99,.4)}
.statue{position:absolute;bottom:30%;width:56px;height:104px;opacity:.5;
  background:linear-gradient(180deg,#5a4d42,#241d18);
  clip-path:polygon(50% 0,66% 14%,68% 40%,86% 100%,14% 100%,32% 40%,34% 14%)}
.statue.l{left:4%}.statue.r{right:4%}
.plinth{position:absolute;bottom:26%;width:78px;height:26px;background:linear-gradient(180deg,#4a3f36,#241d18);opacity:.55}
.plinth.l{left:2.5%}.plinth.r{right:2.5%}
.candle{position:absolute;width:6px;height:24px;background:linear-gradient(180deg,#e6d6b4,#b8a483);border-radius:2px;opacity:.9}
.candle::before{content:"";position:absolute;left:50%;top:-13px;width:16px;height:20px;transform:translateX(-50%);
  background:radial-gradient(circle at 50% 65%,#ffe7b0,#ff9a3c 55%,transparent 72%);
  filter:blur(1px);border-radius:50%;animation:candleFlicker 2.2s ease-in-out infinite alternate}
.candle::after{content:"";position:absolute;left:50%;top:-4px;width:40px;height:46px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(255,170,80,.22),transparent 68%)}
@keyframes candleFlicker{from{opacity:.75;transform:translateX(-50%) scale(.94)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}
.candle.c1{left:13%;bottom:44%}.candle.c2{right:13%;bottom:44%}
.candle.c3{left:20%;bottom:33%}.candle.c4{right:20%;bottom:33%}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(70% 55% at 50% 42%,rgba(120,50,40,.10),transparent 62%),
    radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(50,10,14,.42) 100%);}
.floor{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 3px,transparent 3px 62px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 3px,transparent 3px 54px),
  radial-gradient(60% 60% at 50% 40%,rgba(120,50,35,.22),transparent 70%),
  linear-gradient(180deg,#33251c 0%,#1a120e 60%,#0b0807 100%)}


/* 拱廊场景修正 */
.archk{bottom:26%;height:40%;background:linear-gradient(180deg,#1d1713,#0b0807);
  border:9px solid #382d24;border-bottom:0;opacity:.8;
  box-shadow:inset 0 0 50px rgba(0,0,0,.9),0 0 26px rgba(0,0,0,.55)}
.archk.a1{left:2%}.archk.a2{left:36.5%}.archk.a3{left:71%}
.gate{top:18%;width:26%;height:42%;opacity:.58;
  background:repeating-linear-gradient(90deg,#1b1611 0 4px,#080706 4px 12px)}
.statue{bottom:33%;width:64px;height:118px;opacity:.62;background:linear-gradient(180deg,#6b5d4f,#2a221c)}
.statue.l{left:7%}.statue.r{right:7%}
.plinth{bottom:30%;opacity:.6}
.plinth.l{left:5%}.plinth.r{right:5%}
.candle.c1{left:15%;bottom:52%}.candle.c2{right:15%;bottom:52%}
.candle.c3{left:24%;bottom:42%}.candle.c4{right:24%;bottom:42%}
.candle::before{width:11px;height:15px;top:-11px;filter:blur(.8px)}
.candle::after{width:28px;height:32px;top:-2px}
.candle{height:20px;width:5px}
.arch{opacity:.3}


/* 顶部进度与左侧标签 */
.steps{display:flex;gap:7px;margin:3px 0 2px}
.steps i{font-style:normal;width:20px;height:20px;border:1px solid rgba(190,160,110,.4);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#8b7a64;background:rgba(10,8,7,.55)}
.steps i.on{border-color:#e0a752;color:#ffd79a;box-shadow:0 0 10px rgba(230,167,82,.35)}
.vwrap{position:relative}
.vlab{position:absolute;left:15px;top:2px;writing-mode:vertical-rl;font-size:8px;letter-spacing:.24em;
  color:#a08c72;text-shadow:0 1px 4px #000}


/* 末轮视觉微调 */
.hand{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 52px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 52px),transparent 100%)}
.gate{opacity:.42;filter:blur(.6px)}
.beast{opacity:.5}
#unit-row .unit{background:linear-gradient(180deg,#2f3a2e,#171d16);border-color:rgba(206,190,150,.4)}
#unit-row .unit .hpbar i{background:linear-gradient(90deg,#a82f26,#d8674c)}


/* ===== 性能优化层：去掉高开销滤镜与大面积遮罩 ===== */
.wall::before{display:none!important}          /* SVG 噪点滤镜，最贵 */
.wall::after{display:none!important}           /* 交错砖缝 mask，整屏遮罩 */
body::before{display:none!important}           /* 整屏漂移光斑 */
.dust{animation:none!important;opacity:.1!important;background:none!important}
.field::after{filter:none!important;animation:none!important;opacity:.28!important}
.field::before{animation:none!important;opacity:.3!important}
.gate{filter:none!important}
.beast{filter:none!important}
.beast::before{filter:none!important}
.candle::before{filter:none!important}
.candle::after{display:none!important}
.torch-hand::before{filter:none!important}
.torch-hand .flame{filter:none!important}
.card .glyph{filter:none!important}
.btn::after{display:none!important}
.slot.target{animation:none!important}
.unit.threat::after{animation:none!important}
.card.sel::after{animation:none!important;display:none!important}
.torch{animation:flicker 4s ease-in-out infinite!important}
.hand{-webkit-mask-image:none!important;mask-image:none!important}
.archk{box-shadow:none!important}
.scene::after{background:radial-gradient(120% 100% at 50% 50%,transparent 58%,rgba(40,8,12,.42) 100%)!important}
.floor{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 3px,transparent 3px 62px),
  radial-gradient(60% 60% at 50% 40%,rgba(120,50,35,.18),transparent 70%),
  linear-gradient(180deg,#33251c 0%,#1a120e 60%,#0b0807 100%)!important}
.card{box-shadow:0 6px 14px rgba(0,0,0,.5)!important}
#enemy-row .unit .uname,.tl b{text-shadow:0 2px 6px rgba(0,0,0,.9)!important}


/* 常驻动画改为只动透明度，避免每帧重绘 */
body::after{display:none!important}
.torch{animation:torchGlow 4.5s ease-in-out infinite!important}
@keyframes torchGlow{0%,100%{opacity:.72}50%{opacity:1}}
.beast{animation:none!important}
.torch-hand .flame{animation:flameOp 1.3s ease-in-out infinite alternate!important}
@keyframes flameOp{from{opacity:.82}to{opacity:1}}
.torch-hand::before{animation:glowOp 1.8s ease-in-out infinite alternate!important}
@keyframes glowOp{from{opacity:.75}to{opacity:1}}
.candle::before{animation:candleOp 2.4s ease-in-out infinite alternate!important}
@keyframes candleOp{from{opacity:.7}to{opacity:1}}

.embers{display:none!important}
.torch,.torch-hand::before,.torch-hand .flame,.candle::before{animation:none!important;will-change:auto!important}

.scene-fixed{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.scene-fixed .scene{position:absolute;inset:0}
#app{position:relative;z-index:2}


/* 轻量绘制：减少渐变与阴影层数 */
.card{background:#26301f!important;box-shadow:0 4px 10px rgba(0,0,0,.45)!important}
.card::before{display:none!important}
.card .chead{background:#1b241a!important}
.card .cart{background:#1f2a20!important}
.card .ctext{background:none!important;color:#d8cdb0!important}
.card .cfoot{background:#182116!important}
.card .glyph{text-shadow:0 1px 2px #000!important}
#enemy-row .unit .uname,.tl b,.side-label{text-shadow:0 2px 4px #000!important}
.unit,.slot{box-shadow:none!important}
.float{text-shadow:0 2px 4px rgba(0,0,0,.8)!important}
.hand-zone{background:linear-gradient(180deg,transparent,#080605 60%)!important}


/* 清除残余滤镜与合成层 */
*,*::before,*::after{filter:none!important;backdrop-filter:none!important;mix-blend-mode:normal!important}
.scene-fixed{will-change:auto!important}


/* 场景亮度与烛台细节 */
.backwall{background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 3px,transparent 3px 40px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.24) 0 3px,transparent 3px 78px),
  linear-gradient(180deg,#4a4036 0%,#26201a 62%,#141110 100%)!important}
.wall-l{background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 3px,transparent 3px 48px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,transparent 3px 74px),
  linear-gradient(90deg,#332a22,#191410)!important}
.wall-r{background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 3px,transparent 3px 48px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 3px,transparent 3px 74px),
  linear-gradient(90deg,#191410,#332a22)!important}
.candle{height:16px;width:4px;background:linear-gradient(180deg,#f0e2c2,#bfa87f)!important}
.candle::before{width:7px;height:11px;top:-10px;background:radial-gradient(ellipse at 50% 70%,#fff0c8,#ffb055 55%,rgba(255,120,40,.25) 75%,transparent 82%)!important}
.candle::after{content:"";display:block!important;position:absolute;left:-6px;top:6px;width:14px;height:4px;border-radius:2px;background:#2b2118}


/* 设置与历史对局 */
.panel-wrap.settings{gap:10px;padding:18px;justify-content:flex-start}
.hist-head{width:100%;display:flex;align-items:baseline;justify-content:space-between;
  margin-top:4px;padding-bottom:6px;border-bottom:1px solid rgba(200,170,120,.25);
  font-size:12px;letter-spacing:.18em;color:#c9b394}
.hist-head em{font-style:normal;font-size:10px;color:#8b7a64;letter-spacing:.06em}
.hist-list{width:100%;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.hist-list::-webkit-scrollbar{width:3px}
.hist-list::-webkit-scrollbar-thumb{background:rgba(200,170,120,.35);border-radius:2px}
.hist-row{border:1px solid rgba(200,170,120,.22);border-radius:8px;padding:8px 10px;
  background:rgba(20,16,12,.55);display:flex;flex-direction:column;gap:4px}
.hist-main{display:flex;align-items:center;gap:8px}
.hist-main b{font-size:12px;letter-spacing:.1em}
.hist-main b.win{color:#8fd6a4}
.hist-main b.lose{color:#e08a78}
.hist-main span{font-size:12px;color:#e2d3b8}
.hist-sub{display:flex;gap:10px;font-size:10px;color:#8f7f6a}
.hist-empty{width:100%;padding:22px 12px;border:1px dashed rgba(200,170,120,.22);border-radius:10px;
  color:#8b7a64;font-size:12px;line-height:1.8;text-align:center}
.title-settings{margin-top:10px}


/* 设置/奖励面板压暗背景，烛台去“勺子”感 */
.panel-wrap{background:linear-gradient(180deg,rgba(9,7,6,.74),rgba(9,7,6,.92))!important}
.candle::after{display:none!important}
.candle::before{width:6px;height:10px;top:-9px;background:radial-gradient(ellipse at 50% 72%,#fff2cf,#ffb257 56%,rgba(255,130,50,.22) 78%,transparent 84%)!important}
.candle{height:14px;width:3px!important}


/* 设置页可读性与按钮层级 */
.panel-wrap.settings h2{color:#f0d9a8!important;text-shadow:0 0 18px rgba(230,178,99,.45),0 2px 8px #000!important}
.panel-wrap.settings [data-act="clear-history"]{
  align-self:center;padding:7px 18px;font-size:12px;letter-spacing:.1em;
  border-color:rgba(200,120,100,.45);color:#e0a08c;background:rgba(40,20,16,.5)}
.panel-wrap.settings [data-act="clear-history"]:active{border-color:#e08a78;color:#ffc3ae}
.hist-list{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 18px),transparent 100%)}


/* 主开始页 */
.start-wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:36px 24px calc(36px + env(safe-area-inset-bottom));
  text-align:center;

  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=rnd(i+1); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  /* ---------------- 开局 ---------------- */
  function startRun(clan,diff){
    S.clan=clan; S.diff=diff||S.diff; S.deck=STARTERS[clan].slice();
    S.relics=[clan==="order"?"oath":"maw"]; S.wave=0; S.battle=null; S.event=null;
    S.runTurns=0; S.recorded=false;
    startBattle();
  }

  function startBattle(){
    var wave=WAVES[S.wave];
    var baseHp=(DIFFS[S.diff]||DIFFS.apostle).hp;
    var keepHp = S.battle ? S.battle.playerHp : baseHp;
    var b={
      playerHp:keepHp, maxHp:baseHp, energy:3, maxEnergy:3, turn:0,
      hand:[], drawPile:shuffle(S.deck).map(function(id){ return {id:id,uid:S.uid++}; }), discard:[],
      units:[null,null,null], enemies:[], log:[], outcome:null
    };
    var diff=DIFFS[S.diff]||DIFFS.apostle;
    wave.enemies.forEach(function(e){
      var hp=Math.round(e.hp*diff.mul);
      b.enemies.push({name:e.name,hp:hp,maxHp:hp,atk:diff.atk,intents:e.intents,ii:0,alive:true});
    });
    S.battle=b; S.screen="battle"; ui.sel=null;
    if(S.relics.indexOf("oath")>=0){ summonUnit({name:"铁誓卫兵",atk:2,hp:6,kw:["taunt"]}); log("铁誓护符：召唤铁誓卫兵"); }
    if(S.relics.indexOf("chain")>=0){ log("连锁之环：全体攻击 +1"); }
    drawTo(5);
    startTurn(true);
  }

  function drawTo(n){
    var b=S.battle;
    while(b.hand.length<n){
      var c=takeFromPile();
      if(!c) break;
      b.hand.push(c);
    }
  }
  function takeFromPile(){
    var b=S.battle;
    for(var guard=0; guard<400; guard++){
      if(b.drawPile.length===0){
        if(b.discard.length===0) return null;
        b.drawPile=shuffle(b.discard); b.discard=[];
      }
      // 驻留卡不进入手牌，只在牌堆里参与联动；先找第一张可抽的牌
      var pick=-1;
      for(var i=0;i<b.drawPile.length;i++){
        if(CARDS[b.drawPile[i].id].type!=="passive"){ pick=i; break; }
      }
      if(pick<0){
        // 牌堆只剩驻留卡：把弃牌堆洗回牌堆（驻留卡原地保留），再继续抽
        if(b.discard.length===0) return null;
        b.drawPile=b.drawPile.concat(shuffle(b.discard));
        b.discard=[];
        continue;
      }
      return b.drawPile.splice(pick,1)[0];
    }
    return null;
  }

  function startTurn(first){
    var b=S.battle;
    if(!first && b.outcome) return;
    b.turn++;
    b.energy=b.maxEnergy+(S.relics.indexOf("ember")>=0?1:0);
    // 成长
    b.units.forEach(function(u){ if(u && u.alive && u.kw.indexOf("grow")>=0){ u.atk+=1; u.buffs.push("攻+1"); } });
    if(S.relics.indexOf("maw")>=0){
      aliveUnits().forEach(function(u){ u.atk+=1; u.buffs.push("攻+1"); });
      b.playerHp-=1; log("深渊之胃：自损 1 点生命，全体攻击 +1");
      if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; S.screen="over"; }
    }
    // 驻留卡触发
    b.drawPile.forEach(function(c){
      var def=CARDS[c.id];
      if(def.type==="passive"){ applyEffect(def.effect,{passive:true,card:def}); log("驻留生效：" + def.name); }
    });
    drawTo(5+(S.relics.indexOf("censer")>=0?1:0));
    render();
  }

  /* ---------------- 效果 ---------------- */
  function aliveUnits(){ return S.battle.units.filter(function(u){return u&&u.alive;}); }
  function aliveEnemies(){ return S.battle.enemies.filter(function(e){return e.alive;}); }
  function frontEnemy(){ var a=aliveEnemies(); return a.length?a[0]:null; }
  function slotIndex(u){ return S.battle.units.indexOf(u); }

  function applyEffect(eff,ctx){
    if(!eff) return;
    var b=S.battle;
    switch(eff.kind){
      case "buffAll":
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.buffs.push("攻+"+eff.atk); });
        break;
      case "summon":
        for(var i=0;i<eff.count;i++){ summonUnit({name:eff.kw&&eff.kw.length?"爬虫":"侍从",atk:eff.atk,hp:eff.hp,kw:eff.kw||[]}); }
        break;
      case "focus": {
        var target=b.units[0];
        if(!target||!target.alive){ msg("1 号位没有单位，增益无处集中"); return; }
        var moved=0, movedHp=0;
        b.units.forEach(function(u,idx){
          if(u&&u.alive&&idx!==0){
            u.buffs.forEach(function(tag){
              if(tag.indexOf("攻+")===0){ var n=parseInt(tag.slice(2),10)||0; target.atk+=n; moved+=n; }
              if(tag.indexOf("血+")===0){ var h=parseInt(tag.slice(2),10)||0; target.hp+=h; target.maxHp+=h; movedHp+=h; }
            });
            u.buffs=u.buffs.filter(function(t){return t.indexOf("攻+")!==0 && t.indexOf("血+")!==0;});
          }
        });
        if(moved>0){ target.buffs.push("攻+"+moved); }
        if(movedHp>0){ target.buffs.push("血+"+movedHp); }
        if(moved+movedHp>0){ log("共生：把 "+moved+" 攻 / "+movedHp+" 血 的增益集中到 1 号位"); }
        break;
      }
      case "clone": {
        var src=b.units[1];
        if(!src||!src.alive){ msg("2 号位没有单位可复制"); return; }
        var tags=src.buffs.slice();
        if(tags.length===0){ msg("2 号位没有增益可复制"); return; }
        aliveUnits().forEach(function(u){
          tags.forEach(function(t){
            u.buffs.push(t);
            if(t.indexOf("攻+")===0){ u.atk+=parseInt(t.slice(2),10)||0; }
            if(t.indexOf("血+")===0){ u.hp+=parseInt(t.slice(2),10)||0; u.maxHp+=parseInt(t.slice(2),10)||0; }
          });
        });
        log("无形者复制了 "+tags.length+" 条增益给全体");
        break;
      }
      case "swap": {
        var u=b.units[0];
        if(!u||!u.alive){ msg("1 号位没有单位"); return; }
        var t=u.atk; u.atk=u.hp; u.hp=t;
        u.maxHp=Math.max(u.maxHp,u.hp);
        u.buffs.push("攻血互换");
        log(u.name+" 攻血互换：" + u.atk + " / " + u.hp);
        break;
      }
      case "healAll":
        aliveUnits().forEach(function(u){ u.hp=Math.min(u.maxHp,u.hp+eff.v); });
        break;
      case "drawPerUnit":
        drawTo(b.hand.length + aliveUnits().length);
        log("连锁圣咏：抽 "+aliveUnits().length+" 张");
        break;
      case "drawN":
        drawTo(b.hand.length + eff.v);
        break;
      case "healPlayer":
        b.playerHp=Math.min(b.maxHp,b.playerHp+eff.v);
        break;
      case "damageFront":
        var fe=frontEnemy(); if(fe) damageEnemy(fe,eff.v);
        break;
      case "damageAllEnemy":
        aliveEnemies().slice().forEach(function(e){ damageEnemy(e,eff.v); });
        if(eff.self) damagePlayer(eff.self);
        break;
      case "sacrifice": {
        var s=b.units[0];
        if(!s||!s.alive){ msg("1 号位没有单位可献祭"); return; }
        killUnit(s);
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.buffs.push("攻+"+eff.atk); });
        log("献祭 "+s.name+"，全体攻击+"+eff.atk);
        break;
      }
      case "devour": {
        var d=b.units[0];
        if(!d||!d.alive){ msg("1 号位没有单位可吞食"); return; }
        var heal=d.atk; killUnit(d);
        b.playerHp=Math.min(b.maxHp,b.playerHp+heal);
        log("吞食 "+d.name+"，回复 "+heal+" 生命");
        break;
      }
      case "doubleAtk": {
        var t2=b.units[0];
        if(!t2||!t2.alive){ msg("1 号位没有单位"); return; }
        t2.atk*=2; t2.buffs.push("攻×2"); damagePlayer(4);
        break;
      }
      case "bloodPact":
        damagePlayer(3); b.energy+=2;
        log("血契：自损 3，能量 +2");
        break;
      case "growSlot1": {
        var g=b.units[0];
        if(g&&g.alive){ g.atk+=2; g.buffs.push("攻+2"); damagePlayer(1); }
        break;
      }
      case "buffSlot": {
        var t3=b.units[0];
        if(!t3||!t3.alive){ msg("1 号位没有单位"); return; }
        t3.atk+=eff.atk||0; t3.hp+=eff.hp||0; t3.maxHp+=eff.hp||0;
        if(eff.atk) t3.buffs.push("攻+"+eff.atk);
        if(eff.hp) t3.buffs.push("血+"+eff.hp);
        break;
      }
      case "buffAllHeal":
        aliveUnits().forEach(function(u){ u.atk+=eff.atk; u.hp=Math.min(u.maxHp,u.hp+eff.v); });
        break;
      case "selfDamage":
        damagePlayer(eff.v);
        break;
    }
  }

  function summonUnit(tpl){
    var b=S.battle;
    var idx=-1;
    for(var i=0;i<3;i++){ if(!b.units[i]||!b.units[i].alive){ idx=i; break; } }
    if(idx<0){ msg("站位已满"); return false; }
    b.units[idx]={uid:S.uid++,name:tpl.name,atk:tpl.atk,hp:tpl.hp,maxHp:tpl.hp,kw:(tpl.kw||[]).slice(),buffs:[],alive:true};
    return true;
  }

  function damageEnemy(e,v){
    if(!e||!e.alive) return;
    e.hp-=v;
    if(e.hp<=0){ e.hp=0; e.alive=false; log("击杀 "+e.name); }
  }
  function damagePlayer(v){
    var b=S.battle; b.playerHp-=v;
    if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; }
  }
  function killUnit(u){
    if(!u||!u.alive) return;
    u.hp=0; u.alive=false;
    if(u.kw.indexOf("deathrattle")>=0){
      log(u.name+" 亡语：对敌方全体造成 3 点伤害");
      aliveEnemies().slice().forEach(function(e){ damageEnemy(e,3); });
    }
  }

  function msg(t){
    var h=el("hint"); h.textContent=t; h.classList.remove("hidden");
    clearTimeout(msg._t); msg._t=setTimeout(function(){ h.classList.add("hidden"); },1600);
  }

  /* ---------------- 出牌 ---------------- */
  function canPlay(card,slot){
    var def=CARDS[card.id];
    if(def.type==="passive") return false;
    if(def.cost>S.battle.energy) return false;
    if(def.type==="unit"){
      if(typeof slot!=="number") return false;
      var u=S.battle.units[slot];
      return !u || !u.alive;
    }
    return true;
  }

  function playCard(handIdx,slot){
    var b=S.battle;
    var card=b.hand[handIdx];
    if(!card) return;
    var def=CARDS[card.id];
    if(!canPlay(card,slot)){
      if(def.cost>b.energy) msg("能量不足");
      else if(def.type==="unit") msg("选一个空位召唤");
      return;
    }
    var cardEl=document.querySelector('[data-hand="'+handIdx+'"] .card');
    var targetEl=(typeof slot==="number")?document.querySelector('[data-slot="'+slot+'"]'):document.querySelector(".mid");
    var flyFrom=cardEl?cardEl.getBoundingClientRect():null;
    var flyTo=targetEl?targetEl.getBoundingClientRect():null;
    b.energy-=def.cost;
    b.hand.splice(handIdx,1);
    if(def.type==="unit"){
      b.units[slot]={uid:S.uid++,name:def.name,atk:def.atk,hp:def.hp,maxHp:def.hp,kw:(def.kw||[]).slice(),buffs:[],alive:true};
      log("召唤 "+def.name+" 到 "+(slot+1)+" 号位");
      if(def.onPlay) applyEffect(def.onPlay,{unit:b.units[slot]});
    }else{
      log("施放 "+def.name);
      applyEffect(def.effect,{});
    }
    b.discard.push(card);
    ui.sel=null;
    cleanup();
    if(flyFrom&&flyTo){
      PENDING_FLY={node:cardEl,from:flyFrom,to:{x:flyTo.left+flyTo.width/2,y:flyTo.top+flyTo.height/2}};
    }
    if(b.playerHp<=0){ b.playerHp=0; b.outcome="lose"; recordRun("lose"); S.screen="over"; render(); return; }
    saveGame();
    render();
  }

  /* ---------------- 回合结算 ---------------- */
  function endTurn(){
    var b=S.battle;
    if(b.outcome) return;
    S.runTurns++;
    // 己方单位攻击
    for(var i=0;i<3;i++){
      var u=b.units[i];
      if(u&&u.alive){
        var target=pickEnemyTarget();
        if(target){ damageEnemy(target,u.atk); log(u.name+" 攻击 "+target.name+"，造成 "+u.atk); }
      }
    }
    cleanup();
    if(aliveEnemies().length===0){ winBattle(); return; }
    // 敌方行动
    aliveEnemies().forEach(function(e){
      var intent=e.intents[e.ii % e.intents.length];
      e.ii++;
      if(intent.t==="attack"){
        var t=pickUnitTarget();
        if(t){ t.hp-=intent.v; log(e.name+" 攻击 "+t.name+"，造成 "+intent.v); if(t.hp<=0) killUnit(t); }
        else { damagePlayer(intent.v); log(e.name+" 直接命中你，造成 "+intent.v); }
      }else if(intent.t==="defend"){
        var healed=Math.min(e.maxHp-e.hp,intent.v);
        e.hp+=healed;
        log(e.name+" 恢复 "+healed+" 生命"+(healed<intent.v?"（生命已满）":""));
      }else if(intent.t==="buff"){
        e.atk+=intent.v; log(e.name+" 攻击+"+intent.v);
      }
    });
    cleanup();
    if(b.playerHp<=0){ b.outcome="lose"; recordRun("lose"); S.screen="over"; render(); return; }
    if(aliveEnemies().length===0){ winBattle(); return; }
    startTurn(false);
    saveGame();
    render();
  }

  function pickEnemyTarget(){

    var pool=["ember","oath","maw","censer","chain"].filter(function(r){ return S.relics.indexOf(r)<0; });

        ],{duration:480+Math.random()*220,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});

  var floatSeq=0, floatClear=null;

  function swordSlash(node,kind,after){

    slash.innerHTML='<span class="sword-body"><i class="blade"></i><i class="guard"></i><i class="handle"></i></span><i class="slash-line"></i>';
    fxLayer().appendChild(slash);
    setTimeout(function(){

      var sp=document.createElement("i"); sp.className="slash-spark";
      sp.style.left=(x-3+(Math.random()-.5)*34)+"px";
      sp.style.top=(y-3+(Math.random()-.5)*24)+"px";
      sp.style.setProperty("--sx",((Math.random()-.5)*(kind==="cleave"?112:82)).toFixed(0)+"px");

  function unitNode(side,i){

  function animateDiff(p,c){
    if(!p||!c||c.screen!=="battle"||p.screen!=="battle") return;
    var queue=[];
    c.enemies.forEach(function(hp,i){
      var before=p.enemies[i];
      if(before!=null&&hp!=null&&hp<before) queue.push({side:"enemy",i:i,dmg:before-hp,kill:hp<=0});
      else if(before!=null&&hp===null) queue.push({side:"enemy",i:i,dmg:0,kill:true});
    });
    c.units.forEach(function(hp,i){
      var before=p.units[i];
      if(before!=null&&hp==null) queue.push({side:"player",i:i,dmg:before,kill:true});
      else if(before!=null&&hp!=null&&hp<before) queue.push({side:"player",i:i,dmg:before-hp,kill:false});
    });
    queue.forEach(function(item,idx){
      setTimeout(function(){
        var node=unitNode(item.side,item.i)||slotNode(item.side,item.i);
        if(item.side==="enemy"){
          var atk=document.querySelectorAll("#unit-row .unit");
          for(var a=0;a<atk.length;a++){
            (function(el,delay){ setTimeout(function(){ lungeEl(el); },delay); })(atk[a],a*70);
          }
        }else{
          var foe=document.querySelector("#enemy-row .unit");
          if(foe) lungeEl(foe);
        }
        if(item.dmg>0){
          swordSlash(node,item.dmg>=10?"cleave":"slash",function(){
            floatAt(node,"-"+item.dmg,item.dmg>=10?"dmg big":"dmg");
          });
        }
        if(item.kill){ floatAt(node,"击杀","gold"); shatter(node); }
        if(node){ node.classList.add("hurt"); setTimeout(function(){ node.classList.remove("hurt"); },450); }
        shakeEl(node);
      },idx*120);
    });
    if(c.hand>p.hand){
      var deckIco=document.querySelector(".hud .deck-ico");
      if(deckIco){ deckIco.classList.remove("pulse"); void deckIco.offsetWidth; deckIco.classList.add("pulse"); }
      var pile=document.querySelector(".hud .pile");
      var pr=pile?pile.getBoundingClientRect():null;
      var hs=document.querySelectorAll("#hand .handcard");
      for(var k=0;k<hs.length;k++){
        var card=hs[k].querySelector(".card");
        if(!card) continue;
        if(pr&&card.animate&&k>=p.hand&&!reduceMotion()){
          var r=card.getBoundingClientRect();
          var dx=(pr.left+pr.width/2)-(r.left+r.width/2);
          var dy=(pr.top+pr.height/2)-(r.top+r.height/2);
          card.animate([
            {transform:"translate("+dx+"px,"+dy+"px) scale(.35) rotate(-14deg)",opacity:.15},
            {transform:"none",opacity:1}
          ],{duration:420,delay:k*40,easing:"cubic-bezier(.22,.61,.36,1)",fill:"both"});
        }else{
          hs[k].classList.add("deal-in");
          hs[k].style.animationDelay=(k*32)+"ms";
        }
      }
    }
    var orbList=document.querySelectorAll(".orbs .orb");
    if(orbList.length){
      if(c.energy<p.energy){
        for(var oi=c.energy;oi<p.energy&&oi<orbList.length;oi++) orbList[oi].classList.add("drain");
        var en=document.querySelector(".hud .en");
        if(en){ en.classList.add("bump"); setTimeout(function(){ en.classList.remove("bump"); },380); }
      }else if(c.energy>p.energy){
        for(var oj=0;oj<orbList.length;oj++){
          orbList[oj].style.animationDelay=(oj*45)+"ms";
          orbList[oj].classList.add("light");
        }
      }
    }
    if(c.turn>p.turn){
      setTimeout(function(){ showBanner("第 "+c.turn+" 回合"); },80);
      var foes=document.querySelectorAll("#enemy-row .unit");
      for(var f=0;f<foes.length;f++){
        (function(el,d){
          setTimeout(function(){ el.classList.add("scout"); setTimeout(function(){ el.classList.remove("scout"); },620); },d);
        })(foes[f],140+f*90);
      }
    }
    if(c.hp<p.hp){
      quakeScreen();
      var hud=document.querySelector(".hud");
      if(hud){ hud.classList.add("flash-red"); setTimeout(function(){ hud.classList.remove("flash-red"); },440); }
      floatAt(document.querySelector(".leftbars .hp-b"),"-"+(p.hp-c.hp),"dmg");
    }
  }

  }

  }
  function setDisplay(mode){

  }
  function fsElement(){
    return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement||null;
  }
  function fsSupported(){
    var el=document.documentElement;
    var api=!!(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen);
    var enabled=(document.fullscreenEnabled!==false)&&(document.webkitFullscreenEnabled!==false);
    return api&&enabled;
  }
  function orientationLockable(){
    try{ return !!(screen.orientation&&screen.orientation.lock); }catch(e){ return false; }
  }
  function lockOrientation(){
    try{
      if(!orientationLockable()) return;
      var pr=screen.orientation.lock(getOrient());
      if(pr&&pr.catch) pr.catch(function(){});
    }catch(e){}
  }
  function unlockOrientation(){
    try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  }
  function pseudoFull(on){
    var root=document.documentElement, body=document.body;
    if(on){ root.classList.add("pseudo-full"); body.classList.add("pseudo-full"); }
    else{ root.classList.remove("pseudo-full"); body.classList.remove("pseudo-full"); }
  }
  function applyDisplay(mode){
    try{
      var el=document.documentElement;
      if(mode==="fullscreen"){
        if(fsElement()) return;
        if(fsSupported()){
          var r=null;
          if(el.requestFullscreen) r=el.requestFullscreen();
          else if(el.webkitRequestFullscreen) r=el.webkitRequestFullscreen();
          else if(el.mozRequestFullScreen) r=el.mozRequestFullScreen();
          else if(el.msRequestFullscreen) r=el.msRequestFullscreen();
          if(r&&r.then) r.then(function(){ lockOrientation(); }).catch(function(){
            pseudoFull(true);
            msg("系统全屏被浏览器拦截，已按页面内全屏显示");
          });
          else lockOrientation();
          return;
        }
        pseudoFull(true);
        lockOrientation();
        msg("当前浏览器不支持系统全屏，已按页面内全屏显示");
      }else{
        if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if(document.msExitFullscreen) document.msExitFullscreen();
        unlockOrientation();
        pseudoFull(false);
      }
    }catch(e){ pseudoFull(mode==="fullscreen"); }
  }
  document.addEventListener("fullscreenchange",function(){
    if(fsElement()){ pseudoFull(false); lockOrientation(); }
    else unlockOrientation();
  });
  document.addEventListener("webkitfullscreenchange",function(){ if(fsElement()) pseudoFull(false); });

  function render(){
    var app=el("app");
    var prev=LAST;
    var oldHand={};
    var oldNodes=document.querySelectorAll("#hand .handcard");
    for(var oh=0;oh<oldNodes.length;oh++){
      var uidKey=oldNodes[oh].getAttribute("data-uid");
      if(uidKey) oldHand[uidKey]=oldNodes[oh].getBoundingClientRect();
    }
    if(S.screen==="start") app.innerHTML=renderStart();
    else if(S.screen==="title") app.innerHTML=renderTitle();
    else if(S.screen==="battle") app.innerHTML=renderBattle();
    else if(S.screen==="reward") app.innerHTML=renderReward();
    else if(S.screen==="event") app.innerHTML=renderEvent();
    else if(S.screen==="over") app.innerHTML=renderEnd(false);
    else if(S.screen==="win") app.innerHTML=renderEnd(true);
    else if(S.screen==="settings") app.innerHTML=renderSettings();
    var cur=snap();
    animateDiff(prev,cur);
    if(PENDING_FLY){ playFly(PENDING_FLY); PENDING_FLY=null; }
    if(!prev||prev.screen!==S.screen){
      app.classList.remove("screen-in");
      void app.offsetWidth;
      app.classList.add("screen-in");
    }
    if(prev&&prev.screen==="battle"&&S.screen==="battle") handReflow(oldHand);
    if(prev&&prev.screen!=="battle"&&S.screen==="battle") battleIntro();
    LAST=cur;
    syncAura();
  }

  function renderStart(){
    var mode=getDisplay();
    var gl=document.querySelector(".start-wrap");
    return '<div class="start-wrap'+(gl?" start-in":"")+'">'+
      '<div class="start-crest"></div>'+
      '<h1 class="start-title">残烛纪年</h1>'+
      '<div class="start-sub">ASHEN CANDLE</div>'+
      '<div class="start-rule"></div>'+
      '<p class="start-desc">牌组构筑 · 回合制战斗<br>在熄灭前走到最后一层</p>'+
      '<button class="btn primary enter-btn" data-act="enter">进入游戏</button>'+
      '<div class="start-hint">'+(mode==="window"?"窗口":"全屏")+' · '+(getOrient()==="portrait"?"竖屏":"横屏")+' · 可在设置中修改</div>'+
      '<div class="version">v0.4</div>'+
      '</div>';
  }

  function renderTitle(){
    var clans=Object.keys(CLANS).map(function(k){
      var c=CLANS[k];
      return '<button class="clan-card" data-clan="'+k+'">'+
        '<h3>'+c.name+'</h3><div class="tag">'+c.tag+'</div><p>'+c.desc+'</p></button>';
    }).join("");
    var diffs=Object.keys(DIFFS).map(function(k){
      var d=DIFFS[k];
      return '<button class="diff-btn'+(S.diff===k?" on":"")+'" data-diff="'+k+'" title="'+d.desc+'">'+d.name+'</button>';
    }).join("");
    var resume=S.hasSave?'<button class="btn ghost" data-act="resume" style="margin-top:6px">继续上次进度</button>':"";
    return '<div class="title-wrap">'+
      '<h1>残烛纪年</h1>'+
      '<div class="sub">牌组构筑 · 回合制战斗</div>'+
      '<div class="version">ASHEN CANDLE · v0.3</div>'+
      '<div class="diff-row">'+diffs+'</div>'+
      '<div class="pick-label">选择氏族</div>'+
      '<div class="clan-list">'+clans+'</div>'+
      '<button class="btn ghost title-settings" data-act="settings">设置 · 历史对局</button>'+
      resume+
      '</div>';
  }

  function relicDockHTML(){
    if(!S.relics||!S.relics.length) return '<div class="relic-dock"><span class="relic-empty">暂无遗物</span></div>';
    return '<div class="relic-dock" aria-label="遗物">'+S.relics.map(function(id){
      var r=RELICS[id]; if(!r) return "";
      return '<button class="relic-icon" type="button" tabindex="0" aria-label="'+r.name+'：'+r.text+'"><span class="relic-art relic-'+(r.cls||id)+'" aria-hidden="true"><i></i><em></em><strong></strong></span><span class="relic-tip"><b>'+r.name+'</b><span>'+r.text+'</span></span></button>';
    }).join("")+'</div>';
  }

  function renderBattle(){
    var b=S.battle;
    var wave=WAVES[Math.min(S.wave,WAVES.length-1)];
    var alive=b.enemies.filter(function(e){return e.alive;}).length;
    var hpPct=Math.max(0,Math.min(100,Math.round(b.playerHp/b.maxHp*100)));
    var enPct=Math.max(0,Math.min(100,Math.round(b.energy/b.maxEnergy*100)));
    var enemyRow=b.enemies.map(function(e,i){
      return '<div class="slot '+(e.alive?"":"dead")+'" data-eidx="'+i+'">'+unitHTML(e,"enemy",i)+'</div>';
    }).join("");
    var unitRow=b.units.map(function(u,i){
      var cls="slot"+(u&&u.alive?"":" empty")+(u&&u.alive&&u.kw.indexOf("taunt")>=0?" taunt":"");
      return '<div class="'+cls+'" data-slot="'+i+'">'+unitHTML(u,"player",i)+'</div>';
    }).join("");
    var nHand=b.hand.length;
    var hand=b.hand.map(function(c,i){
      var d=CARDS[c.id];
      var no=(d.cost>b.energy)?" no":"";
      var sel=(ui.sel===i)?" sel":"";
      var off=i-(nHand-1)/2;
      var rot=(off*3.4).toFixed(1);
      var lift=(Math.abs(off)*3).toFixed(0);
      return '<div class="handcard'+(sel?" selwrap":"")+'" data-hand="'+i+'" data-uid="'+c.uid+'" style="--rot:'+rot+'deg;--lift:'+lift+'px">'+cardHTML(c.id,no+sel)+'</div>';
    }).join("");
    var logHTML=b.log.slice(-4).map(function(t){return '<div>'+t+'</div>';}).join("");
    return ''+
      '<div class="dungeon">'+
        '<div class="topbar">'+
          '<div class="tl"><b>第 '+(S.wave+1)+' / '+WAVES.length+' 层</b>'+
            '<div class="steps">'+WAVES.map(function(w,wi){return '<i class="'+(wi===S.wave?'on':'')+'">'+(wi+1)+'</i>';}).join("")+'</div>'+
            '<span>'+wave.label+' · 剩余 '+alive+' 名</span></div>'+
          '<button class="gear" data-act="settings" aria-label="设置">⚙</button>'+
        '</div>'+
        '<div class="leftbars">'+
          '<div class="vwrap"><div class="vbar hp-b" title="生命"><i style="height:'+hpPct+'%"></i><b>'+b.playerHp+'</b></div><span class="vlab">生命</span></div>'+
          '<div class="vwrap"><div class="vbar mp-b" title="烛火"><i style="height:'+enPct+'%"></i><b>'+b.energy+'</b></div><span class="vlab">烛火</span></div>'+
          '<div class="orbs-vert">'+orbsHTML(b.energy,b.maxEnergy)+'</div>'+
        '</div>'+
        '<div class="hud">'+
          '<span class="turn"><em>回合</em>'+b.turn+'</span>'+
          '<span class="pile"><i class="ico deck-ico"></i>'+b.drawPile.length+'<i class="ico dis-ico"></i>'+b.discard.length+'</span>'+
        '</div>'+
        '<div class="field">'+
          '<div class="enemy-wrap"><i class="beast" aria-hidden="true"></i><div class="side-label">敌方 · 第 '+(S.wave+1)+'/'+WAVES.length+' 场</div><div class="row" id="enemy-row">'+enemyRow+'</div></div>'+
          '<div class="mid"><i></i><span>战 场</span><i></i></div>'+
          '<div class="unit-wrap"><div class="side-label">我方序列</div><div class="row" id="unit-row">'+unitRow+'</div></div>'+
        '</div>'+
        '<div class="log">'+logHTML+'</div>'+
        '<div class="hand-zone">'+
          '<div class="tools">'+
            '<button class="tool" data-act="rules">规则</button>'+
            '<button class="tool" data-act="deck">牌堆</button>'+
          '</div>'+
          '<div class="hand'+(ui.sel!==null?' focus':'')+'" id="hand">'+hand+'</div>'+
        '</div>'+
        relicDockHTML()+
        '<div class="actionbar"><button class="btn primary" data-act="end">结束回合</button></div>'+
        '<div class="firsthand torch-hand"><i class="flame"></i></div>'+
        '<div class="firsthand sword-hand"></div>'+
      '</div>';
  }

  function renderReward(){
    var opts=S.reward.map(function(id){
      var d=CARDS[id];
      return '<button class="reward" data-reward="'+id+'">'+
        '<span class="rp">'+d.cost+'费</span>'+
        '<span class="rc"><div class="rn">'+d.name+'</div><div class="rt">'+d.text+'</div></span>'+
      '</button>';
    }).join("");
    return '<div class="panel-wrap">'+
      '<h2>战斗胜利</h2>'+
      '<p>选择一张牌加入卡组，然后继续前进。</p>'+
      '<div class="rewards">'+opts+'</div>'+
      '<button class="btn ghost" data-act="skip">跳过，直接前进</button>'+
    '</div>';
  }

  function renderEvent(){
    var ev=S.event||EVENTS[0];
    var opts=ev.options.map(function(o,i){
      return '<button class="reward" data-event="'+i+'"><span class="rc"><div class="rn">'+o.label+'</div></span></button>';
    }).join("");
    return '<div class="panel-wrap"><h2>'+ev.title+'</h2><p>'+ev.text+'</p><div class="rewards">'+opts+'</div></div>';
  }

  function renderSettings(){
    var list=loadHistory();
    var pad=function(n){ return (n<10?"0":"")+n; };
    var rows=list.map(function(h){
      var d=new Date(h.ts||0);
      var when=pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
      var ok=(h.result==="win");
      return '<div class="hist-row">'+
        '<div class="hist-main"><b class="'+(ok?"win":"lose")+'">'+(ok?"通关":"失败")+'</b>'+
        '<span>'+h.clan+' · '+h.diff+'</span></div>'+
        '<div class="hist-sub"><span>第 '+h.wave+' 层</span><span>'+h.turns+' 回合</span><span>'+when+'</span></div>'+
      '</div>';
    }).join("");
    var mode=getDisplay();
    var dir=getOrient();
    var dirLabel=dir==="portrait"?"竖屏":"横屏";
    var dd='<div class="set-row"><span class="set-label">显示模式</span>'+
      '<div class="dd'+(ui.ddOpen==="display"?" open":"")+'">'+
        '<button class="dd-btn" data-act="dd-toggle" data-dd="display" aria-haspopup="listbox" aria-expanded="'+(ui.ddOpen==="display")+'">'+
          (mode==="window"?"窗口":"全屏")+'<i>▾</i></button>'+
        (ui.ddOpen==="display"?'<div class="dd-menu" role="listbox">'+
          '<button class="dd-item'+(mode==="fullscreen"?" on":"")+'" data-display="fullscreen" role="option">全屏</button>'+
          '<button class="dd-item'+(mode==="window"?" on":"")+'" data-display="window" role="option">窗口</button>'+
        '</div>':'')+
      '</div></div>'+
      '<div class="set-row"><span class="set-label">游戏方向</span>'+
      '<div class="dd'+(ui.ddOpen==="orient"?" open":"")+'">'+
        '<button class="dd-btn" data-act="dd-toggle" data-dd="orient" aria-haspopup="listbox" aria-expanded="'+(ui.ddOpen==="orient")+'">'+
          dirLabel+'<i>▾</i></button>'+
        (ui.ddOpen==="orient"?'<div class="dd-menu" role="listbox">'+
          '<button class="dd-item'+(dir==="landscape"?" on":"")+'" data-orient="landscape" role="option">横屏</button>'+
          '<button class="dd-item'+(dir==="portrait"?" on":"")+'" data-orient="portrait" role="option">竖屏</button>'+
        '</div>':'')+
      '</div></div>'+
      (fsSupported()?"":'<div class="set-note">当前浏览器不支持系统全屏，将铺满页面显示</div>')+
      (orientationLockable()?"":'<div class="set-note">当前环境不支持锁定屏幕方向，将随设备自动旋转</div>');
    return '<div class="panel-wrap settings">'+
      '<h2>设置</h2>'+
      dd+
      '<div class="hist-head"><span>历史对局</span><em>'+list.length+' / 30</em></div>'+
      (list.length?'<div class="hist-list">'+rows+'</div>':'<div class="hist-empty">还没有对局记录。打完一局（通关或失败）就会出现在这里。</div>')+
      (list.length?'<button class="btn ghost" data-act="clear-history">'+(ui.confirmClear?"再点一次确认清空":"清空记录")+'</button>':'')+
      '<button class="btn primary" data-act="back">返回</button>'+
    '</div>';
  }

  function renderEnd(win){
    return '<div class="panel-wrap">'+
      '<h2>'+(win?"空心王已倒下":"烛火熄灭")+'</h2>'+
      '<p>'+(win?"你带着这副卡组走到了终局。":"你被使徒击倒了。换一套构筑再试。")+'</p>'+
      '<div style="margin-top:16px"><button class="btn primary" data-act="restart">回到开始</button></div>'+
    '</div>';
  }

  /* ---------------- 交互 ---------------- */
  var app=el("app");

  app.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-clan],[data-diff],[data-reward],[data-event],[data-act],[data-display],[data-orient],[data-hand],[data-slot]");
    if(!t) return;
    if(t.dataset.diff){ S.diff=t.dataset.diff; render(); return; }
    if(t.dataset.clan){ startRun(t.dataset.clan,S.diff); return; }
    if(t.dataset.reward){ chooseReward(t.dataset.reward); return; }
    if(t.dataset.event!==undefined){ eventChoice(parseInt(t.dataset.event,10)); return; }
    if(t.dataset.display){
      var dm=t.dataset.display==="window"?"window":"fullscreen";
      setDisplay(dm); applyDisplay(dm); ui.ddOpen=""; render(); return;
    }
    if(t.dataset.orient){
      setOrient(t.dataset.orient);
      if(fsElement()) lockOrientation();
      ui.ddOpen=""; render(); return;
    }
    if(t.dataset.act){
      if(t.dataset.act==="end"){ endTurn(); }
      else if(t.dataset.act==="skip"){ nextBattleSkip(); }
      else if(t.dataset.act==="restart"){ S.screen="title"; S.battle=null; S.event=null; render(); }
      else if(t.dataset.act==="resume"){ loadGame(); }
      else if(t.dataset.act==="rules"){ showRules(); }
      else if(t.dataset.act==="enter"){
        applyDisplay(getDisplay());
        S.screen="title"; render();
      }
      else if(t.dataset.act==="settings"){ S.prevScreen=S.screen; ui.confirmClear=false; ui.ddOpen=""; S.screen="settings"; render(); }
      else if(t.dataset.act==="back"){ ui.ddOpen=""; S.screen=S.prevScreen||"title"; render(); }
      else if(t.dataset.act==="dd-toggle"){
        var key=t.dataset.dd||"display";
        ui.ddOpen=(ui.ddOpen===key?"":key);
        render();
      }
      else if(t.dataset.act==="clear-history"){
        if(!ui.confirmClear){ ui.confirmClear=true; render(); }
        else { clearHistory(); ui.confirmClear=false; render(); }
      }
      else if(t.dataset.act==="deck"){ msg("牌堆 "+S.battle.drawPile.length+" 张 · 弃牌 "+S.battle.discard.length+" 张"); }
      else if(t.dataset.act==="relics"){ msg(S.relics.length?("遗物：" + S.relics.map(function(r){return RELICS[r].name;}).join(" / ")):"还没有获得遗物"); }
      return;
    }
    if(t.dataset.slot!==undefined && ui.sel!==null){
      playCard(ui.sel,parseInt(t.dataset.slot,10));
      return;
    }
    if(t.dataset.hand!==undefined){
      var i=parseInt(t.dataset.hand,10);
      var d=CARDS[S.battle.hand[i].id];
      if(d.type==="spell"){
        if(ui.sel===i){ playCard(i,-1); return; }
        ui.sel=i; render(); msg("再次点击这张牌施放");
        return;
      }
      if(ui.sel===i){ ui.sel=null; render(); return; }
      ui.sel=i; render();
      msg("选择一个空位召唤");
    }
  });

  app.addEventListener("pointerdown",function(ev){
    var btn=ev.target.closest(".btn");
    if(!btn||reduceMotion()) return;
    var r=btn.getBoundingClientRect();
    var sp=document.createElement("span");
    sp.className="ripple";
    var size=Math.max(r.width,r.height)*1.6;
    sp.style.width=sp.style.height=size+"px";
    sp.style.left=(ev.clientX-r.left)+"px";
    sp.style.top=(ev.clientY-r.top)+"px";
    btn.appendChild(sp);
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },580);
  });

  app.addEventListener("pointermove",function(ev){
    var sel=document.querySelector(".card.sel");
    if(!sel) return;
    var r=sel.getBoundingClientRect();
    var dx=Math.max(-1,Math.min(1,(ev.clientX-(r.left+r.width/2))/(r.width/2)));
    var dy=Math.max(-1,Math.min(1,(ev.clientY-(r.top+r.height/2))/(r.height/2)));
    sel.style.setProperty("--ry",(dx*9).toFixed(1)+"deg");
    sel.style.setProperty("--rx",(-dy*9).toFixed(1)+"deg");
  });

  function showRules(){
    msg("拖拽或点选卡牌：单位卡放到我方空位，法术卡直接施放；驻留卡留在牌堆自动生效");
  }

  /* 拖拽 */
  var ghost=el("ghost");
  app.addEventListener("pointerdown",function(ev){
    var hc=ev.target.closest("[data-hand]");
    if(!hc) return;
    var idx=parseInt(hc.dataset.hand,10);
    ui.dragId=idx; ui.startX=ev.clientX; ui.startY=ev.clientY; ui.moved=false; ui.dragging=false;
  });
  app.addEventListener("pointermove",function(ev){
    if(ui.dragId===null) return;
    var dx=ev.clientX-ui.startX, dy=ev.clientY-ui.startY;
    if(!ui.dragging && Math.abs(dx)+Math.abs(dy)>12){
      ui.dragging=true;
      var card=S.battle.hand[ui.dragId];
      ghost.innerHTML=cardHTML(card.id);
      ghost.className="drag-ghost";
    }
    if(ui.dragging){
      ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
      highlight(ev.clientX,ev.clientY);
    }
  });
  app.addEventListener("pointerup",function(ev){
    if(ui.dragId===null) return;
    var idx=ui.dragId; var moved=ui.dragging;
    ui.dragId=null; ui.dragging=false; ghost.className="drag-ghost hidden"; ghost.innerHTML="";
    if(!moved){ return; } // 交给 click 处理点选
    var target=document.elementFromPoint(ev.clientX,ev.clientY);
    var slot=target&&target.closest("[data-slot]");
    var def=CARDS[S.battle.hand[idx]?S.battle.hand[idx].id:"o1"];
    if(def.type==="unit"){
      if(slot) playCard(idx,parseInt(slot.dataset.slot,10));
      else msg("把单位卡拖到我方空位");
    }else{
      if(slot||(target&&target.closest(".field"))) playCard(idx,-1);
      else msg("拖到战场任意位置施放");
    }
    clearHighlight();
  });
  app.addEventListener("pointercancel",function(){
    ui.dragId=null; ui.dragging=false; ghost.className="drag-ghost hidden"; clearHighlight();
  });

  function highlight(x,y){
    clearHighlight();
    var t=document.elementFromPoint(x,y);
    if(!t) return;
    var slot=t.closest("[data-slot]");
    if(slot) slot.classList.add("target");
  }
  function clearHighlight(){
    var list=document.querySelectorAll(".slot.target");
    for(var i=0;i<list.length;i++) list[i].classList.remove("target");
  }

  (function initEmbers(){
    var box=el("embers");
    if(!box) return;
    for(var i=0;i<16;i++){
      var sp=document.createElement("span");
      sp.style.left=(Math.random()*100)+"%";
      sp.style.animationDuration=(7+Math.random()*6)+"s";
      sp.style.animationDelay=(-Math.random()*9)+"s";
      sp.style.width=sp.style.height=(2+Math.random()*2)+"px";
      box.appendChild(sp);
    }
  })();

  document.addEventListener("animationend",function(ev){
    var n=ev.animationName;
    if(n==="slotIn") ev.target.classList.remove("intro-in");
    else if(n==="dealIn") ev.target.classList.remove("deal-in");
    else if(n==="popIn") ev.target.classList.remove("pop-in");
  },true);

  try{ S.hasSave=!!localStorage.getItem(SAVE_KEY); }catch(e){}
  render();
})();
</script>
</body>
</html>
