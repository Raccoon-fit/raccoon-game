<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="免费、好玩的在线游戏集合地！game.raccoon.fit 提供一系列精致的网页游戏，随时随地开启你的游戏时间。">
    <title>软软的游戏库 - 纯玩无图版</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
           软软的游戏库 · Neo-Brutalism / 印刷风重制版
           ============================================================ */

        /* ---------- 基础重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --paper:     #f2eee3;
            --paper-2:   #fffdf7;
            --ink:       #17140f;
            --ink-2:     #3b362e;
            --muted:     #857e70;
            --accent:    #ff4d00;
            --accent-2:  #1652f0;
            --accent-3:  #ffd400;
            --green:     #00a86b;
            --sidebar-width: 288px;
            --sh:    6px 6px 0 var(--ink);
            --sh-sm: 3px 3px 0 var(--ink);
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        body {
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(rgba(23, 20, 15, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 20, 15, .055) 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 粒子层在新风格中完全弃用，改用网格纸背景 */
        .bg-particles {
            display: none;
        }

        .particle {
            display: none;
        }

        ::selection {
            background: var(--accent-3);
            color: var(--ink);
        }

        /* ---------- 应用骨架 ---------- */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            width: var(--sidebar-width);
            position: fixed;
            inset: 0 auto 0 0;
            background: var(--paper-2);
            border-right: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform .25s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 22px 18px 18px;
            border-bottom: 3px solid var(--ink);
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: var(--accent-3);
            font-size: 20px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--accent-3);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.02em;
            line-height: 1.15;
        }

        .logo-subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }

        /* 用户卡片 */
        .user-profile {
            margin: 16px 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--accent-3);
            border: 2px solid var(--ink);
            box-shadow: var(--sh-sm);
            cursor: pointer;
            user-select: none;
        }

        .avatar {
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            background: var(--ink);
            color: var(--accent-3);
            border: 2px solid var(--ink);
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.2;
        }

        .user-info p {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            color: #5a5348;
            margin-top: 3px;
        }

        .user-tip {
            margin-top: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #6d6559;
        }

        /* 导航 */
        .nav-menu {
            flex: 1;
            padding: 0 14px 18px;
            overflow-y: auto;
        }

        .nav-section-title {
            padding: 16px 4px 8px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 2px dashed rgba(23, 20, 15, .18);
            margin-bottom: 10px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 6px;
            border: 2px solid transparent;
            background: transparent;
            color: var(--ink);
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            transition: transform .12s ease, background .12s ease, border-color .12s ease;
        }

        .nav-item:hover {
            background: var(--accent-3);
            border-color: var(--ink);
            transform: translateX(3px);
        }

        .nav-item.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper-2);
            box-shadow: var(--sh-sm);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 14px;
        }

        .nav-text {
            font-size: 14px;
            font-weight: 800;
        }

        .nav-badge {
            margin-left: auto;
            min-width: 28px;
            padding: 2px 7px;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            background: var(--paper-2);
            color: var(--ink);
            border: 2px solid var(--ink);
        }

        .nav-item.active .nav-badge {
            background: var(--accent-3);
        }

        .sidebar-footer {
            padding: 16px 18px 22px;
            border-top: 3px solid var(--ink);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--muted);
            line-height: 1.7;
        }

        /* ---------- 主内容区 ---------- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 22px;
        }

        /* ---------- 顶部条 ---------- */
        .top-bar {
            background: var(--paper-2);
            border: 2px solid var(--ink);
            box-shadow: var(--sh);
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .page-title h1 {
            display: inline-block;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.03em;
            line-height: 1.1;
            border-bottom: 7px solid var(--accent-3);
            padding-bottom: 2px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            max-width: 46ch;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            width: 100%;
        }

        /* 搜索 / 排序 */
        .search-box,
        .sort-box {
            position: relative;
        }

        .search-box i,
        .sort-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink);
            font-size: 13px;
            pointer-events: none;
        }

        .search-box input,
        .sort-box select {
            min-width: 220px;
            width: 100%;
            border: 2px solid var(--ink);
            background: var(--paper);
            color: var(--ink);
            font-weight: 700;
            padding: 11px 12px 11px 38px;
            outline: none;
            transition: box-shadow .15s ease, background .15s ease;
        }

        .search-box input::placeholder {
            color: var(--muted);
            font-weight: 600;
        }

        .search-box input:focus,
        .sort-box select:focus {
            background: #fff;
            box-shadow: var(--sh-sm);
        }

        .sort-box select option {
            color: #111;
            background: #fff;
        }

        /* ---------- 按钮系统 ---------- */
        .mobile-menu-btn,
        .ghost-btn,
        .primary-btn,
        .secondary-btn {
            border: 2px solid var(--ink);
            cursor: pointer;
            font-weight: 800;
            letter-spacing: .04em;
            transition: transform .12s ease, box-shadow .12s ease,
                        background .12s ease, color .12s ease;
        }

        .primary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            background: var(--ink);
            color: var(--paper-2);
            font-size: 13px;
            text-transform: uppercase;
        }

        .primary-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: translate(-2px, -2px);
            box-shadow: var(--sh-sm);
        }

        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            background: var(--paper-2);
            color: var(--ink);
            font-size: 13px;
            text-transform: uppercase;
        }

        .secondary-btn:hover {
            background: var(--accent-3);
            transform: translate(-2px, -2px);
            box-shadow: var(--sh-sm);
        }

        .ghost-btn {
            padding: 11px 16px;
            background: transparent;
            color: var(--ink);
            font-size: 13px;
            text-transform: uppercase;
        }

        .ghost-btn:hover {
            background: var(--ink);
            color: var(--paper-2);
        }

        .mobile-menu-btn {
            display: none;
            width: 46px;
            height: 46px;
            align-items: center;
            justify-content: center;
            background: var(--accent-3);
            color: var(--ink);
        }

        /* ---------- 欢迎横幅 ---------- */
        .welcome-banner {
            background: var(--ink);
            color: var(--paper);
            border: 2px solid var(--ink);
            box-shadow: var(--sh);
            padding: 26px 28px;
            margin-bottom: 22px;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 22px;
        }

        .welcome-content h2 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.03em;
            color: #fff;
            line-height: 1.15;
        }

        .welcome-content h2::after {
            content: "";
            display: block;
            width: 72px;
            height: 7px;
            margin-top: 12px;
            background: var(--accent-3);
        }

        .welcome-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .stat-card {
            background: #262119;
            border: 2px solid #4b453b;
            padding: 14px 16px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #b3aa99;
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: "Courier New", "SFMono-Regular", monospace;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -.02em;
            color: var(--accent-3);
            line-height: 1.1;
            word-break: break-all;
        }

        /* ---------- 面板 ---------- */
        .panel {
            background: var(--paper-2);
            border: 2px solid var(--ink);
            box-shadow: var(--sh);
