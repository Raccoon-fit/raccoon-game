<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雨夜归途</title>
<link rel="stylesheet" href="styles.css">
<style>
#btnShop{position:absolute;right:76px;top:18px;width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg, rgba(255,214,140,.22), rgba(120,80,20,.35));border:1px solid rgba(255,214,140,.55);color:#ffe6a8;font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:.25s;font-family:inherit;}
#btnShop:active{transform:scale(.9);}
#btnTempLight{right:188px !important;}
#btnMap{position:absolute;right:132px;top:18px;width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg,rgba(20,32,46,.85),rgba(9,15,24,.9));border:1px solid rgba(150,190,230,.22);color:#9fb6cc;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:.2s;font-family:inherit;overflow:hidden;padding:0;}
#btnMap canvas{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);display:block;pointer-events:none;}
#mapPanel{position:absolute;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .3s;}
#mapPanel.show{pointer-events:auto;opacity:1;}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
#btnCloseMap{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,rgba(56,42,22,.92),rgba(28,20,10,.95));border:1px solid rgba(255,214,140,.5);color:#ffe6a8;font-size:20px;display:none;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;z-index:2;}
#mapPanel.show #btnCloseMap{display:flex;}
#shopPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);width:680px;max-height:620px;border-radius:22px;background:linear-gradient(180deg,rgba(24,30,44,.988) 0%,rgba(14,20,32,.992) 45%,rgba(8,12,20,.995) 100%);border:1px solid rgba(255,214,140,.42);opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;overflow:hidden;z-index:35;display:flex;flex-direction:column;}
#shopPanel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.shop-head{padding:22px 28px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,214,140,.15);}
.shop-head h3{font-size:22px;letter-spacing:12px;font-weight:800;color:#ffe6a8;}
.shop-scroll{padding:18px 24px 22px;overflow-y:auto;flex:1 1 auto;}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.shop-item{padding:18px 12px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(30,42,58,.95),rgba(12,18,28,.98));border:1px solid rgba(150,190,230,.28);text-align:center;cursor:pointer;}
#btnSet{position:absolute;right:20px;top:18px;width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg,rgba(20,32,46,.85),rgba(9,15,24,.9));border:1px solid rgba(150,190,230,.22);color:#9fb6cc;font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;}
#toast{position:absolute;left:50%;top:24px;transform:translate(-50%,-16px);padding:10px 26px;border-radius:24px;font-size:15px;background:linear-gradient(180deg,rgba(26,42,62,.95),rgba(12,20,32,.96));border:1px solid rgba(255,214,140,.32);color:#ffd98f;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;z-index:99;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#dlgMask{position:absolute;inset:0;background:rgba(2,4,8,0.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:8;}
#dlgMask.show{opacity:1;pointer-events:auto;}
#dlg{position:absolute;left:82px;right:82px;bottom:30px;padding:22px 30px 24px;font-size:19px;line-height:1.78;color:#dbe8f5;letter-spacing:.6px;background:linear-gradient(180deg,rgba(12,21,33,.96),rgba(6,11,18,.98));border:1px solid rgba(140,180,220,.2);border-radius:16px;opacity:0;transform:translateY(16px);transition:opacity .24s,transform .24s;pointer-events:none;cursor:pointer;white-space:pre-wrap;word-break:break-word;min-height:74px;z-index:9;}
#dlg.show{opacity:1;transform:translateY(0);pointer-events:auto;}
#choiceBox{position:absolute;left:82px;right:82px;bottom:170px;display:none;flex-direction:column;gap:8px;z-index:11;pointer-events:auto;}
#choiceBox.show{display:flex;}
#choiceBox button{width:100%;padding:14px 22px;border-radius:12px;font-family:inherit;font-size:16px;color:#e8eef7;text-align:left;background:linear-gradient(180deg,rgba(20,32,48,.96),rgba(10,16,26,.98));border:1px solid rgba(140,180,220,.3);cursor:pointer;}
#settings{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:580px;border-radius:18px;background:linear-gradient(180deg,rgba(14,23,36,.985),rgba(7,12,20,.995));border:1px solid rgba(140,180,220,.24);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:30;}
#settings.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
#settings .close-x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;color:#9fb6cc;background:rgba(22,34,50,.85);border:1px solid rgba(140,180,220,.24);cursor:pointer;z-index:3;}
#settings .settings-body{padding:24px 28px 20px;}
#settings h3{font-size:19px;letter-spacing:7px;color:#ffd98f;margin-bottom:16px;text-align:center;}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid rgba(140,180,220,.08);}
.opts{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:rgba(6,11,18,.92);border:1px solid rgba(140,180,220,.14);}
.opts button{min-width:44px;padding:7px 14px;font-size:12.5px;color:#8fa4ba;background:transparent;border:none;border-radius:8px;cursor:pointer;}
.opts button.on{color:#1a1208;background:linear-gradient(180deg,#ffe6b0,#d9a24a);font-weight:800;}
.danger{padding:8px 18px;font-size:13px;color:#ff9a8a;background:rgba(60,20,20,.5);border:1px solid rgba(255,120,100,.35);border-radius:9px;cursor:pointer;}
#warnMask{position:absolute;inset:0;background:rgba(2,4,8,.72);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;z-index:40;}
#warnMask.show{opacity:1;pointer-events:auto;}
#warnBox{width:420px;padding:24px 26px 20px;border-radius:16px;background:linear-gradient(180deg,rgba(28,16,18,.98),rgba(14,8,10,.99));border:1px solid rgba(255,120,100,.38);text-align:center;}
.warn-btns{display:flex;gap:12px;margin-top:18px;}
.warn-btns button{flex:1;padding:11px 0;border-radius:10px;cursor:pointer;}
#loadingScreen{position:absolute;inset:0;background:#020408;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .45s;z-index:60;pointer-events:auto;}
#loadingScreen.hidden{opacity:0;pointer-events:none;}
.loading-box{width:480px;display:flex;flex-direction:column;align-items:center;gap:22px;}
.loading-scene-name{font-size:28px;letter-spacing:16px;color:#f2e6cb;}
.loading-bar{width:100%;height:8px;border-radius:4px;background:rgba(18,28,42,.98);overflow:hidden;}
.loading-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b661,#ffd98f 55%,#ffe6b0);transition:width .12s linear;}
.loading-row{width:100%;display:flex;justify-content:space-between;color:#8ba0b6;font-size:13.5px;}
#devErrorPanel{
  position: fixed; left: 10px; bottom: 10px; z-index: 99999; max-width: 46vw; max-height: calc(100vh - 20px);
  display: none; flex-direction: column; gap: 1px; pointer-events: none; font-family: monospace;
  font-size: 9.5px; line-height: 1.35; color: #ff3a3a; overflow: hidden;
}
#devErrorPanel.show{ display: flex; }
.dev-err-item{ word-break: break-word; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="devErrorPanel"></div>
<div id="stage">
  <div id="overlay">
    <div id="hud">
      <div id="inv"></div>
      <button id="btnTempLight">✨ 临时点亮全局</button>
      <button id="btnShop">🛒</button>
      <button id="btnMap" aria-label="地图"></button>
      <button id="btnSet">⚙</button>
    </div>
    <div id="fanClub">✦ 欢迎加入粉丝团 ✦</div>
    <div id="streamerBadge"><span class="dot"></span>主播模式：开</div>
    <div id="toast"></div>
    <div id="sceneTitle"></div>
    <div id="dlgMask"></div>
    <div id="dlg"></div>
    <div id="choiceBox"></div>
    <div id="settings">
      <button class="close-x" id="btnCloseSet">✕</button>
      <div class="settings-body">
        <h3>设 置</h3>
        <div class="row"><span>提示</span><button class="highlight-btn" id="btnHighlight">🔍 高亮可交互</button></div>
        <div class="row"><span>帧率</span><div class="opts" data-key="fps"><button data-v="30">30</button><button data-v="45">45</button><button data-v="60">60</button></div></div>
        <div class="row"><span>文字速度</span><div class="opts" data-key="textSpeed"><button data-v="slow">慢</button><button data-v="normal">中</button><button data-v="fast">快</button><button data-v="instant">瞬显</button></div></div>
        <div class="row"><span>文字大小</span><div class="opts" data-key="fontSize"><button data-v="17">小</button><button data-v="19">中</button><button data-v="22">大</button></div></div>
        <div class="row"><span>主播模式</span><div class="opts" data-key="streamerMode"><button data-v="off">关</button><button data-v="on">开</button></div></div>
        <div class="row"><span>游戏进度</span><button class="danger" id="btnReset">清除所有进度</button></div>
      </div>
    </div>
    <div id="shopPanel">
      <button class="close-x" id="btnCloseShop">✕</button>
      <div class="shop-head"><h3>补 给 站</h3></div>
      <div class="shop-scroll">
        <div class="shop-grid">
          <div class="shop-item" data-amount="6"><div class="si-amount">6</div><div class="si-price">¥ 6</div></div>
          <div class="shop-item" data-amount="30"><div class="si-amount">30</div><div class="si-price">¥ 30</div></div>
          <div class="shop-item" data-amount="68"><div class="si-amount">68</div><div class="si-price">¥ 68</div></div>
        </div>
      </div>
    </div>
    <div id="mapPanel"><canvas id="mapCanvas"></canvas><button id="btnCloseMap" aria-label="关闭地图">✕</button></div>
    <div id="warnMask"><div id="warnBox"><h4>警 告</h4><p>即将清除所有进度。此操作无法撤销。</p><div class="warn-btns"><button id="warnCancel">取 消</button><button id="warnConfirm">确 认</button></div></div></div>
    <div id="ending"><h2>雨 停 了</h2><p>第二天早上，红屋顶的房子门口，多了一只浣熊。<br>它在晒太阳。</p><button id="btnAgain">再 走 一 次</button></div>
    <div id="bloodEnding"><h2>雨 还 在 下</h2><p>它想起来了。全部。</p><button id="btnBloodAgain">结 束 了 …</button></div>
    <div id="forgetEnding"><h2>一 个 人 的 早 晨</h2><p>第二天早上，街上没有人。</p><button id="btnForgetAgain">再 走 一 次</button></div>
  </div>
  <div id="loadingScreen"><div class="loading-box"><div class="loading-scene-name" id="loadingName">雨 夜 归 途</div><div class="loading-bar"><div class="loading-bar-fill" id="loadingFill"></div></div><div class="loading-row"><span class="loading-tip" id="loadingTip">正在准备……</span><span class="loading-pct" id="loadingPct">0%</span></div><button class="loading-retry" id="loadingRetry">重 试</button></div></div>
</div>

<script>
(function(){
  var MAX_ITEMS = 200;
  var panel = null;
  function ensurePanel(){ if(!panel) panel = document.getElementById('devErrorPanel'); return panel; }
  function stamp(){ var d = new Date(); function p(n){ return String(n).padStart(2,'0'); } return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  function push(level, src, msg){
    var el = ensurePanel(); if(!el) return; el.classList.add('show');
    var raw = String(msg);
    var display = raw.replace(/[（(][^）)]*[）)]/g, '').replace(/\s{2,}/g, ' ').trim(); if(!display) display = raw;
    var item = document.createElement('div'); item.className = 'dev-err-item';
    item.innerHTML = `<span style="color:#ff8080;margin-right:4px;">[${level==='warn'?'WARN':'ERR'} ${src||'?'}]</span><span class="msg"></span><span style="color:rgba(255,140,140,0.65);font-size:8.5px;margin-left:4px;">${stamp()}</span>`;
    var msgEl = item.querySelector('.msg'); if(msgEl) msgEl.textContent = display;
    el.appendChild(item);
    while(el.children.length > MAX_ITEMS) el.removeChild(el.firstChild);
    while(el.scrollHeight > el.clientHeight && el.children.length > 1) el.removeChild(el.firstChild);
    try{ if(level === 'warn') console.warn('[DEV_WARN]', src, raw); else console.error('[DEV_ERR]', src, raw); }catch(e){}
  }
  window.__DEV_ERROR__ = function(msg, src){ push('error', src || '?', msg); };
  window.__DEV_WARN__  = function(msg, src){ push('warn',  src || '?', msg); };
  window.addEventListener('error', function(ev){ if(ev && ev.message) push('error', 'JS', ev.message); else if(ev && ev.target) push('error', 'RES', '资源加载失败'); }, true);
  window.addEventListener('unhandledrejection', function(ev){ push('error', 'PROMISE', ev.reason ? (ev.reason.stack || ev.reason.message || String(ev.reason)) : '未知'); });
  window.addEventListener('message', function(e){ var d = e.data; if(!d || !d.type) return; if(d.type === 'devError') push('error', d.source || 'IFRAME', d.message || '?'); else if(d.type === 'devWarn') push('warn', d.source || 'IFRAME', d.message || '?'); });
})();
</script>

<script src="map.js"></script>
<script src="game.js"></script>

<script>
window.addEventListener('message', function(e) {
  var d = e.data; if (!d || !d.type) return;
  if (d.type === 'triggerHalloween') document.body.classList.add('halloween-mode');
  if (d.type === 'triggerHalloweenOff') document.body.classList.remove('halloween-mode');
});
</script>

<script>
/* 商店、地图、新手引导等原有逻辑保留 */
(function(){
'use strict';
var shopPanel = document.getElementById('shopPanel'); var btnShop = document.getElementById('btnShop'); var btnClose = document.getElementById('btnCloseShop');
if(shopPanel && btnShop){ btnShop.addEventListener('click', function(e){ e.stopPropagation(); shopPanel.classList.add('show'); }); btnClose.addEventListener('click', function(e){ e.stopPropagation(); shopPanel.classList.remove('show'); }); }
var btn = document.getElementById('btnMap'); if(btn){ btn.addEventListener('click', function(e){ e.stopPropagation(); if(typeof RaccoonMap !== 'undefined'){ if(RaccoonMap.isOpen()) RaccoonMap.close(); else RaccoonMap.open(); } }); }
})();
</script>
</body>
</html>
