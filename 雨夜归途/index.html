<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04070b">
<title>雨夜归途 · 开始</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#04070b;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #titleStage{position:relative;overflow:hidden;background:#04070b;
    box-shadow:0 0 120px rgba(0,0,0,1);}
  canvas{display:block;width:100%;height:100%;}
  #titleContent{position:absolute;left:0;top:0;width:960px;height:540px;
    transform-origin:0 0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;}
  #titleContent > *{pointer-events:auto;}

  /* ★ 主标题 */
  #titleContent h1{margin:0;font-size:66px;letter-spacing:26px;
    color:#f2e6cb;font-weight:600;padding-left:26px;
    text-shadow:0 0 50px rgba(255,196,110,.5),0 6px 26px rgba(0,0,0,.95);
    animation:glow 4.5s ease-in-out infinite;}
  @keyframes glow{
    0%,100%{text-shadow:0 0 44px rgba(255,196,110,.32),0 6px 26px rgba(0,0,0,.95);}
    50%{text-shadow:0 0 78px rgba(255,206,130,.65),0 6px 26px rgba(0,0,0,.95);}
  }
  #titleContent .sub{margin:12px 0 46px;font-size:15px;letter-spacing:10px;
    color:#8ea3b8;padding-left:10px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);}

  /* ★ 按钮 */
  #titleContent .btns{display:flex;gap:26px;margin-bottom:40px;}
  #titleContent button{padding:15px 46px;font-size:17px;letter-spacing:6px;
    cursor:pointer;color:#e9dcc0;
    background:linear-gradient(180deg,rgba(38,55,76,.94),rgba(14,22,34,.96));
    border:1px solid rgba(200,170,110,.4);border-radius:12px;
    transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;
    font-family:inherit;
    box-shadow:
      0 8px 26px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.06);}
  #titleContent button:hover:not(:disabled){
    background:linear-gradient(180deg,rgba(66,96,132,.96),rgba(28,42,60,.96));
    border-color:rgba(255,214,140,.9);color:#ffe6b0;transform:translateY(-3px);
    box-shadow:
      0 16px 38px rgba(0,0,0,.75),
      0 0 30px rgba(255,190,110,.22),
      inset 0 1px 0 rgba(255,255,255,.10);}
  #titleContent button:active:not(:disabled){transform:scale(.96);}
  #titleContent button:disabled{opacity:.3;cursor:not-allowed;}
  #titleContent .tip{font-size:13px;letter-spacing:2.5px;color:#5a6f85;
    text-shadow:0 1px 6px rgba(0,0,0,.7);}

  /* ===========================================
     左下角 · 16+ 适龄提示
     =========================================== */
  #titleContent .age-badge{
    position:absolute;left:34px;bottom:30px;
    display:flex;align-items:center;gap:13px;
    pointer-events:none;z-index:10;
    animation:ageIn 1.1s cubic-bezier(.2,.9,.3,1) .55s both;}
  @keyframes ageIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  #titleContent .age-circle{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;letter-spacing:.5px;
    color:#ffffff;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 36% 28%,
      #9fe8af 0%, #5fc97c 45%, #3ea65f 78%, #2c7f47 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.92),
      0 0 0 3px rgba(95,201,124,.55),
      0 8px 22px rgba(60,180,100,.38),
      inset 0 -3px 8px rgba(0,0,0,.20),
      inset 0 3px 6px rgba(255,255,255,.32);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  #titleContent .age-label{
    display:flex;flex-direction:column;gap:3px;
    padding-left:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 5px rgba(0,0,0,.7);
  }
  #titleContent .age-label .cn{
    font-size:14.5px;letter-spacing:5px;
    color:#dbe9e0;font-weight:600;padding-left:2px;
  }
  #titleContent .age-label .en{
    font-size:9.5px;letter-spacing:2.2px;
    color:#87a99a;font-weight:500;padding-left:2px;
  }

  /* ===========================================
     右下角 · 感谢名单（五位主播）
     =========================================== */
  #titleContent .thanks{
    position:absolute;right:34px;bottom:30px;
    display:flex;flex-direction:column;
    gap:7px;
    padding:16px 24px 16px 20px;
    border-radius:18px;
    background:linear-gradient(180deg,
      rgba(44,32,16,.78),
      rgba(18,12,6,.88));
    border:1px solid rgba(255,214,140,.45);
    box-shadow:
      0 8px 26px rgba(0,0,0,.65),
      0 0 30px rgba(255,196,110,.18),
      inset 0 1px 0 rgba(255,255,255,.07);
    pointer-events:none;z-index:10;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    max-width:300px;
    animation:thanksIn 1.2s cubic-bezier(.2,.9,.3,1) .85s both;}
  @keyframes thanksIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  #titleContent .thanks .label{
    font-size:17px;letter-spacing:6px;
    color:#ffe6a8;
    font-weight:700;
    text-align:center;
    padding-left:6px;padding-bottom:5px;
    border-bottom:1px solid rgba(255,214,140,.28);
    margin-bottom:6px;
    text-shadow:
      0 0 14px rgba(255,200,110,.45),
      0 1px 2px rgba(0,0,0,.85);}
  #titleContent .thanks .row{
    display:flex;align-items:center;
    gap:9px;
    padding:2px 0;}
  #titleContent .thanks .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#ffd98f,#c93a3a 75%,#8a1a1a);
    box-shadow:
      0 0 9px rgba(255,90,90,.9),
      0 0 16px rgba(255,120,120,.5);
    animation:liveDot 1.5s ease-in-out infinite;}
  @keyframes liveDot{
    0%,100%{opacity:.75;transform:scale(.92);}
    50%    {opacity:1;transform:scale(1.18);}
  }
  #titleContent .thanks .role{
    font-size:12px;letter-spacing:1.8px;
    color:rgba(200,180,140,.72);
    font-weight:500;}
  #titleContent .thanks .role .live{
    color:#ff9070;
    font-weight:700;
    text-shadow:0 0 9px rgba(255,120,90,.6);}
  #titleContent .thanks .name{
    font-size:15.5px;letter-spacing:1.5px;
    color:#ffe6a8;font-weight:700;
    text-shadow:
      0 0 14px rgba(255,200,110,.55),
      0 1px 2px rgba(0,0,0,.85);}

  /* ★ 水水_SSS 的专属小注 */
  #titleContent .thanks .msg{
    font-size:10.5px;
    letter-spacing:.8px;
    line-height:1.6;
    color:rgba(255,150,130,.9);
    padding-left:17px;
    padding-bottom:2px;
    padding-top:3px;
    font-style:italic;
    text-shadow:0 0 10px rgba(255,90,70,.4);
    max-width:250px;
    margin-top:-1px;
    border-top:1px dashed rgba(255,140,110,.22);
    margin-top:2px;}

  /* ===========================================
     底部居中 · 健康忠告
     =========================================== */
  #titleContent .health-tip{
    position:absolute;left:50%;bottom:22px;
    transform:translateX(-50%);
    display:flex;flex-direction:column;
    gap:1px;
    text-align:center;
    pointer-events:none;z-index:10;
    animation:healthIn 1.1s cubic-bezier(.2,.9,.3,1) .75s both;}
  @keyframes healthIn{
    from{opacity:0;transform:translate(-50%,14px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  #titleContent .health-tip p{
    font-size:9px;
    letter-spacing:1.2px;
    line-height:1.5;
    color:rgba(140,160,180,.58);
    font-weight:400;
    text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.6);
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="titleStage">
  <canvas id="titleCv"></canvas>
  <div id="titleContent">
    <h1>雨夜归途</h1>
    <p class="sub">一只浣熊的寻找</p>
    <div class="btns">
      <button id="btnNew">新 游 戏</button>
      <button id="btnCont">继续存档</button>
    </div>
    <p class="tip">点击场景中的物件进行探索 · 进度自动保存</p>

    <div class="age-badge">
      <div class="age-circle">16+</div>
      <div class="age-label">
        <span class="cn">适龄提示</span>
        <span class="en">AGE RATING</span>
      </div>
    </div>

    <!-- ★ 感谢名单（五位主播） -->
    <div class="thanks">
      <div class="label">感谢名单</div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">刘忠英</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">星奈_ovo</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">超级丫丫channel</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">融雪o_o</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">水水_SSS</span>
      </div>
      <!-- ★ 水水_SSS 的专属战绩 -->
      <div class="msg">第一个不打主线直接挑战血腥线的勇者</div>
    </div>

    <div class="health-tip">
      <p>抵制不良游戏，拒绝盗版游戏。</p>
      <p>注意自我保护，谨防受骗上当。</p>
      <p>适度游戏益脑，沉迷游戏伤身。</p>
      <p>合理安排时间，享受健康生活。</p>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('titleCv');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
const stage = document.getElementById('titleStage');
const content = document.getElementById('titleContent');

const SAVE_KEY = 'raccoon_rainy_night_v5';
const LAUNCH_KEY = 'raccoon_launch_mode';
const GAME_URL = 'index.html';

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  content.style.transform = 'scale(' + scale + ')';
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = '100%';
  cv.style.height = '100%';
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

const rain = [];
for(let i=0;i<120;i++){
  rain.push({
    x: Math.random()*W*1.4-140, y: Math.random()*H,
    len: 10 + Math.random()*20, sp: 600 + Math.random()*520
  });
}

function draw(t){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#05080f'); sky.addColorStop(0.5,'#0c1624'); sky.addColorStop(1,'#16202e');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(28,42,62,0.35)';
  ctx.beginPath(); ctx.ellipse(200,90,240,36,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(720,120,280,44,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(42,58,82,0.22)';
  ctx.beginPath(); ctx.ellipse(480,60,320,32,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#070c14';
  ctx.fillRect(0,220,140,H-220);
  ctx.fillRect(160,260,100,H-260);
  ctx.fillRect(280,200,120,H-200);
  ctx.fillRect(560,240,140,H-240);
  ctx.fillRect(840,210,120,H-210);

  const wins = [
    [30,250],[80,250],[30,320],[80,320],
    [190,290],[230,290],[190,360],[230,360],
    [310,230],[360,230],[310,300],[360,300],
    [590,270],[640,270],[590,340],[640,340],
    [870,240],[920,240],[870,310],[920,310]
  ];
  ctx.fillStyle = 'rgba(255,196,120,0.13)';
  for(let i=0;i<wins.length;i++) ctx.fillRect(wins[i][0], wins[i][1], 20, 28);

  const hx = 640, hy = 300;
  ctx.fillStyle = '#381c1c';
  ctx.beginPath();
  ctx.moveTo(hx-20, hy); ctx.lineTo(hx+50, hy-70); ctx.lineTo(hx+120, hy);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#121821'; ctx.fillRect(hx, hy, 100, 80);

  const flick = 0.7 + 0.3*Math.sin(t*2.1);
  ctx.fillStyle = `rgba(255,200,120,${0.75*flick})`;
  ctx.fillRect(hx+34, hy+24, 32, 40);

  const hg = ctx.createRadialGradient(hx+50, hy+44, 0, hx+50, hy+44, 180);
  hg.addColorStop(0, `rgba(255,190,110,${0.28*flick})`);
  hg.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = hg; ctx.fillRect(hx-130, hy-136, 360, 360);

  ctx.strokeStyle = `rgba(200,90,80,${0.5*flick})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hx-20, hy); ctx.lineTo(hx+50, hy-70); ctx.lineTo(hx+120, hy);
  ctx.stroke();

  const g = ctx.createLinearGradient(0, H-100, 0, H);
  g.addColorStop(0,'#0e1620'); g.addColorStop(1,'#05080c');
  ctx.fillStyle = g; ctx.fillRect(0, H-100, W, 100);

  ctx.save();
  ctx.beginPath();
  ctx.ellipse(480, H-30, 200, 24, 0, 0, Math.PI*2);
  const pg = ctx.createRadialGradient(480, H-30, 0, 480, H-30, 200);
  pg.addColorStop(0, `rgba(255,190,110,${0.14*flick})`);
  pg.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = pg; ctx.fill();
  ctx.restore();

  drawRaccoon(400, H-100, t);

  ctx.save();
  ctx.strokeStyle = 'rgba(168,205,240,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<rain.length;i++){
    const d = rain[i];
    d.y += d.sp * 0.016;
    d.x -= d.sp * 0.016 * 0.16;
    if(d.y > H+24){ d.y = -30 - Math.random()*140; d.x = Math.random()*W*1.4 - 140; }
    if(d.x < -70) d.x = W + 50;
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.len*0.16, d.y - d.len);
  }
  ctx.stroke();
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.34, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

function drawRaccoon(x, y, t){
  const breathe = Math.sin(t*1.4)*1.5;
  ctx.save();
  ctx.translate(x, y + breathe);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 8, 70, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#05080c';
  ctx.beginPath();
  ctx.moveTo(-40, -10);
  ctx.quadraticCurveTo(-100, -30, -86, -100);
  ctx.quadraticCurveTo(-72, -110, -60, -96);
  ctx.quadraticCurveTo(-70, -50, -30, -30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(30,36,48,0.9)'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-74, -76); ctx.lineTo(-64, -80);
  ctx.moveTo(-80, -58); ctx.lineTo(-70, -62);
  ctx.moveTo(-80, -40); ctx.lineTo(-70, -44);
  ctx.stroke();
  ctx.fillStyle = '#05080c';
  ctx.beginPath(); ctx.ellipse(0, -20, 52, 46, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-22, 0, 22, 14, 0, 0, Math.PI*2); ctx.fill();
  const headX = 34, headY = -78;
  ctx.beginPath(); ctx.ellipse(headX, headY, 30, 26, -0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(headX-16, headY-18); ctx.lineTo(headX-14, headY-40); ctx.lineTo(headX+4, headY-22);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(headX+8, headY-24); ctx.lineTo(headX+22, headY-42); ctx.lineTo(headX+26, headY-18);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(headX-8, -14, 14, 10, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `rgba(255,210,140,${0.65 + 0.2*Math.sin(t*1.8)})`;
  ctx.beginPath(); ctx.arc(headX+6, headY-4, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(headX+18, headY-8, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

let time = 0, last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;
  draw(time);
  requestAnimationFrame(loop);
}

const btnNew = document.getElementById('btnNew');
const btnCont = document.getElementById('btnCont');

(function checkSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
  }catch(e){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
})();

function goGame(mode){
  try{ localStorage.setItem(LAUNCH_KEY, mode); }catch(e){}
  location.replace(GAME_URL);
}

btnNew.addEventListener('click', () => {
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  goGame('new');
});
btnCont.addEventListener('click', () => {
  if(btnCont.disabled) return;
  goGame('continue');
});

resize();
last = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
