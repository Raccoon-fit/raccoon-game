<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04070b">
<title>雨夜归途 · 开始</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#04070b;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #titleStage{position:relative;overflow:hidden;background:#04070b;
    box-shadow:0 0 120px rgba(0,0,0,1);}
  #cv3d{position:absolute;left:0;top:0;width:100%;height:100%;display:block;background:#04070b;}
  #cvRain{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
    pointer-events:none;z-index:2;}
  #titleContent{position:absolute;left:0;top:0;width:960px;height:540px;
    transform-origin:0 0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;z-index:3;}

  /* 渐变遮罩 —— 让 HTML 文字更清晰 */
  #titleContent::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(4,7,11,0.30) 0%,
      rgba(4,7,11,0.62) 55%,
      rgba(4,7,11,0.88) 100%);
    pointer-events:none;z-index:-1;
    animation:veilIn 2s ease-out both;}
  @keyframes veilIn{from{opacity:0;}to{opacity:1;}}

  #titleContent > *{pointer-events:auto;}

  /* ===== 主标题 ===== */
  #titleContent h1{margin:0;font-size:66px;letter-spacing:26px;
    color:#f2e6cb;font-weight:600;padding-left:26px;
    text-shadow:0 0 50px rgba(255,196,110,.5),0 6px 26px rgba(0,0,0,.95);
    animation:glow 4.5s ease-in-out infinite;}
  @keyframes glow{
    0%,100%{text-shadow:0 0 44px rgba(255,196,110,.32),0 6px 26px rgba(0,0,0,.95);}
    50%{text-shadow:0 0 78px rgba(255,206,130,.65),0 6px 26px rgba(0,0,0,.95);}
  }
  #titleContent .sub{margin:12px 0 46px;font-size:15px;letter-spacing:10px;
    color:#8ea3b8;padding-left:10px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);}

  /* ===== 按钮 ===== */
  #titleContent .btns{display:flex;gap:26px;margin-bottom:40px;}
  #titleContent button{padding:15px 46px;font-size:17px;letter-spacing:6px;
    cursor:pointer;color:#e9dcc0;
    background:linear-gradient(180deg,rgba(38,55,76,.94),rgba(14,22,34,.96));
    border:1px solid rgba(200,170,110,.4);border-radius:12px;
    transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;
    font-family:inherit;
    box-shadow:
      0 8px 26px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.06);}
  #titleContent button:hover:not(:disabled){
    background:linear-gradient(180deg,rgba(66,96,132,.96),rgba(28,42,60,.96));
    border-color:rgba(255,214,140,.9);color:#ffe6b0;transform:translateY(-3px);
    box-shadow:
      0 16px 38px rgba(0,0,0,.75),
      0 0 30px rgba(255,190,110,.22),
      inset 0 1px 0 rgba(255,255,255,.10);}
  #titleContent button:active:not(:disabled){transform:scale(.96);}
  #titleContent button:disabled{opacity:.3;cursor:not-allowed;}
  #titleContent .tip{font-size:13px;letter-spacing:2.5px;color:#5a6f85;
    text-shadow:0 1px 6px rgba(0,0,0,.7);}

  /* ===== 左下角 · 16+ 适龄提示 ===== */
  #titleContent .age-badge{
    position:absolute;left:34px;bottom:30px;
    display:flex;align-items:center;gap:13px;
    pointer-events:none;z-index:10;
    animation:ageIn 1.1s cubic-bezier(.2,.9,.3,1) .55s both;}
  @keyframes ageIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  #titleContent .age-circle{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;letter-spacing:.5px;
    color:#ffffff;
    background:radial-gradient(circle at 36% 28%,
      #9fe8af 0%, #5fc97c 45%, #3ea65f 78%, #2c7f47 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.92),
      0 0 0 3px rgba(95,201,124,.55),
      0 8px 22px rgba(60,180,100,.38),
      inset 0 -3px 8px rgba(0,0,0,.20),
      inset 0 3px 6px rgba(255,255,255,.32);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  #titleContent .age-label{
    display:flex;flex-direction:column;gap:3px;
    padding-left:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 5px rgba(0,0,0,.7);
  }
  #titleContent .age-label .cn{
    font-size:14.5px;letter-spacing:5px;
    color:#dbe9e0;font-weight:600;padding-left:2px;
  }
  #titleContent .age-label .en{
    font-size:9.5px;letter-spacing:2.2px;
    color:#87a99a;font-weight:500;padding-left:2px;
  }

  /* ===== 右下角 · 感谢名单 ===== */
  #titleContent .thanks{
    position:absolute;right:34px;bottom:30px;
    display:flex;flex-direction:column;
    gap:7px;
    padding:16px 24px 16px 20px;
    border-radius:18px;
    background:linear-gradient(180deg,
      rgba(44,32,16,.78),
      rgba(18,12,6,.88));
    border:1px solid rgba(255,214,140,.45);
    box-shadow:
      0 8px 26px rgba(0,0,0,.65),
      0 0 30px rgba(255,196,110,.18),
      inset 0 1px 0 rgba(255,255,255,.07);
    pointer-events:none;z-index:10;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    max-width:300px;
    animation:thanksIn 1.2s cubic-bezier(.2,.9,.3,1) .85s both;}
  @keyframes thanksIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  #titleContent .thanks .label{
    font-size:17px;letter-spacing:6px;
    color:#ffe6a8;font-weight:700;text-align:center;
    padding-left:6px;padding-bottom:5px;
    border-bottom:1px solid rgba(255,214,140,.28);
    margin-bottom:6px;
    text-shadow:
      0 0 14px rgba(255,200,110,.45),
      0 1px 2px rgba(0,0,0,.85);}
  #titleContent .thanks .row{
    display:flex;align-items:center;gap:9px;padding:2px 0;}
  #titleContent .thanks .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#ffd98f,#c93a3a 75%,#8a1a1a);
    box-shadow:
      0 0 9px rgba(255,90,90,.9),
      0 0 16px rgba(255,120,120,.5);
    animation:liveDot 1.5s ease-in-out infinite;}
  @keyframes liveDot{
    0%,100%{opacity:.75;transform:scale(.92);}
    50%    {opacity:1;transform:scale(1.18);}
  }
  #titleContent .thanks .role{
    font-size:12px;letter-spacing:1.8px;
    color:rgba(200,180,140,.72);
    font-weight:500;}
  #titleContent .thanks .role .live{
    color:#ff9070;font-weight:700;
    text-shadow:0 0 9px rgba(255,120,90,.6);}
  #titleContent .thanks .name{
    font-size:15.5px;letter-spacing:1.5px;
    color:#ffe6a8;font-weight:700;
    text-shadow:
      0 0 14px rgba(255,200,110,.55),
      0 1px 2px rgba(0,0,0,.85);}
  #titleContent .thanks .msg{
    font-size:10.5px;letter-spacing:.8px;line-height:1.6;
    color:rgba(255,150,130,.9);
    padding-left:17px;padding-bottom:2px;padding-top:3px;
    font-style:italic;
    text-shadow:0 0 10px rgba(255,90,70,.4);
    max-width:250px;margin-top:2px;
    border-top:1px dashed rgba(255,140,110,.22);}

  /* ===== 底部居中 · 健康忠告 ===== */
  #titleContent .health-tip{
    position:absolute;left:50%;bottom:22px;
    transform:translateX(-50%);
    display:flex;flex-direction:column;gap:1px;
    text-align:center;pointer-events:none;z-index:10;
    animation:healthIn 1.1s cubic-bezier(.2,.9,.3,1) .75s both;}
  @keyframes healthIn{
    from{opacity:0;transform:translate(-50%,14px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  #titleContent .health-tip p{
    font-size:9px;letter-spacing:1.2px;line-height:1.5;
    color:rgba(140,160,180,.58);
    text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.6);
    white-space:nowrap;
  }
</style>

<script src="assets3d/r3d.js"></script>
<script>
(function(){
'use strict';

const W = 960, H = 540;

const stage    = document.getElementById('titleStage');
const content  = document.getElementById('titleContent');
const cv3d     = document.getElementById('cv3d');
const cvRain   = document.getElementById('cvRain');
const rainCtx  = cvRain.getContext('2d');

const SAVE_KEY = 'raccoon_rainy_night_v5';
const LAUNCH_KEY = 'raccoon_launch_mode';
const GAME_URL = 'index1.html';

/* =========================================================
   纹理生成
   ========================================================= */
function shadeHex(hex, amt){
  const r = Math.min(255, Math.max(0, parseInt(hex.slice(1,3),16) + amt));
  const g = Math.min(255, Math.max(0, parseInt(hex.slice(3,5),16) + amt));
  const b = Math.min(255, Math.max(0, parseInt(hex.slice(5,7),16) + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function makeWallTex(){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  const base = '#1a1216';
  const grad = x.createLinearGradient(0, 0, 0, S);
  grad.addColorStop(0, base);
  grad.addColorStop(1, shadeHex(base, -18));
  x.fillStyle = grad;
  x.fillRect(0, 0, S, S);

  const bw = 32, bh = 16;
  for(let row = 0; row * bh < S; row++){
    const y = row * bh;
    const off = (row % 2) ? 0 : bw/2;
    for(let cx = off - bw; cx < S; cx += bw){
      const bx = cx + 1, by = y + 1;
      const seed = (row * 31 + cx * 17) % 100;
      const tint = (seed - 50) / 400;
      x.fillStyle = shadeHex(base, tint * 50);
      x.fillRect(bx, by, bw - 2, bh - 2);
      x.fillStyle = 'rgba(255,255,255,0.04)';
      x.fillRect(bx, by, bw - 2, 1);
      x.fillStyle = 'rgba(0,0,0,0.35)';
      x.fillRect(bx, by + bh - 3, bw - 2, 1);
    }
  }
  // 污渍
  for(let i = 0; i < 18; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 4 + Math.random() * 14;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(0,0,0,0.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // 湿痕
  x.fillStyle = 'rgba(120,160,200,0.05)';
  for(let i = 0; i < 4; i++){
    x.fillRect(0, 8 + i * 30, S, 1);
  }
  return c;
}

function makeFloorTex(){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  const base = '#0a0c10';
  x.fillStyle = base;
  x.fillRect(0, 0, S, S);

  const t = 32;
  x.strokeStyle = 'rgba(0,0,0,0.6)';
  x.lineWidth = 1;
  for(let i = 0; i <= S; i += t){
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, S); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke();
  }
  for(let y = 0; y < S; y += t){
    for(let x0 = 0; x0 < S; x0 += t){
      const seed = (x0 * 7 + y * 13) % 100;
      const tint = (seed - 50) / 700;
      x.fillStyle = shadeHex(base, tint * 40);
      x.fillRect(x0 + 1, y + 1, t - 2, t - 2);
    }
  }
  // 湿反光
  for(let i = 0; i < 6; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 6 + Math.random() * 16;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(120,180,220,0.10)');
    g.addColorStop(1, 'rgba(120,180,220,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  return c;
}

function makeCeilTex(){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#030305';
  x.fillRect(0, 0, S, S);
  for(let i = 0; i < 20; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 8 + Math.random() * 22;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(0,0,0,0.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  return c;
}

/* =========================================================
   场景构建
   ========================================================= */
const grid = [
  '11111111111111111111',
  '10000000000000000001',
  '10000000000000000001',
  '10000000000000000001',
  '10000000000000000001',
  '10000000000000000001',
  '10000000000000000001',
  '10000000000000000001',
  '11111111111111111111'
];

const props = [
  /* 路灯 1 —— 左前方 */
  { shape:'cyl', x:4.2, y:0, z:5.5, w:0.14, h:2.7, color:'#12100c' },
  { shape:'box', x:4.2, y:2.7, z:5.5, w:0.42, h:0.16, d:0.42, color:'#2a1d10' },
  { shape:'box', x:4.2, y:2.62, z:5.5, w:0.3, h:0.06, d:0.3, color:'#ffd27a' },

  /* 路灯 2 —— 中景右侧 */
  { shape:'cyl', x:15.8, y:0, z:4.0, w:0.14, h:2.7, color:'#12100c' },
  { shape:'box', x:15.8, y:2.7, z:4.0, w:0.42, h:0.16, d:0.42, color:'#2a1d10' },
  { shape:'box', x:15.8, y:2.62, z:4.0, w:0.3, h:0.06, d:0.3, color:'#ffd27a' },

  /* 路灯 3 —— 远景左侧 */
  { shape:'cyl', x:4.2, y:0, z:2.2, w:0.14, h:2.7, color:'#12100c' },
  { shape:'box', x:4.2, y:2.7, z:2.2, w:0.42, h:0.16, d:0.42, color:'#2a1d10' },
  { shape:'box', x:4.2, y:2.62, z:2.2, w:0.3, h:0.06, d:0.3, color:'#ffd27a' },

  /* 红屋顶房子 —— 巷子尽头 */
  { shape:'box', x:10, y:0, z:1.4, w:5.6, h:3.0, d:3.2, color:'#3a2820' },
  { shape:'box', x:10, y:3.0, z:1.4, w:6.0, h:0.34, d:3.6, color:'#7a2818' },
  { shape:'box', x:10, y:3.34, z:1.4, w:5.6, h:0.24, d:3.2, color:'#a04030' },
  /* 窗户光 */
  { shape:'box', x:8.2, y:1.4, z:-0.22, w:1.0, h:1.4, d:0.1, color:'#ffd680' },
  { shape:'box', x:10,  y:1.4, z:-0.22, w:1.0, h:1.4, d:0.1, color:'#ffbb60' },
  { shape:'box', x:11.8, y:1.4, z:-0.22, w:1.0, h:1.4, d:0.1, color:'#ffd680' },
  /* 门 */
  { shape:'box', x:10, y:0, z:-0.22, w:1.4, h:2.0, d:0.08, color:'#8a3a20' },

  /* 水坑 */
  { shape:'low', x:6.5, y:0.011, z:5.6, w:1.6, h:0.01, color:'#1a2535' },
  { shape:'low', x:13.5, y:0.011, z:5.0, w:1.3, h:0.01, color:'#1a2535' },
  { shape:'low', x:9.5, y:0.011, z:3.6, w:1.1, h:0.01, color:'#1a2535' },
  { shape:'low', x:5.0, y:0.011, z:6.8, w:0.9, h:0.01, color:'#1a2535' },
  { shape:'low', x:15.0, y:0.011, z:6.5, w:1.0, h:0.01, color:'#1a2535' },

  /* 杂物 —— 箱子 */
  { shape:'box', x:2.6, y:0, z:6.6, w:0.85, h:0.75, d:0.85, color:'#1e1812' },
  { shape:'box', x:3.1, y:0.75, z:6.4, w:0.5, h:0.4, d:0.5, color:'#241b14' },
  /* 杂物 —— 桶 */
  { shape:'cyl', x:17.2, y:0, z:6.8, w:0.7, h:0.9, color:'#161210' },
  /* 杂物 —— 木板 */
  { shape:'box', x:16.5, y:0, z:2.5, w:1.4, h:0.08, d:0.25, color:'#2a2018' },

  /* 天花板横梁（加深巷子感） */
  { shape:'box', x:10, y:3.15, z:1.0, w:19.0, h:0.1, d:0.2, color:'#0a0808' },
  { shape:'box', x:10, y:3.15, z:3.0, w:19.0, h:0.1, d:0.2, color:'#0a0808' },
  { shape:'box', x:10, y:3.15, z:5.0, w:19.0, h:0.1, d:0.2, color:'#0a0808' }
];

/* =========================================================
   初始化
   ========================================================= */
let renderer = null;
let rainDrops = [];
let started = false;

function init3D(){
  try{
    renderer = R3D.create(cv3d);
  }catch(e){
    console.error('[3D]', e);
    cv3d.style.display = 'none';
    return false;
  }

  renderer.buildWorld({
    grid: grid,
    wallHeight: 3.4,
    wallTexSource:  makeWallTex(),
    floorTexSource: makeFloorTex(),
    ceilTexSource:  makeCeilTex()
  });
  renderer.buildProps(props);

  return true;
}

/* =========================================================
   雨
   ========================================================= */
function initRain(){
  rainDrops = [];
  for(let i = 0; i < 130; i++){
    rainDrops.push({
      x: Math.random() * (W * 1.4) - 140,
      y: Math.random() * H,
      len: 14 + Math.random() * 22,
      sp: 640 + Math.random() * 520,
      a: 0.10 + Math.random() * 0.14
    });
  }
}

function drawRain(dt){
  rainCtx.clearRect(0, 0, W, H);

  rainCtx.save();
  rainCtx.strokeStyle = 'rgba(180,210,240,0.9)';
  rainCtx.lineWidth = 1;
  rainCtx.beginPath();
  for(let i = 0; i < rainDrops.length; i++){
    const d = rainDrops[i];
    d.y += d.sp * dt;
    d.x -= d.sp * dt * 0.16;
    if(d.y > H + 24){
      d.y = -30 - Math.random() * 140;
      d.x = Math.random() * W * 1.4 - 140;
    }
    if(d.x < -70) d.x = W + 50;

    rainCtx.globalAlpha = d.a;
    rainCtx.moveTo(d.x, d.y);
    rainCtx.lineTo(d.x - d.len * 0.16, d.y - d.len);
  }
  rainCtx.stroke();
  rainCtx.restore();

  /* 偶尔的涟漪亮点 */
  rainCtx.save();
  rainCtx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < 4; i++){
    const t = (performance.now() * 0.0004 + i * 0.25) % 1;
    const x = ((i * 331 + 77) % W);
    const y = H - 50 - ((i * 51) % 60);
    const a = (1 - t) * 0.15;
    rainCtx.strokeStyle = 'rgba(180,210,240,' + a + ')';
    rainCtx.lineWidth = 1;
    rainCtx.beginPath();
    rainCtx.ellipse(x, y, 4 + t * 18, (4 + t * 18) * 0.32, 0, 0, Math.PI * 2);
    rainCtx.stroke();
  }
  rainCtx.restore();
}

/* =========================================================
   主循环
   ========================================================= */
const cam = {
  x: 10,
  y: 1.4,
  z: 6.8,
  baseYaw: -Math.PI / 2,
  yaw: -Math.PI / 2,
  basePitch: -0.02,
  pitch: -0.02,
  fov: Math.PI / 3.0,
  near: 0.06,
  far: 60
};

const lightsTemplate = [
  /* 主光 —— 暖黄 */
  { x: 10, y: 2.4, z: 4.0, color: [1.35, 0.95, 0.55] },
  /* 副光 —— 暗红 */
  { x: 4.2, y: 2.5, z: 5.5, color: [0.75, 0.30, 0.18] },
  /* 远端光 —— 冷蓝 */
  { x: 16, y: 2.5, z: 2.5, color: [0.28, 0.34, 0.55] }
];

const ambientBase = [0.045, 0.055, 0.095];
const fogColor    = [0.012, 0.020, 0.038];
const fogNear     = 4.0;
const fogFar      = 17.0;

let time = 0;
let lastFrame = performance.now();
let running = true;

function loop(now){
  if(!running) return;
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  time += dt;

  /* 相机呼吸 */
  const breath = Math.sin(time * 0.85);
  const sway   = Math.sin(time * 0.42) * 0.022;
  const bob    = Math.sin(time * 0.62) * 0.35;

  cam.yaw   = cam.baseYaw   + sway;
  cam.pitch = cam.basePitch + Math.sin(time * 0.55) * 0.014;
  cam.y     = 1.4 + Math.sin(time * 1.1) * 0.018;
  cam.z     = 6.8 - (Math.sin(time * 0.15) * 0.5 + 0.5) * 0.35;

  if(renderer){
    renderer.setCamera({
      x: cam.x, y: cam.y, z: cam.z,
      yaw: cam.yaw, pitch: cam.pitch,
      fov: cam.fov, near: cam.near, far: cam.far
    });

    /* 光源轻微呼吸 */
    const lights = lightsTemplate.map(function(l, i){
      const k = 0.85 + 0.15 * Math.sin(time * (1.5 + i * 0.3) + i);
      const flick = (i === 1) ? (0.75 + 0.25 * Math.sin(time * 12) * Math.random()) : 1;
      return {
        x: l.x, y: l.y, z: l.z,
        color: [l.color[0] * k * flick, l.color[1] * k * flick, l.color[2] * k * flick]
      };
    });
    renderer.setLights(lights);

    renderer.setAmbient(ambientBase);
    renderer.setFog({
      color: fogColor,
      near: fogNear,
      far: fogFar
    });

    renderer.render();
  }

  drawRain(dt);
  requestAnimationFrame(loop);
}

/* =========================================================
   resize
   ========================================================= */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale);
  const h = Math.round(H * scale);
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  content.style.transform = 'scale(' + scale + ')';

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

  if(renderer){
    renderer.resize(w, h, dpr);
  }
  cv3d.style.width  = '100%';
  cv3d.style.height = '100%';

  cvRain.width  = Math.round(w * dpr);
  cvRain.height = Math.round(h * dpr);
  cvRain.style.width  = '100%';
  cvRain.style.height = '100%';
  rainCtx.setTransform(cvRain.width / W, 0, 0, cvRain.height / H, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

/* =========================================================
   存档检测 / 按钮
   ========================================================= */
const btnNew  = document.getElementById('btnNew');
const btnCont = document.getElementById('btnCont');

(function checkSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
  }catch(e){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
})();

function goGame(mode){
  try{ localStorage.setItem(LAUNCH_KEY, mode); }catch(e){}
  location.replace(GAME_URL);
}

btnNew.addEventListener('click', function(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  goGame('new');
});
btnCont.addEventListener('click', function(){
  if(btnCont.disabled) return;
  goGame('continue');
});

/* =========================================================
   启动
   ========================================================= */
function start(){
  const ok = init3D();
  initRain();
  resize();
  if(!ok){
    cv3d.style.background = 'radial-gradient(ellipse at center, #0c1624 0%, #04070b 100%)';
  }
  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}

})();
</script>
