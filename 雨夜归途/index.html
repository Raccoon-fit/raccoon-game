<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04070b">
<title>雨夜归途 · 开始</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#04070b;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #titleStage{position:relative;overflow:hidden;background:#04070b;
    box-shadow:0 0 120px rgba(0,0,0,1);}
  #cv3d{position:absolute;left:0;top:0;width:100%;height:100%;display:block;background:#04070b;}
  #cvFx{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
    pointer-events:none;z-index:2;}

  /* ============================================================
     UI 容器 —— 建立共享 3D 坐标系
     ============================================================ */
  #titleContent{
    position:absolute;left:0;top:0;width:960px;height:540px;
    transform-origin:0 0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:3;
    perspective:1800px;
    perspective-origin:50% 55%;
  }
  #titleContent::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(4,7,11,0.22) 0%,
      rgba(4,7,11,0.52) 55%,
      rgba(4,7,11,0.84) 100%);
    pointer-events:none;z-index:-1;
    animation:veilIn 2s ease-out both;}
  @keyframes veilIn{from{opacity:0;}to{opacity:1;}}
  #titleContent > *{pointer-events:auto;}

  /* ============================================================
     主标题 —— 3D 金属挤出
     ============================================================ */
  #titleContent h1{
    margin:0;
    font-size:68px;letter-spacing:26px;
    color:#f2e6cb;font-weight:600;
    padding-left:26px;
    text-shadow:
      0 1px 0 #8a6a3a,
      0 2px 0 #7a5a2a,
      0 3px 0 #6a4a1a,
      0 4px 0 #5a3a10,
      0 5px 0 #4a2a08,
      0 6px 0 #3a1a04,
      0 7px 0 #2a0e00,
      0 8px 0 #1a0600,
      0 10px 20px rgba(0,0,0,0.9),
      0 14px 32px rgba(0,0,0,0.6);
    transform:perspective(900px) rotateX(-4deg);
    transform-origin:center bottom;
    filter:drop-shadow(0 0 28px rgba(255,196,110,.5));
    animation:titleGlow 4.5s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 22px rgba(255,196,110,.38));}
    50%{filter:drop-shadow(0 0 52px rgba(255,206,130,.78));}
  }

  #titleContent .sub{
    margin:14px 0 48px;
    font-size:15px;letter-spacing:10px;
    color:#a0b6cc;
    padding-left:10px;
    text-shadow:
      0 1px 0 #2a3a4a,
      0 2px 0 #1a2a3a,
      0 3px 8px rgba(0,0,0,0.85),
      0 0 20px rgba(140,180,220,.3);
    transform:perspective(900px) rotateX(-3deg) translateZ(6px);
    transform-origin:center top;
  }

  /* ============================================================
     按钮 —— 3D 厚板
     ============================================================ */
  #titleContent .btns{
    display:flex;gap:30px;
    margin-bottom:42px;
    transform-style:preserve-3d;
    transform:perspective(1200px) rotateX(-2deg);
  }
  #titleContent button{
    position:relative;
    padding:16px 48px;
    font-size:17px;letter-spacing:6px;
    cursor:pointer;color:#e9dcc0;
    background:
      linear-gradient(180deg,
        rgba(58,78,104,.98) 0%,
        rgba(38,55,76,.98) 40%,
        rgba(14,22,34,.99) 100%);
    border:1px solid rgba(200,170,110,.45);
    border-radius:14px;
    font-family:inherit;
    transform:perspective(600px) rotateX(6deg);
    transform-origin:center top;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(0,0,0,.5),
      0 3px 0 #0f1a26,
      0 6px 0 #0a131c,
      0 9px 0 #060c12,
      0 12px 0 #03060a,
      0 16px 26px rgba(0,0,0,0.75),
      0 0 20px rgba(255,190,110,.08);
    transition:transform .14s ease, box-shadow .14s ease, background .25s ease, border-color .25s ease;
    will-change:transform;
  }
  #titleContent button::before{
    content:'';position:absolute;left:6px;right:6px;top:2px;height:45%;
    border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0));
    pointer-events:none;
  }
  #titleContent button:hover:not(:disabled){
    background:
      linear-gradient(180deg,
        rgba(96,130,168,.98) 0%,
        rgba(66,96,132,.98) 40%,
        rgba(28,42,60,.99) 100%);
    border-color:rgba(255,214,140,.95);
    color:#ffe6b0;
    transform:perspective(600px) rotateX(6deg) translateY(-4px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -1px 0 rgba(0,0,0,.5),
      0 3px 0 #16263a,
      0 6px 0 #0e1826,
      0 9px 0 #08101a,
      0 12px 0 #04080e,
      0 20px 34px rgba(0,0,0,0.8),
      0 0 34px rgba(255,190,110,.24);
  }
  #titleContent button:active:not(:disabled){
    transform:perspective(600px) rotateX(6deg) translateY(6px);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.5),
      inset 0 -1px 0 rgba(0,0,0,.3),
      0 1px 0 #0f1a26,
      0 2px 0 #0a131c,
      0 3px 0 #060c12,
      0 5px 8px rgba(0,0,0,0.6);
  }
  #titleContent button:disabled{
    opacity:.3;cursor:not-allowed;
    transform:perspective(600px) rotateX(6deg);
  }

  #titleContent .tip{
    font-size:13px;letter-spacing:2.5px;
    color:#66798c;
    text-shadow:
      0 1px 0 #1a2028,
      0 2px 6px rgba(0,0,0,0.9);
    transform:perspective(900px) rotateX(-3deg) translateZ(4px);
  }

  /* ============================================================
     16+ 适龄提示 —— 3D 徽章
     ============================================================ */
  #titleContent .age-badge{
    position:absolute;left:34px;bottom:30px;
    display:flex;align-items:center;gap:13px;
    pointer-events:none;z-index:10;
    transform:perspective(800px) rotateX(-2deg) rotateY(6deg);
    transform-origin:left bottom;
    animation:ageIn 1.1s cubic-bezier(.2,.9,.3,1) .55s both;}
  @keyframes ageIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  #titleContent .age-circle{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;letter-spacing:.5px;
    color:#ffffff;
    background:radial-gradient(circle at 36% 28%,
      #b0f0c2 0%, #5fc97c 45%, #3ea65f 78%, #1a5a2a 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.95),
      0 0 0 3px rgba(95,201,124,.6),
      0 2px 0 #0e2a18,
      0 4px 0 #081a10,
      0 6px 0 #040e08,
      0 10px 20px rgba(0,0,0,0.7),
      0 0 30px rgba(95,201,124,.35),
      inset 0 -4px 8px rgba(0,0,0,.28),
      inset 0 4px 6px rgba(255,255,255,.4);
    text-shadow:
      0 1px 0 rgba(0,0,0,0.5),
      0 -1px 1px rgba(255,255,255,0.4);
  }
  #titleContent .age-label{
    display:flex;flex-direction:column;gap:3px;
    padding-left:2px;
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 8px rgba(0,0,0,0.9);
  }
  #titleContent .age-label .cn{
    font-size:14.5px;letter-spacing:5px;
    color:#dbe9e0;font-weight:600;padding-left:2px;
  }
  #titleContent .age-label .en{
    font-size:9.5px;letter-spacing:2.2px;
    color:#87a99a;font-weight:500;padding-left:2px;
  }

  /* ============================================================
     感谢名单 —— 3D 悬浮卡
     ============================================================ */
  #titleContent .thanks{
    position:absolute;right:34px;bottom:30px;
    display:flex;flex-direction:column;
    gap:7px;
    padding:16px 24px 16px 20px;
    border-radius:18px;
    background:linear-gradient(180deg,
      rgba(56,42,22,.88) 0%,
      rgba(32,22,12,.92) 60%,
      rgba(18,12,6,.94) 100%);
    border:1px solid rgba(255,214,140,.5);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 -1px 0 rgba(0,0,0,.6),
      0 2px 0 #1a1208,
      0 4px 0 #100a04,
      0 6px 0 #080400,
      0 12px 26px rgba(0,0,0,0.75),
      0 0 34px rgba(255,196,110,.22);
    pointer-events:none;z-index:10;
    max-width:300px;
    transform:perspective(1400px) rotateY(-6deg) rotateX(4deg) translateZ(30px);
    transform-origin:right center;
    animation:thanksIn 1.2s cubic-bezier(.2,.9,.3,1) .85s both;}
  @keyframes thanksIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  #titleContent .thanks .label{
    font-size:17px;letter-spacing:6px;
    color:#ffe6a8;font-weight:700;text-align:center;
    padding-left:6px;padding-bottom:5px;
    border-bottom:1px solid rgba(255,214,140,.28);
    margin-bottom:6px;
    text-shadow:
      0 1px 0 #6a4a1a,
      0 2px 0 #3a2a10,
      0 3px 6px rgba(0,0,0,0.9),
      0 0 16px rgba(255,200,110,.5);}
  #titleContent .thanks .row{
    display:flex;align-items:center;gap:9px;padding:2px 0;}
  #titleContent .thanks .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#ffd98f,#c93a3a 75%,#6a0a0a);
    box-shadow:
      0 0 9px rgba(255,90,90,.95),
      0 0 16px rgba(255,120,120,.55),
      0 2px 4px rgba(0,0,0,0.6);
    animation:liveDot 1.5s ease-in-out infinite;}
  @keyframes liveDot{
    0%,100%{opacity:.75;transform:scale(.92);}
    50%    {opacity:1;transform:scale(1.18);}
  }
  #titleContent .thanks .role{
    font-size:12px;letter-spacing:1.8px;
    color:rgba(200,180,140,.72);
    font-weight:500;}
  #titleContent .thanks .role .live{
    color:#ff9070;font-weight:700;
    text-shadow:
      0 0 9px rgba(255,120,90,.65),
      0 1px 0 rgba(80,20,10,0.9);}
  #titleContent .thanks .name{
    font-size:15.5px;letter-spacing:1.5px;
    color:#ffe6a8;font-weight:700;
    text-shadow:
      0 1px 0 #6a4a1a,
      0 2px 0 #3a2a10,
      0 3px 6px rgba(0,0,0,0.9),
      0 0 14px rgba(255,200,110,.6);}
  #titleContent .thanks .msg{
    font-size:10.5px;letter-spacing:.8px;line-height:1.6;
    color:rgba(255,150,130,.92);
    padding-left:17px;padding-bottom:2px;padding-top:3px;
    font-style:italic;
    text-shadow:
      0 1px 0 rgba(50,10,5,0.8),
      0 2px 6px rgba(0,0,0,0.7),
      0 0 12px rgba(255,90,70,.45);
    max-width:250px;margin-top:2px;
    border-top:1px dashed rgba(255,140,110,.22);}

  /* ============================================================
     底部健康忠告
     ============================================================ */
  #titleContent .health-tip{
    position:absolute;left:50%;bottom:22px;
    transform:translateX(-50%) perspective(1000px) rotateX(-4deg);
    transform-origin:center bottom;
    display:flex;flex-direction:column;gap:1px;
    text-align:center;pointer-events:none;z-index:10;
    animation:healthIn 1.1s cubic-bezier(.2,.9,.3,1) .75s both;}
  @keyframes healthIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  #titleContent .health-tip p{
    font-size:9px;letter-spacing:1.2px;line-height:1.5;
    color:rgba(150,170,190,.62);
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 4px rgba(0,0,0,0.9);
    white-space:nowrap;}

  /* ============================================================
     退出全屏按钮（文字版）
     ============================================================ */
  #btnExitFs{
    position:fixed;top:14px;right:14px;z-index:60;
    height:42px;padding:0 20px;
    border-radius:13px;
    display:none;align-items:center;justify-content:center;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    letter-spacing:3px;
    font-weight:600;
    white-space:nowrap;
    color:#d8c8a8;
    background:linear-gradient(180deg,
      rgba(58,78,104,.94) 0%,
      rgba(38,55,76,.96) 40%,
      rgba(14,22,34,.98) 100%);
    border:1px solid rgba(200,170,110,.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(0,0,0,.5),
      0 2px 0 #0f1a26,
      0 4px 0 #0a131c,
      0 8px 18px rgba(0,0,0,0.7),
      0 0 18px rgba(255,190,110,.10);
    transition:transform .14s ease, box-shadow .14s ease,
               background .22s ease, border-color .22s ease, color .22s ease;
    -webkit-user-select:none;user-select:none;
  }
  #btnExitFs.visible{display:flex;}
  #btnExitFs:hover{
    color:#ffd27a;
    border-color:rgba(255,214,140,.95);
    background:linear-gradient(180deg,
      rgba(96,130,168,.98) 0%,
      rgba(66,96,132,.98) 40%,
      rgba(28,42,60,.99) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -1px 0 rgba(0,0,0,.5),
      0 2px 0 #16263a,
      0 4px 0 #0e1826,
      0 10px 22px rgba(0,0,0,0.8),
      0 0 26px rgba(255,190,110,.28);
  }
  #btnExitFs:active{
    transform:translateY(3px);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.5),
      0 1px 0 #0f1a26,
      0 2px 0 #0a131c,
      0 4px 8px rgba(0,0,0,0.6);
  }

  /* 点击后的抖动反馈 */
  @keyframes fsShake{
    0%,100%{transform:translateX(0);}
    18%{transform:translateX(-5px) rotate(-3deg);}
    38%{transform:translateX(5px) rotate(3deg);}
    58%{transform:translateX(-3px) rotate(-2deg);}
    78%{transform:translateX(3px) rotate(2deg);}
  }
  #btnExitFs.shake{animation:fsShake .42s cubic-bezier(.36,.07,.19,.97) both;}

  /* ============================================================
     SnackBar
     ============================================================ */
  #snackbar{
    position:fixed;left:50%;bottom:46px;z-index:150;
    display:flex;align-items:center;gap:10px;
    padding:13px 26px 13px 22px;
    border-radius:13px;
    background:linear-gradient(180deg,
      rgba(74,32,26,.97) 0%,
      rgba(38,14,10,.98) 60%,
      rgba(22,8,6,.99) 100%);
    border:1px solid rgba(255,120,90,.62);
    color:#ffc0ae;
    font-size:14px;letter-spacing:2.5px;font-weight:600;
    white-space:nowrap;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -1px 0 rgba(0,0,0,.6),
      0 2px 0 #2a0e08,
      0 5px 0 #1a0704,
      0 10px 26px rgba(0,0,0,0.85),
      0 0 30px rgba(255,90,70,.28);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%, 26px) scale(.94);
    transition:opacity .28s ease, transform .34s cubic-bezier(.2,.9,.3,1.2);
  }
  #snackbar.show{
    opacity:1;
    transform:translate(-50%, 0) scale(1);
  }
  #snackbar .sb-icon{
    width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;letter-spacing:0;
    color:#2a0806;
    background:radial-gradient(circle at 35% 30%,#ffd9a8,#ff7a55 62%,#c83818 100%);
    box-shadow:
      0 0 10px rgba(255,120,80,.9),
      0 0 20px rgba(255,90,60,.5),
      inset 0 -2px 3px rgba(0,0,0,.3);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }

  /* ============================================================
     游戏 iframe 全屏嵌入层
     ============================================================ */
  #gameFrame{
    position:fixed;inset:0;width:100%;height:100%;
    border:none;background:#04070b;
    z-index:200;
    display:none;
  }
  #gameFrame.active{display:block;}

  #gameLoading{
    position:fixed;inset:0;z-index:201;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;background:#04070b;
    opacity:1;transition:opacity .5s ease;
    pointer-events:none;
  }
  #gameLoading.active{display:flex;}
  #gameLoading.hidden{opacity:0;}

  .gl-spinner{
    width:42px;height:42px;border-radius:50%;
    border:3px solid rgba(255,214,140,0.18);
    border-top-color:#ffcf87;
    animation:glSpin 1s linear infinite;
  }
  @keyframes glSpin{to{transform:rotate(360deg);}}
  .gl-text{
    font-size:14px;letter-spacing:4px;color:#a0b6cc;
    text-shadow:0 1px 0 #1a2028,0 2px 6px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<div id="titleStage">
  <canvas id="cv3d"></canvas>
  <canvas id="cvFx"></canvas>
  <div id="titleContent">
    <h1>雨夜归途</h1>
    <p class="sub">一只浣熊的寻找</p>
    <div class="btns">
      <button id="btnNew">新 游 戏</button>
      <button id="btnCont">继续存档</button>
    </div>
    <p class="tip">点击场景中的物件进行探索 · 进度自动保存</p>

    <div class="age-badge">
      <div class="age-circle">16+</div>
      <div class="age-label">
        <span class="cn">适龄提示</span>
        <span class="en">AGE RATING</span>
      </div>
    </div>

    <div class="thanks">
      <div class="label">感谢名单</div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">刘忠英</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">星奈_ovo</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">超级丫丫channel</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">融雪o_o</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">小椰家的傻芙芙</span>
      </div>
      <div class="row">
        <span class="dot"></span>
        <span class="role"><span class="live">主播</span></span>
        <span class="name">水水_SSS</span>
      </div>
      <div class="msg">第一个不打主线直接挑战血腥线的勇者</div>
    </div>

    <div class="health-tip">
      <p>抵制不良游戏，拒绝盗版游戏。</p>
      <p>注意自我保护，谨防受骗上当。</p>
      <p>适度游戏益脑，沉迷游戏伤身。</p>
      <p>合理安排时间，享受健康生活。</p>
    </div>
  </div>
</div>

<!-- 退出全屏按钮（点击不真正退出，仅提示异常） -->
<button id="btnExitFs" aria-label="退出全屏" title="退出全屏">退出全屏</button>

<!-- SnackBar -->
<div id="snackbar" role="status" aria-live="polite">
  <span class="sb-icon">!</span>
  <span class="sb-text">操作异常</span>
</div>

<!-- 游戏 iframe 全屏嵌入层 -->
<iframe id="gameFrame" src="about:blank" allow="autoplay" frameborder="0"></iframe>

<!-- 游戏加载过渡层 -->
<div id="gameLoading">
  <div class="gl-spinner"></div>
  <div class="gl-text">正在进入雨夜…</div>
</div>

<script src="assets3d/r3d.js"></script>
<script>
(function(){
'use strict';

const W = 960, H = 540;
const stage   = document.getElementById('titleStage');
const content = document.getElementById('titleContent');
const cv3d    = document.getElementById('cv3d');
const cvFx    = document.getElementById('cvFx');
const fxCtx   = cvFx.getContext('2d');

const SAVE_KEY = 'raccoon_rainy_night_v5';
const LAUNCH_KEY = 'raccoon_launch_mode';
const GAME_URL = 'raccoon.html';
const GAME_BODY_URL = 'index1.html';

function shadeHex(hex, amt){
  const r = Math.min(255, Math.max(0, parseInt(hex.slice(1,3),16) + amt));
  const g = Math.min(255, Math.max(0, parseInt(hex.slice(3,5),16) + amt));
  const b = Math.min(255, Math.max(0, parseInt(hex.slice(5,7),16) + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function makeWallTex(){
  const S = 1024;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  const base = '#221610';
  const grad = x.createLinearGradient(0, 0, 0, S);
  grad.addColorStop(0, base); grad.addColorStop(1, shadeHex(base, -32));
  x.fillStyle = grad; x.fillRect(0, 0, S, S);
  const bw = 64, bh = 32;
  for(let row = 0; row * bh < S; row++){
    const y = row * bh;
    const off = (row % 2) ? 0 : bw / 2;
    for(let cx = off - bw; cx < S + bw; cx += bw){
      const bx = cx + 2, by = y + 2;
      const seed = (row * 37 + cx * 13) % 100;
      const tint = (seed - 50) / 280;
      x.fillStyle = shadeHex(base, tint * 90);
      x.fillRect(bx, by, bw - 4, bh - 4);
      x.fillStyle = 'rgba(255,255,255,0.08)';
      x.fillRect(bx, by, bw - 4, 1.5);
      x.fillStyle = 'rgba(0,0,0,0.65)';
      x.fillRect(bx, by + bh - 5, bw - 4, 2);
      x.fillRect(bx + bw - 5, by, 2, bh - 4);
    }
  }
  for(let i = 0; i < 250; i++){
    const px = Math.random() * S, py = S * 0.5 + Math.random() * S * 0.5;
    const r = 6 + Math.random() * 20;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(55,80,45,0.55)');
    g.addColorStop(0.5, 'rgba(45,65,40,0.22)');
    g.addColorStop(1, 'rgba(45,65,40,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for(let i = 0; i < 150; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 8 + Math.random() * 40;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(0,0,0,0.48)');
    g.addColorStop(0.5, 'rgba(0,0,0,0.18)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  x.strokeStyle = 'rgba(120,160,200,0.12)';
  for(let i = 0; i < 80; i++){
    const sx = Math.random() * S, sy = Math.random() * S * 0.5;
    const len = 30 + Math.random() * 180;
    x.lineWidth = 0.8 + Math.random() * 1.5;
    x.beginPath(); x.moveTo(sx, sy);
    x.lineTo(sx + (Math.random() - 0.5) * 10, sy + len);
    x.stroke();
  }
  x.strokeStyle = 'rgba(0,0,0,0.7)';
  for(let i = 0; i < 20; i++){
    let cx = Math.random() * S, cy = Math.random() * S;
    x.lineWidth = 0.8 + Math.random() * 1.6;
    x.beginPath(); x.moveTo(cx, cy);
    for(let j = 0; j < 15; j++){
      cx += (Math.random() - 0.5) * 55;
      cy += Math.random() * 35;
      x.lineTo(cx, cy);
    }
    x.stroke();
  }
  for(let i = 0; i < 40; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const w = 6 + Math.random() * 20;
    const h = 4 + Math.random() * 14;
    x.fillStyle = 'rgba(60,50,45,0.45)';
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + w, py + (Math.random() - 0.5) * 6);
    x.lineTo(px + w * 0.9, py + h);
    x.lineTo(px + (Math.random() - 0.5) * 4, py + h * 0.8);
    x.closePath(); x.fill();
  }
  return c;
}

function makeFloorTex(){
  const S = 1024;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  const base = '#0c0e12';
  x.fillStyle = base; x.fillRect(0, 0, S, S);
  const t = 128;
  for(let y = 0; y < S; y += t){
    for(let x0 = 0; x0 < S; x0 += t){
      const seed = (x0 * 7 + y * 13) % 100;
      const tint = (seed - 50) / 550;
      x.fillStyle = shadeHex(base, tint * 80);
      x.fillRect(x0 + 3, y + 3, t - 6, t - 6);
      x.fillStyle = 'rgba(255,255,255,0.06)';
      x.fillRect(x0 + 3, y + 3, t - 6, 1.5);
      x.fillStyle = 'rgba(0,0,0,0.6)';
      x.fillRect(x0 + 3, y + t - 4, t - 6, 2);
    }
  }
  x.strokeStyle = 'rgba(0,0,0,0.85)';
  x.lineWidth = 1.5;
  for(let i = 0; i <= S; i += t){
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, S); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke();
  }
  for(let i = 0; i < 80; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 10 + Math.random() * 50;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(120,180,220,0.22)');
    g.addColorStop(0.6, 'rgba(120,180,220,0.09)');
    g.addColorStop(1, 'rgba(120,180,220,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for(let i = 0; i < 60; i++){
    const px = Math.random() * S, py = Math.random() * S;
    const r = 8 + Math.random() * 30;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  x.fillStyle = 'rgba(255,255,255,0.08)';
  for(let i = 0; i < 800; i++){
    x.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  return c;
}

      len: 14 + Math.random() * 26,
      sp: 640 + Math.random() * 520,
      a: 0.10 + Math.random() * 0.14,
      layer: i < 110 ? 'far' : 'near'
    });
  }
  ripples = [];
  drops = [];
  flashTime = 0;
  nextFlashAt = performance.now() + 4000 + Math.random() * 6000;
}

function drawFx(dt, t){
  fxCtx.clearRect(0, 0, W, H);

  const fog = fxCtx.createRadialGradient(W/2, H*0.62, H*0.15, W/2, H*0.62, H*0.95);
  fog.addColorStop(0, 'rgba(8,14,26,0)');
  fog.addColorStop(0.6, 'rgba(6,10,20,0.28)');
  fog.addColorStop(1, 'rgba(4,7,14,0.65)');
  fxCtx.fillStyle = fog;
  fxCtx.fillRect(0, 0, W, H);

  fxCtx.save();
  fxCtx.globalCompositeOperation = 'lighter';
  const g1 = fxCtx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, W*0.4);
  g1.addColorStop(0, 'rgba(255,200,120,0.18)');
  g1.addColorStop(0.4, 'rgba(255,180,100,0.07)');
  g1.addColorStop(1, 'rgba(255,180,100,0)');
  fxCtx.fillStyle = g1;
  fxCtx.fillRect(0, 0, W, H);

  const g2 = fxCtx.createRadialGradient(W*0.25, H*0.42, 0, W*0.25, H*0.42, W*0.26);
  g2.addColorStop(0, 'rgba(255,140,80,0.12)');
  g2.addColorStop(1, 'rgba(255,140,80,0)');
  fxCtx.fillStyle = g2;
  fxCtx.fillRect(0, 0, W, H);

  const g3 = fxCtx.createRadialGradient(W*0.78, H*0.42, 0, W*0.78, H*0.42, W*0.24);
  g3.addColorStop(0, 'rgba(140,170,220,0.10)');
  g3.addColorStop(1, 'rgba(140,170,220,0)');
  fxCtx.fillStyle = g3;
  fxCtx.fillRect(0, 0, W, H);
  fxCtx.restore();

  fxCtx.save();
  fxCtx.strokeStyle = 'rgba(180,210,240,0.9)';
  fxCtx.lineWidth = 1;
  fxCtx.beginPath();
  for(let i = 0; i < rainDrops.length; i++){
    const d = rainDrops[i];
    if(d.layer !== 'far') continue;
    d.y += d.sp * dt * 0.6;
    d.x -= d.sp * dt * 0.6 * 0.16;
    if(d.y > H + 24){ d.y = -30 - Math.random() * 140; d.x = Math.random() * W * 1.4 - 140; }
    if(d.x < -70) d.x = W + 50;
    fxCtx.globalAlpha = d.a * 0.7;
    fxCtx.moveTo(d.x, d.y);
    fxCtx.lineTo(d.x - d.len * 0.16, d.y - d.len);
  }
  fxCtx.stroke();
  fxCtx.lineWidth = 1.6;
  fxCtx.beginPath();
  for(let i = 0; i < rainDrops.length; i++){
    const d = rainDrops[i];
    if(d.layer !== 'near') continue;
    d.y += d.sp * dt;
    d.x -= d.sp * dt * 0.16;
    if(d.y > H + 24){ d.y = -30 - Math.random() * 140; d.x = Math.random() * W * 1.4 - 140; }
    if(d.x < -70) d.x = W + 50;
    fxCtx.globalAlpha = d.a * 1.2;
    fxCtx.moveTo(d.x, d.y);
    fxCtx.lineTo(d.x - d.len * 0.16, d.y - d.len);
  }
  fxCtx.stroke();
  fxCtx.restore();

  if(Math.random() < 0.32){
    ripples.push({
      x: 40 + Math.random() * (W - 80),
      y: H * 0.7 + Math.random() * H * 0.25,
      r: 0, max: 14 + Math.random() * 30,
      life: 0, dur: 0.75 + Math.random() * 0.6
    });
  }
  for(let i = ripples.length - 1; i >= 0; i--){
    const p = ripples[i];
    p.life += dt;
    if(p.life >= p.dur){ ripples.splice(i, 1); continue; }
    p.r = p.max * (p.life / p.dur);
  }
  fxCtx.save();
  fxCtx.strokeStyle = 'rgba(170,210,240,0.55)';
  fxCtx.lineWidth = 1.1;
  for(let i = 0; i < ripples.length; i++){
    const p = ripples[i];
    fxCtx.globalAlpha = (1 - p.life / p.dur) * 0.5;
    fxCtx.beginPath();
    fxCtx.ellipse(p.x, p.y, p.r, p.r * 0.32, 0, 0, Math.PI * 2);
    fxCtx.stroke();
  }
  fxCtx.restore();

  const rf = fxCtx.createLinearGradient(0, H * 0.65, 0, H);
  rf.addColorStop(0, 'rgba(180,160,120,0)');
  rf.addColorStop(0.5, 'rgba(180,140,90,0.06)');
  rf.addColorStop(1, 'rgba(140,110,70,0.14)');
  fxCtx.fillStyle = rf;
  fxCtx.fillRect(0, H * 0.65, W, H * 0.35);

  if(Math.random() < 0.06){
    drops.push({
      x: Math.random() * W, y: -20,
      vy: 120 + Math.random() * 80,
      r: 1 + Math.random() * 2,
      life: 0, dur: 2.5 + Math.random() * 2
    });
  }
  for(let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.life += dt;
    d.y += d.vy * dt;
    if(d.life >= d.dur || d.y > H){ drops.splice(i, 1); continue; }
  }
  fxCtx.save();
  fxCtx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < drops.length; i++){
    const d = drops[i];
    const a = Math.sin(d.life / d.dur * Math.PI) * 0.6;
    fxCtx.fillStyle = 'rgba(200,220,250,' + a + ')';
    fxCtx.beginPath(); fxCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2); fxCtx.fill();
    fxCtx.fillStyle = 'rgba(255,255,255,' + (a * 0.7) + ')';
    fxCtx.beginPath(); fxCtx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.4, 0, Math.PI * 2); fxCtx.fill();
  }
  fxCtx.restore();

  const now = performance.now();
  if(now >= nextFlashAt && flashTime <= 0){
    flashTime = 0.42;
    nextFlashAt = now + 8000 + Math.random() * 14000;
  }
  if(flashTime > 0){
    flashTime = Math.max(0, flashTime - dt);
    const k = flashTime / 0.42;
    let intensity = 0;
    if(k > 0.85 || (k > 0.55 && k < 0.70)) intensity = 0.4;
    else if(k > 0.15) intensity = 0.1;
    if(intensity > 0){
      fxCtx.save();
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.fillStyle = 'rgba(180,200,240,' + intensity + ')';
      fxCtx.fillRect(0, 0, W, H);
      fxCtx.restore();
    }
  }

  const vg = fxCtx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  fxCtx.fillStyle = vg;
  fxCtx.fillRect(0, 0, W, H);
}

const cam = {
  x: 13, y: 1.9, z: 14.5,
  yaw: -Math.PI / 2,
  pitch: 0,
  fov: Math.PI / 3.0,
  near: 0.06,
  far: 60
};

function updateOrbitCamera(t){
  const angle = t * ORBIT.angularSpeed + ORBIT.initialAngle;
  cam.x = ORBIT.centerX + Math.cos(angle) * ORBIT.radiusX;
  cam.z = ORBIT.centerZ + Math.sin(angle) * ORBIT.radiusZ;
  cam.y = ORBIT.baseY + Math.sin(t * 0.55) * 0.35;
  const dx = ORBIT.focusX - cam.x;
  const dz = ORBIT.focusZ - cam.z;
  const dy = ORBIT.focusY - cam.y;
  const distXZ = Math.sqrt(dx*dx + dz*dz) || 1;
  const headSway = Math.sin(t * 0.7) * 0.28;
  cam.yaw   = Math.atan2(dz, dx) + headSway;
  cam.pitch = Math.atan2(dy, distXZ) + Math.sin(t * 0.9) * 0.02;
}

let time = 0;
let lastFrame = performance.now();

function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  time += dt;

  if(!gameActive){
    if(renderer){
      updateOrbitCamera(time);
      renderer.setCamera({
        x: cam.x, y: cam.y, z: cam.z,
        yaw: cam.yaw, pitch: cam.pitch,
        fov: cam.fov, near: cam.near, far: cam.far
      });
      const lights = lightsTemplate.map(function(l, i){
        const k = 0.88 + 0.12 * Math.sin(time * (1.4 + i * 0.3) + i);
        const flick = (i === 1) ? (0.82 + 0.18 * Math.sin(time * 12) * Math.random()) : 1;
        return {
          x: l.x, y: l.y, z: l.z,
          color: [l.color[0] * k * flick, l.color[1] * k * flick, l.color[2] * k * flick]
        };
      });
      renderer.setLights(lights);
      renderer.setAmbient(ambientBase);
      renderer.setFog({ color: fogColor, near: fogNear, far: fogFar });
      renderer.render();
    }
    drawFx(dt, time);
  }
  requestAnimationFrame(loop);
}

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale);
  const h = Math.round(H * scale);
  stage.style.width  = w + 'px';
  stage.style.height = h + 'px';
  content.style.transform = 'scale(' + scale + ')';
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  if(renderer) renderer.resize(w, h, dpr);
  cv3d.style.width  = '100%';
  cv3d.style.height = '100%';
  cvFx.width  = Math.round(w * dpr);
  cvFx.height = Math.round(h * dpr);
  cvFx.style.width  = '100%';
  cvFx.style.height = '100%';
  fxCtx.setTransform(cvFx.width / W, 0, 0, cvFx.height / H, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

const btnNew  = document.getElementById('btnNew');
const btnCont = document.getElementById('btnCont');

const gameFrame   = document.getElementById('gameFrame');
const gameLoading = document.getElementById('gameLoading');

let gameOpened = false;

/* ============================================================
   浏览器全屏（必须在用户手势中同步调用）
   ============================================================ */
function requestFullscreenCompat(){
  const el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen ||
             el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!fn) return;
  try{
    const p = fn.call(el);
    if(p && p.catch) p.catch(function(){ /* 用户拒绝或设备不支持，静默 */ });
  }catch(e){ /* 忽略 */ }
}

/* ============================================================
   退出全屏按钮（仅提示，不真正退出）
   ============================================================ */
const btnExitFs  = document.getElementById('btnExitFs');
const snackbarEl = document.getElementById('snackbar');
const snackbarTx = snackbarEl.querySelector('.sb-text');
let snackbarTimer = null;

function isFullscreen(){
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement);
}

function syncExitFsButton(){
  const shouldShow = isFullscreen() && !gameOpened;
  btnExitFs.classList.toggle('visible', shouldShow);
}

function showSnackbar(message, duration){
  snackbarTx.textContent = message || '操作异常';
  snackbarEl.classList.remove('show');
  void snackbarEl.offsetWidth;
  snackbarEl.classList.add('show');
  if(snackbarTimer) clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(function(){
    snackbarEl.classList.remove('show');
    snackbarTimer = null;
  }, duration || 2000);
}

btnExitFs.addEventListener('click', function(e){
  e.preventDefault();
  e.stopPropagation();
  // 关键：不调用 exitFullscreen，仅做视觉反馈
  btnExitFs.classList.remove('shake');
  void btnExitFs.offsetWidth;
  btnExitFs.classList.add('shake');
  setTimeout(function(){ btnExitFs.classList.remove('shake'); }, 460);
  showSnackbar('操作异常', 2000);
});

/* ============================================================
   全屏守卫 —— 尽可能拦截用户主动退出全屏
   - 用户按 ESC / 浏览器退出全屏按钮 → 立刻重新进入全屏
   - 若浏览器拒绝（非用户手势），静默失败，仅提示
   - 代码自身的主动退出（intentionalExit）不拦截
   - 注：F11 是浏览器原生全屏，不触发 Fullscreen API，无法拦截
   ============================================================ */
let intentionalExit = false;
let fsReenterLock   = false;
let fsGuardTimer    = null;

function exitFullscreenIntentional(){
  // 供后续代码主动退出全屏时调用（不会触发拦截）
  intentionalExit = true;
  const d  = document;
  const fn = d.exitFullscreen || d.webkitExitFullscreen ||
             d.mozCancelFullScreen || d.msExitFullscreen;
  if(fn){ try{ fn.call(d); }catch(e){ intentionalExit = false; } }
}

function handleFullscreenChange(){
  syncExitFsButton();

  // 已进入全屏：正常
  if(isFullscreen()) return;

  // 代码主动退出：放行
  if(intentionalExit){
    intentionalExit = false;
    return;
  }

  // 用户主动退出 → 拦截
  if(fsReenterLock) return;
  fsReenterLock = true;

  // 同步调用，最大概率复用 ESC 的用户激活
  requestFullscreenCompat();
  showSnackbar('操作异常', 1800);

  // 释放锁，允许下一次拦截
  if(fsGuardTimer) clearTimeout(fsGuardTimer);
  fsGuardTimer = setTimeout(function(){
    fsReenterLock = false;
    fsGuardTimer  = null;
  }, 600);
}

document.addEventListener('fullscreenchange',       handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange',    handleFullscreenChange);
document.addEventListener('MSFullscreenChange',     handleFullscreenChange);

/* ============================================================
   ★ 序章 → 本体：接收 raccoon.html 的 postMessage
   ============================================================ */
window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || !d.type) return;
  if(d.type === 'next'){
    if(!gameFrame || !gameOpened) return;
    /* 只接受来自当前 iframe 的消息 */
    try{
      if(e.source !== gameFrame.contentWindow) return;
    }catch(err){}
    /* 先显示 loading，再切 src */
    gameLoading.classList.remove('hidden');
    gameLoading.classList.add('active');
    gameFrame.src = GAME_BODY_URL;
  }
});

/* ============================================================
   以全屏 iframe 方式打开游戏（不跳转文档，保持全屏）
   ============================================================ */
function openGameInFullscreen(mode){
  if(gameOpened) return;
  gameOpened = true;
  gameActive = true;

  // 隐藏退出全屏按钮（游戏接管界面）
  btnExitFs.classList.remove('visible');
  snackbarEl.classList.remove('show');

  try{
    if(mode === 'new') localStorage.removeItem(SAVE_KEY);
    localStorage.setItem(LAUNCH_KEY, mode);
  }catch(e){}

  // 若尚未全屏，再尝试一次（在用户手势中有效）
  requestFullscreenCompat();

  gameLoading.classList.add('active');
  gameFrame.classList.add('active');
  /* ★ 「继续存档」直接加载本体，不经过序章 */
  gameFrame.src = (mode === 'continue') ? GAME_BODY_URL : GAME_URL;
}

gameFrame.addEventListener('load', function(){
  setTimeout(function(){
    gameLoading.classList.add('hidden');
    setTimeout(function(){
      gameLoading.classList.remove('active');
      gameLoading.classList.remove('hidden');
    }, 500);
  }, 300);
});

function goGame(mode){
  openGameInFullscreen(mode);
}

/* ============================================================
   存档检测
   ============================================================ */
(function checkSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
  }catch(e){ btnCont.disabled = true; btnCont.textContent = '无 存 档'; }
})();

/* 新游戏：请求全屏 + 直接进入游戏（新手引导在 index1.html 内） */
btnNew.addEventListener('click', function(){
  requestFullscreenCompat();
  goGame('new');
});

/* 继续存档：请求全屏 + 直接以 iframe 打开游戏本体 */
btnCont.addEventListener('click', function(){
  if(btnCont.disabled) return;
  requestFullscreenCompat();
  goGame('continue');
});

function start(){
  const ok = init3D();
  initFx();
  resize();
  if(!ok){
    cv3d.style.background = 'radial-gradient(ellipse at center, #0c1624 0%, #04070b 100%)';
  }
  syncExitFsButton();
  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}

})();
</script>
