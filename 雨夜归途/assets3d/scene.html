<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>scene3d</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #viewport{position:absolute;overflow:hidden;background:#000;}
  #cv{display:block;width:100%;height:100%;}
  #interactBtn{
    position:absolute;left:3.2%;bottom:14%;
    display:none;align-items:center;gap:12px;
    padding:12px 22px 12px 14px;
    border-radius:16px;
    background:linear-gradient(180deg,rgba(26,42,62,0.94),rgba(10,18,28,0.96));
    border:2px solid rgba(255,214,140,0.6);
    color:#e8eef7;font-family:inherit;cursor:pointer;
    text-align:left;max-width:70%;
  }
  #interactBtn.show{display:inline-flex;}
  #interactBtn .icon{font-size:34px;line-height:1;}
  #interactBtn .name{font-size:18px;font-weight:800;color:#ffd98f;}
  #interactBtn .hint{font-size:12px;color:rgba(180,210,240,0.78);}
  #hint{
    position:absolute;left:0;right:0;bottom:14px;text-align:center;
    font-size:12px;color:rgba(140,170,200,0.5);pointer-events:none;
  }
  #__diag{
    position:fixed;left:8px;top:8px;right:8px;
    color:#9fefff;font-family:monospace;font-size:11px;
    z-index:99999;background:rgba(0,0,0,0.88);
    padding:10px 12px;border-radius:8px;line-height:1.65;
    border:1px solid rgba(80,200,255,0.4);
    white-space:pre-wrap;pointer-events:none;
    max-height:80vh;overflow:auto;
  }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="cv"></canvas>
  <button id="interactBtn">
    <span class="icon" id="ibIcon"></span>
    <span class="txt">
      <span class="name" id="ibName"></span>
      <span class="hint" id="ibHint">点击查看</span>
    </span>
  </button>
  <div id="hint">WASD / 方向键 · 鼠标拖动看 · E 互动</div>
</div>

<script>
window.__DIAG_LOGS = [];
window.__DIAG_ERRORS = [];
window.addEventListener('error', function(e){
  window.__DIAG_ERRORS.push(
    (e.message || '?') + '\n  @ ' + (e.filename || '?') + ':' + (e.lineno || 0)
  );
});
function diag(msg){ window.__DIAG_LOGS.push('· ' + msg); }
</script>

<script src="scenes.js" onerror="window.__DIAG_ERRORS.push('scenes.js 加载失败')"></script>
<script src="r3d.js"    onerror="window.__DIAG_ERRORS.push('r3d.js 加载失败')"></script>
<script src="engine.js" onerror="window.__DIAG_ERRORS.push('engine.js 加载失败')"></script>

<script>
diag('三个 js 的 script 标签已执行');
diag('typeof R3D = ' + (typeof window.R3D));
diag('typeof Engine3D = ' + (typeof window.Engine3D));
diag('typeof __SCENES_3D__ = ' + (typeof window.__SCENES_3D__));
if(window.__SCENES_3D__){
  var keys = Object.keys(window.__SCENES_3D__);
  diag('场景 keys: ' + keys.join(', '));
  var qid = new URLSearchParams(location.search).get('id');
  diag('URL 里的 id = ' + qid);
  diag('id 是否在场景里 = ' + (qid && window.__SCENES_3D__[qid] ? '是' : '否'));
}
try {
  if(typeof Engine3D !== 'undefined'){
    Engine3D.boot();
    diag('Engine3D.boot() 正常返回');
  } else {
    diag('❌ Engine3D 未定义，无法启动');
  }
} catch(e) {
  diag('❌ Engine3D.boot() 抛错: ' + (e.message || e));
}

setTimeout(function(){
  var lines = [];
  lines.push('══════ 3D 场景诊断 ══════');
  lines.push('URL: ' + location.href);
  lines.push('innerW×H: ' + window.innerWidth + ' × ' + window.innerHeight);

  var cv = document.getElementById('cv');
  if(cv){
    lines.push('canvas 物理尺寸: ' + cv.width + '×' + cv.height);
    lines.push('canvas CSS 尺寸: ' + cv.clientWidth + '×' + cv.clientHeight);
    try {
      var gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
      lines.push('再次取 WebGL: ' + (gl ? '成功' : '失败'));
      if(gl){
        lines.push('  VERSION: ' + gl.getParameter(gl.VERSION));
        lines.push('  RENDERER: ' + gl.getParameter(gl.RENDERER));
      }
    } catch(e){
      lines.push('取 WebGL 抛错: ' + (e.message || e));
    }
  } else {
    lines.push('❌ 找不到 #cv');
  }

  var vp = document.getElementById('viewport');
  if(vp){
    lines.push('viewport CSS: ' + vp.style.width + ' × ' + vp.style.height
             + '  left=' + vp.style.left + '  top=' + vp.style.top);
  }

  lines.push('');
  lines.push('───── 执行日志 ─────');
  if(window.__DIAG_LOGS.length === 0) lines.push('（空）');
  else Array.prototype.push.apply(lines, window.__DIAG_LOGS);

  lines.push('');
  lines.push('───── 捕获的错误 ─────');
  if(window.__DIAG_ERRORS.length === 0) lines.push('（无）');
  else Array.prototype.push.apply(lines, window.__DIAG_ERRORS);

  lines.push('');
  lines.push('把这段贴给助手。');

  var d = document.createElement('div');
  d.id = '__diag';
  d.textContent = lines.join('\n');
  document.body.appendChild(d);
}, 2000);
</script>
</body>
</html>
