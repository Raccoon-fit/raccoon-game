<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>scene3d</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #viewport{position:absolute;overflow:hidden;background:#000;}
  #cv{display:block;width:100%;height:100%;}

  /* 右上角键位提示 —— 常显 */
  #ctrlHelp{
    position:absolute;right:14px;top:14px;
    padding:10px 16px;
    border-radius:12px;
    background:rgba(6,10,16,0.72);
    border:1px solid rgba(120,160,200,0.22);
    color:rgba(200,220,240,0.78);
    font-size:12.5px;
    letter-spacing:0.4px;
    line-height:1.7;
    pointer-events:none;
    z-index:8;
    box-shadow:0 4px 20px rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);
    white-space:nowrap;
  }
  #ctrlHelp b{
    color:#9ad7ff;
    font-weight:700;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    margin-right:4px;
  }

  #interactBtn{
    position:absolute;left:3.2%;bottom:14%;
    display:none;align-items:center;gap:12px;
    padding:12px 22px 12px 14px;
    border-radius:16px;
    background:linear-gradient(180deg,rgba(26,42,62,0.94),rgba(10,18,28,0.96));
    border:2px solid rgba(255,214,140,0.6);
    color:#e8eef7;font-family:inherit;cursor:pointer;
    text-align:left;max-width:70%;
    transition:transform .14s ease, box-shadow .2s ease;
    box-shadow:0 6px 28px rgba(0,0,0,0.65),
               0 0 36px rgba(255,200,120,0.22),
               inset 0 1px 0 rgba(255,255,255,0.08);
    animation:btnPulse 2s ease-in-out infinite;
  }
  @keyframes btnPulse{
    0%,100%{box-shadow:0 6px 28px rgba(0,0,0,0.65), 0 0 28px rgba(255,200,120,0.18), inset 0 1px 0 rgba(255,255,255,0.08);}
    50%    {box-shadow:0 6px 28px rgba(0,0,0,0.65), 0 0 44px rgba(255,210,140,0.34), inset 0 1px 0 rgba(255,255,255,0.10);}
  }
  #interactBtn.show{display:inline-flex;}
  #interactBtn:active{transform:scale(0.95);}
  #interactBtn .icon{
    font-size:34px;line-height:1;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.75));
    flex:0 0 auto;
  }
  #interactBtn .txt{display:flex;flex-direction:column;gap:3px;min-width:0;}
  #interactBtn .name{
    font-size:18px;font-weight:800;color:#ffd98f;
    letter-spacing:0.5px;
    text-shadow:0 0 12px rgba(255,190,100,0.45);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #interactBtn .hint{
    font-size:12px;color:rgba(180,210,240,0.78);
    letter-spacing:0.5px;white-space:nowrap;
  }

  #hint{
    position:absolute;left:0;right:0;bottom:14px;text-align:center;
    font-size:12px;letter-spacing:1px;
    color:rgba(140,170,200,0.5);
    pointer-events:none;
    transition:opacity 1s ease;
  }

  #fatal{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(4,6,10,0.95);z-index:10;
    color:#e8eef7;font-size:14px;line-height:1.9;
    text-align:center;padding:40px;
  }
  #fatal.show{display:flex;}
  #fatal .box{max-width:460px;}
  #fatal h2{color:#ff6a5a;font-size:18px;margin-bottom:14px;letter-spacing:1px;}
  #fatal p{color:#8b98a8;font-size:13px;}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="cv"></canvas>

  <div id="ctrlHelp"></div>

  <button id="interactBtn">
    <span class="icon" id="ibIcon"></span>
    <span class="txt">
      <span class="name" id="ibName"></span>
      <span class="hint" id="ibHint">按 E / 空格 查看</span>
    </span>
  </button>

  <div id="hint">按 E 互动</div>

  <div id="fatal">
    <div class="box">
      <h2>3D 场景无法启动</h2>
      <p id="fatalMsg"></p>
      <p style="margin-top:14px;color:#6a7a8a">可以在设置里切回 2D 继续游戏。</p>
    </div>
  </div>
</div>

<script src="scenes.js"></script>
<script src="r3d.js"></script>
<script src="engine.js"></script>

<script>
(function(){
  window.addEventListener('error', function(ev){
    var msg = (ev.message || '未知错误') + ' @' + (ev.filename || '') + ':' + (ev.lineno || 0);
    console.error('[3D ERROR]', msg);
    try{ window.parent.postMessage({ type:'engineError', message: msg }, '*'); }catch(e){}
    var fatal = document.getElementById('fatal');
    var fatalMsg = document.getElementById('fatalMsg');
    if(fatal && fatalMsg && !fatal.classList.contains('show')){
      fatalMsg.textContent = ev.message || '未知错误';
      fatal.classList.add('show');
    }
  });

  try{
    if(typeof Engine3D === 'undefined'){
      throw new Error('Engine3D 未加载（engine.js 可能缺失或路径错误）');
    }
    Engine3D.boot();
  }catch(e){
    console.error('[3D BOOT]', e);
    try{ window.parent.postMessage({ type:'engineError', message: e.message || String(e) }, '*'); }catch(_){}
    var fatal = document.getElementById('fatal');
    var fatalMsg = document.getElementById('fatalMsg');
    if(fatal && fatalMsg){
      fatalMsg.textContent = e.message || String(e);
      fatal.classList.add('show');
    }
  }
})();
</script>
</body>
</html>
