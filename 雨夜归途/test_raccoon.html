<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>导出高清浣熊 sprite</title>
<style>
  body{background:#0a0e14;color:#dbe8f5;font-family:system-ui,sans-serif;padding:40px;text-align:center;}
  h1{color:#ffd98f;margin-bottom:16px;}
  p{color:#9fb6cc;font-size:14px;line-height:1.8;margin-bottom:20px;}
  button{padding:12px 28px;font-size:15px;cursor:pointer;background:#d9a44a;border:none;
    border-radius:10px;font-weight:700;color:#1a0e04;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  #status{margin:20px 0;color:#ffcf87;font-size:14px;min-height:20px;white-space:pre-wrap;}
  #preview{background:#000;display:inline-block;padding:10px;border:2px solid rgba(255,214,140,.4);border-radius:10px;}
</style>
</head>
<body>

<h1>浣熊 Sprite 高清导出</h1>
<p>每帧 240×240，生成 4×4 网格的 960×960 图，透明背景。</p>
<button id="btnExport" disabled>开 始 导 出</button>
<div id="status">等待加载模型……</div>
<div id="preview"><canvas id="previewCanvas" width="320" height="320"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script>
(function(){
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btnExport');
  const previewCtx = document.getElementById('previewCanvas').getContext('2d');

  if(typeof THREE === 'undefined'){ statusEl.textContent = '❌ three.js 加载失败'; return; }

  const FRAME_SIZE = 240;     // 高清：每帧 240x240
  const GRID = 4;             // 4x4 网格
  const TOTAL = GRID * GRID;  // 16 帧
  const BASE = 'assets3d/models/';

  // 离屏画布
  const offCanvas = document.createElement('canvas');
  offCanvas.width = FRAME_SIZE;
  offCanvas.height = FRAME_SIZE;

  const renderer = new THREE.WebGLRenderer({
    canvas: offCanvas,
    alpha: true,
    antialias: true,
    preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(1);
  renderer.setSize(FRAME_SIZE, FRAME_SIZE, false);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 1.15, 3.5); // 和之前一样的稍微近一点的距离
  camera.lookAt(0, 1.0, 0);

  scene.add(new THREE.AmbientLight(0x8899bb, 0.60));
  const key = new THREE.DirectionalLight(0xffd8b0, 1.6); key.position.set(3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x90b0ff, 0.7); rim.position.set(-4, 2, -3); scene.add(rim);
  const fill = new THREE.PointLight(0xffc090, 0.8, 20); fill.position.set(-2, 3, 3); scene.add(fill);

  const pivot = new THREE.Group();
  scene.add(pivot);

  // 加载模型
  const mtlLoader = new THREE.MTLLoader();
  mtlLoader.setPath(BASE);
  mtlLoader.setResourcePath(BASE);
  mtlLoader.load('raccoon.mtl', function(mat){
    mat.preload();
    new THREE.OBJLoader().setMaterials(mat).setPath(BASE).load('raccoon.obj', function(model){
      // 自动缩放居中
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 2.0 / Math.max(size.y, 0.001);
      model.scale.setScalar(scale);
      model.position.x = -center.x * scale;
      model.position.y = 1.0 - center.y * scale;
      model.position.z = -center.z * scale;
      pivot.add(model);
      
      statusEl.textContent = '✅ 模型就绪，可以导出';
      btn.disabled = false;
      btn.addEventListener('click', doExport);
    }, undefined, function(err){
      statusEl.textContent = '❌ OBJ 加载失败: ' + err;
    });
  }, undefined, function(){
    // 如果 MTL 失败，用纯色材质兜底
    new THREE.OBJLoader().setPath(BASE).load('raccoon.obj', function(model){
      model.traverse(o => { if(o.isMesh) o.material = new THREE.MeshLambertMaterial({ color: 0x9a8a78 }); });
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const scale = 2.0 / Math.max(size.y, 0.001);
      model.scale.setScalar(scale);
      model.position.x = -center.x * scale;
      model.position.y = 1.0 - center.y * scale;
      model.position.z = -center.z * scale;
      pivot.add(model);
      
      statusEl.textContent = '✅ 模型就绪（无贴图），可以导出';
      btn.disabled = false;
      btn.addEventListener('click', doExport);
    });
  });

  function doExport(){
    btn.disabled = true;
    statusEl.textContent = '正在渲染……';
    
    const sheet = document.createElement('canvas');
    sheet.width = FRAME_SIZE * GRID;
    sheet.height = FRAME_SIZE * GRID;
    const sctx = sheet.getContext('2d');
    
    let frame = 0;
    function next(){
      if(frame >= TOTAL){ finish(sheet); return; }
      
      pivot.rotation.y = (frame / TOTAL) * Math.PI * 2;
      renderer.render(scene, camera);
      
      const gx = (frame % GRID) * FRAME_SIZE;
      const gy = Math.floor(frame / GRID) * FRAME_SIZE;
      sctx.drawImage(offCanvas, gx, gy, FRAME_SIZE, FRAME_SIZE);
      
      // 同步预览（缩放到 320x320 显示）
      previewCtx.clearRect(0,0,320,320);
      previewCtx.drawImage(sheet, 0, 0, 320, 320);
      
      frame++;
      statusEl.textContent = `正在渲染…… ${frame} / ${TOTAL}`;
      setTimeout(next, 20);
    }
    setTimeout(next, 50);
  }

  function finish(sheet){
    statusEl.textContent = '✅ 正在下载……';
    sheet.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'raccoon_sprite.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      
      statusEl.textContent = `✅ 已下载（${Math.round(blob.size/1024)} KB）\n放回 assets3d/ 即可，代码不需要改。`;
      btn.disabled = false;
      btn.textContent = '重新导出';
    }, 'image/png');
  }
})();
</script>
</body>
</html>
