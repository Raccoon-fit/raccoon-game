<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>暗夜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  #cv{display:block;width:100%;height:100%;cursor:none;position:absolute;left:0;top:0;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="common.js"></script>
<script src="scenes.js"></script>
<script>
/* =========================================================
   暗夜模式（血腥线）
   与普通场景共用同一套 2D 引擎，区别在于：
     1) 启动前就把 flags.bloodMode 置为 true（否则首帧是正常色）
     2) 引擎会切到血色的雨 / 余烬 / 暗角
   用法：assets/scene_blood.html?id=alley
   ========================================================= */
(function(){
  var m = /[?&]id=([^&]+)/.exec(location.search);
  var sid = m ? decodeURIComponent(m[1]) : 'alley';

  /* common.js 在加载时把 window.S 重置了，这里必须在其之后覆盖 */
  window.S = {
    scene: sid,
    inv: [],
    invBlood: [],
    flags: { bloodMode:true, bloodEnteredOnce:true },
    ended: false
  };

  SceneCommon.boot(sid);
})();
</script>
</body>
</html>
