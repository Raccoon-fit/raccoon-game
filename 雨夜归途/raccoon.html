<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>雨夜归途 · 序</title>
<style>
 
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:960px;height:540px;overflow:hidden;background:#000;
    box-shadow:0 0 120px rgba(0,0,0,1);transform-origin:center center;flex:0 0 auto;}
  #cv{display:block;width:100%;height:100%;position:absolute;left:0;top:0;}

  /* 加载 */
  #loading{position:absolute;inset:0;background:#000;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:#8fa4ba;z-index:10;transition:opacity .6s;}
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .name{font-size:22px;letter-spacing:14px;color:#f2e6cb;
    padding-left:14px;text-shadow:0 0 40px rgba(255,200,120,.5);}
  #loading .bar{width:320px;height:6px;border-radius:3px;
    background:rgba(20,30,44,.9);border:1px solid rgba(140,180,220,.25);
    overflow:hidden;}
  #loading .fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b661,#ffe6b0);
    box-shadow:0 0 16px rgba(255,200,120,.85);transition:width .2s;}
  #loading .tip{font-size:12px;letter-spacing:2px;color:#8fa4ba;}
  #loading .tip.error{color:#ff6a5a;}

  /* 剧情飘窗 */
  #storyBox{
    position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);
    min-width:420px;max-width:760px;
    padding:20px 32px;
    background:linear-gradient(180deg,
      rgba(20,26,38,.88) 0%,
      rgba(10,14,22,.94) 100%);
    border:1px solid rgba(255,214,140,.3);
    border-radius:16px;
    box-shadow:
      0 20px 60px rgba(0,0,0,.9),
      0 0 40px rgba(255,190,100,.12),
      inset 0 1px 0 rgba(255,255,255,.06);
    color:#e9dcc0;
    font-size:17px;line-height:1.9;letter-spacing:2px;
    opacity:0;pointer-events:none;
    transition:opacity .8s cubic-bezier(.2,.9,.3,1),
               transform .8s cubic-bezier(.2,.9,.3,1);
    text-align:center;
    z-index:5;
    text-shadow:0 1px 0 #6a4a1a, 0 2px 6px rgba(0,0,0,.85);}
  #storyBox.show{
    opacity:1;transform:translate(-50%,0);}
  #storyBox .line{
    opacity:0;
    transition:opacity .6s;
    white-space:pre-wrap;}
  #storyBox .line.show{opacity:1;}
  #storyBox .cursor{
    display:inline-block;width:8px;
    animation:blink 0.9s ease-in-out infinite;
    color:#ffe6a8;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

  /* 底部提示 */
  #hint{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    color:rgba(140,160,180,.55);font-size:12px;letter-spacing:2px;
    pointer-events:none;z-index:6;opacity:0;transition:opacity 1s;}
  #hint.show{opacity:1;}

  /* 跳转遮罩 */
  #endScreen{
    position:absolute;inset:0;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s;
    z-index:20;}
  #endScreen.show{opacity:1;}
  #endScreen .w{color:#3a0a0e;font-size:12px;letter-spacing:10px;
    padding-left:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="storyBox">
    <div class="line" id="line1"></div>
    <div class="line" id="line2"></div>
    <div class="line" id="line3"></div>
    <div class="line" id="line4"></div>
    <span class="cursor">▍</span>
  </div>

  <div id="hint">按 W A S D 移动　·　↑ ↓ ← → 转动视角</div>

  <div id="loading">
    <div class="name">雨 夜 归 途</div>
    <div class="bar"><div class="fill" id="loadFill"></div></div>
    <div class="tip" id="loadTip">正在准备……</div>
  </div>

  <div id="endScreen">
    <div class="w">—— 雨 夜 归 途 ——</div>
  </div>
</div>

<script src="assets3d/r3d.js"></script>
<script>
(function(){
'use strict';

const W = 960, H = 540;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const loading = document.getElementById('loading');
const loadFill = document.getElementById('loadFill');
const loadTip = document.getElementById('loadTip');
const storyBox = document.getElementById('storyBox');
const hintEl = document.getElementById('hint');
const endScreen = document.getElementById('endScreen');

/* 读跳转模式 —— 如果是从"继续存档"来的，直接跳 index */
let mode = 'new';
try{ mode = localStorage.getItem('raccoon_launch_mode') || 'new'; }catch(e){}
if(mode === 'continue'){
  location.replace('index1.html');
  return;
}

/* ==================== 状态 ==================== */
const cam = { x: 6, y: 1.6, z: 6, yaw: 0, pitch: 0 };
const keys = {};
let renderer = null;
let time = 0;
let lastFrame = performance.now();
let loaded = false;
let storyDone = false;
let canMove = false;

/* 房间大小：12 × 12，边缘为墙 */
const ROOM = 12;
const grid = [];
for(let i = 0; i < ROOM; i++){
  let row = '';
  for(let j = 0; j < ROOM; j++){
    row += (i === 0 || i === ROOM-1 || j === 0 || j === ROOM-1) ? '1' : '0';
  }
  grid.push(row);
}

/* ==================== 尺寸 ==================== */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.transform = 'scale(1)';
  stage.style.left = Math.round((vw - w) / 2) + 'px';
  stage.style.top = Math.round((vh - h) / 2) + 'px';
  stage.style.position = 'absolute';
  if(renderer){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.resize(w, h, dpr);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ==================== 暗室纹理 ==================== */
function makeDarkTex(){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#04060a';
  x.fillRect(0, 0, S, S);
  /* 细颗粒 */
  for(let i = 0; i < 800; i++){
    x.fillStyle = 'rgba(255,255,255,' + (0.008 + Math.random()*0.012) + ')';
    x.fillRect(Math.random()*S, Math.random()*S, 1, 1);
  }
  /* 微弱砖纹 */
  x.strokeStyle = 'rgba(0,0,0,0.5)';
  x.lineWidth = 2;
  const bh = 32;
  for(let row = 0; row * bh < S; row++){
    const y = row * bh;
    x.beginPath(); x.moveTo(0, y); x.lineTo(S, y); x.stroke();
    const off = (row % 2) ? 0 : 40;
    for(let cx = off; cx < S; cx += 80){
      x.beginPath(); x.moveTo(cx, y); x.lineTo(cx, y + bh); x.stroke();
    }
  }
  return c;
}
function makeFloorTex(){
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#080a0c';
  x.fillRect(0, 0, S, S);
  for(let i = 0; i < 400; i++){
    x.fillStyle = 'rgba(255,255,255,' + (0.005 + Math.random()*0.01) + ')';
    x.fillRect(Math.random()*S, Math.random()*S, 1, 1);
  }
  /* 石砖缝 */
  x.strokeStyle = 'rgba(0,0,0,0.7)';
  x.lineWidth = 2;
  const t = 64;
  for(let i = 0; i <= S; i += t){
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, S); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke();
  }
  return c;
}

/* ==================== 初始化 3D ==================== */
function init3D(){
  try{
    renderer = R3D.create(cv);
  }catch(e){
    console.error('[raccoon] WebGL:', e);
    loadTip.textContent = '⚠ WebGL 不可用';
    loadTip.classList.add('error');
    return false;
  }

  renderer.buildWorld({
    grid: grid,
    wallHeight: 4.0,
    wallTexSource:  makeDarkTex(),
    floorTexSource: makeFloorTex(),
    ceilTexSource:  makeDarkTex()
  });

  /* 灯光 —— 浣熊头顶一盏暖光 + 环境暗光 */
  renderer.setAmbient([0.05, 0.05, 0.07]);
  renderer.setLights([
    { x: 6, y: 3.2, z: 6, color: [1.4, 1.1, 0.7] },
    { x: 6, y: 3.0, z: 6, color: [0.35, 0.4, 0.55] },
    { x: 0, y: -999, z: 0, color: [0, 0, 0] }
  ]);
  renderer.setFog({ color: [0.005, 0.008, 0.014], near: 3, far: 18 });

  return true;
}

/* ==================== 加载浣熊模型 ==================== */
function loadRaccoon(){
  loadTip.textContent = '正在加载浣熊……';
  loadFill.style.width = '30%';

  R3D.loadOBJModel('assets3d/models/raccoon.obj', function(msg){
    loadTip.textContent = msg;
  }).then(function(model){
    if(!model || !model.P || model.P.length === 0){
      throw new Error('模型为空');
    }
    loadFill.style.width = '75%';
    loadTip.textContent = '上传到显卡……';

    /* 让模型适配场景尺寸：
       浣熊原模型大概尺寸未知，用 autoFit + scale 控制
       scale=1 先试，如果太大/太小后面再调 */
    renderer.addModel(model, {
      x: 6, y: 0, z: 6,
      scale: 1.0,
      rotationY: Math.PI,     /* 让它面向摄像机（+z 方向） */
      autoFit: true
    });

    loadFill.style.width = '100%';
    loadTip.textContent = '完成';
    setTimeout(function(){
      loading.classList.add('hide');
      startStory();
    }, 400);
  }).catch(function(err){
    console.error('[raccoon] 加载失败', err);
    loadTip.textContent = '⚠ 加载失败：' + (err.message || err);
    loadTip.classList.add('error');
    /* 加载失败也放行，跳 index */
    setTimeout(function(){
      loading.classList.add('hide');
      startStory();
    }, 1800);
  });
}

/* ==================== 剧情飘窗 ==================== */
const STORY_LINES = [
  '灰豆又一次从梦里醒来。',
  '它不认识这里。',
  '四面是黑的墙。',
  '墙上什么也没有，只有一只浣熊头顶的苹果，还在。'
];

function startStory(){
  storyBox.classList.add('show');
  canMove = false;

  let lineIdx = 0;
  function showNextLine(){
    if(lineIdx >= STORY_LINES.length){
      /* 全部显示完，等 1 秒跳 index */
      setTimeout(function(){
        finishStory();
      }, 1000);
      return;
    }
    const el = document.getElementById('line' + (lineIdx + 1));
    if(!el){ lineIdx++; showNextLine(); return; }
    el.textContent = STORY_LINES[lineIdx];
    el.classList.add('show');
    lineIdx++;
    setTimeout(showNextLine, 900);
  }

  setTimeout(showNextLine, 400);
}

function finishStory(){
  if(storyDone) return;
  storyDone = true;
  endScreen.classList.add('show');
  /* 让黑幕渐显完成后再跳 */
  setTimeout(function(){
    location.replace('index.html');
  }, 800);
}

/* ==================== 移动 / 视角 ==================== */
function bindInput(){
  window.addEventListener('keydown', function(e){
    keys[e.key.toLowerCase()] = true;
    if(e.key.indexOf('Arrow') === 0 || e.key === ' ') e.preventDefault();
    /* 剧情未完成前禁止移动（但视角可转） */
  });
  window.addEventListener('keyup', function(e){
    keys[e.key.toLowerCase()] = false;
  });

  /* 鼠标拖动转视角（点击并拖动） */
  let dragging = false, lx = 0, ly = 0;
  cv.addEventListener('mousedown', function(e){ dragging = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    cam.yaw += dx * 0.005;
    cam.pitch -= dy * 0.005;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  });
  window.addEventListener('mouseup', function(){ dragging = false; });

  /* 触屏 */
  let touchLx = 0, touchLy = 0, touching = false;
  cv.addEventListener('touchstart', function(e){
    if(!e.touches.length) return;
    touching = true;
    touchLx = e.touches[0].clientX;
    touchLy = e.touches[0].clientY;
  }, {passive:true});
  cv.addEventListener('touchmove', function(e){
    if(!touching || !e.touches.length) return;
    const dx = e.touches[0].clientX - touchLx;
    const dy = e.touches[0].clientY - touchLy;
    touchLx = e.touches[0].clientX;
    touchLy = e.touches[0].clientY;
    cam.yaw += dx * 0.006;
    cam.pitch -= dy * 0.006;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  }, {passive:true});
  cv.addEventListener('touchend', function(){ touching = false; });
}

/* ==================== 碰撞 ==================== */
function canStand(x, z){
  const gy = Math.floor(z), gx = Math.floor(x);
  if(gy < 0 || gy >= grid.length) return false;
  const row = grid[gy];
  if(gx < 0 || gx >= row.length) return false;
  return row[gx] === '0';
}

/* ==================== 渲染循环 ==================== */
function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  time += dt;

  /* 相机视角（方向键转视角） */
  const rotSpeed = 1.8;
  if(keys['arrowleft'])  cam.yaw -= rotSpeed * dt;
  if(keys['arrowright']) cam.yaw += rotSpeed * dt;
  if(keys['arrowup'])    cam.pitch += rotSpeed * 0.6 * dt;
  if(keys['arrowdown'])  cam.pitch -= rotSpeed * 0.6 * dt;
  if(cam.pitch >  0.9) cam.pitch =  0.9;
  if(cam.pitch < -0.9) cam.pitch = -0.9;

  /* 移动 */
  if(canMove){
    const speed = 2.8;
    let fwd = 0, str = 0;
    if(keys['w']) fwd += 1;
    if(keys['s']) fwd -= 1;
    if(keys['a']) str -= 1;
    if(keys['d']) str += 1;
    if(fwd || str){
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      let dx = cy*fwd - sy*str;
      let dz = sy*fwd + cy*str;
      const len = Math.hypot(dx, dz) || 1;
      dx = dx/len * speed * dt;
      dz = dz/len * speed * dt;
      const nx = cam.x + dx, nz = cam.z + dz;
      if(canStand(nx, cam.z)) cam.x = nx;
      if(canStand(cam.x, nz)) cam.z = nz;
    }
  }

  if(renderer){
    renderer.setCamera({
      x: cam.x, y: cam.y, z: cam.z,
      yaw: cam.yaw, pitch: cam.pitch,
      fov: Math.PI / 3.0, near: 0.06, far: 40
    });
    renderer.render();
  }

  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
resize();
if(init3D()){
  bindInput();
  lastFrame = performance.now();
  requestAnimationFrame(loop);
  loadRaccoon();
  setTimeout(function(){
    hintEl.classList.add('show');
  }, 2500);
} else {
  loadFill.style.width = '100%';
  loadTip.textContent = '⚠ 3D 不可用，即将跳过……';
  setTimeout(function(){
    location.replace('index1.html');
  }, 2000);
}

})();
</script>
</body>
</html>
