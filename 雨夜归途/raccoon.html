<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>雨夜归途 · 序</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:960px;height:540px;overflow:hidden;background:#000;
    box-shadow:0 0 120px rgba(0,0,0,1);transform-origin:center center;flex:0 0 auto;}
  #cv{display:block;width:100%;height:100%;position:absolute;left:0;top:0;}

  #loading{position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;flex-direction:column;
    color:#8fa4ba;z-index:10;transition:opacity .75s ease,filter .75s ease;
    background:
      radial-gradient(circle at 50% 38%,rgba(90,56,35,.28),transparent 34%),
      radial-gradient(circle at 50% 65%,rgba(36,70,110,.22),transparent 42%),
      linear-gradient(180deg,#02050a 0%,#050912 42%,#0c0710 100%);
    overflow:hidden;}
  #loading.hide{opacity:0;filter:blur(10px);pointer-events:none;}
  #loading::before{content:'';position:absolute;inset:-80px;opacity:.42;pointer-events:none;
    background-image:linear-gradient(115deg,transparent 0 48%,rgba(170,210,255,.22) 49%,transparent 52%);
    background-size:18px 80px;animation:loaderRain 1.15s linear infinite;}
  #loading::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.20) 48%,rgba(0,0,0,.78) 100%);}
  @keyframes loaderRain{from{transform:translate3d(-36px,-80px,0);}to{transform:translate3d(36px,80px,0);}}
  .loaderCard{position:relative;z-index:1;width:min(560px,82%);padding:34px 34px 28px;
    border:1px solid rgba(230,190,120,.22);border-radius:24px;
    background:linear-gradient(180deg,rgba(10,16,28,.70),rgba(5,8,14,.56));
    box-shadow:0 24px 80px rgba(0,0,0,.68),inset 0 0 38px rgba(255,205,120,.045);
    backdrop-filter:blur(10px);}
  .loaderCard::before{content:'';position:absolute;inset:1px;border-radius:23px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,230,180,.20),transparent 32%,rgba(115,180,255,.10) 100%);opacity:.9;}
  #loading .name{position:relative;font-size:26px;letter-spacing:15px;color:#fff1cc;
    padding-left:15px;text-align:center;text-shadow:0 0 20px rgba(255,213,134,.85),0 0 70px rgba(255,166,80,.32);}
  #loading .sub{position:relative;margin-top:10px;text-align:center;font-size:12px;letter-spacing:4px;color:rgba(170,194,220,.72);}
  .progressWrap{position:relative;margin-top:28px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;}
  #loading .bar{position:relative;height:14px;border-radius:999px;
    background:linear-gradient(180deg,rgba(3,8,16,.95),rgba(19,32,48,.88));
    border:1px solid rgba(154,198,238,.24);overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.80),0 0 34px rgba(60,130,190,.10);}
  #loading .bar::before{content:'';position:absolute;inset:2px;border-radius:999px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px);}
  #loading .fill{position:relative;height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#5ad0ff 0%,#e8b661 45%,#fff0b8 78%,#ffffff 100%);
    box-shadow:0 0 16px rgba(90,208,255,.58),0 0 30px rgba(255,197,98,.72);
    transition:width .28s cubic-bezier(.2,.7,.2,1);overflow:hidden;}
  #loading .fill::after{content:'';position:absolute;inset:0;width:70%;
    background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.75) 45%,transparent 78%);
    transform:translateX(-100%);animation:loaderShine 1.55s ease-in-out infinite;}
  @keyframes loaderShine{0%{transform:translateX(-120%);}58%,100%{transform:translateX(170%);}}
  #loadPct{position:relative;min-width:48px;text-align:right;font-size:13px;letter-spacing:1px;color:#ffe7ad;
    font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,195,95,.70);}
  #loading .tip{position:relative;margin-top:14px;font-size:12px;letter-spacing:2.5px;color:#9eb7d4;text-align:center;}
  #loading .tip.error{color:#ff8174;text-shadow:0 0 18px rgba(255,74,66,.55);}
  .loadSteps{position:relative;margin-top:18px;display:flex;justify-content:center;gap:9px;}
  .loadSteps i{width:7px;height:7px;border-radius:50%;background:rgba(135,170,205,.28);box-shadow:0 0 0 rgba(255,210,135,0);animation:stepPulse 1.8s ease-in-out infinite;}
  .loadSteps i:nth-child(2){animation-delay:.18s}.loadSteps i:nth-child(3){animation-delay:.36s}.loadSteps i:nth-child(4){animation-delay:.54s}
  @keyframes stepPulse{0%,100%{background:rgba(135,170,205,.25);transform:scale(.9);}45%{background:#ffe0a2;box-shadow:0 0 18px rgba(255,210,135,.75);transform:scale(1.22);}}

  #storyLayer{position:absolute;left:0;top:0;width:100%;height:100%;
    pointer-events:none;overflow:hidden;z-index:5;}

  .storyLine{
    position:absolute;left:50%;bottom:-80px;
    transform:translateX(-50%);white-space:nowrap;
    font-size:26px;letter-spacing:8px;font-weight:600;
    color:#faf0dc;
    text-shadow:
      0 0 10px rgba(255, 235, 190, 0.75),
      0 0 24px rgba(255, 210, 140, 0.55),
      0 0 48px rgba(255, 180, 100, 0.35),
      0 0 90px rgba(255, 150, 80, 0.20),
      0 2px 3px rgba(0, 0, 0, 0.95),
      0 4px 12px rgba(0, 0, 0, 0.9);
    opacity:0;
    animation-name: floatUp;
    animation-duration: 6s;
    animation-timing-function: cubic-bezier(.25,.5,.35,1);
    animation-fill-mode: both;
    will-change: transform, opacity, filter, letter-spacing;}

  @keyframes floatUp{
    0%   { transform:translateX(-50%) translateY(0) scale(0.88); opacity:0; filter:blur(10px); letter-spacing:2px; }
    15%  { transform:translateX(-50%) translateY(-110px) scale(1); opacity:1; filter:blur(0); letter-spacing:6px; }
    28%  { transform:translateX(-50%) translateY(-200px) scale(1); opacity:1; filter:blur(0); letter-spacing:8px; }
    72%  { transform:translateX(-50%) translateY(-460px) scale(1.01); opacity:1; filter:blur(0); letter-spacing:10px; }
    100% { transform:translateX(-50%) translateY(-620px) scale(1.04); opacity:0; filter:blur(8px); letter-spacing:14px; }
  }

  #storyLayer::before{
    content:'';position:absolute;left:0;top:0;width:100%;height:140px;
    background:linear-gradient(180deg,#000 0%,rgba(0,0,0,0.85) 35%,transparent 100%);
    pointer-events:none;z-index:6;}
  #storyLayer::after{
    content:'';position:absolute;left:0;bottom:0;width:100%;height:110px;
    background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0.8) 40%,transparent 100%);
    pointer-events:none;z-index:6;}

  #hint{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    color:rgba(140,160,180,.5);font-size:11.5px;letter-spacing:2.5px;
    pointer-events:none;z-index:7;opacity:0;transition:opacity 1s;}
  #hint.show{opacity:1;}

  #skipBtn{
    position:absolute;right:28px;bottom:24px;
    padding:10px 22px;
    font-size:13px;letter-spacing:3px;font-weight:500;
    color:rgba(200,180,140,0.75);
    background:rgba(10,14,20,0.55);
    border:1px solid rgba(200,170,110,0.35);
    border-radius:10px;
    font-family:inherit;
    cursor:pointer;
    z-index:9;
    transition:color .2s ease, border-color .2s ease, background .2s ease, transform .1s ease;
    backdrop-filter:blur(4px);
    opacity:0;
    pointer-events:none;
  }
  #skipBtn.show{opacity:1;pointer-events:auto;}
  #skipBtn:hover{
    color:#ffe6a8;
    border-color:rgba(255,214,140,0.85);
    background:rgba(20,30,44,0.75);
  }
  #skipBtn:active{transform:scale(.96);}

  #endScreen{position:absolute;inset:0;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s;z-index:20;}
  #endScreen.show{opacity:1;}
  #endScreen .w{color:#3a0a0e;font-size:12px;letter-spacing:10px;padding-left:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="storyLayer"></div>
  <div id="hint">按 W A S D 移动　·　↑ ↓ ← → 转动身体</div>
  <button id="skipBtn">跳 过 ▸</button>
  <div id="loading" aria-live="polite">
    <div class="loaderCard">
      <div class="name">雨 夜 归 途</div>
      <div class="sub">LOADING THE RAINY WAY HOME</div>
      <div class="progressWrap">
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill" id="loadFill"></div>
        </div>
        <div id="loadPct">0%</div>
      </div>
      <div class="tip" id="loadTip">正在准备雨夜……</div>
      <div class="loadSteps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div id="endScreen"><div class="w">—— 雨 夜 归 途 ——</div></div>
</div>

<script>
(function(){
'use strict';

const W = 960, H = 540;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const loading = document.getElementById('loading');
const loadFill = document.getElementById('loadFill');
const loadTip = document.getElementById('loadTip');
const loadPct = document.getElementById('loadPct');
const loadBar = loading.querySelector('.bar');
const storyLayer = document.getElementById('storyLayer');
const hintEl = document.getElementById('hint');
const endScreen = document.getElementById('endScreen');
const skipBtn = document.getElementById('skipBtn');

const NEXT_URL = 'index1.html';
const SPRITE_URL = 'assets3d/raccoon_sprite.png';
const GRID = 8;
const TOTAL_FRAMES = GRID * GRID;

/* =========================================================
   离开方式：
   - 在 iframe 里 → postMessage 通知父页面切换 iframe.src
   - 独立打开 → location.replace 降级
   ========================================================= */
function leaveToNext(){
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type:'next' }, '*');
      return;
    }
  }catch(e){}
  location.replace(NEXT_URL);
}

/* 「继续存档」直接进本体，跳过序章 */
let mode = 'new';
try{ mode = localStorage.getItem('raccoon_launch_mode') || 'new'; }catch(e){}
if(mode === 'continue'){
  leaveToNext();
  return;
}

/* =========================================================
   剧情文本（原样保留）
   ========================================================= */
const STORY = [
  { text: '灰豆又一次从梦里醒来。' },
  { text: '它不认识这里。' },
  { text: '四面是黑的墙。' },
  { text: '墙上什么都没有。' },
  { text: '——除了头顶那颗红苹果。', pause: 800 },

  { text: '它记得一些事。' },
  { text: '记得雨。' },
  { text: '三天三夜没停过的雨。' },
  { text: '记得一个老人。' },
  { text: '记得一双粗糙的手。' },
  { text: '记得一栋红屋顶的房子。', pause: 800 },

  { text: '其它的，它都想不起来了。' },
  { text: '但它知道，那个屋顶还在等它。' },
  { text: '所以它必须回去。' },
  { text: '——哪怕它已经忘了路。', pause: 1000 },

  { text: '雨夜归途，从这里开始。' }
];

/* =========================================================
   状态
   ========================================================= */
let spriteImg = null;
let frameSize = 240;   // 加载后按图片宽度 / 8 更新

const raccoon = {
  x: W / 2,
  y: H * 0.72,
  size: 320,
  yaw: Math.PI,           // 弧度，初始朝前
  frame: 32               // 0-63
};

const cam = { x: 0, y: 0 };
const keys = {};

let animTime = 0;
let lastFrameTime = performance.now();

/* =========================================================
   输入
   ========================================================= */
window.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(e.key.indexOf('Arrow') === 0 || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', function(e){
  const k = e.key.toLowerCase();
  keys[k] = false;
});

/* 触摸旋转（拖动屏幕旋转角色） */
let touchDrag = null;
cv.addEventListener('touchstart', function(e){
  if(!e.touches.length) return;
  touchDrag = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
cv.addEventListener('touchmove', function(e){
  if(!touchDrag || !e.touches.length) return;
  const dx = e.touches[0].clientX - touchDrag.x;
  touchDrag.x = e.touches[0].clientX;
  touchDrag.y = e.touches[0].clientY;
  raccoon.yaw += dx * 0.012;
}, { passive: true });
cv.addEventListener('touchend', function(){ touchDrag = null; });
cv.addEventListener('touchcancel', function(){ touchDrag = null; });

/* =========================================================
   加载精灵图
   ========================================================= */
function loadSprite(){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){
      spriteImg = img;
      if(img.width > 0) frameSize = img.width / GRID;
      resolve();
    };
    img.onerror = function(){
      reject(new Error('精灵图加载失败：' + SPRITE_URL));
    };
    img.src = SPRITE_URL;
  });
}

/* 假进度条（图片加载无进度事件，做个视觉增长） */
let fakeProgress = 0;
let fakeTimer = null;
function setLoadProgress(value, text){
  fakeProgress = Math.max(0, Math.min(100, value));
  const shown = Math.round(fakeProgress);
  loadFill.style.width = fakeProgress.toFixed(1) + '%';
  loadPct.textContent = shown + '%';
  if(loadBar) loadBar.setAttribute('aria-valuenow', String(shown));
  if(text) loadTip.textContent = text;
}
function startFakeProgress(){
  setLoadProgress(6, '正在收集雨声……');
  const steps = ['正在点亮屋檐灯……','正在展开红屋顶的路……','正在加载灰豆的脚步……','正在校准雨夜方向……'];
  let stepIndex = 0;
  fakeTimer = setInterval(function(){
    if(fakeProgress < 88){
      const ease = Math.max(1.1, (92 - fakeProgress) / 18);
      const inc = Math.random() * 2.8 + ease;
      setLoadProgress(Math.min(88, fakeProgress + inc), steps[stepIndex % steps.length]);
      stepIndex++;
    }
  }, 220);
}
function stopFakeProgress(ok){
  if(fakeTimer){ clearInterval(fakeTimer); fakeTimer = null; }
  setLoadProgress(100, ok ? '加载完成，雨夜开启。' : '加载异常，正在进入备用演出。');
}

/* =========================================================
   背景绘制
   ========================================================= */
function drawBackground(t){
  /* 天空 / 房间远景 */
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0,   '#04070d');
  skyGrad.addColorStop(0.35,'#0a1020');
  skyGrad.addColorStop(0.7, '#181228');
  skyGrad.addColorStop(1,   '#2a1a22');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  /* 远处建筑剪影 */
  const skyline = [
    { x: 0,   y: 200, w: 100, h: 200 },
    { x: 100, y: 180, w: 120, h: 220 },
    { x: 220, y: 220, w: 100, h: 180 },
    { x: 320, y: 160, w: 140, h: 240 },
    { x: 460, y: 200, w: 110, h: 200 },
    { x: 570, y: 140, w: 130, h: 260 },
    { x: 700, y: 180, w: 120, h: 220 },
    { x: 820, y: 200, w: 140, h: 200 }
  ];
  ctx.fillStyle = '#03060c';
  const parallaxX = cam.x * 0.1;
  skyline.forEach(function(b){
    ctx.fillRect(b.x + parallaxX, b.y, b.w, b.h);
  });

  /* 远处零星窗灯 */
  ctx.save();
  for(let i = 0; i < 30; i++){
    const bx = ((i * 137) % W) + parallaxX;
    const by = 220 + ((i * 47) % 120);
    const flick = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 1.3);
    ctx.globalAlpha = 0.25 + flick * 0.45;
    ctx.fillStyle = (i % 5 === 0) ? '#ffb070' : '#ffd98f';
    ctx.fillRect(bx, by, 3, 4);
  }
  ctx.restore();

  /* 地面 */
  const floorGrad = ctx.createLinearGradient(0, 400, 0, H);
  floorGrad.addColorStop(0, '#0a0810');
  floorGrad.addColorStop(1, '#050308');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, 400, W, H - 400);

  /* 地面纹理线 */
  ctx.strokeStyle = 'rgba(60,50,70,0.14)';
  ctx.lineWidth = 1;
  for(let i = 0; i < 15; i++){
    const y = 420 + i * 10;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  /* 远处红屋顶房子剪影 */
  const rx = 700 + parallaxX * 0.6;
  ctx.fillStyle = '#3a1818';
  ctx.beginPath();
  ctx.moveTo(rx - 80, 380);
  ctx.lineTo(rx,     320);
  ctx.lineTo(rx + 80, 380);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#1a0e10';
  ctx.fillRect(rx - 60, 380, 120, 30);

  /* 窗户里的暖光 */
  const windowGlow = ctx.createRadialGradient(rx, 360, 0, rx, 360, 70);
  windowGlow.addColorStop(0, 'rgba(255,200,120,0.55)');
  windowGlow.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = windowGlow;
  ctx.fillRect(rx - 70, 290, 140, 140);
  ctx.fillStyle = 'rgba(255,220,160,0.9)';
  ctx.fillRect(rx - 10, 348, 20, 28);

  /* 雨丝 */
  ctx.save();
  ctx.strokeStyle = 'rgba(180,210,240,0.22)';
  ctx.lineWidth = 1;
  for(let i = 0; i < 90; i++){
    const rx2 = ((i * 67 + t * 300) % (W + 120)) - 60;
    const ry2 = ((i * 43 + t * 800) % (H + 120)) - 60;
    ctx.beginPath();
    ctx.moveTo(rx2, ry2);
    ctx.lineTo(rx2 - 2, ry2 + 12);
    ctx.stroke();
  }
  ctx.restore();

  /* 两侧渐暗（舞台聚光感） */
  const vigL = ctx.createLinearGradient(0, 0, 220, 0);
  vigL.addColorStop(0, 'rgba(0,0,0,0.65)');
  vigL.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vigL;
  ctx.fillRect(0, 0, 220, H);

  const vigR = ctx.createLinearGradient(W - 220, 0, W, 0);
  vigR.addColorStop(0, 'rgba(0,0,0,0)');
  vigR.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vigR;
  ctx.fillRect(W - 220, 0, 220, H);
}

/* =========================================================
   绘制浣熊
   ========================================================= */
function drawRaccoon(t){
  if(!spriteImg) return;

  /* 地面阴影 */
  const shadowY = raccoon.y + raccoon.size * 0.40;
  const shadowGrad = ctx.createRadialGradient(
    raccoon.x, shadowY, 0,
    raccoon.x, shadowY, raccoon.size * 0.42
  );
  shadowGrad.addColorStop(0, 'rgba(0,0,0,0.55)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.ellipse(raccoon.x, shadowY, raccoon.size * 0.42, raccoon.size * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 呼吸缩放 */
  const breath = 1 + Math.sin(t * 1.2) * 0.015;

  const col = raccoon.frame % GRID;
  const row = Math.floor(raccoon.frame / GRID);
  const sx = col * frameSize;
  const sy = row * frameSize;

  const drawSize = raccoon.size * breath;
  const drawX = raccoon.x - drawSize / 2;
  const drawY = raccoon.y - drawSize / 2;

  ctx.drawImage(
    spriteImg,
    sx, sy, frameSize, frameSize,
    drawX, drawY, drawSize, drawSize
  );

  /* 身上一点点暖光打光（增加融合感） */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const warm = ctx.createRadialGradient(
    raccoon.x - drawSize * 0.15, raccoon.y - drawSize * 0.15, 0,
    raccoon.x - drawSize * 0.15, raccoon.y - drawSize * 0.15, drawSize * 0.55
  );
  warm.addColorStop(0, 'rgba(255,220,160,0.12)');
  warm.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(drawX, drawY, drawSize, drawSize);
  ctx.restore();
}

/* =========================================================
   主循环
   ========================================================= */
function loop(now){
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;
  animTime += dt;

  /* 移动（WASD） */
  const moveSpeed = 260 * dt;
  if(keys['w']) raccoon.y -= moveSpeed;
  if(keys['s']) raccoon.y += moveSpeed;
  if(keys['a']) raccoon.x -= moveSpeed;
  if(keys['d']) raccoon.x += moveSpeed;
  raccoon.x = Math.max(150, Math.min(W - 150, raccoon.x));
  raccoon.y = Math.max(H * 0.55, Math.min(H * 0.86, raccoon.y));

  /* 视差相机 */
  cam.x = (raccoon.x - W / 2) * 0.15;
  cam.y = (raccoon.y - H * 0.7) * 0.1;

  /* 旋转（← →） */
  const rotSpeed = Math.PI * 0.55;
  if(keys['arrowleft'])  raccoon.yaw -= rotSpeed * dt;
  if(keys['arrowright']) raccoon.yaw += rotSpeed * dt;
  /* ↑ ↓ 也做轻微上下位移（和 W/S 一致的手感） */
  if(keys['arrowup'])    raccoon.y -= moveSpeed * 0.7;
  if(keys['arrowdown'])  raccoon.y += moveSpeed * 0.7;
  raccoon.y = Math.max(H * 0.55, Math.min(H * 0.86, raccoon.y));

  /* yaw → frame */
  let a = raccoon.yaw % (Math.PI * 2);
  if(a < 0) a += Math.PI * 2;
  raccoon.frame = Math.floor((a / (Math.PI * 2)) * TOTAL_FRAMES) % TOTAL_FRAMES;

  /* 渲染 */
  ctx.clearRect(0, 0, W, H);
  drawBackground(animTime);
  drawRaccoon(animTime);

  /* 全屏暗角 */
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(loop);
}

/* =========================================================
   剧情播放
   ========================================================= */
let storyStarted = false;
function startStory(){
  if(storyStarted) return;
  storyStarted = true;
  const GAP = 2100;
  let delay = 600;
  STORY.forEach(function(item){
    const el = document.createElement('div');
    el.className = 'storyLine';
    el.textContent = item.text;
    const len = item.text.length;
    let fs = 26, ls = 8;
    if(len > 12){ fs = 22; ls = 6; }
    if(len > 16){ fs = 20; ls = 5; }
    el.style.fontSize = fs + 'px';
    el.style.letterSpacing = ls + 'px';
    el.style.animationDelay = (delay / 1000) + 's';
    storyLayer.appendChild(el);
    delay += GAP + (item.pause || 0);
  });
  setTimeout(finishStory, delay + 1000);
  skipBtn.classList.add('show');
  setTimeout(function(){ hintEl.classList.add('show'); }, 2500);
}

let storyDone = false;
function finishStory(){
  if(storyDone) return;
  storyDone = true;
  skipBtn.classList.remove('show');
  endScreen.classList.add('show');
  setTimeout(leaveToNext, 800);
}

skipBtn.addEventListener('click', function(e){
  e.stopPropagation();
  if(storyDone) return;
  storyLayer.innerHTML = '';
  finishStory();
});

/* =========================================================
   resize
   ========================================================= */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.position = 'absolute';
  stage.style.left = Math.round((vw - w) / 2) + 'px';
  stage.style.top = Math.round((vh - h) / 2) + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = '100%';
  cv.style.height = '100%';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

/* =========================================================
   启动
   ========================================================= */
resize();
startFakeProgress();

loadSprite().then(function(){
  stopFakeProgress(true);
  setTimeout(function(){
    loading.classList.add('hide');
    startStory();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
  }, 300);
}).catch(function(err){
  console.error('[raccoon]', err);
  stopFakeProgress(false);
  loadTip.textContent = '⚠ ' + (err.message || '加载失败');
  loadTip.classList.add('error');
  setTimeout(function(){
    loading.classList.add('hide');
    startStory();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop); /* 无浣熊，背景照常跑，剧情继续 */
  }, 1800);
});

})();
</script>
