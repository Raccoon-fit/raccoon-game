<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>雨夜归途 · 序</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:960px;height:540px;overflow:hidden;background:#000;
    box-shadow:0 0 120px rgba(0,0,0,1);transform-origin:center center;flex:0 0 auto;}
  #cv{display:block;width:100%;height:100%;position:absolute;left:0;top:0;}

  #loading{position:absolute;inset:0;background:#000;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:#8fa4ba;z-index:10;transition:opacity .6s;}
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .name{font-size:22px;letter-spacing:14px;color:#f2e6cb;
    padding-left:14px;text-shadow:0 0 40px rgba(255,200,120,.5);}
  #loading .bar{width:320px;height:6px;border-radius:3px;
    background:rgba(20,30,44,.9);border:1px solid rgba(140,180,220,.25);
    overflow:hidden;}
  #loading .fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b661,#ffe6b0);
    box-shadow:0 0 16px rgba(255,200,120,.85);transition:width .2s;}
  #loading .tip{font-size:12px;letter-spacing:2px;color:#8fa4ba;}
  #loading .tip.error{color:#ff6a5a;}

  #storyLayer{position:absolute;left:0;top:0;width:100%;height:100%;
    pointer-events:none;overflow:hidden;z-index:5;}

  .storyLine{
    position:absolute;left:50%;bottom:-80px;
    transform:translateX(-50%);white-space:nowrap;
    font-size:26px;letter-spacing:8px;font-weight:600;
    color:#faf0dc;
    text-shadow:
      0 0 10px rgba(255, 235, 190, 0.75),
      0 0 24px rgba(255, 210, 140, 0.55),
      0 0 48px rgba(255, 180, 100, 0.35),
      0 0 90px rgba(255, 150, 80, 0.20),
      0 2px 3px rgba(0, 0, 0, 0.95),
      0 4px 12px rgba(0, 0, 0, 0.9);
    opacity:0;
    animation-name: floatUp;
    animation-duration: 6s;
    animation-timing-function: cubic-bezier(.25,.5,.35,1);
    animation-fill-mode: both;
    will-change: transform, opacity, filter, letter-spacing;}

  @keyframes floatUp{
    0%   { transform:translateX(-50%) translateY(0) scale(0.88); opacity:0; filter:blur(10px); letter-spacing:2px; }
    15%  { transform:translateX(-50%) translateY(-110px) scale(1); opacity:1; filter:blur(0); letter-spacing:6px; }
    28%  { transform:translateX(-50%) translateY(-200px) scale(1); opacity:1; filter:blur(0); letter-spacing:8px; }
    72%  { transform:translateX(-50%) translateY(-460px) scale(1.01); opacity:1; filter:blur(0); letter-spacing:10px; }
    100% { transform:translateX(-50%) translateY(-620px) scale(1.04); opacity:0; filter:blur(8px); letter-spacing:14px; }
  }

  #storyLayer::before{
    content:'';position:absolute;left:0;top:0;width:100%;height:140px;
    background:linear-gradient(180deg,#000 0%,rgba(0,0,0,0.85) 35%,transparent 100%);
    pointer-events:none;z-index:6;}
  #storyLayer::after{
    content:'';position:absolute;left:0;bottom:0;width:100%;height:110px;
    background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0.8) 40%,transparent 100%);
    pointer-events:none;z-index:6;}

  #hint{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    color:rgba(140,160,180,.5);font-size:11.5px;letter-spacing:2.5px;
    pointer-events:none;z-index:7;opacity:0;transition:opacity 1s;}
  #hint.show{opacity:1;}

  #endScreen{position:absolute;inset:0;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s;z-index:20;}
  #endScreen.show{opacity:1;}
  #endScreen .w{color:#3a0a0e;font-size:12px;letter-spacing:10px;padding-left:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="storyLayer"></div>
  <div id="hint">按 W A S D 移动　·　↑ ↓ ← → 转动视角</div>
  <div id="loading">
    <div class="name">雨 夜 归 途</div>
    <div class="bar"><div class="fill" id="loadFill"></div></div>
    <div class="tip" id="loadTip">正在准备……</div>
  </div>
  <div id="endScreen"><div class="w">—— 雨 夜 归 途 ——</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script>
(function(){
'use strict';

const W = 960, H = 540;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const loading = document.getElementById('loading');
const loadFill = document.getElementById('loadFill');
const loadTip = document.getElementById('loadTip');
const storyLayer = document.getElementById('storyLayer');
const hintEl = document.getElementById('hint');
const endScreen = document.getElementById('endScreen');

const NEXT_URL = 'index1.html';

/* three.js 可用性检查 */
if(typeof THREE === 'undefined'){
  loadTip.textContent = '⚠ three.js 加载失败（检查网络）';
  loadTip.classList.add('error');
  setTimeout(function(){ location.replace(NEXT_URL); }, 2500);
  return;
}

let mode = 'new';
try{ mode = localStorage.getItem('raccoon_launch_mode') || 'new'; }catch(e){}
if(mode === 'continue'){
  location.replace(NEXT_URL);
  return;
}

/* =========================================================
   ★ 剧情文本
   ========================================================= */
const STORY = [
  { text: '灰豆又一次从梦里醒来。' },
  { text: '它不认识这里。' },
  { text: '四面是黑的墙。' },
  { text: '墙上什么都没有。' },
  { text: '——除了头顶那颗红苹果。', pause: 800 },

  { text: '它记得一些事。' },
  { text: '记得雨。' },
  { text: '三天三夜没停过的雨。' },
  { text: '记得一个老人。' },
  { text: '记得一双粗糙的手。' },
  { text: '记得一栋红屋顶的房子。', pause: 800 },

  { text: '其它的，它都想不起来了。' },
  { text: '但它知道，那个屋顶还在等它。' },
  { text: '所以它必须回去。' },
  { text: '——哪怕它已经忘了路。', pause: 1000 },

  { text: '雨夜归途，从这里开始。' }
];

/* =========================================================
   three.js 场景
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.Fog(0x02040a, 2.5, 14);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.06, 40);

const renderer = new THREE.WebGLRenderer({
  canvas: cv,
  antialias: true,
  alpha: false
});
renderer.setClearColor(0x02040a, 1);

/* ---------- 房间 ---------- */
const ROOM = 12;
const WALL_H = 4.0;

const wallMat  = new THREE.MeshLambertMaterial({ color: 0x2a2030 });
const floorMat = new THREE.MeshLambertMaterial({ color: 0x0a0810 });
const ceilMat  = new THREE.MeshLambertMaterial({ color: 0x050408 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(ROOM/2, 0, ROOM/2);
scene.add(floor);

const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), ceilMat);
ceil.rotation.x = Math.PI / 2;
ceil.position.set(ROOM/2, WALL_H, ROOM/2);
scene.add(ceil);

function makeWall(w, h, d, x, y, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z);
  scene.add(m);
}
makeWall(ROOM, WALL_H, 1, ROOM/2, WALL_H/2, 0.5);
makeWall(ROOM, WALL_H, 1, ROOM/2, WALL_H/2, ROOM-0.5);
makeWall(1, WALL_H, ROOM, 0.5, WALL_H/2, ROOM/2);
makeWall(1, WALL_H, ROOM, ROOM-0.5, WALL_H/2, ROOM/2);

/* ---------- 灯光 ---------- */
scene.add(new THREE.AmbientLight(0x8899bb, 0.35));

const l1 = new THREE.PointLight(0xffd0a0, 3.5, 25, 2);
l1.position.set(6, 3.5, 4.0);
scene.add(l1);

const l2 = new THREE.PointLight(0x90b0ff, 1.5, 25, 2);
l2.position.set(6, 1.5, 8.5);
scene.add(l2);

const l3 = new THREE.PointLight(0x8090c0, 1.0, 25, 2);
l3.position.set(3.5, 2.0, 4.0);
scene.add(l3);

/* ---------- 相机控制 ---------- */
const cam = { x: 6, y: 1.8, z: 10.5, yaw: -Math.PI/2, pitch: -0.15 };
const keys = {};

function updateCamera(){
  camera.position.set(cam.x, cam.y, cam.z);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const cy = Math.cos(cam.yaw),   sy = Math.sin(cam.yaw);
  const dx = cy*cp, dy = sp, dz = sy*cp;
  camera.lookAt(cam.x + dx, cam.y + dy, cam.z + dz);
}

function canStand(x, z){
  if(x < 1.2 || x > ROOM - 1.2) return false;
  if(z < 1.2 || z > ROOM - 1.2) return false;
  return true;
}

/* ---------- 输入 ---------- */
function bindInput(){
  window.addEventListener('keydown', function(e){
    keys[e.key.toLowerCase()] = true;
    if(e.key.indexOf('Arrow') === 0 || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function(e){
    keys[e.key.toLowerCase()] = false;
  });
  let dragging = false, lx = 0, ly = 0;
  cv.addEventListener('mousedown', function(e){
    dragging = true; lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    cam.yaw += dx * 0.005; cam.pitch -= dy * 0.005;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  });
  window.addEventListener('mouseup', function(){ dragging = false; });

  let tlx = 0, tly = 0, touching = false;
  cv.addEventListener('touchstart', function(e){
    if(!e.touches.length) return;
    touching = true; tlx = e.touches[0].clientX; tly = e.touches[0].clientY;
  }, {passive:true});
  cv.addEventListener('touchmove', function(e){
    if(!touching || !e.touches.length) return;
    const dx = e.touches[0].clientX - tlx;
    const dy = e.touches[0].clientY - tly;
    tlx = e.touches[0].clientX; tly = e.touches[0].clientY;
    cam.yaw += dx * 0.006; cam.pitch -= dy * 0.006;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  }, {passive:true});
  cv.addEventListener('touchend', function(){ touching = false; });
}

/* ---------- 放置浣熊到世界 ---------- */
function placeRaccoon(model){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const targetHeight = 2.4;
  const s = targetHeight / Math.max(size.y, 0.001);

  model.scale.setScalar(s);
  model.rotation.y = -Math.PI / 2;      /* ★ 让浣熊正面朝相机 */
  model.position.x = 6 - center.x * s;
  model.position.y = 0 - box.min.y * s;
  model.position.z = 4 - center.z * s;

  scene.add(model);

  console.log('[raccoon] 尺寸:', size.x.toFixed(3), '×', size.y.toFixed(3), '×', size.z.toFixed(3),
              '| 中心:', center.x.toFixed(3), center.y.toFixed(3), center.z.toFixed(3),
              '| 自动缩放:', s.toFixed(4));
}

/* ---------- 加载浣熊 ---------- */
function loadRaccoon(){
  loadTip.textContent = '正在加载浣熊……';
  loadFill.style.width = '20%';

  const BASE = 'assets3d/models/';

  const mtlLoader = new THREE.MTLLoader();
  mtlLoader.setPath(BASE);
  mtlLoader.setResourcePath(BASE);
  mtlLoader.load('raccoon.mtl', function(materials){
    materials.preload();
    loadFill.style.width = '45%';
    loadTip.textContent = '加载模型……';

    const objLoader = new THREE.OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.setPath(BASE);
    objLoader.load('raccoon.obj', function(model){
      placeRaccoon(model);
      loadFill.style.width = '100%';
      loadTip.textContent = '完成';
      setTimeout(function(){
        loading.classList.add('hide');
        startStory();
      }, 400);
    }, function(progress){
      if(progress.total){
        const pct = 45 + Math.round(progress.loaded / progress.total * 50);
        loadFill.style.width = pct + '%';
      }
    }, function(err){
      console.error('[raccoon] OBJ 加载失败', err);
      loadTip.textContent = '⚠ OBJ 加载失败';
      loadTip.classList.add('error');
      setTimeout(function(){
        loading.classList.add('hide');
        startStory();
      }, 1800);
    });
  }, function(progress){
    if(progress.total){
      loadFill.style.width = (10 + Math.round(progress.loaded / progress.total * 30)) + '%';
    }
  }, function(err){
    /* MTL 失败 → 用普通材质加载 OBJ */
    console.warn('[raccoon] MTL 加载失败，改用无贴图模式', err);
    loadTip.textContent = '无贴图模式……';
    const objLoader = new THREE.OBJLoader();
    objLoader.setPath(BASE);
    objLoader.load('raccoon.obj', function(model){
      model.traverse(function(o){
        if(o.isMesh) o.material = new THREE.MeshLambertMaterial({ color: 0x9a8a78 });
      });
      placeRaccoon(model);
      loadFill.style.width = '100%';
      loadTip.textContent = '完成（无贴图）';
      setTimeout(function(){
        loading.classList.add('hide');
        startStory();
      }, 400);
    }, undefined, function(err2){
      console.error('[raccoon] OBJ 也加载失败', err2);
      loadTip.textContent = '⚠ 加载失败';
      loadTip.classList.add('error');
      setTimeout(function(){
        loading.classList.add('hide');
        startStory();
      }, 1800);
    });
  });
}

/* =========================================================
   剧情播放
   ========================================================= */
function startStory(){
  const GAP = 2100;
  let delay = 600;
  STORY.forEach(function(item){
    const el = document.createElement('div');
    el.className = 'storyLine';
    el.textContent = item.text;
    const len = item.text.length;
    let fs = 26, ls = 8;
    if(len > 12){ fs = 22; ls = 6; }
    if(len > 16){ fs = 20; ls = 5; }
    el.style.fontSize = fs + 'px';
    el.style.letterSpacing = ls + 'px';
    el.style.animationDelay = (delay / 1000) + 's';
    storyLayer.appendChild(el);
    delay += GAP + (item.pause || 0);
  });
  setTimeout(finishStory, delay + 1000);
}
let storyDone = false;
function finishStory(){
  if(storyDone) return;
  storyDone = true;
  endScreen.classList.add('show');
  setTimeout(function(){
    location.replace(NEXT_URL);
  }, 800);
}

/* =========================================================
   主循环
   ========================================================= */
let lastFrame = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  const rotSpeed = 1.8;
  if(keys['arrowleft'])  cam.yaw -= rotSpeed * dt;
  if(keys['arrowright']) cam.yaw += rotSpeed * dt;
  if(keys['arrowup'])    cam.pitch += rotSpeed * 0.6 * dt;
  if(keys['arrowdown'])  cam.pitch -= rotSpeed * 0.6 * dt;
  if(cam.pitch >  0.9) cam.pitch =  0.9;
  if(cam.pitch < -0.9) cam.pitch = -0.9;

  const speed = 2.8;
  let fwd = 0, str = 0;
  if(keys['w']) fwd += 1;
  if(keys['s']) fwd -= 1;
  if(keys['a']) str -= 1;
  if(keys['d']) str += 1;
  if(fwd || str){
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    let dx = cy*fwd - sy*str, dz = sy*fwd + cy*str;
    const len = Math.hypot(dx, dz) || 1;
    dx = dx/len * speed * dt; dz = dz/len * speed * dt;
    const nx = cam.x + dx, nz = cam.z + dz;
    if(canStand(nx, cam.z)) cam.x = nx;
    if(canStand(cam.x, nz)) cam.z = nz;
  }

  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* =========================================================
   resize
   ========================================================= */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.position = 'absolute';
  stage.style.left = Math.round((vw - w) / 2) + 'px';
  stage.style.top = Math.round((vh - h) / 2) + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H, false);
  cv.style.width = '100%';
  cv.style.height = '100%';

  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

/* =========================================================
   启动
   ========================================================= */
resize();
bindInput();
updateCamera();
loadRaccoon();
setTimeout(function(){ hintEl.classList.add('show'); }, 2500);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
