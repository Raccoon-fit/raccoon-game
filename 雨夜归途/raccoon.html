<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>雨夜归途 · 序</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:960px;height:540px;overflow:hidden;background:#000;
    box-shadow:0 0 120px rgba(0,0,0,1);transform-origin:center center;flex:0 0 auto;}
  #cv{display:block;width:100%;height:100%;position:absolute;left:0;top:0;}

  #loading{position:absolute;inset:0;background:#000;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:#8fa4ba;z-index:10;transition:opacity .6s;}
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .name{font-size:22px;letter-spacing:14px;color:#f2e6cb;
    padding-left:14px;text-shadow:0 0 40px rgba(255,200,120,.5);}
  #loading .bar{width:320px;height:6px;border-radius:3px;
    background:rgba(20,30,44,.9);border:1px solid rgba(140,180,220,.25);
    overflow:hidden;}
  #loading .fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b661,#ffe6b0);
    box-shadow:0 0 16px rgba(255,200,120,.85);transition:width .2s;}
  #loading .tip{font-size:12px;letter-spacing:2px;color:#8fa4ba;}
  #loading .tip.error{color:#ff6a5a;}

  #storyLayer{position:absolute;left:0;top:0;width:100%;height:100%;
    pointer-events:none;overflow:hidden;z-index:5;}

  .storyLine{
    position:absolute;
    left:50%;
    bottom:-80px;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:26px;
    letter-spacing:8px;
    font-weight:600;
    color:#faf0dc;
    text-shadow:
      0 0 10px rgba(255, 235, 190, 0.75),
      0 0 24px rgba(255, 210, 140, 0.55),
      0 0 48px rgba(255, 180, 100, 0.35),
      0 0 90px rgba(255, 150, 80, 0.20),
      0 2px 3px rgba(0, 0, 0, 0.95),
      0 4px 12px rgba(0, 0, 0, 0.9);
    opacity:0;
    animation-name: floatUp;
    animation-duration: 6s;
    animation-timing-function: cubic-bezier(.25,.5,.35,1);
    animation-fill-mode: both;
    will-change: transform, opacity, filter, letter-spacing;}

  @keyframes floatUp{
    0%{
      transform:translateX(-50%) translateY(0) scale(0.88);
      opacity:0;
      filter:blur(10px);
      letter-spacing:2px;
    }
    15%{
      transform:translateX(-50%) translateY(-110px) scale(1);
      opacity:1;
      filter:blur(0);
      letter-spacing:6px;
    }
    28%{
      transform:translateX(-50%) translateY(-200px) scale(1);
      opacity:1;
      filter:blur(0);
      letter-spacing:8px;
    }
    72%{
      transform:translateX(-50%) translateY(-460px) scale(1.01);
      opacity:1;
      filter:blur(0);
      letter-spacing:10px;
    }
    100%{
      transform:translateX(-50%) translateY(-620px) scale(1.04);
      opacity:0;
      filter:blur(8px);
      letter-spacing:14px;
    }
  }

  #storyLayer::before{
    content:'';position:absolute;left:0;top:0;width:100%;height:140px;
    background:linear-gradient(180deg,#000 0%,rgba(0,0,0,0.85) 35%,transparent 100%);
    pointer-events:none;z-index:6;}

  #storyLayer::after{
    content:'';position:absolute;left:0;bottom:0;width:100%;height:110px;
    background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0.8) 40%,transparent 100%);
    pointer-events:none;z-index:6;}

  #hint{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    color:rgba(140,160,180,.5);font-size:11.5px;letter-spacing:2.5px;
    pointer-events:none;z-index:7;opacity:0;transition:opacity 1s;}
  #hint.show{opacity:1;}

  #endScreen{position:absolute;inset:0;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s;z-index:20;}
  #endScreen.show{opacity:1;}
  #endScreen .w{color:#3a0a0e;font-size:12px;letter-spacing:10px;padding-left:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="storyLayer"></div>
  <div id="hint">按 W A S D 移动　·　↑ ↓ ← → 转动视角</div>
  <div id="loading">
    <div class="name">雨 夜 归 途</div>
    <div class="bar"><div class="fill" id="loadFill"></div></div>
    <div class="tip" id="loadTip">正在准备……</div>
  </div>
  <div id="endScreen"><div class="w">—— 雨 夜 归 途 ——</div></div>
</div>

<script src="assets3d/r3d.js"></script>
<script>
(function(){
'use strict';

const W = 960, H = 540;
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const loading = document.getElementById('loading');
const loadFill = document.getElementById('loadFill');
const loadTip = document.getElementById('loadTip');
const storyLayer = document.getElementById('storyLayer');
const hintEl = document.getElementById('hint');
const endScreen = document.getElementById('endScreen');

const NEXT_URL = 'index1.html';

let mode = 'new';
try{ mode = localStorage.getItem('raccoon_launch_mode') || 'new'; }catch(e){}
if(mode === 'continue'){
  location.replace(NEXT_URL);
  return;
}

/* =========================================================
   ★ 剧情文本
   ========================================================= */
const STORY = [
  { text: '灰豆又一次从梦里醒来。' },
  { text: '它不认识这里。' },
  { text: '四面是黑的墙。' },
  { text: '墙上什么都没有。' },
  { text: '——除了头顶那颗红苹果。', pause: 800 },

  { text: '它记得一些事。' },
  { text: '记得雨。' },
  { text: '三天三夜没停过的雨。' },
  { text: '记得一个老人。' },
  { text: '记得一双粗糙的手。' },
  { text: '记得一栋红屋顶的房子。', pause: 800 },

  { text: '其它的，它都想不起来了。' },
  { text: '但它知道，那个屋顶还在等它。' },
  { text: '所以它必须回去。' },
  { text: '——哪怕它已经忘了路。', pause: 1000 },

  { text: '雨夜归途，从这里开始。' }
];

/* =========================================================
   状态
   ========================================================= */
const cam = { x: 6, y: 1.8, z: 10.5, yaw: -Math.PI / 2, pitch: -0.15 };
const keys = {};
let renderer = null;
let time = 0;
let lastFrame = performance.now();
let storyDone = false;

const canMove = true;

const ROOM = 12;
const grid = [];
for(let i = 0; i < ROOM; i++){
  let row = '';
  for(let j = 0; j < ROOM; j++){
    row += (i === 0 || i === ROOM-1 || j === 0 || j === ROOM-1) ? '1' : '0';
  }
  grid.push(row);
}

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.position = 'absolute';
  stage.style.left = Math.round((vw - w) / 2) + 'px';
  stage.style.top = Math.round((vh - h) / 2) + 'px';
  if(renderer){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.resize(w, h, dpr);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ==================== 暗室纹理 ==================== */
function makeDarkTex(){
  const S = 256;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#04060a'; x.fillRect(0, 0, S, S);
  for(let i = 0; i < 800; i++){
    x.fillStyle = 'rgba(255,255,255,' + (0.008 + Math.random()*0.012) + ')';
    x.fillRect(Math.random()*S, Math.random()*S, 1, 1);
  }
  x.strokeStyle = 'rgba(0,0,0,0.5)'; x.lineWidth = 2;
  const bh = 32;
  for(let row = 0; row * bh < S; row++){
    const y = row * bh;
    x.beginPath(); x.moveTo(0, y); x.lineTo(S, y); x.stroke();
    const off = (row % 2) ? 0 : 40;
    for(let cx = off; cx < S; cx += 80){
      x.beginPath(); x.moveTo(cx, y); x.lineTo(cx, y + bh); x.stroke();
    }
  }
  return c;
}
function makeFloorTex(){
  const S = 256;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#080a0c'; x.fillRect(0, 0, S, S);
  for(let i = 0; i < 400; i++){
    x.fillStyle = 'rgba(255,255,255,' + (0.005 + Math.random()*0.01) + ')';
    x.fillRect(Math.random()*S, Math.random()*S, 1, 1);
  }
  x.strokeStyle = 'rgba(0,0,0,0.7)'; x.lineWidth = 2;
  const t = 64;
  for(let i = 0; i <= S; i += t){
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, S); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke();
  }
  return c;
}

/* ==================== 初始化 3D ==================== */
function init3D(){
  try{ renderer = R3D.create(cv); }
  catch(e){
    console.error('[raccoon] WebGL:', e);
    loadTip.textContent = '⚠ WebGL 不可用';
    loadTip.classList.add('error');
    return false;
  }
  renderer.buildWorld({
    grid: grid, wallHeight: 4.0,
    wallTexSource: makeDarkTex(),
    floorTexSource: makeFloorTex(),
    ceilTexSource: makeDarkTex()
  });

  /* ★ 环境光 0.18 —— 暗但能看清 */
  renderer.setAmbient([0.18, 0.18, 0.22]);

  /* 4 个方向补光，确保浣熊任何朝向都被照亮 */
  renderer.setLights([
    { x: 6,  y: 3.4, z: 4.5, color: [2.4, 1.9, 1.2] },   /* 顶部主光 */
    { x: 6,  y: 2.0, z: 8.5, color: [1.6, 1.5, 1.3] },   /* 从相机方向打过来 */
    { x: 3.5, y: 2.0, z: 4.0, color: [0.9, 1.1, 1.4] }    /* 左侧偏冷 */
  ]);
  renderer.setFog({ color: [0.005, 0.008, 0.014], near: 3, far: 18 });
  return true;
}

/* ==================== 加载浣熊 ==================== */
function loadRaccoon(){
  loadTip.textContent = '正在加载浣熊……';
  loadFill.style.width = '30%';

  R3D.loadOBJModel('assets3d/models/raccoon.obj', function(msg){
    loadTip.textContent = msg;
  }).then(function(model){
    if(!model || !model.P || model.P.length === 0) throw new Error('模型为空');

    let minX = Infinity, maxX = -Infinity;
    let minY = Infinity, maxY = -Infinity;
    let minZ = Infinity, maxZ = -Infinity;
    for(let i = 0; i < model.P.length; i += 3){
      const px = model.P[i], py = model.P[i+1], pz = model.P[i+2];
      if(px < minX) minX = px; if(px > maxX) maxX = px;
      if(py < minY) minY = py; if(py > maxY) maxY = py;
      if(pz < minZ) minZ = pz; if(pz > maxZ) maxZ = pz;
    }
    const height = maxY - minY;
    const targetHeight = 2.4;
    const autoScale = targetHeight / Math.max(height, 0.001);

    console.log('[raccoon] 包围盒 X:',
      minX.toFixed(3), '~', maxX.toFixed(3),
      '| Y:', minY.toFixed(3), '~', maxY.toFixed(3),
      '| Z:', minZ.toFixed(3), '~', maxZ.toFixed(3),
      '| 高度:', height.toFixed(4),
      '| 自动缩放:', autoScale.toFixed(4));

    loadFill.style.width = '75%';
    loadTip.textContent = '上传到显卡……';

    renderer.addModel(model, {
      x: 6, y: 0, z: 4,
      scale: autoScale,
      rotationY: 0,       /* ★ 从 Math.PI 改成 0，正面朝相机 */
      autoFit: true
    });

    loadFill.style.width = '100%';
    loadTip.textContent = '完成';
    setTimeout(function(){
      loading.classList.add('hide');
      startStory();
    }, 400);
  }).catch(function(err){
    console.error('[raccoon] 加载失败', err);
    loadTip.textContent = '⚠ 加载失败：' + (err.message || err);
    loadTip.classList.add('error');
    setTimeout(function(){
      loading.classList.add('hide');
      startStory();
    }, 1800);
  });
}

/* ==================== 剧情播放 ==================== */
function startStory(){
  const GAP = 2100;
  let delay = 600;

  STORY.forEach(function(item){
    const el = document.createElement('div');
    el.className = 'storyLine';
    el.textContent = item.text;

    const len = item.text.length;
    let fs = 26, ls = 8;
    if(len > 12){ fs = 22; ls = 6; }
    if(len > 16){ fs = 20; ls = 5; }
    el.style.fontSize = fs + 'px';
    el.style.letterSpacing = ls + 'px';
    el.style.animationDelay = (delay / 1000) + 's';

    storyLayer.appendChild(el);
    delay += GAP + (item.pause || 0);
  });

  setTimeout(finishStory, delay + 1000);
}

function finishStory(){
  if(storyDone) return;
  storyDone = true;
  endScreen.classList.add('show');
  setTimeout(function(){
    location.replace(NEXT_URL);
  }, 800);
}

/* ==================== 输入 ==================== */
function bindInput(){
  window.addEventListener('keydown', function(e){
    keys[e.key.toLowerCase()] = true;
    if(e.key.indexOf('Arrow') === 0 || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function(e){
    keys[e.key.toLowerCase()] = false;
  });
  let dragging = false, lx = 0, ly = 0;
  cv.addEventListener('mousedown', function(e){
    dragging = true; lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    cam.yaw += dx * 0.005; cam.pitch -= dy * 0.005;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  });
  window.addEventListener('mouseup', function(){ dragging = false; });

  let tlx = 0, tly = 0, touching = false;
  cv.addEventListener('touchstart', function(e){
    if(!e.touches.length) return;
    touching = true; tlx = e.touches[0].clientX; tly = e.touches[0].clientY;
  }, {passive:true});
  cv.addEventListener('touchmove', function(e){
    if(!touching || !e.touches.length) return;
    const dx = e.touches[0].clientX - tlx;
    const dy = e.touches[0].clientY - tly;
    tlx = e.touches[0].clientX; tly = e.touches[0].clientY;
    cam.yaw += dx * 0.006; cam.pitch -= dy * 0.006;
    if(cam.pitch >  0.9) cam.pitch =  0.9;
    if(cam.pitch < -0.9) cam.pitch = -0.9;
  }, {passive:true});
  cv.addEventListener('touchend', function(){ touching = false; });
}

function canStand(x, z){
  const gy = Math.floor(z), gx = Math.floor(x);
  if(gy < 0 || gy >= grid.length) return false;
  const row = grid[gy];
  if(gx < 0 || gx >= row.length) return false;
  return row[gx] === '0';
}

/* ==================== 渲染循环 ==================== */
function loop(now){
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now; time += dt;

  const rotSpeed = 1.8;
  if(keys['arrowleft'])  cam.yaw -= rotSpeed * dt;
  if(keys['arrowright']) cam.yaw += rotSpeed * dt;
  if(keys['arrowup'])    cam.pitch += rotSpeed * 0.6 * dt;
  if(keys['arrowdown'])  cam.pitch -= rotSpeed * 0.6 * dt;
  if(cam.pitch >  0.9) cam.pitch =  0.9;
  if(cam.pitch < -0.9) cam.pitch = -0.9;

  if(canMove){
    const speed = 2.8;
    let fwd = 0, str = 0;
    if(keys['w']) fwd += 1;
    if(keys['s']) fwd -= 1;
    if(keys['a']) str -= 1;
    if(keys['d']) str += 1;
    if(fwd || str){
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      let dx = cy*fwd - sy*str, dz = sy*fwd + cy*str;
      const len = Math.hypot(dx, dz) || 1;
      dx = dx/len * speed * dt; dz = dz/len * speed * dt;
      const nx = cam.x + dx, nz = cam.z + dz;
      if(canStand(nx, cam.z)) cam.x = nx;
      if(canStand(cam.x, nz)) cam.z = nz;
    }
  }

  if(renderer){
    renderer.setCamera({
      x: cam.x, y: cam.y, z: cam.z,
      yaw: cam.yaw, pitch: cam.pitch,
      fov: Math.PI / 3.0, near: 0.06, far: 40
    });
    renderer.render();
  }
  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
resize();
if(init3D()){
  resize();        /* ★ renderer 已创建，再调一次让 canvas / viewport 尺寸正确 */
  bindInput();
  lastFrame = performance.now();
  requestAnimationFrame(loop);
  loadRaccoon();
  setTimeout(function(){ hintEl.classList.add('show'); }, 2500);
} else {
  loadFill.style.width = '100%';
  loadTip.textContent = '⚠ 3D 不可用，即将跳过……';
  setTimeout(function(){ location.replace(NEXT_URL); }, 2000);
}

})();
</script>
</body>
</html>
