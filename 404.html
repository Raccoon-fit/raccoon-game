<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>软软翻错垃圾桶了 | 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 禁止选中文本 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* 禁止长按弹出菜单 */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e17;
            color: #e0e9ff;
            font-family: 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            /* 禁止拖拽 */
            -webkit-user-drag: none;
        }

        /* 禁用所有元素的拖拽和选中 */
        img, a, p, h1, div, span {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 禁止输入框高亮（虽然页面没输入框，防御性写法） */
        *:focus {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- 星空画布 ---------- */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 流星样式已删除 - 不再需要 */

        /* ---------- 主内容 ---------- */
        .content {
            position: relative;
            z-index: 10;
        }

        /* ---------- 浣熊插画 ---------- */
        .raccoon {
            width: 320px;
            height: auto;
            margin: 0 auto 1.5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(179, 136, 255, 0.25));
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid rgba(179, 136, 255, 0.2);
            /* 禁止图片拖拽 */
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }

        /* ---------- 标题 ---------- */
        h1 {
            font-size: 6rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #4fc3f7, #b388ff, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 0.1em;
        }

        /* ---------- 副标题 ---------- */
        .subtitle {
            font-size: 1.3rem;
            color: #8899b3;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        /* ---------- 文案 ---------- */
        p {
            font-size: 1.1rem;
            max-width: 520px;
            margin: 0 auto 2rem;
            line-height: 1.8;
            color: #aabbcc;
        }

        /* ---------- 按钮 ---------- */
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            color: #4fc3f7;
            text-decoration: none;
            border: 1px solid #4fc3f7;
            padding: 12px 28px;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        a:hover {
            background: rgba(79, 195, 247, 0.15);
            box-shadow: 0 0 25px rgba(79, 195, 247, 0.4);
            transform: translateY(-2px);
        }

        /* ---------- 脚印装饰 ---------- */
        .paw-prints {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 60px;
            z-index: 5;
            opacity: 0.25;
            pointer-events: none;
        }

        .paw {
            font-size: 1.8rem;
            animation: paw-fade 2s ease-in-out infinite alternate;
        }

        .paw:nth-child(2) { animation-delay: 0.5s; }
        .paw:nth-child(3) { animation-delay: 1s; }
        .paw:nth-child(4) { animation-delay: 1.5s; }

        @keyframes paw-fade {
            0%   { opacity: 0.15; transform: scale(1); }
            100% { opacity: 0.5;  transform: scale(1.15); }
        }

        /* ---------- 底部小字 ---------- */
        .footer-note {
            position: fixed;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #445566;
            z-index: 10;
        }

        /* ---------- 移动端适配 ---------- */
        @media (max-width: 600px) {
            h1 { font-size: 4rem; }
            .subtitle { font-size: 1rem; }
            p { font-size: 0.95rem; padding: 0 1.5rem; }
            .raccoon { width: 200px; }
            .btn-group { flex-direction: column; align-items: center; }
            a { width: 200px; text-align: center; }
        }
    </style>
</head>

    <script>
    // ========== 禁用右键菜单（多重保险） ==========
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // ========== 禁用长按菜单（移动端） ==========
    document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
            e.preventDefault(); // 禁止多指操作
        }
    }, { passive: false });

    document.addEventListener('touchhold', function(e) {
        e.preventDefault();
        return false;
    });

    // iOS Safari 长按菜单阻止
    document.addEventListener('webkitcontextmenu', function(e) {
        e.preventDefault();
    });

    // ========== 禁用文本选择（额外JS层防护） ==========
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
        return false;
    });

    // ========== 禁用复制/剪切/粘贴 ==========
    document.addEventListener('copy', function(e) {
        e.preventDefault();
        return false;
    });
    document.addEventListener('cut', function(e) {
        e.preventDefault();
        return false;
    });
    document.addEventListener('paste', function(e) {
        e.preventDefault();
        return false;
    });

    // ========== 禁用拖拽 ==========
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
    });

    // ========== 禁止 Ctrl+A / Ctrl+C / Ctrl+V / Ctrl+S / Ctrl+P / F12 ==========
    document.addEventListener('keydown', function(e) {
        // Ctrl+A 全选
        if (e.ctrlKey && e.key === 'a') { e.preventDefault(); return false; }
        // Ctrl+C 复制
        if (e.ctrlKey && e.key === 'c') { e.preventDefault(); return false; }
        // Ctrl+V 粘贴
        if (e.ctrlKey && e.key === 'v') { e.preventDefault(); return false; }
        // Ctrl+X 剪切
        if (e.ctrlKey && e.key === 'x') { e.preventDefault(); return false; }
        // Ctrl+S 保存
        if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
        // Ctrl+P 打印
        if (e.ctrlKey && e.key === 'p') { e.preventDefault(); return false; }
        // F12 开发者工具
        if (e.key === 'F12') { e.preventDefault(); return false; }
        // Ctrl+Shift+I 开发者工具
        if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
        // Ctrl+Shift+C 元素检查
        if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); return false; }
        // Ctrl+U 查看源代码
        if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
    });

    // ========== 禁止图片长按保存（移动端额外防护） ==========
    document.querySelectorAll('img').forEach(function(img) {
        img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        img.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
    });

    // ========== Canvas 星空 ==========
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars;

    function initStars() {
        w = canvas.width  = window.innerWidth;
        h = canvas.height = window.innerHeight;
        const count = Math.min(180, Math.floor(w * h / 6000));
        stars = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.8 + 0.3,
            opacity: Math.random(),
            speed: Math.random() * 0.02 + 0.005,
            twinkleDir: Math.random() > 0.5 ? 1 : -1
        }));
    }

    function drawStars() {
        ctx.clearRect(0, 0, w, h);

        // 深空渐变背景
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.7);
        grad.addColorStop(0, '#0d1428');
        grad.addColorStop(1, '#050810');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // 画星星
        stars.forEach(s => {
            s.opacity += s.speed * s.twinkleDir;
            if (s.opacity >= 1)   { s.opacity = 1;     s.twinkleDir = -1; }
            if (s.opacity <= 0.1) { s.opacity = 0.1;   s.twinkleDir =  1; }

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.fill();

            // 大星星加光晕
            if (s.r > 1.5) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(79, 195, 247, ${s.opacity * 0.08})`;
                ctx.fill();
            }
        });

        requestAnimationFrame(drawStars);
    }

    initStars();
    drawStars();
    window.addEventListener('resize', initStars);
